<style>
  :root {
    --top-nav-height: 84px;
    --top-nav-bg: #f7fbf2;
    --top-nav-pill-bg: rgba(198, 223, 159, 0.78);
    --top-nav-pill-hover: rgba(182, 213, 139, 0.95);
    --top-nav-text: #2d5630;
    --top-nav-green: #3f7339;
    --top-nav-ring: #ff7a18;
    --top-nav-surface: rgba(255, 255, 255, 0.58);
    --top-nav-surface-strong: rgba(255, 255, 255, 0.86);
  }

  /* Top navigation shell */
  .global-sidebar.top-nav-shell {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: auto !important;
    width: 100% !important;
    height: var(--top-nav-height) !important;
    display: none;
    align-items: center;
    background: var(--top-nav-bg) !important;
    border-right: none !important;
    border-bottom: 1px solid rgba(49, 95, 47, 0.12);
    box-shadow: 0 6px 18px rgba(31, 51, 31, 0.08);
    z-index: 1000;
    overflow: visible !important;
  }

  body.has-sidebar .global-sidebar.top-nav-shell {
    display: flex !important;
  }

  body.hide-sidebar .global-sidebar.top-nav-shell,
  body.has-admin-sidebar .global-sidebar.top-nav-shell {
    display: none !important;
  }

  .top-nav-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 0 28px 0 24px;
    box-sizing: border-box;
  }

  .top-nav-brand {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    cursor: pointer;
  }

  #sidebarLogo {
    height: 66px;
    width: auto;
    display: block;
  }

  .top-nav-scroll {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    overflow: visible;
  }

  .top-nav-group {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  .top-nav-group-main {
    flex: 1 1 auto;
    justify-content: space-evenly;
  }

  .top-nav-group-user {
    flex: 0 0 auto;
    justify-content: flex-end;
    margin-left: auto;
  }

  .top-search-shell {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 20;
  }

  .top-search-toggle {
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 999px;
    background: var(--top-nav-surface-strong);
    box-shadow: 0 8px 22px rgba(68, 104, 58, 0.12);
    color: var(--top-nav-green);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }

  .top-search-toggle:hover,
  .top-search-shell.is-open .top-search-toggle {
    background: #ffffff;
    transform: translateY(-1px);
    box-shadow: 0 10px 26px rgba(68, 104, 58, 0.16);
  }

  .top-search-toggle .search-icon {
    font-size: 22px;
    line-height: 1;
  }

  .top-search-panel {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 0;
    max-width: 0;
    opacity: 0;
    overflow: hidden;
    pointer-events: none;
    padding: 0;
    border-radius: 999px;
    background: var(--top-nav-surface-strong);
    border: 1px solid rgba(62, 115, 57, 0.16);
    box-shadow: 0 8px 24px rgba(68, 104, 58, 0.12);
    transition:
      width 0.26s ease,
      max-width 0.26s ease,
      opacity 0.18s ease,
      padding 0.26s ease;
  }

  .top-search-shell.is-open .top-search-panel {
    width: 300px;
    max-width: 300px;
    opacity: 1;
    pointer-events: auto;
    padding: 0.35rem 0.45rem 0.35rem 0.9rem;
  }

  .top-search-input {
    width: 100%;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: var(--top-nav-text);
    font-size: 0.92rem;
    font-weight: 700;
    padding: 0;
  }

  .top-search-input::placeholder {
    color: rgba(49, 95, 47, 0.52);
    font-weight: 600;
  }

  .top-search-clear {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: rgba(63, 115, 57, 0.12);
    color: var(--top-nav-green);
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.18s ease, background 0.18s ease;
  }

  .top-search-clear:hover {
    transform: scale(1.05);
    background: rgba(63, 115, 57, 0.18);
  }

  .nav-item {
    flex: 0 0 auto;
    min-height: 46px;
    padding: 0 18px;
    border: none;
    border-radius: 18px;
    background: var(--top-nav-pill-bg);
    color: var(--top-nav-text);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-weight: 900;
    font-size: 0.92rem;
    letter-spacing: 0.02em;
    white-space: nowrap;
    cursor: pointer;
    transition:
      transform 0.18s ease,
      background 0.18s ease,
      box-shadow 0.18s ease,
      color 0.18s ease;
  }

  .nav-item:hover,
  .nav-item.active {
    background: var(--top-nav-pill-hover);
    transform: translateY(-1px);
  }

  .nav-text {
    min-width: 0;
    background: transparent;
    box-shadow: none;
    padding: 0.6rem 1rem;
  }

  .nav-text .nav-label {
    display: inline-block;
    transition: transform 0.22s ease;
  }

  .nav-text:hover .nav-label,
  .nav-text:focus-visible .nav-label {
    animation: navLabelBounce 0.36s ease;
  }

  .nav-code {
    width: 52px;
    height: 52px;
    min-width: 52px;
    padding: 0;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(63, 115, 57, 0.95), rgba(40, 79, 35, 0.95));
    box-shadow: 0 10px 20px rgba(40, 79, 35, 0.18);
  }

  .nav-code-icon {
    width: 32px;
    height: 32px;
    object-fit: contain;
    display: block;
  }

  .nav-streak {
    min-width: 122px;
    padding: 0 14px;
    gap: 10px;
    background: linear-gradient(135deg, rgba(222, 245, 255, 0.95), rgba(255, 255, 255, 0.92));
    box-shadow: 0 8px 20px rgba(72, 145, 196, 0.12);
  }

  .nav-fire-icon {
    width: 26px;
    height: 26px;
    object-fit: contain;
    flex: 0 0 auto;
  }

  .nav-streak.checked-in {
    background: linear-gradient(135deg, rgba(255, 233, 226, 0.96), rgba(255, 244, 240, 0.96));
    box-shadow: 0 8px 20px rgba(255, 98, 55, 0.14);
  }

  .nav-streak-value {
    font-size: 1.15rem;
    font-weight: 900;
    line-height: 1;
  }

  .nav-xp {
    min-width: 146px;
    justify-content: center;
    gap: 0.45rem;
    padding: 0 16px;
    background: rgba(255, 255, 255, 0.68);
    box-shadow: 0 8px 20px rgba(68, 104, 58, 0.1);
  }

  .nav-xp-label {
    font-size: 0.84rem;
    font-weight: 800;
    letter-spacing: 0.01em;
  }

  .nav-xp-value {
    font-size: 1.02rem;
    font-weight: 900;
    color: var(--top-nav-green);
  }

  .nav-avatar-shell {
    position: relative;
    flex: 0 0 auto;
  }

  .nav-avatar-button {
    width: 50px;
    height: 50px;
    padding: 0;
    border: 2px solid rgba(63, 115, 57, 0.16);
    border-radius: 50%;
    overflow: hidden;
    background: #ffffff;
    box-shadow: 0 8px 20px rgba(68, 104, 58, 0.14);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .nav-avatar-button:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 24px rgba(68, 104, 58, 0.18);
  }

  .nav-avatar-button img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .nav-avatar-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    min-width: 170px;
    padding: 0.45rem;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.98);
    border: 1px solid rgba(63, 115, 57, 0.14);
    box-shadow: 0 18px 40px rgba(35, 58, 31, 0.18);
    display: none;
    z-index: 1400;
  }

  .nav-avatar-shell.open .nav-avatar-menu {
    display: grid;
    gap: 0.35rem;
  }

  .nav-avatar-menu-item {
    width: 100%;
    border: none;
    border-radius: 14px;
    background: transparent;
    color: var(--top-nav-text);
    padding: 0.8rem 0.9rem;
    text-align: left;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.18s ease, transform 0.18s ease;
  }

  .nav-avatar-menu-item:hover {
    background: rgba(198, 223, 159, 0.34);
    transform: translateX(2px);
  }

  @keyframes navLabelBounce {
    0% {
      transform: translateY(0) scale(1);
    }
    40% {
      transform: translateY(-4px) scale(1.04);
    }
    100% {
      transform: translateY(0) scale(1);
    }
  }

  .sidebar-search-results {
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    width: 360px;
    max-height: 340px;
    overflow: auto;
    display: none;
    background: #ffffff;
    border: 1px solid rgba(49, 95, 47, 0.16);
    border-radius: 14px;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.14);
    padding: 8px;
    z-index: 1300;
  }

  .sidebar-search-results.show,
  .sidebar-search-results.open {
    display: block;
  }

  /* Xóa layout sidebar trái cũ */
  body.has-sidebar .page-content,
  body.has-sidebar .main-content,
  body.has-sidebar .dashboard-main-content,
  body.has-sidebar .content-area,
  body.has-sidebar .topics-container,
  body.has-sidebar .lesson-container,
  body.has-sidebar .mcq-container,
  body.has-sidebar .matching-container {
    margin-left: 0 !important;
    width: 100% !important;
  }

  body.has-sidebar .page-content {
    padding-top: var(--top-nav-height) !important;
  }

  body.has-sidebar #page-dashboard {
    padding-top: var(--top-nav-height) !important;
  }

  body.has-sidebar #page-dashboard .content-area {
    padding-top: 0 !important;
  }

  .sidebar-overlay,
  .mobile-menu-toggle,
  .mobile-close-sidebar-btn,
  .sidebar-toggle-btn,
  .sidebar-footer,
  .sidebar-user-profile,
  .sidebar-logout-btn,
  .sidebar-flyout,
  .sidebar-flyout-menu {
    display: none !important;
  }

  .logout-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 2000;
    justify-content: center;
    align-items: center;
  }

  .logout-modal-overlay.show {
    display: flex;
  }

  .logout-modal {
    background: var(--theme-card, #ffffff);
    border-radius: 14px;
    padding: 1.5rem;
    max-width: 360px;
    width: 90%;
    text-align: center;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.3);
  }

  .logout-modal-buttons {
    display: flex;
    gap: 0.875rem;
    justify-content: center;
  }

  .logout-modal-buttons .btn-cancel,
  .logout-modal-buttons .btn-confirm {
    padding: 0.625rem 1.25rem;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }

  .logout-modal-buttons .btn-cancel {
    border: 1px solid #e5e7eb;
    background: #ffffff;
    color: #6b7280;
  }

  .logout-modal-buttons .btn-confirm {
    border: none;
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    color: #ffffff;
  }

  @media (max-width: 768px) {
    :root {
      --top-nav-height: 72px;
    }

    .top-nav-inner {
      padding: 0 10px;
      gap: 10px;
    }

    #sidebarLogo {
      height: 50px;
    }

    .top-nav-scroll {
      gap: 10px;
    }

    .nav-item {
      min-height: 38px;
      padding: 0 12px;
      font-size: 0.8rem;
    }

    .top-search-shell.is-open .top-search-panel {
      width: 220px;
      max-width: 220px;
    }

    .nav-streak {
      min-width: 106px;
      padding: 0 10px;
    }

    .nav-xp {
      min-width: 126px;
      padding: 0 12px;
    }

    .nav-avatar-button {
      width: 42px;
      height: 42px;
    }

    .nav-code {
      width: 46px;
      min-width: 46px;
      height: 46px;
    }

    .nav-code-icon {
      width: 28px;
      height: 28px;
    }
  }
</style>
            display: flex;
