<style>
  :root {
    --top-nav-height: 72px;
    --top-nav-bg: #f7fbf2;
    --top-nav-pill-bg: rgba(198, 223, 159, 0.78);
    --top-nav-pill-hover: rgba(182, 213, 139, 0.95);
    --top-nav-text: #28472a;
    --top-nav-text-soft: #4f6f48;
    --top-nav-green: #2f6b36;
    --top-nav-green-dark: #1f4d27;
    --top-nav-active: #245c2b;
    --top-nav-ring: #ff7a18;
    --top-nav-surface: rgba(255, 255, 255, 0.58);
    --top-nav-surface-strong: rgba(255, 255, 255, 0.86);
  }

  /* Top navigation shell */
  .global-sidebar.top-nav-shell {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: auto !important;
    width: 100% !important;
    height: var(--top-nav-height) !important;
    display: none;
    align-items: center;
    background: linear-gradient(180deg, rgba(247, 251, 242, 0.45) 0%, rgba(247, 251, 242, 0.25) 100%) !important;
    backdrop-filter: blur(24px) saturate(1.6);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    border-bottom: 1px solid rgba(100, 160, 90, 0.15) !important;
    box-shadow: 0 8px 32px 0 rgba(60, 100, 50, 0.06), 
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
    z-index: 1000;
    overflow: visible !important;
    /* Smart sticky: smooth show/hide transition */
    transform: translateY(0);
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1),
                background 0.3s ease,
                box-shadow 0.3s ease,
                backdrop-filter 0.3s ease;
    will-change: transform;
  }

  /* Hide header when scrolling down */
  .global-sidebar.top-nav-shell.nav-hidden {
    transform: translateY(-110%) !important;
    pointer-events: none;
  }

  /* Slightly deeper glass when page is scrolled */
  .global-sidebar.top-nav-shell.nav-scrolled {
    background: linear-gradient(180deg, rgba(247, 251, 242, 0.6) 0%, rgba(247, 251, 242, 0.4) 100%) !important;
    backdrop-filter: blur(28px) saturate(1.7);
    -webkit-backdrop-filter: blur(28px) saturate(1.7);
    box-shadow: 0 12px 40px rgba(50, 90, 40, 0.1),
                0 1px 0 rgba(100, 160, 90, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }

  body.has-sidebar .global-sidebar.top-nav-shell {
    display: flex !important;
  }

  body.hide-sidebar .global-sidebar.top-nav-shell,
  body.has-admin-sidebar .global-sidebar.top-nav-shell {
    display: none !important;
  }

  .top-nav-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px 0 12px;
    box-sizing: border-box;
  }

  .top-nav-brand {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  #sidebarLogo {
    height: 88px;
    width: auto;
    display: block;
    margin-left: -10px;
    transform-origin: center center;
    animation: sidebarLogoHeartbeat 3.2s ease-in-out infinite;
    transition:
      transform 260ms cubic-bezier(0.22, 1, 0.36, 1),
      filter 260ms cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform, filter;
    backface-visibility: hidden;
  }

  .top-nav-brand:hover #sidebarLogo,
  .top-nav-brand:active #sidebarLogo,
  .top-nav-brand:focus-visible #sidebarLogo {
    transform: scale(1.08);
    filter:
      drop-shadow(0 0 8px rgba(132, 204, 22, 0.55))
      drop-shadow(0 0 18px rgba(47, 107, 54, 0.34));
    animation-play-state: paused;
  }

  @keyframes sidebarLogoHeartbeat {
    0%, 100% {
      transform: scale(1);
      filter: drop-shadow(0 3px 5px rgba(47, 107, 54, 0.08));
    }

    45% {
      transform: scale(1);
    }

    52% {
      transform: scale(1.025);
      filter: drop-shadow(0 5px 10px rgba(132, 204, 22, 0.18));
    }

    60% {
      transform: scale(1);
    }

    68% {
      transform: scale(1.018);
    }

    78% {
      transform: scale(1);
    }
  }

  .top-nav-scroll {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
    overflow: visible;
  }
  
  .top-nav-scroll::-webkit-scrollbar {
    display: none; /* Chrome, Safari and Opera */
  }

  .top-nav-group {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  .top-nav-group-main {
    flex: 0 0 auto;
    justify-content: flex-end;
    position: relative;
  }

  .top-nav-group-user {
    flex: 0 0 auto;
    justify-content: flex-end;
    margin-left: 0;
  }

  .top-search-shell {
    position: relative;
    display: flex;
    flex-direction: row-reverse;
    align-items: center;
    gap: 8px;
    z-index: 20;
  }

  .top-search-toggle {
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 999px;
    background: var(--top-nav-green);
    box-shadow: 0 8px 22px rgba(68, 104, 58, 0.2);
    color: #ffffff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }

  .top-search-toggle:hover,
  .top-search-shell.is-open .top-search-toggle {
    background: #315f2f;
    transform: translateY(-1px);
    box-shadow: 0 10px 26px rgba(68, 104, 58, 0.25);
  }

  .top-search-toggle .search-icon {
    font-size: 22px;
    line-height: 1;
  }

  .top-search-panel {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 0;
    max-width: 0;
    opacity: 0;
    overflow: hidden;
    pointer-events: none;
    padding: 0;
    border-radius: 999px;
    background: var(--top-nav-surface-strong);
    border: 1px solid rgba(62, 115, 57, 0.16);
    box-shadow: 0 8px 24px rgba(68, 104, 58, 0.12);
    transition:
      width 0.26s ease,
      max-width 0.26s ease,
      opacity 0.18s ease,
      padding 0.26s ease;
  }

  .top-search-shell.is-open .top-search-panel {
    width: 300px;
    max-width: 300px;
    opacity: 1;
    pointer-events: auto;
    padding: 0.35rem 0.45rem 0.35rem 0.9rem;
  }

  .top-search-input {
    width: 100%;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: var(--top-nav-text);
    font-size: 0.92rem;
    font-weight: 700;
    padding: 0;
  }

  .top-search-input::placeholder {
    color: rgba(49, 95, 47, 0.52);
    font-weight: 600;
  }

  .top-search-clear {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--top-nav-green);
    font-size: 1.2rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.18s ease, color 0.18s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 3px;
  }

  .top-search-clear:hover {
    transform: scale(1.1);
    color: #ff3b30;
  }

  .nav-item {
    flex: 0 0 auto;
    min-height: 46px;
    padding: 0 16px;
    border: none;
    border-radius: 18px;
    background: transparent;
    color: var(--top-nav-text-soft);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    font-family: "Be Vietnam Pro", "Inter", "Segoe UI", sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    letter-spacing: 0.055em;
    white-space: nowrap;

    cursor: pointer;
    box-shadow: none;
    position: relative;
    transition:
      transform 0.2s ease,
      background 0.2s ease,
      color 0.2s ease,
      text-shadow 0.2s ease;
  }

  .nav-item:hover {
    background: rgba(47, 107, 54, 0.08);
    color: var(--top-nav-green-dark);
    transform: translateY(-1px);
  }

  .nav-item.active {
    background: transparent;
    color: var(--top-nav-active);
    text-shadow: none;
  }

  .nav-item.active .nav-label {
    color: var(--top-nav-active);
    letter-spacing: 0.07em;
  }

  .nav-magic-line {
    position: absolute;
    bottom: 5px;
    height: 5px;
    border-radius: 999px;
    background: linear-gradient(
      90deg,
      rgba(47, 107, 54, 0.15),
      #2f6b36 35%,
      #65a30d 100%
    );
    box-shadow:
      0 5px 14px rgba(47, 107, 54, 0.26),
      inset 0 1px 0 rgba(255, 255, 255, 0.45);
    transition:
      left 0.34s cubic-bezier(0.34, 1.56, 0.64, 1),
      width 0.34s cubic-bezier(0.34, 1.56, 0.64, 1),
      opacity 0.2s ease,
      transform 0.2s ease;
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    left: 0;
    width: 0;
  }

  .nav-magic-line::after {
    content: "";
    position: absolute;
    inset: -7px -10px;
    border-radius: inherit;
    background: radial-gradient(circle, rgba(101, 163, 13, 0.22), transparent 62%);
    filter: blur(7px);
    z-index: -1;
  }

  .nav-text {
    min-width: 0;
    background: transparent;
    box-shadow: none;
    padding: 0.58rem 0.95rem;
  }

  .nav-text .nav-label {
    display: inline-block;
    line-height: 1;
    transform: translateY(1px);
    transition:
      transform 0.22s ease,
      color 0.22s ease,
      letter-spacing 0.22s ease;
  }

  .nav-text:hover .nav-label,
  .nav-text:focus-visible .nav-label {
    transform: translateY(-1px);
  }

  .nav-code {
    width: 46px;
    height: 46px;
    min-width: 46px;
    padding: 0;
    border-radius: 18px;
    background: transparent;
    box-shadow: none;
  }
  
  .nav-code:hover {
    transform: translateY(-1px);
  }

  .nav-code-icon {
    width: 42px;
    height: 42px;
    object-fit: contain;
    display: block; 
  }

  /* Sort Game icon - same styling as Code Playground */
  .nav-sort-game {
    width: 46px;
    height: 46px;
    min-width: 46px;
    padding: 0;
    border-radius: 18px;
    background: transparent;
    box-shadow: none;
  }

  .nav-sort-game:hover {
    transform: translateY(-1px);
  }

  /* Chat nav button */
  .nav-chat-btn {
    position: relative;
    width: 46px;
    height: 46px;
    min-width: 46px;
    padding: 0;
    border-radius: 18px;
    background: transparent;
    box-shadow: none;
  }

  .nav-chat-btn:hover {
    transform: translateY(-1px);
  }

  .nav-chat-icon {
    font-size: 25px;
    color: var(--top-nav-text-soft);
    transition:
      color 0.2s ease,
      transform 0.2s ease,
      filter 0.2s ease;
  }

  .nav-chat-btn:hover .nav-chat-icon,
  .nav-chat-btn.active .nav-chat-icon {
    color: var(--top-nav-active);
    transform: translateY(-1px);
    filter: drop-shadow(0 4px 8px rgba(47, 107, 54, 0.22));
  }

  .nav-chat-badge {
    position: absolute;
    top: 2px;
    right: 0;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 99px;
    background: #ef4444;
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
    line-height: 18px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
    animation: badgePulse 2s ease-in-out infinite;
  }

  @keyframes badgePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .nav-streak {
    min-width: 70px;
    padding: 0 8px;
    gap: 0px;
    background: transparent;
    box-shadow: none;
  }

  .nav-fire-icon {
    width: 44px;
    height: 44px;
    margin-right: -4px;
    object-fit: contain;
    flex: 0 0 auto;
    filter: drop-shadow(0 4px 8px rgba(255, 122, 24, 0.22));
    transition: transform 0.3s ease-in-out;
  }

  .nav-fire-icon.pulse-animation {
    animation: fireScalePulse 1.2s ease-in-out infinite;
    filter: drop-shadow(0 4px 12px rgba(59, 130, 246, 0.6));
  }

  @keyframes fireScalePulse {
    0%, 100% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.15);
    }
  }

  .nav-streak.checked-in {
    background: transparent;
    box-shadow: none;
  }

  .nav-streak-value {
    font-size: 1.15rem;
    font-weight: 900;
    line-height: 1;
  }

  .nav-xp {
    min-width: 110px;
    justify-content: center;
    gap: 0.45rem;
    padding: 0 12px;
    background: transparent;
    box-shadow: none;
  }

  .nav-xp-label {
    font-size: 0.84rem;
    font-weight: 800;
    letter-spacing: 0.01em;
  }

  .nav-xp-value {
    font-size: 1.02rem;
    font-weight: 900;
    color: var(--top-nav-green);
  }

  .nav-avatar-shell {
    position: relative;
    flex: 0 0 auto;
  }

  .nav-pet-shell {
    position: relative;
    flex: 0 0 auto;
  }

  .nav-pet-button {
    width: 46px;
    height: 46px;
    padding: 0;
    border: none;
    border-radius: 0;
    overflow: visible;
    background: transparent;
    box-shadow: none;
    cursor: pointer;
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition:
      transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
      filter 0.2s ease;
  }

  .nav-pet-button:hover {
    transform: translateY(-1px) scale(1.06);
    filter: drop-shadow(0 5px 10px rgba(47, 107, 54, 0.22));
  }

  .nav-pet-button img,
  .nav-pet-button .nav-pet-fallback {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .nav-pet-button .nav-pet-fallback {
    position: absolute;
    inset: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #4b5563;
    background: linear-gradient(180deg, #eef2ff 0%, #e2e8f0 100%);
    visibility: hidden;
  }

  .nav-pet-button.is-placeholder img {
    visibility: hidden;
  }

  .nav-pet-button.is-placeholder .nav-pet-fallback {
    visibility: visible;
  }

  .nav-avatar-button {
    width: 50px;
    height: 50px;
    padding: 0;
    border: none;
    border-radius: 50%;
    overflow: visible;
    background: transparent;
    box-shadow: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .nav-avatar-button:hover {
    transform: scale(1.15);
  }

  .nav-avatar-button img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 50%;
  }

  .nav-avatar-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    min-width: 170px;
    padding: 0.45rem;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.98);
    border: 1px solid rgba(63, 115, 57, 0.14);
    box-shadow: 0 18px 40px rgba(35, 58, 31, 0.18);
    display: none;
    z-index: 1400;
  }

  .nav-avatar-shell.open .nav-avatar-menu {
    display: grid;
    gap: 0.35rem;
  }

  .nav-avatar-menu-item {
    width: 100%;
    border: none;
    border-radius: 14px;
    background: transparent;
    color: var(--top-nav-text);
    padding: 0.8rem 0.9rem;
    text-align: left;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.18s ease, transform 0.18s ease;
  }

  .nav-avatar-menu-item:hover {
    background: rgba(198, 223, 159, 0.34);
    transform: translateX(2px);
  }

  @keyframes navLabelBounce {
    0% {
      transform: translateY(0) scale(1);
    }
    40% {
      transform: translateY(-4px) scale(1.04);
    }
    100% {
      transform: translateY(0) scale(1);
    }
  }

  .sidebar-search-results {
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    width: 380px;
    max-height: 400px;
    overflow-y: auto;
    overflow-x: hidden;
    display: none;
    background: #ffffff;
    border: 1px solid rgba(49, 95, 47, 0.12);
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(31, 51, 31, 0.12);
    padding: 12px;
    z-index: 1300;
  }

  .sidebar-search-empty {
    padding: 24px 16px;
    text-align: center;
    color: #6b7280;
    font-size: 0.95rem;
    font-weight: 600;
  }

  .sidebar-search-group {
    margin-bottom: 12px;
  }

  .sidebar-search-group:last-child {
    margin-bottom: 0;
  }

  .sidebar-search-group-label {
    font-size: 0.75rem;
    font-weight: 800;
    color: var(--top-nav-green);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 4px 12px 8px;
    margin-bottom: 6px;
    border-bottom: 1px solid rgba(63, 115, 57, 0.1);
  }

  .sidebar-search-result-item {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border: none;
    background: transparent;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
    gap: 12px;
  }

  .sidebar-search-result-item:hover,
  .sidebar-search-result-item.active {
    background: rgba(198, 223, 159, 0.25);
    transform: translateX(4px);
  }

  .sidebar-search-result-item.is-locked {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .sidebar-search-result-item.is-locked:hover {
    transform: none;
    background: rgba(0, 0, 0, 0.04);
  }

  .sidebar-search-result-main {
    flex: 1;
    min-width: 0;
  }

  .sidebar-search-result-title {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--top-nav-text);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sidebar-search-result-subtitle {
    font-size: 0.8rem;
    color: #6b7280;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sidebar-search-result-side {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .sidebar-search-result-tag {
    font-size: 0.7rem;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 99px;
    background: rgba(63, 115, 57, 0.1);
    color: var(--top-nav-green);
  }
  
  .tag-page { background: rgba(59, 130, 246, 0.1); color: #2563eb; }
  .tag-lesson { background: rgba(16, 185, 129, 0.1); color: #059669; }
  .tag-quiz { background: rgba(139, 92, 246, 0.1); color: #7c3aed; }
  .tag-matching { background: rgba(245, 158, 11, 0.1); color: #d97706; }
  .tag-profile { background: rgba(236, 72, 153, 0.1); color: #db2777; }

  .sidebar-search-result-lock {
    font-size: 1.1rem;
    color: #9ca3af;
  }

  .sidebar-search-results.show,
  .sidebar-search-results.open {
    display: block;
  }

  /* Xóa layout sidebar trái cũ */
  body.has-sidebar .page-content,
  body.has-sidebar .main-content,
  body.has-sidebar .dashboard-main-content,
  body.has-sidebar .content-area,
  body.has-sidebar .topics-container,
  body.has-sidebar .lesson-container,
  body.has-sidebar .mcq-container,
  body.has-sidebar .matching-container {
    margin-left: 0 !important;
    width: 100% !important;
  }

  body.has-sidebar .page-content {
    padding-top: var(--top-nav-height) !important;
  }

  body.has-sidebar #page-dashboard {
    padding-top: var(--top-nav-height) !important;
  }

  body.has-sidebar #page-dashboard .content-area {
    padding-top: 0 !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }

  body:not(.has-admin-sidebar) .sidebar-overlay,
  body:not(.has-admin-sidebar) .mobile-menu-toggle,
  body:not(.has-admin-sidebar) .mobile-close-sidebar-btn,
  body:not(.has-admin-sidebar) .sidebar-toggle-btn,
  body:not(.has-admin-sidebar) .sidebar-footer,
  body:not(.has-admin-sidebar) .sidebar-user-profile,
  body:not(.has-admin-sidebar) .sidebar-logout-btn,
  body:not(.has-admin-sidebar) .sidebar-flyout,
  body:not(.has-admin-sidebar) .sidebar-flyout-menu {
    display: none !important;
  }

  .logout-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 2000;
    justify-content: center;
    align-items: center;
  }

  .logout-modal-overlay.show {
    display: flex;
  }

  .logout-modal {
    background: var(--theme-card, #ffffff);
    border-radius: 14px;
    padding: 1.5rem;
    max-width: 360px;
    width: 90%;
    text-align: center;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.3);
  }

  .logout-modal-buttons {
    display: flex;
    gap: 0.875rem;
    justify-content: center;
  }

  .logout-modal-buttons .btn-cancel,
  .logout-modal-buttons .btn-confirm {
    padding: 0.625rem 1.25rem;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
