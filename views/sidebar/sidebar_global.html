<!-- Global Top Navigation -->
<header class="global-sidebar top-nav-shell" id="globalSidebar">
  <div class="top-nav-inner">
    <div class="top-nav-brand" onclick="if(typeof showPage === 'function') showPage('page-dashboard')">
      <img
        id="sidebarLogo"
        src="https://cdn.jsdelivr.net/gh/twngvi/Doan@main/Image/Dashboard/TerraCode.png?v=20260524"
        alt="Terracode"
      />
    </div>

    <div class="top-nav-scroll" role="navigation" aria-label="Main navigation">
      <div class="top-nav-group top-nav-group-main">
        <div class="top-search-shell" id="sidebarSearchBox" title="Tìm kiếm">
          <button
            class="top-search-toggle"
            id="sidebarSearchToggle"
            type="button"
            aria-label="Mở tìm kiếm"
            aria-expanded="false"
          >
            <span class="material-symbols-sharp search-icon">search</span>
          </button>
          <div class="top-search-panel" id="sidebarSearchPanel">
            <input
              type="text"
              class="top-search-input"
              id="sidebarSearchInput"
              placeholder="Tìm kiếm..."
              autocomplete="off"
            />
            <button class="top-search-clear" id="sidebarSearchClear" type="button" aria-label="Xóa tìm kiếm">×</button>
          </div>
          <div class="sidebar-search-results" id="sidebarSearchResults" aria-live="polite"></div>
        </div>

        <a href="#" class="nav-item nav-text" data-page="page-dashboard">
          <span class="nav-label">TỔNG QUAN</span>
        </a>

        <a href="#" class="nav-item nav-text" data-page="page-topics">
          <span class="nav-label">HỌC TẬP</span>
        </a>

        <a href="#" class="nav-item nav-code nav-sort-game" data-page="page-code-game" title="Game sắp xếp">
          <img
            class="nav-code-icon"
            src="https://cdn.jsdelivr.net/gh/twngvi/Doan@main/Image/Dashboard/BaiTappython.png"
            alt="Game sắp xếp"
          />
        </a>

        <a href="#" class="nav-item nav-code" data-page="page-code-playground" title="Code Playground">
          <img
            class="nav-code-icon"
            src="https://cdn.jsdelivr.net/gh/twngvi/Doan@main/Image/Dashboard/Codeplayground.png"
            alt="Playground"
          />
        </a>

        <a href="javascript:void(0)" class="nav-item nav-chat-btn" onclick="if(typeof showToast==='function')showToast('💬 Chat - Coming Soon!','info');return false;" title="Chat - Coming Soon">
          <span class="material-symbols-sharp nav-chat-icon">chat</span>
        </a>
      </div>

      <div class="top-nav-group top-nav-group-user">
        <button class="nav-item nav-streak" id="global-checkin-fire" type="button" title="Điểm danh">
          <img
            class="nav-fire-icon"
            id="global-fire-icon"
            src="https://cdn.jsdelivr.net/gh/twngvi/Doan@main/Image/Dashboard/Lua_xanh_chua_diem_danh.png?v=20260518"
            alt="Điểm danh"
          />
          <span class="nav-streak-value" id="global-streak-value">0</span>
        </button>

        <button class="nav-item nav-xp" id="global-xp-chip" type="button" title="Điểm XP">
          <span class="nav-xp-label">Điểm XP:</span>
          <span class="nav-xp-value" id="global-xp-value">0</span>
        </button>

        <div class="nav-pet-shell">
          <button
            class="nav-pet-button"
            id="globalPetButton"
            type="button"
            aria-label="Mở trang PET"
            title="Trang PET"
          >
            <img
              id="globalPetImage"
              src="https://ui-avatars.com/api/?name=Pet&size=96&background=9ca3af&color=fff"
              alt="Pet yêu thích"
            />
            <span class="material-symbols-sharp nav-pet-fallback" aria-hidden="true">pets</span>
          </button>
        </div>

        <div class="nav-avatar-shell">
          <button
            class="nav-avatar-button"
            id="globalAvatarButton"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-label="Mở menu tài khoản"
          >
            <img
              id="globalAvatarImage"
              src="https://ui-avatars.com/api/?name=User&size=96&background=6b7280&color=fff"
              alt="Avatar"
            />
          </button>
          <div class="nav-avatar-menu" id="globalAvatarMenu" role="menu" aria-label="Tài khoản">
            <button class="nav-avatar-menu-item" type="button" data-action="profile">Profile</button>
            <button class="nav-avatar-menu-item" type="button" data-action="logout">Đăng xuất</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Logout Confirmation Modal -->
<div class="logout-modal-overlay" id="logoutModalOverlay">
  <div class="logout-modal">
    <div class="logout-modal-icon">
      <span class="material-symbols-sharp">logout</span>
    </div>
    <h3 class="logout-modal-title">Xác nhận đăng xuất</h3>
    <p class="logout-modal-text">Bạn có chắc chắn muốn đăng xuất không?</p>
    <div class="logout-modal-buttons">
      <button class="btn-cancel" id="logoutCancelBtn">Hủy</button>
      <button class="btn-confirm" id="logoutConfirmBtn">Đăng xuất</button>
    </div>
  </div>
</div>

<!-- Mobile Overlay (legacy placeholder, kept for compatibility) -->
<div class="sidebar-overlay" id="sidebarOverlay" style="display:none"></div>
