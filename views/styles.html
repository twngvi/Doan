<style>
  /* ===== CRITICAL RESET - Fix margin/padding/overflow ===== */
  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body {
    font-family:
      "Inter",
      -apple-system,
      BlinkMacSystemFont,

      sans-serif;

    width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: var(--app-surface-bg, var(--theme-bg, #071a33));
    color: var(--theme-text, #111827);
  }

  /* Khi landing page hiển thị - không scroll */
  body.no-scroll {
    overflow: hidden !important;
  }

  /* Scale down content for dashboard pages (after login) */
  body.has-sidebar {
    font-size: 90%;
  }

  .page-content {
    height: 100vh;
    min-height: 100vh;
    width: 100%;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    overflow-x: hidden;
    overflow-y: auto;
    color: var(--theme-text, #111827);
  }

  input,
  textarea,
  select,
  button {
    color: inherit;
  }

  /* Landing page specific - full viewport, no scroll */
  #page-landing {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    max-width: 100%;
    max-height: 100%;
    min-height: 100dvh;
    overflow: hidden;
  }

  .main-content {
    height: 100vh;
    height: 100dvh;
    padding: 0;
    margin: 0;
    overflow: hidden;
  }

  /* Smooth transitions */
  .transition-all {
    transition: all 0.3s ease;
  }

  /* Custom animations */
  @keyframes slideInRight {
    from {
      transform: translateX(100%);
      opacity: 0;
    }
    to {
      transform: translateX(0);
      opacity: 1;
    }
  }

  @keyframes slideInLeft {
    from {
      transform: translateX(-100%);
      opacity: 0;
    }
    to {
      transform: translateX(0);
      opacity: 1;
    }
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  .animate-slide-in-right {
    animation: slideInRight 0.3s ease-out;
  }

  .animate-slide-in-left {
    animation: slideInLeft 0.3s ease-out;
  }

  .animate-fade-in {
    animation: fadeIn 0.3s ease-out;
  }

  /* Custom button styles — themed via CSS custom properties */
  .btn-primary {
    color: #ffffff;
    font-weight: 600;
    padding: 0.75rem 1.5rem;
    border-radius: 0.5rem;
    transition: all 200ms;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    background: var(--theme-primary, #2563eb);
  }
  .btn-primary:hover {
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    background: var(--theme-primary-hover, #1d4ed8);
  }

  .btn-secondary {
    font-weight: 600;
    padding: 0.75rem 1.5rem;
    border-radius: 0.5rem;
    transition: all 200ms;
    background: var(--theme-surface, #e5e7eb);
    color: var(--theme-text-secondary, #374151);
    border: 1px solid var(--theme-border, #d1d5db);
  }
  .btn-secondary:hover {
    background: var(--theme-hover, #d1d5db);
  }

  .btn-back-global {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 0.6rem 1.2rem;
    border-radius: 50px;
    background: var(--theme-surface, #ffffff);
    color: var(--theme-text-secondary, #4b5563);
    border: 1px solid var(--theme-border, #d1d5db);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    width: max-content;
  }
  .btn-back-global:hover {
    background: var(--theme-primary, #2563eb);
    color: #ffffff;
    border-color: var(--theme-primary, #2563eb);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
  }
  .btn-back-global .  {
    font-size: 1.2rem;
    transition: transform 0.3s ease;
  }
  .btn-back-global:hover .material-symbols-sharp {
    transform: translateX(-3px);
  }

  .btn-success {
    color: #ffffff;
    font-weight: 600;
    padding: 0.75rem 1.5rem;
    border-radius: 0.5rem;
    transition: all 200ms;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    background: var(--theme-success, #16a34a);
  }
  .btn-success:hover {
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  }

  .btn-danger {
    color: #ffffff;
    font-weight: 600;
    padding: 0.75rem 1.5rem;
    border-radius: 0.5rem;
    transition: all 200ms;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    background: var(--theme-danger, #dc2626);
  }
  .btn-danger:hover {
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  }

  /* Custom input styles */
  .input-field {
    width: 100%;
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
    transition: all 200ms;
    outline: none;
    border: 1px solid var(--theme-border, #d1d5db);
    --tw-ring-color: var(--theme-secondary, #3b82f6);
  }
  .input-field:focus {
    box-shadow: 0 0 0 2px var(--tw-ring-color);
    border-color: transparent;
  }

  /* Card styles */
  .card {
    border-radius: 0.5rem;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    padding: 1.5rem;
    transition: all 200ms;
    background: var(--theme-card, #ffffff);
  }
  .card:hover {
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  }

  /* ===== TOAST NOTIFICATION SYSTEM ===== */
  .app-toast {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 320px;
    background: var(--theme-card, #ffffff);
    color: var(--theme-text, #111827);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    overflow: hidden;
    transform: translateX(120%);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
    border-left: 4px solid transparent;
  }

  .app-toast.show {
    transform: translateX(0);
    opacity: 1;
  }

  .app-toast-content {
    display: flex;
    align-items: center;
    padding: 16px;
    gap: 12px;
  }

  .app-toast-icon {
    display: flex;
    flex-shrink: 0;
  }

  .app-toast-message {
    flex-grow: 1;
    font-size: 0.95rem;
    font-weight: 500;
    line-height: 1.4;
  }

  .app-toast-close {
    background: transparent;
    border: none;
    color: var(--theme-text-muted, #9ca3af);
    cursor: pointer;
    display: flex;
    padding: 4px;
    border-radius: 50%;
    transition: all 0.2s ease;
  }

  .app-toast-close:hover {
    background: var(--theme-surface, #f3f4f6);
    color: var(--theme-text, #111827);
  }

  .app-toast-progress {
    height: 4px;
    width: 100%;
    background: rgba(0,0,0,0.05);
    position: relative;
  }

  .app-toast-progress::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 100%;
    transform-origin: left;
    animation: toast-progress 3s linear forwards;
  }

  @keyframes toast-progress {
    0% { transform: scaleX(1); }
    100% { transform: scaleX(0); }
  }

  /* Variants */
  .app-toast-success { border-left-color: var(--theme-success, #22c55e); }
  .app-toast-success .app-toast-icon { color: var(--theme-success, #22c55e); }
  .app-toast-success .app-toast-progress::after { background: var(--theme-success, #22c55e); }

  .app-toast-error { border-left-color: var(--theme-danger, #ef4444); }
  .app-toast-error .app-toast-icon { color: var(--theme-danger, #ef4444); }
  .app-toast-error .app-toast-progress::after { background: var(--theme-danger, #ef4444); }

  .app-toast-warning { border-left-color: var(--theme-warning, #eab308); }
  .app-toast-warning .app-toast-icon { color: var(--theme-warning, #eab308); }
  .app-toast-warning .app-toast-progress::after { background: var(--theme-warning, #eab308); }

  .app-toast-info { border-left-color: var(--theme-secondary, #3b82f6); }
  .app-toast-info .app-toast-icon { color: var(--theme-secondary, #3b82f6); }
  .app-toast-info .app-toast-progress::after { background: var(--theme-secondary, #3b82f6); }

  /* Navbar styles */
  .navbar {
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    background: var(--theme-card, #ffffff);
  }

  .navbar-item {
    padding: 0.5rem 1rem;
    border-radius: 0.375rem;
    transition: all 200ms;
    cursor: pointer;
    color: var(--theme-text-secondary, #374151);
  }
  .navbar-item:hover {
    background: var(--theme-hover, rgba(0, 0, 0, 0.05));
  }

  .navbar-item.active {
    font-weight: 600;
    background: var(--theme-surface, #dbeafe);
    color: var(--theme-primary, #2563eb);
  }

  /* Responsive utilities */
  @media (max-width: 640px) {
    .card {
      padding: 1rem;
    }

    .btn-primary,
    .btn-secondary,
    .btn-success,
    .btn-danger {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
    }
  }

  /* Loading spinner */
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .animate-spin {
    animation: spin 1s linear infinite;
  }

  /* Scrollbar styling - uses theme tokens */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  ::-webkit-scrollbar-track {
    background: var(--theme-scrollbar-track, rgba(15, 12, 41, 0.6));
    border-radius: 10px;
  }

  ::-webkit-scrollbar-thumb {
    background: var(
      --theme-scrollbar-thumb,
      linear-gradient(135deg, #3b82f6 0%, #2563eb 100%)
    );
    border-radius: 10px;
    border: 2px solid var(--theme-scrollbar-track, rgba(15, 12, 41, 0.3));
  }

  ::-webkit-scrollbar-thumb:hover {
    background: var(
      --theme-scrollbar-thumb-hover,
      linear-gradient(135deg, #2563eb 0%, #1e3a8a 100%)
    );
  }

  /* Firefox scrollbar */
  * {
    scrollbar-width: thin;
    scrollbar-color: var(--theme-primary, #3b82f6)
      var(--theme-scrollbar-track, rgba(15, 12, 41, 0.6));
  }

  /* Hide galaxy-specific effects (stars, meteors, etc.) when theme disables them */
  body.hide-galaxy-effects #page-dashboard::before,
  body.hide-galaxy-effects .topics-container::before,
  body.hide-galaxy-effects .profile-page::before,
  body.hide-galaxy-effects .profile-bg-effects,
  body.hide-galaxy-effects .profile-meteor-container,
  body.hide-galaxy-effects .profile-gradient-orb,
  body.hide-galaxy-effects .header-galaxy-bg {
    display: none !important;
  }

  /* ===== NOTIFICATION PANEL SYSTEM ===== */
  .nav-notif-badge {
    position: absolute;
    top: 6px;
    right: 8px;
    background: #ef4444;
    color: white;
    font-size: 0.65rem;

    padding: 0 4px;

  }

  .notification-panel {
    position: absolute;

    animation: fadeIn 0.2s ease-out;
  }

  .notification-header {
    display: flex;

  .notification-header h3 {
    margin: 0;

  }

  .close-notif-btn {

    border: none;
    color: var(--theme-text-secondary, #6b7280);

    font-size: 20px;

    transition: all 0.2s;
  }

  .close-notif-btn:hover {
    background: var(--theme-hover, #e5e7eb);
    color: var(--theme-text, #111827);
  }

  .notification-list {
    flex-grow: 1;
    overflow-y: auto;
    padding: 0;
    margin: 0;
  }

  .notification-empty {
    padding: 24px;
    text-align: center;
    color: var(--theme-text-muted, #9ca3af);
    font-size: 0.9rem;
  }

  .notification-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--theme-border-light, #f3f4f6);
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .notification-item:hover {
    background: var(--theme-surface, #f9fafb);
  }

  .notification-item.unread {
    background: var(--theme-primary-alpha10, rgba(37, 99, 235, 0.05));
    border-left: 3px solid var(--theme-primary, #2563eb);
  }

  .notif-title {
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--theme-text, #111827);
  }

  .notif-text {
    font-size: 0.85rem;
    color: var(--theme-text-secondary, #4b5563);
  }

  .notif-time {
    font-size: 0.75rem;
    color: var(--theme-text-muted, #9ca3af);
  }

  /* ===== GLOBAL APP DIALOG (alert/confirm/prompt replacement) ===== */
  .app-dialog-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    z-index: 11000;
    background: color-mix(in srgb, #000 58%, transparent);
    backdrop-filter: blur(4px);
  }

  .app-dialog-overlay.active {
    display: flex;
  }

  .app-dialog {
    width: min(92vw, 520px);
    background: var(--theme-card, #ffffff);
    border: 1px solid var(--theme-border, #d1d5db);
    border-radius: 16px;
    box-shadow: 0 18px 54px color-mix(in srgb, #000 35%, transparent);
    overflow: hidden;
    transform: scale(0.85) translateY(15px);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
  }

  .app-dialog-overlay.active .app-dialog {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .app-dialog-header {
    padding: 1rem 1.25rem 0.75rem;
    border-bottom: 1px solid var(--theme-border-light, #e5e7eb);
  }

  .app-dialog-title {
    margin: 0;
    color: var(--theme-text, #111827);
    font-size: 1.06rem;
    font-weight: 700;
  }

  .app-dialog-body {
    padding: 1rem 1.25rem 0.75rem;
  }

  .app-dialog-message {
    margin: 0;
    color: var(--theme-text-secondary, #374151);
    line-height: 1.55;
    white-space: pre-line;
  }

  .app-dialog-input-wrap {
    margin-top: 0.9rem;
  }

  .app-dialog-input {
    width: 100%;
    border: 1px solid var(--theme-border, #d1d5db);
    border-radius: 10px;
    background: var(--theme-surface, #f9fafb);
    color: var(--theme-text, #111827);
    padding: 0.65rem 0.8rem;
    font-size: 0.95rem;
    outline: none;
  }

  .app-dialog-input:focus {
    border-color: var(--theme-primary, #2563eb);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--theme-primary, #2563eb) 22%, transparent);
  }

  .app-dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.65rem;
    padding: 0.9rem 1.25rem 1.25rem;
  }

  .app-dialog-btn {
    border: 1px solid var(--theme-border, #d1d5db);
    border-radius: 10px;
    padding: 0.55rem 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .app-dialog-btn.secondary {
    background: var(--theme-surface, #f3f4f6);
    color: var(--theme-text-secondary, #1f2937);
  }

  .app-dialog-btn.secondary:hover {
    background: var(--theme-hover, #e5e7eb);
  }

  /* Default/User buttons (Orange) */
  #app-dialog-ok,
  .app-dialog-btn.primary,
  body.theme-forest #app-dialog-ok,
  body.theme-forest .app-dialog-btn.primary {
    background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%) !important;
    border: none !important;
    color: #ffffff !important;
    box-shadow: 0 4px 12px rgba(234, 88, 12, 0.25) !important;
  }

  #app-dialog-ok:hover,
  .app-dialog-btn.primary:hover,
  body.theme-forest #app-dialog-ok:hover,
  body.theme-forest .app-dialog-btn.primary:hover {
    background: linear-gradient(135deg, #d97706 0%, #c2410c 100%) !important;
    box-shadow: 0 6px 16px rgba(234, 88, 12, 0.35) !important;
  }

  /* Admin buttons override (Blue) */
  body.page-admin #app-dialog-ok,
  body.page-admin .app-dialog-btn.primary {
    background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%) !important;
    border: none !important;
    color: #ffffff !important;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25) !important;
  }

  body.page-admin #app-dialog-ok:hover,
  body.page-admin .app-dialog-btn.primary:hover {
    background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%) !important;
    box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35) !important;
  }

  /* ===== FLOWER FALLING ANIMATION (GLOBAL) ===== */
  .flower-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
  }

  .flower {
    position: absolute;
    font-size: 1.5rem;
    animation: fall linear forwards;
    opacity: 0;
  }

  /* ===== GLOBAL BACK TO TOP BUTTON ===== */
  :root {
    --floating-stack-right: 1.25rem;
    --floating-button-size: 46px;
  }

  .app-back-to-top {
    position: fixed;
    right: var(--floating-stack-right) !important;
    bottom: 80px;
    width: var(--floating-button-size);
    height: var(--floating-button-size);
    border: 1px solid var(--theme-primary-alpha30, rgba(45, 90, 61, 0.3));
    border-radius: 50%;
    background: linear-gradient(135deg, var(--theme-primary, #2d5a3d) 0%, var(--theme-secondary, #3a7a52) 100%);
    color: #ffffff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10050;
    opacity: 0;
    transform: translateY(12px) scale(0.92);
    pointer-events: none;
    box-shadow: 0 10px 24px rgba(30, 74, 46, 0.32);
    transition:
      opacity 0.25s ease,
      transform 0.25s ease,
      box-shadow 0.25s ease,
      background 0.25s ease;
  }

  .app-back-to-top.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .app-back-to-top:hover {
    background: linear-gradient(135deg, var(--theme-primary-hover, #1e4a2e) 0%, var(--theme-secondary, #3a7a52) 100%);
    box-shadow: 0 14px 30px rgba(45, 90, 61, 0.38);
  }

  .app-back-to-top:focus-visible {
    outline: 2px solid var(--theme-primary-alpha40, rgba(45, 90, 61, 0.25));
    outline-offset: 2px;
  }

  @media (max-width: 768px) {

      --floating-stack-right: 1rem;
      --floating-button-size: 42px;
    }

      bottom: 18px;
    }
    .app-back-to-top {
      width: var(--floating-button-size);
      height: var(--floating-button-size);
      right: var(--floating-stack-right) !important;
      bottom: 72px;
    }
  }

  /* Hide floating controls only while mobile sidebar is actively open */
  body.sidebar-mobile-open #mobileMenuToggleGlobal,
  body.sidebar-mobile-open .app-back-to-top {
    display: none !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }

  /* Hide floating controls when any pet info panel is open */
  body.pet-panel-open #mobileMenuToggleGlobal,
  body.pet-panel-open .app-back-to-top {
    display: none !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }

    transition: background 0.25s ease;
  }

  .content-area,
  .topics-container,
  .mcq-container,
  .matching-container,
  .lesson-container,
  .profile-container,
  .profile-page,
  .pet-page,
  .main-content,
  #page-dashboard,
  #page-topics,
  #page-lesson,
  #page-mcq,
  #page-matching,
  #page-profile,
