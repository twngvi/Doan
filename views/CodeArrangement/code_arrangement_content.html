<div class="ca-list-container" id="caListContainer" style="padding: 20px;">
  <h2 class="ca-game-title" style="margin-bottom: 20px;">Danh sách Game Sắp xếp Code</h2>
  <div id="caListBody" style="display: grid; gap: 15px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));">
    <!-- List of games will be rendered here -->
  </div>
</div>

<div class="ca-game-container" id="caGameContainer" style="display: none;">
  <div style="margin-bottom: 20px;">
    <button class="ca-action-btn secondary" onclick="goBackToList()">
      <span class="material-symbols-sharp" style="font-size: 18px;">arrow_back</span> Quay lại danh sách
    </button>
  </div>

  <div class="ca-game-header">
    <div class="ca-game-tags">
      <span class="ca-game-tag" id="caClientLanguageTag">Javascript</span>
      <span class="ca-game-tag" id="caClientDifficultyTag" style="background: rgba(245, 158, 11, 0.1); color: #f59e0b;">Medium</span>
    </div>
    <h2 class="ca-game-title" id="caClientTitle">Sắp xếp code</h2>
    <div class="ca-game-desc" id="caClientDescription">Hãy kéo thả các khối mã bên dưới để tạo thành chương trình hoàn chỉnh.</div>
  </div>

  <div class="ca-ide-wrapper">
    <div class="ca-ide-header">
      <div class="ca-ide-dots">
        <div class="ca-ide-dot red"></div>
        <div class="ca-ide-dot yellow"></div>
        <div class="ca-ide-dot green"></div>
      </div>
      <div class="ca-ide-filename" id="caClientFilename">main.js</div>
    </div>
    
    <div class="ca-ide-body" id="caClientContainer">
      <!-- Loading state -->
      <div style="text-align: center; color: #858585; padding: 40px;">
        <div class="loading-spinner" style="width: 24px; height: 24px; margin: 0 auto 12px; border-color: #858585; border-bottom-color: transparent;"></div>
        Đang tải câu hỏi...
      </div>
    </div>
  </div>

  <div id="caClientCelebration" class="ca-celebration" style="display: none;">
    🎉 Chúc mừng! Bạn đã ghép đúng code!
  </div>

  <div class="ca-game-actions">
    <button class="ca-action-btn primary" id="caClientCheckBtn" onclick="checkCodeArrangement()">
      <span class="material-symbols-sharp" style="font-size: 18px;">check_circle</span> Kiểm tra
    </button>
    <button class="ca-action-btn secondary" id="caClientRetryBtn" onclick="retryCodeArrangement()" style="display: none;">
      <span class="material-symbols-sharp" style="font-size: 18px;">refresh</span> Thử lại
    </button>
    <button class="ca-action-btn secondary" id="caClientCopyBtn" onclick="copyArrangedCode()" style="display: none;">
      <span class="material-symbols-sharp" style="font-size: 18px;">content_copy</span> Copy Code
    </button>
    <button class="ca-action-btn secondary" id="caClientPlaygroundBtn" onclick="openCodeArrangementPlayground()" style="display: none;">
      <span class="material-symbols-sharp" style="font-size: 18px;">code</span> Mở Playground
    </button>
  </div>
</div>
