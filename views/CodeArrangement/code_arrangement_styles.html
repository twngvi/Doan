<style>
  .ca-game-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
  }

  .ca-game-header {
    margin-bottom: 24px;
  }

  .ca-game-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--theme-text);
    margin-bottom: 8px;
  }

  .ca-game-desc {
    font-size: 16px;
    color: var(--theme-text-secondary);
    line-height: 1.6;
    margin-bottom: 16px;
  }

  .ca-game-tags {
    display: flex;
    gap: 8px;
  }

  .ca-game-tag {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    background: var(--theme-primary-light, rgba(37, 99, 235, 0.1));
    color: var(--theme-primary);
  }

  /* IDE container */
  .ca-ide-wrapper {
    background-color: #1e1e1e;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    margin-bottom: 24px;
  }

  .ca-ide-header {
    background-color: #2d2d2d;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #000;
  }

  .ca-ide-dots {
    display: flex;
    gap: 6px;
  }

  .ca-ide-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  .ca-ide-dot.red { background-color: #ff5f56; }
  .ca-ide-dot.yellow { background-color: #ffbd2e; }
  .ca-ide-dot.green { background-color: #27c93f; }

  .ca-ide-filename {
    color: #858585;
    font-size: 13px;
    margin-left: 16px;
    font-family: monospace;
  }

  .ca-ide-body {
    padding: 16px;
    min-height: 200px;
  }

  /* ===== New Play Layout ===== */

  .ca-play-layout {
    max-width: 1380px;
    padding: 24px;
    margin: 0 auto;
  }

  .ca-play-topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }

  .ca-icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    border: 1px solid var(--theme-border);
    background: var(--theme-surface);
    color: var(--theme-text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .ca-icon-btn:hover {
    background: var(--theme-bg);
    transform: translateY(-1px);
  }

  .ca-play-title-area {
    flex: 1;
    min-width: 0;
  }

  .ca-play-eyebrow {
    font-size: 12px;
    font-weight: 700;
    color: var(--theme-primary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }

  .ca-play-main {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }

  .ca-play-sidebar {
    display: grid;
    gap: 14px;
    position: sticky;
    top: 16px;
  }

  .ca-mission-card,
  .ca-progress-card {
    background: var(--theme-surface);
    border: 1px solid var(--theme-border);
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
  }

  .ca-section-label {
    font-size: 12px;
    font-weight: 800;
    color: var(--theme-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }

  .ca-progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--theme-border);
  }

  .ca-progress-row:last-of-type {
    border-bottom: none;
  }

  .ca-feedback-box {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 14px;
    background: var(--theme-bg);
    color: var(--theme-text-secondary);
    font-size: 14px;
    line-height: 1.5;
  }

  .ca-feedback-box.success {
    background: rgba(16, 185, 129, 0.12);
    color: #059669;
  }

  .ca-feedback-box.warning {
    background: rgba(245, 158, 11, 0.12);
    color: #d97706;
  }

  .ca-feedback-box.error {
    background: rgba(239, 68, 68, 0.12);
    color: #dc2626;
  }

  .ca-play-code-area {
    min-width: 0;
  }

  .ca-ide-status {
    margin-left: auto;
    color: #a3a3a3;
    font-size: 12px;
    font-weight: 700;
    background: rgba(255,255,255,0.06);
    padding: 5px 10px;
    border-radius: 999px;
  }

  .ca-card {
    position: relative;
    width: 100%;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: 30px 24px minmax(0, 1fr) 28px;
    gap: 8px;
    align-items: flex-start;
    border-radius: 14px;
    padding: 11px 14px;
    margin-bottom: 8px;
    background: #25272d;
    border: 1px solid #3b3f46;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    user-select: none;
  }

  .ca-card:hover {
    border-color: var(--theme-primary);
    box-shadow: 0 10px 24px rgba(0,0,0,0.28);
  }

  .ca-card-index {
    grid-column: 1;
    width: 28px;
    height: 28px;
    border-radius: 9px;
    background: rgba(255,255,255,0.08);
    color: #cbd5e1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
  }

  .ca-card-drag-icon {
    grid-column: 2;
    margin-right: 0;
    color: #94a3b8;
    cursor: grab;
    display: flex;
    align-items: center;
  }

  .ca-card-content {
    grid-column: 3;
    min-width: 0;
    margin: 0;
    padding: 0;
    background: transparent;
    color: #e5e7eb;
    font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre;
    overflow-x: auto;
    overflow-y: hidden;
    tab-size: 4;
  }

  .ca-card-status-icon {
    grid-column: 4;
    color: #64748b;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .ca-card.dragging {
    opacity: 0.7;
    transform: rotate(-1deg) scale(1.015);
    box-shadow: 0 18px 40px rgba(0,0,0,0.35);
  }

  .ca-card.drag-over {
    border-color: var(--theme-primary);
    box-shadow: inset 0 3px 0 var(--theme-primary);
  }

  .ca-card.correct {
    border-color: #22c55e;
    background: rgba(34, 197, 94, 0.12);
  }

  .ca-card.correct .ca-card-status-icon {
    color: #22c55e;
  }

  .ca-card.wrong {
    border-color: #ef4444;
    background: rgba(239, 68, 68, 0.12);
    animation: shake 0.5s;
  }

  .ca-card.wrong .ca-card-status-icon {
    color: #ef4444;
  }

  .ca-card.completed {
    background: rgba(22, 101, 52, 0.10);
    border-color: rgba(34, 197, 94, 0.38);
    cursor: default;
  }

  .ca-card.completed .ca-card-drag-icon {
    visibility: hidden;
  }

  .ca-card.completed .ca-card-index {
    background: rgba(34, 197, 94, 0.18);
    color: #86efac;
  }

  .ca-card.completed:hover {
    transform: none;
    box-shadow: none;
  }

  .ca-game-actions.ca-sticky-actions {
    position: static;
    z-index: 1;
    margin: 18px 0 0;
    padding: 0;
    width: 100%;
    max-width: none;
    background: transparent;
    backdrop-filter: none;
    border: none;
    border-radius: 0;
    box-shadow: none;
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    flex-wrap: wrap;
  }

  .ca-celebration {
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.25);
    border-radius: 18px;
    padding: 16px;
    color: #059669;
    margin-top: 16px;
    animation: fadeIn 0.5s;
  }

  .ca-celebration p {
    margin: 4px 0 0;
    font-size: 14px;
    font-weight: 500;
  }

  .ca-celebration-icon {
    font-size: 28px;
  }

  .ca-action-btn {
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
  }

  .ca-action-btn.primary {
    background: var(--theme-primary);
    color: white;
  }

  .ca-action-btn.primary:hover {
    filter: brightness(1.1);
    transform: translateY(-2px);
  }

  .ca-action-btn.secondary {
    background: var(--theme-surface);
    color: var(--theme-text);
    border: 1px solid var(--theme-border);
  }

  .ca-action-btn.secondary:hover {
    background: var(--theme-bg);
  }

  /* Tap to Move for Mobile */
  .ca-card.selected {
    border-color: var(--theme-primary);
    background: rgba(91, 111, 248, 0.14);
    box-shadow: 0 0 0 3px rgba(91, 111, 248, 0.18);
  }

.ca-ladder-content {

  color: #6a3f16;
}

.ca-ladder-title {

  color: #6a3f16;
  font-size: 32px;
  font-weight: 800;
  line-height: 1.18;
}

.ca-ladder-desc {

}

.ca-ladder-action {

  padding: 12px 20px;

  font-size: 14px;
  font-weight: 800;
  white-space: nowrap;

.ca-ladder-action:hover {

}

.ca-ladder-card:hover {

  border-color: rgba(190, 122, 45, 0.34);
  box-shadow: 0 24px 60px rgba(73, 55, 28, 0.18);

}

}

  color: #166534;
}

.ca-ladder-completed .ca-ladder-action {
  color: #166534;
  background: #dcfce7;
  box-shadow: 0 6px 16px rgba(34, 197, 94, 0.12);
}

.ca-ladder-locked {
  background: linear-gradient(135deg, #f5f3f0 0%, #eae8e5 100%);
  border-color: rgba(148, 140, 130, 0.2);

}

.ca-ladder-locked::after {
  background: rgba(148, 140, 130, 0.1);
}

.ca-ladder-locked .ca-ladder-icon {
  color: #8a8077;
  background: rgba(148, 140, 130, 0.14);
}

.ca-ladder-locked .ca-ladder-title {
  color: #8a8077;
}

.ca-ladder-locked .ca-ladder-desc {
  color: #a09890;
}

.ca-ladder-locked .ca-ladder-action {
  color: #8a8077;
  background: #e8e5e2;
  cursor: not-allowed;
  box-shadow: none;
}

.ca-ladder-locked:hover {

  box-shadow: 0 18px 45px rgba(73, 55, 28, 0.08);
}

.ca-ladder-empty {

  z-index: 3;
  text-align: center;
  color: #7a5a32;
  padding: 42px 16px;
  border-radius: 22px;
  background: rgba(255, 248, 235, 0.7);
  border: 1px dashed rgba(145, 104, 61, 0.28);
}

  /* Mobile */
  @media (max-width: 768px) {
    .ca-ladder-page {
      padding: 16px 10px 92px;
    }

    .ca-ladder-list {
      max-width: 100%;
      gap: 16px;
      padding: 10px 0 18px;
    }

    .ca-ladder-card {
      min-height: 100px;
      padding: 18px 16px;
      border-radius: 22px;
    }

    .ca-ladder-card-main {
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 11px;
    }

    .ca-ladder-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
    }

    .ca-ladder-action {
      grid-column: 1 / -1;
      justify-self: stretch;
      margin-top: 8px;
    }

    .ca-ladder-title {
      font-size: 22px;
    }

    .ca-ladder-desc {
      font-size: 13px;
    }
    .ca-game-container {
      padding-bottom: 96px;
    }

    .ca-play-layout {
      padding: 14px;
    }

    .ca-play-topbar {
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .ca-game-tags {
      width: 100%;
    }

    .ca-play-main {
      grid-template-columns: 1fr;
    }

    .ca-play-sidebar {
      position: static;
    }

    .ca-mission-card {
      padding: 14px;
    }

    .ca-progress-card {
      display: none;
    }

    .ca-card {
      grid-template-columns: 30px minmax(0, 1fr) 28px;
    }

    .ca-card-drag-icon {
      display: none;
    }

    .ca-card-content {
      font-size: 13px;
    }

    .ca-game-actions.ca-sticky-actions {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      width: auto;
      padding: 12px;
      background: rgba(235, 246, 230, 0.94);
      backdrop-filter: blur(14px);
      border: 1px solid var(--theme-border);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.18);
      justify-content: stretch;
    }

    .ca-game-actions.ca-sticky-actions .ca-action-btn {
      flex: 1;
      justify-content: center;
    }

    .ca-action-btn.secondary {
      flex: 0 0 calc(50% - 6px);
    }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
