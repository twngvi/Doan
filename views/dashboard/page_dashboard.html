<!-- Dashboard Content - 4-Zone Gamification Design -->

<main class="dashboard-main-content">
  <div class="content-area">

    <!-- ===== ZONE 2: TWO-COLUMN (60/40) ===== -->
    <div class="dashboard-zone3">
      <!-- Left Column: Lịch sử Thực chiến (60%) -->
      <section class="zone3-left glass-card">
        <div class="glass-card-header">
          <h3 class="glass-card-title">Lịch sử</h3>
        </div>
        <div class="glass-card-body" id="activity-history-list">
          <div class="loading-state">
            <div class="loading-spinner"></div>
            <span>Đang tải...</span>
          </div>
        </div>
      </section>

      <!-- Right Column: Nhiệm vụ & Tiến độ (40%) -->
      <section class="zone3-right">
        <!-- Daily Quests -->
        <div class="glass-card quest-card">
          <div class="glass-card-header">
            <h3 class="glass-card-title">Nhiệm vụ</h3>
          </div>
          <div class="glass-card-body" id="quests-list">
            <div class="loading-state">
              <div class="loading-spinner"></div>
              <span>Đang tải...</span>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- ===== ZONE 3: LEADERBOARD + SUGGESTION ===== -->
    <div class="dashboard-zone4">
      <!-- Leaderboard -->
      <section class="glass-card leaderboard-card forest-leaderboard-card">
        <div class="forest-leaderboard-header">
          <div class="forest-title-board">
            <span class="forest-title-icon">🏆</span>
            <div class="forest-title-content">
              <h3>Bảng xếp hạng</h3>
            </div>
          </div>
        </div>
        <div class="glass-card-body" id="leaderboard-list">
          <div class="loading-state">
            <div class="loading-spinner"></div>
            <span>🍃 Đang mở bảng vinh danh...</span>
          </div>
        </div>
      </section>
    </div>
  </div>
</main>
