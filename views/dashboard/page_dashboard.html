<!-- Dashboard Content - 4-Zone Gamification Design -->

<main class="dashboard-main-content">
  <div class="content-area dashboard-layout">

    <!-- CỘT TRÁI: để chèn nội dung mới -->
    <aside class="dashboard-left-panel">
      <div class="dashboard-pet-welcome" id="dashboardPetWelcome" onclick="if(typeof showPage==='function') showPage('page-pet');" title="Đi tới trang Pet">
        <div class="pet-welcome-bubble">
          <img src="https://cdn.jsdelivr.net/gh/twngvi/Doan@main/Image/Dashboard/welcome.png" class="welcome-bubble-bg" alt="Welcome Bubble">
          <span class="welcome-text" id="dashboardWelcomeText">Chào buổi sáng, User</span>
        </div>
        <img id="dashboardPetImage" src="https://ui-avatars.com/api/?name=Pet&size=250&background=transparent&color=fff" class="pet-welcome-image" alt="Pet">
      </div>

      <!-- NEW: Study Calendar Section -->
      <div class="glass-card" style="margin-top: 1.5rem;">
         <div class="glass-card-header" style="justify-content: center; background: rgba(255, 255, 255, 0.4);">
            <h3 class="glass-card-title" style="font-size: 1.1rem; color: #d97706; text-align: center;">📅 Lịch học tập tháng này</h3>
         </div>
         <div class="glass-card-body" style="padding: 1rem;">
            <div id="study-calendar-grid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center;">
               <!-- Calendar headers -->
               <div style="font-weight: bold; font-size: 0.8rem; color: var(--theme-text-secondary);">T2</div>
               <div style="font-weight: bold; font-size: 0.8rem; color: var(--theme-text-secondary);">T3</div>
               <div style="font-weight: bold; font-size: 0.8rem; color: var(--theme-text-secondary);">T4</div>
               <div style="font-weight: bold; font-size: 0.8rem; color: var(--theme-text-secondary);">T5</div>
               <div style="font-weight: bold; font-size: 0.8rem; color: var(--theme-text-secondary);">T6</div>
               <div style="font-weight: bold; font-size: 0.8rem; color: var(--theme-text-secondary);">T7</div>
               <div style="font-weight: bold; font-size: 0.8rem; color: var(--theme-text-secondary);">CN</div>
               <!-- Days injected by JS -->
            </div>
            <div style="margin-top: 1rem; display: flex; justify-content: space-around; font-size: 0.75rem;">
               <div style="display: flex; align-items: center; gap: 4px;"><div style="width: 12px; height: 12px; border-radius: 50%; background: #10b981;"></div> Đạt mục tiêu</div>
               <div style="display: flex; align-items: center; gap: 4px;"><div style="width: 12px; height: 12px; border-radius: 50%; background: #fbbf24;"></div> Có học</div>
               <div style="display: flex; align-items: center; gap: 4px;"><div style="width: 12px; height: 12px; border-radius: 50%; background: #ef4444;"></div> Nghỉ</div>
            </div>
         </div>
      </div>
    </aside>

    <!-- CỘT PHẢI: giữ toàn bộ nội dung hiện tại -->
    <section class="dashboard-right-panel">

      <!-- ===== ZONE 2: TWO-COLUMN (60/40) ===== -->
      <div class="dashboard-zone3">
        <!-- Left Column: Lịch sử Thực chiến (60%) -->
        <section class="zone3-left glass-card">
          <img src="https://cdn.jsdelivr.net/gh/twngvi/Doan@main/Image/Dashboard/lich_su.png?v=20260519-01" class="frame-image history-frame" alt="Lịch sử">
          <div class="glass-card-header history-header">
            <h3 class="glass-card-title">Lịch sử</h3>
          </div>
          <div class="glass-card-body" id="activity-history-list">
            <div class="loading-state">
              <div class="loading-spinner"></div>
              <span>Đang tải...</span>
            </div>
          </div>
        </section>

        <!-- Right Column: Nhiệm vụ & Tiến độ (40%) -->
        <section class="zone3-right">
          <!-- Daily Quests -->
          <div class="glass-card quest-card">
            <img src="https://cdn.jsdelivr.net/gh/twngvi/Doan@main/Image/Dashboard/nhiem_vu.png?v=20260519-01" class="frame-image quest-frame" alt="Nhiệm vụ">
            <div class="glass-card-header">
            </div>
            <div class="glass-card-body" id="quests-list">
              <div class="loading-state">
                <div class="loading-spinner"></div>
                <span>Đang tải...</span>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- ===== ZONE 3: LEADERBOARD + SUGGESTION ===== -->
      <div class="dashboard-zone4">
        <!-- Leaderboard -->
        <section class="glass-card leaderboard-card forest-leaderboard-card">
          <img src="https://cdn.jsdelivr.net/gh/twngvi/Doan@main/Image/Dashboard/bang_xep_hang.png?v=20260519-02" class="frame-image leaderboard-frame" alt="Bảng xếp hạng">
          <div class="glass-card-body" id="leaderboard-list">
            <div class="loading-state">
              <div class="loading-spinner"></div>
              <span>🍃 Đang mở bảng vinh danh...</span>
            </div>
          </div>
        </section>
      </div>

    </section>
  </div>
</main>
