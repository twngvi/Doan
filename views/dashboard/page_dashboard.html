<!-- Dashboard Content - 4-Zone Gamification Design -->

<main class="dashboard-main-content">
  <div class="content-area dashboard-layout">

    <!-- CỘT TRÁI: để chèn nội dung mới -->
    <aside class="dashboard-left-panel">
      <div class="dashboard-welcome-card">
        <h2>Chào mừng trở lại 🌱</h2>
        <p>Tiếp tục hành trình học tập hôm nay nào!</p>
        <button>Tiếp tục học</button>
      </div>
    </aside>

    <!-- CỘT PHẢI: giữ toàn bộ nội dung hiện tại -->
    <section class="dashboard-right-panel">

      <!-- ===== ZONE 2: TWO-COLUMN (60/40) ===== -->
      <div class="dashboard-zone3">
        <!-- Left Column: Lịch sử Thực chiến (60%) -->
        <section class="zone3-left glass-card">
          <img src="https://cdn.jsdelivr.net/gh/twngvi/Doan@main/Image/Dashboard/lich_su.png?v=20260519-01" class="frame-image history-frame" alt="Lịch sử">
          <div class="glass-card-header history-header">
            <h3 class="glass-card-title">Lịch sử</h3>
          </div>
          <div class="glass-card-body" id="activity-history-list">
            <div class="loading-state">
              <div class="loading-spinner"></div>
              <span>Đang tải...</span>
            </div>
          </div>
        </section>

        <!-- Right Column: Nhiệm vụ & Tiến độ (40%) -->
        <section class="zone3-right">
          <!-- Daily Quests -->
          <div class="glass-card quest-card">
            <img src="https://cdn.jsdelivr.net/gh/twngvi/Doan@main/Image/Dashboard/nhiem_vu.png?v=20260519-01" class="frame-image quest-frame" alt="Nhiệm vụ">
            <div class="glass-card-header">
            </div>
            <div class="glass-card-body" id="quests-list">
              <div class="loading-state">
                <div class="loading-spinner"></div>
                <span>Đang tải...</span>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- ===== ZONE 3: LEADERBOARD + SUGGESTION ===== -->
      <div class="dashboard-zone4">
        <!-- Leaderboard -->
        <section class="glass-card leaderboard-card forest-leaderboard-card">
          <img src="https://cdn.jsdelivr.net/gh/twngvi/Doan@main/Image/Dashboard/bang_xep_hang.png?v=20260519-02" class="frame-image leaderboard-frame" alt="Bảng xếp hạng">
          <div class="glass-card-body" id="leaderboard-list">
            <div class="loading-state">
              <div class="loading-spinner"></div>
              <span>🍃 Đang mở bảng vinh danh...</span>
            </div>
          </div>
        </section>
      </div>

    </section>
  </div>
</main>
