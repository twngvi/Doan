<script>
  /**
   * client_js.html - Client-Side JavaScript
   *
   * Handles all frontend logic, API calls, navigation, and UI updates
   */

  // ==================== Global Variables ====================
  var currentUser = null; // â­ DÃ¹ng var Ä‘á»ƒ tá»± Ä‘á»™ng gáº¯n vÃ o window
  window.currentUser = null; // â­ GÃ¡n trá»±c tiáº¿p Ä‘á»ƒ cháº¯c cháº¯n
  let isGoogleAuthInProgress = false; // Prevent multiple simultaneous requests
  let googleClientInitialized = false;
  let heartbeatIntervalId = null;
  let heartbeatMonitorId = null;
  let heartbeatEventsBound = false;
  let lastHeartbeatAt = 0;
  const GLOBAL_BACK_TO_TOP_SHOW_OFFSET = 220;
  let appBackToTopBound = false;
  let appBackToTopScrollHandler = null;
  let appBackToTopScrollSource = null;

  const HEARTBEAT_INTERVAL_MS = 30000;
  const HEARTBEAT_ACTIVITY_THROTTLE_MS = 20000;

  function getStoredCurrentUser() {
    try {
      const raw = localStorage.getItem("currentUser");
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      console.warn("Parse currentUser failed:", e);
      return null;
    }
  }

  function dispatchCurrentUserState(user) {
    if (typeof window.dispatchEvent !== "function") return;

    const payload =
      user && typeof user === "object"
        ? user
        : window.currentUser || currentUser || getStoredCurrentUser();

    window.dispatchEvent(
      new CustomEvent("user-info-updated", {
        detail: payload,
      })
    );
    window.dispatchEvent(
      new CustomEvent("top-nav-user-state-updated", {
        detail: payload,
      })
    );
  }

  function triggerDashboardRefreshWhenVisible(attempt) {
    const maxAttempts = 8;
    const currentAttempt = typeof attempt === "number" ? attempt : 0;
    const dashboardMain = document.querySelector(
      "#page-dashboard .dashboard-main-content",
    );
    const visible = !!(dashboardMain && dashboardMain.offsetParent !== null);

    console.log("📊 showPage dashboard visibility check:", {
      attempt: currentAttempt,
      visible: visible,
      hasRefreshFunction: typeof window.refreshDashboardOnReturn === "function",
    });

    if (visible && typeof window.refreshDashboardOnReturn === "function") {
      console.log("📊 showPage calling refreshDashboardOnReturn()");
      window.refreshDashboardOnReturn();
      return;
    }

    if (currentAttempt >= maxAttempts) {
      console.warn(
        "⚠️ Dashboard page visibility or refresh function missing after retries",
      );
      return;
    }

    setTimeout(function () {
      triggerDashboardRefreshWhenVisible(currentAttempt + 1);
    }, 100);
  }

  function getHeartbeatUser() {
    return window.currentUser || currentUser || getStoredCurrentUser();
  }

  function isSessionLoggedIn() {
    return (
      localStorage.getItem("isLoggedIn") === "true" && !!getHeartbeatUser()
    );
  }

  function sendUserHeartbeat(reason = "interval") {
    const user = getHeartbeatUser();
    if (!user || !isSessionLoggedIn()) return;
    if (typeof google === "undefined" || !google.script || !google.script.run)
      return;

    const now = Date.now();
    if (
      reason === "activity" &&
      now - lastHeartbeatAt < HEARTBEAT_ACTIVITY_THROTTLE_MS
    ) {
      return;
    }

    lastHeartbeatAt = now;
    const page = (localStorage.getItem("lastActivePage") || "").toString();

    google.script.run
      .withFailureHandler((error) => {
        console.warn("Heartbeat failed:", error);
      })
      .updateUserHeartbeat({
        userId: user.userId || "",
        email: user.email || "",
        sessionId: user.sessionId || "",
        page: page,
      });
  }

  function bindHeartbeatEventsOnce() {
    if (heartbeatEventsBound) return;
    heartbeatEventsBound = true;

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) sendUserHeartbeat("visibility");
    });
    window.addEventListener("focus", () => sendUserHeartbeat("focus"));
    window.addEventListener("online", () => sendUserHeartbeat("online"));

    const passiveEvents = [
      "click",
      "keydown",
      "mousemove",
      "touchstart",
      "scroll",
    ];
    passiveEvents.forEach((eventName) => {
      window.addEventListener(eventName, () => sendUserHeartbeat("activity"), {
        passive: true,
      });
    });
  }

  function startUserHeartbeat() {
    if (!isSessionLoggedIn()) return;
    if (heartbeatIntervalId) return;

    bindHeartbeatEventsOnce();
    sendUserHeartbeat("start");
    heartbeatIntervalId = setInterval(() => {
      sendUserHeartbeat("interval");
    }, HEARTBEAT_INTERVAL_MS);
  }

  function stopUserHeartbeat() {
    if (!heartbeatIntervalId) return;
    clearInterval(heartbeatIntervalId);
    heartbeatIntervalId = null;
  }

  function initHeartbeatMonitor() {
    if (heartbeatMonitorId) return;
    heartbeatMonitorId = setInterval(() => {
      if (isSessionLoggedIn()) {
        startUserHeartbeat();
      } else {
        stopUserHeartbeat();
      }
    }, 5000);
  }

  // ==================== Session Monitor ====================
  let sessionMonitorId = null;
  const SESSION_CHECK_INTERVAL_MS = 15000;

  function runSessionCheckOnce() {
    if (!isSessionLoggedIn()) return;

    const user = getHeartbeatUser();

    if (!user || !user.userId || !user.sessionId) {
      handleForceLogout("Phiên đăng nhập không hợp lệ. Vui lòng đăng nhập lại.");
      return;
    }

    google.script.run
      .withSuccessHandler((response) => {
        if (response && response.status === "FORCE_LOGOUT") {
          console.warn("Session invalid, forcing logout...");
          handleForceLogout(response.message || "Tài khoản đang được đăng nhập ở thiết bị khác.");
        }
      })
      .withFailureHandler((err) => {
        console.warn("Session check failed", err);
      })
      .checkUserSession(user.userId, user.sessionId);
  }

  function initSessionMonitor() {
    if (sessionMonitorId) return;

    runSessionCheckOnce();

    sessionMonitorId = setInterval(() => {
      runSessionCheckOnce();
    }, SESSION_CHECK_INTERVAL_MS);
  }

  function handleForceLogout(message) {
    if (sessionMonitorId) {
      clearInterval(sessionMonitorId);
      sessionMonitorId = null;
    }
    stopUserHeartbeat();

    // Show toast
    if (typeof window.showToast === "function") {
      window.showToast(message, "error");
    } else {
      alert(message);
    }

    // Call logout if available, or just clear storage and redirect
    if (typeof handleLogout === "function") {
      handleLogout(false); // pass false if we don't need a server call, but handleLogout might do it anyway.
    } else {
      localStorage.removeItem("currentUser");
      localStorage.removeItem("isLoggedIn");
      localStorage.removeItem("userId");
      sessionStorage.clear();
      window.currentUser = null;
      currentUser = null;
      if (typeof showPage === "function") {
        showPage("page-landing", {}, false);
      } else {
        window.location.reload();
      }
    }
  }

  function applyThemeFromAuthenticatedUser(user) {
    try {
      if (!user) return;
      currentUser = user;
      window.currentUser = user;
      if (window.ThemeManager) {
        window.ThemeManager.initTheme();
      }
    } catch (e) {
      console.warn("Apply user theme failed:", e);
    }
  }

  function getVisiblePageContent() {
    const pages = document.querySelectorAll(".page-content");
    for (const page of pages) {
      if (window.getComputedStyle(page).display !== "none") {
        return page;
      }
    }
    return null;
  }

  // ==================== Global Petal Effect ====================
  let globalPetalStormTimeout = null;

  function initGlobalPetalEffect() {
    console.log("🌸 [Petal] initGlobalPetalEffect called");
    
    const container = document.getElementById("petal-container");
    if (!container) {
      console.warn("🌸 [Petal] Container #petal-container NOT FOUND in DOM!");
      return;
    }

    // Force container visible regardless of CSS
    container.style.display = "block";
    container.style.position = "fixed";
    container.style.top = "0";
    container.style.left = "0";
    container.style.width = "100vw";
    container.style.height = "100vh";
    container.style.pointerEvents = "none";
    container.style.zIndex = "10";
    container.style.overflow = "visible";
    
    console.log("🌸 [Petal] Container found and forced visible. display:", 
      window.getComputedStyle(container).display);

    const petalImages = [
      "https://cdn.jsdelivr.net/gh/twngvi/Doan@main/Image/Dashboard/hoadao.png",
      "https://cdn.jsdelivr.net/gh/twngvi/Doan@main/Image/Dashboard/hoadao2.png"
    ];

    // Preload images
    function isPageExcluded() {
      var visiblePage = getVisiblePageContent();
      var pageId = visiblePage ? visiblePage.id : "";
      var excluded = ["page-landing", "page-mcq", "page-matching", "page-code-game"];
      if (!pageId || excluded.indexOf(pageId) !== -1 || document.hidden) {
        return true;
      }
      return false;
    }
    const pageMap = {
      dashboard: "page-dashboard",
      topics: "page-topics",
      mcq: "page-mcq",
      lesson: "page-lesson",
      matching: "page-matching",
      codeArrangement: "page-code-game",
      pet: "page-pet",
      profile: "page-profile",
      "code-playground": "page-code-playground",
      admin: "page-admin",
    };

    const allPageIds = [
      "page-dashboard",
      "page-topics",
      "page-code-playground",
      "page-lesson",
      "page-mcq",
      "page-matching",
      "page-code-game",
      "page-pet",
      "page-profile",
      "page-admin",
      "page-landing",
    ];

    petalImages.forEach(function(src) {
      var img = new Image();
      img.src = src;
    });

    function createPetal() {
      if (isPageExcluded()) return;

      var imgSrc = petalImages[Math.floor(Math.random() * petalImages.length)];

      // Use <img> element for reliability
      var petal = document.createElement("img");
      petal.src = imgSrc;
      petal.draggable = false;

      // Random size (10-22px) - Smaller as requested
      var sizeNum = Math.random() * 12 + 10;

      // Random start position (top or left)
      var startFromTop = Math.random() > 0.5;
      var startLeft, startTop;

      if (startFromTop) {
        startLeft = Math.random() * 100; // 0-100vw
        startTop = -(Math.random() * 60 + 40); // -40 to -100px
      } else {
        startLeft = -(Math.random() * 60 + 40); // -40 to -100px
        startTop = Math.random() * 60; // 0-60vh
      }

      petal.style.position = "absolute";
      petal.style.width = sizeNum + "px";
      petal.style.height = sizeNum + "px";
      petal.style.left = startLeft + (startFromTop ? "vw" : "px");
      petal.style.top = startTop + (startFromTop ? "px" : "vh");
      petal.style.pointerEvents = "none"; // Disable interaction to prevent blocking UI
      petal.style.zIndex = "10";
      petal.style.opacity = "0";
      petal.style.objectFit = "contain";
      
      // Base filter: đậm màu hơn (saturate and slight contrast, maybe lower brightness slightly)
      petal.style.filter = "saturate(1.8) brightness(0.9) contrast(1.1)";
      petal.style.transition = "filter 0.3s ease";

      // Glow effect on hover/interaction (phát sáng khi rơ chuột / chạm)
      petal.addEventListener("mouseenter", function() {
        petal.style.filter = "drop-shadow(0 0 15px #ff1493) brightness(1.3) saturate(2)";
      });
      petal.addEventListener("mouseleave", function() {
        petal.style.filter = "saturate(1.8) brightness(0.9) contrast(1.1)";
      });
      petal.addEventListener("touchstart", function() {
        petal.style.filter = "drop-shadow(0 0 15px #ff1493) brightness(1.3) saturate(2)";
      }, {passive: true});
      petal.addEventListener("touchend", function() {
        setTimeout(() => {
          petal.style.filter = "saturate(1.8) brightness(0.9) contrast(1.1)";
        }, 300);
      }, {passive: true});

      container.appendChild(petal);

      // Animation params
      var durationMs = (Math.random() * 4 + 6) * 1000; // 6-10s
      var delayMs = Math.random() * 2000;                // 0-2s stagger
      var startRot = Math.random() * 360;
      var endRot = startRot + 400 + Math.random() * 400;

      try {
        // Web Animations API
        // Random destination points for "free" movement
        var midX = window.innerWidth * (0.3 + Math.random() * 0.4);
        var midY = window.innerHeight * (0.3 + Math.random() * 0.4);
        var destX = window.innerWidth * (0.8 + Math.random() * 0.4);
        var destY = window.innerHeight * (0.5 + Math.random() * 0.5);

        var anim = petal.animate([
          {
            transform: "translate(0px, 0px) rotate(" + startRot + "deg) scale(0.5)",
            opacity: 0
          },
          {
            transform: "translate(" + (midX * 0.4) + "px, " + (midY * 0.4) + "px) rotate(" + (startRot + 90) + "deg) scale(0.8)",
            opacity: 0.5, // Faded
            offset: 0.2
          },
          {
            transform: "translate(" + midX + "px, " + midY + "px) rotate(" + (endRot - 180) + "deg) scale(0.9)",
            opacity: 0.6, // Faded
            offset: 0.5
          },
          {
            transform: "translate(" + destX + "px, " + destY + "px) rotate(" + endRot + "deg) scale(0.8)",
            opacity: 0
          }
        ], {
          duration: durationMs,
          delay: delayMs,
          easing: "cubic-bezier(0.37, 0, 0.63, 1)",
          fill: "forwards"
        });

        anim.onfinish = function() { 
          if (petal.parentNode) petal.remove(); 
        };
      } catch (e) {
        console.warn("🌸 [Petal] animate() failed, using CSS fallback:", e);
        // CSS transition fallback
        petal.style.transition = "all " + (durationMs / 1000) + "s ease-out " + (delayMs / 1000) + "s";
        petal.style.opacity = "0.85";
        setTimeout(function() {
          petal.style.transform = "translate(" + (window.innerWidth * 1.2) + "px, " + (window.innerHeight * 0.7) + "px) rotate(" + endRot + "deg)";
          petal.style.opacity = "0";
        }, 50);
        setTimeout(function() {
          if (petal.parentNode) petal.remove();
        }, durationMs + delayMs + 500);
      }

      // Safety cleanup
      setTimeout(function() { 
        if (petal.parentNode) petal.remove(); 
      }, durationMs + delayMs + 1000);
    }

    function triggerStorm() {
      if (isPageExcluded()) {
        // Still schedule next check even if excluded
        globalPetalStormTimeout = setTimeout(triggerStorm, 5000);
        return;
      }

      var stormCount = Math.floor(Math.random() * 15) + 30; // More petals (30-45)
      console.log("🌸 [Petal] Storm triggered!", stormCount, "petals");
      
      for (var i = 0; i < stormCount; i++) {
        createPetal();
      }

      // Schedule next storm every 10 seconds
      if (globalPetalStormTimeout) clearTimeout(globalPetalStormTimeout);
      globalPetalStormTimeout = setTimeout(triggerStorm, 10000);
    }

    // Start first storm after 1.5s
    if (globalPetalStormTimeout) clearTimeout(globalPetalStormTimeout);
    globalPetalStormTimeout = setTimeout(triggerStorm, 1500);
    
    console.log("🌸 [Petal] First storm scheduled in 1.5s");
  }

  function resolveAppBackToTopScrollSource() {
    const visiblePage = getVisiblePageContent();
    return visiblePage || window;
  }

  function getAppScrollTop(scrollSource) {
    if (scrollSource === window) {
      return (
        window.pageYOffset ||
        document.documentElement.scrollTop ||
        document.body.scrollTop ||
        0
      );
    }
    return Number(scrollSource.scrollTop) || 0;
  }

  function updateAppBackToTopVisibility() {
    const button = document.getElementById("app-back-to-top");
    if (!button) return;

    const source = appBackToTopScrollSource || resolveAppBackToTopScrollSource();
    const shouldShow = getAppScrollTop(source) > GLOBAL_BACK_TO_TOP_SHOW_OFFSET;
    button.classList.toggle("show", shouldShow);
  }

  function scrollActivePageToTop() {
    const source = appBackToTopScrollSource || resolveAppBackToTopScrollSource();
    if (source === window) {
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    if (typeof source.scrollTo === "function") {
      source.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      source.scrollTop = 0;
    }
  }

  function syncAppBackToTopScrollSource() {
    if (!appBackToTopScrollHandler) {
      appBackToTopScrollHandler = updateAppBackToTopVisibility;
    }

    const nextSource = resolveAppBackToTopScrollSource();
    if (appBackToTopScrollSource && appBackToTopScrollSource !== nextSource) {
      appBackToTopScrollSource.removeEventListener(
        "scroll",
        appBackToTopScrollHandler,
      );
    }

    if (appBackToTopScrollSource !== nextSource) {
      nextSource.addEventListener("scroll", appBackToTopScrollHandler, {
        passive: true,
      });
      appBackToTopScrollSource = nextSource;
    }

    updateAppBackToTopVisibility();
  }

  function initGlobalBackToTop() {
    const button = document.getElementById("app-back-to-top");
    if (!button) return;

    if (!appBackToTopBound) {
      button.addEventListener("click", scrollActivePageToTop);
      appBackToTopBound = true;
    }

    syncAppBackToTopScrollSource();
  }

  // ==================== Initialization ====================
  document.addEventListener("DOMContentLoaded", function () {
    console.log("App Initializing...");

    // Initialize Google Sign-In
    initGoogleSignIn();

    // BƯỚC 1: Khôi phục Session NGAY LẬP TỨC
    // Phải làm điều này trước khi quyết định hiển thị trang nào
    try {
      const savedUserStr = localStorage.getItem("currentUser");
      const isLoggedInStr = localStorage.getItem("isLoggedIn");

      // ⭐ Robust check: nếu currentUser có userId hợp lệ → khôi phục session
      // Không chỉ phụ thuộc vào isLoggedIn flag
      let user = null;
      if (savedUserStr) {
        try {
          user = JSON.parse(savedUserStr);
        } catch(parseErr) {
          user = null;
        }
      }

      if (user && user.userId) {
        // Có currentUser hợp lệ → khôi phục session
        currentUser = user;
        window.currentUser = user;

        // ⭐ Auto-fix: đảm bảo isLoggedIn flag đồng bộ
        if (isLoggedInStr !== "true") {
          console.warn("⚠️ isLoggedIn flag missing, auto-restoring...");
          localStorage.setItem("isLoggedIn", "true");
        }

        console.log("✅ Session recovered for:", user.email || user.username);
        console.log("🎭 Display Name:", user.displayName);
        console.log("🛡️ Role:", user.role);

        // ⭐ CẬP NHẬT UI NGAY - Tất cả vị trí hiển thị tên
        setTimeout(() => {
          if (typeof window.updateAllUserNames === "function") {
            window.updateAllUserNames(
              user.displayName || user.fullName || user.username || "User",
            );
          }
          if (typeof window.updateAllUserAvatars === "function") {
            window.updateAllUserAvatars(user.avatarUrl);
          }
          if (typeof window.updateSidebarUserInfo === "function") {
            window.updateSidebarUserInfo();
          }
        }, 100);
      } else {
        console.log("ℹ No active session found");
        currentUser = null;
        window.currentUser = null;
        // ⭐ Dọn dẹp nếu currentUser không hợp lệ
        localStorage.removeItem("currentUser");
        localStorage.removeItem("isLoggedIn");
      }
    } catch (e) {
      console.error("❌ Error recovering session:", e);
      localStorage.removeItem("currentUser");
      localStorage.removeItem("isLoggedIn");
      currentUser = null;
      window.currentUser = null;
    }

    if (isSessionLoggedIn()) {
      startUserHeartbeat();
      setTimeout(initStudyWidget, 2000); // Init study widget after login
    }
    initHeartbeatMonitor();
    initSessionMonitor(); // ⭐ Start checking session periodically

    // BƯỚC 1.5: Khôi phục Theme ngay lập tức (via ThemeManager)
    try {
      if (window.ThemeManager) {
        window.ThemeManager.initTheme();
      }
    } catch (e) {
      console.warn("Theme restore failed:", e);
    }

    // BƯỚC 2: Xác định trang đích (Routing Logic)

    // Ưu tiên 1: Link từ email/server (window.SERVER_PARAMS.page)
    let requestedPageName = window.SERVER_PARAMS?.page || "";

    // Ưu tiên 2: Trạng thái cũ khi F5 (localStorage)
    if (!requestedPageName) {
      requestedPageName = localStorage.getItem("lastActivePage");
      if (requestedPageName) {
        console.log(" Recovered page from storage:", requestedPageName);
      }
    } else {
      console.log(" Server requested page:", requestedPageName);
    }

    // Định nghĩa danh sách trang
    const pageMap = {
      dashboard: "page-dashboard",
      topics: "page-topics",
      mcq: "page-mcq",
      lesson: "page-lesson",
      matching: "page-matching",
      pet: "page-pet",
      profile: "page-profile",
      "code-playground": "page-code-playground",
      admin: "page-admin",
      landing: "page-landing",
      // Auth pages giờ nằm trong auth layer của landing
      login: "page-landing",
      register: "page-landing",
      "verify-email": "page-landing",
      "forgot-password": "page-landing",
    };

    // ⭐ Tách riêng trang cho từng role
    const adminOnlyPages = ["admin"]; // Chỉ admin được vào
    const userOnlyPages = [
      "dashboard",
      "topics",
      "mcq",
      "lesson",
      "matching",
      "pet",
      "profile",
      "code-playground"
    ]; // Chỉ user được vào
    const protectedPages = [...adminOnlyPages, ...userOnlyPages]; // Tất cả trang cần login

    const authPages = [
      "login",
      "register",
      "landing",
      "forgot-password",
      "verify-email",
    ];

    // Mapping auth page name to auth form type
    const authFormMap = {
      login: "login",
      register: "register",
      "verify-email": "verify",
      "forgot-password": "forgot",
    };

    // Mặc định là landing
    let targetPageId = "page-landing";
    let finalPageName = "landing";

    // Logic định tuyến
    if (requestedPageName && pageMap[requestedPageName]) {
      finalPageName = requestedPageName;
    } else {
      // Nếu không có trang yêu cầu, nhưng đã login -> kiểm tra role
      if (window.currentUser) {
        // ⭐ Admin vào trang admin, User vào dashboard
        finalPageName =
          window.currentUser.role === "ADMIN" ? "admin" : "dashboard";
      }
    }

    // ⭐ FORCE OVERRIDE: Admin đang có lastActivePage là user page → chuyển về admin
    if (window.currentUser && window.currentUser.role === "ADMIN") {
      if (userOnlyPages.includes(finalPageName)) {
        console.log("🛡️ Admin override: '" + finalPageName + "' → 'admin'");
        finalPageName = "admin";
      }
    }

    // BƯỚC 3: Kiểm tra quyền truy cập (Auth Guard)
    const isProtected = protectedPages.includes(finalPageName);
    const isAuthPage = authPages.includes(finalPageName);
    const userRole = window.currentUser?.role || "";
    const isAdmin = userRole === "ADMIN";

    // ⭐ ROLE-BASED ACCESS CONTROL
    if (isProtected) {
      if (window.currentUser) {
        // Đã login - kiểm tra quyền theo role
        const isAdminPage = adminOnlyPages.includes(finalPageName);
        const isUserPage = userOnlyPages.includes(finalPageName);

        if (isAdmin) {
          // ADMIN chỉ được vào trang admin
          if (isUserPage) {
            console.warn(
              "🛡️ Admin không được vào trang user. Redirect về admin.",
            );
            targetPageId = "page-admin";
            finalPageName = "admin";
          } else {
            targetPageId = pageMap[finalPageName];
            console.log("🛡️ Admin access to:", finalPageName);
          }
        } else {
          // USER chỉ được vào trang user
          if (isAdminPage) {
            console.warn(
              "🚫 User không được vào trang admin. Redirect về dashboard.",
            );

  // ==================== Header Title Bounce ====================

  function escapeHeaderText(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function buildBouncyTextHtml(text, options) {
    var opts = options || {};
    var preserveSpaces = opts.preserveSpaces !== false;
    var safe = escapeHeaderText(text);
    return safe
      .split("")
      .map(function (ch) {
        if (ch === " ") {
          if (!preserveSpaces) return " ";
          return '<span class="bounce-char bounce-space">&nbsp;</span>';
        }
        return '<span class="bounce-char">' + ch + "</span>";
      })
      .join("");
  }

  function applyHeaderTitleBounce(root) {
    var scope = root && root.nodeType === 1 ? root : document;
    var targets = [];
    if (scope.classList && scope.classList.contains("header-title-animated")) {
      targets.push(scope);
    } else if (scope.querySelectorAll) {
      targets = Array.prototype.slice.call(
        scope.querySelectorAll(".header-title-animated"),
      );
    }

    targets.forEach(function (el) {
      if (!el || el.dataset.bounceReady === "true") return;
      var rawText = el.textContent || "";
      if (!rawText.trim()) return;
      var preserveSpaces = el.dataset.bounceSpaces !== "false";
      el.innerHTML = buildBouncyTextHtml(rawText, {
        preserveSpaces: preserveSpaces,
      });
      el.dataset.bounceReady = "true";
    });
  }

  window.buildBouncyTextHtml = buildBouncyTextHtml;
  window.applyHeaderTitleBounce = applyHeaderTitleBounce;

      else cancel();
    }

  function handleLoginFormSubmit() {

    if (_loginAttempts.length >= LOGIN_MAX_ATTEMPTS) {

        (LOGIN_WINDOW_MS - (now - _loginAttempts[0])) / 1000,
      );
      showToast(
        "Quá nhiều lần thử. Vui lòng đợi " + waitSeconds + " giây.",
        "error",
      );

  window.preloadAppOfflineCaches = function() {

      .withSuccessHandler(function(response) {

              ? (user.userId || user.email)

  function clearAppLocalCaches(options) {
    var opts = options || {};
    var clearMcqDrafts = opts.clearMcqDrafts === true;

    try {
      Object.keys(localStorage).forEach(function(key) {
        var shouldClear =
          key.indexOf("doan:dashboard:") === 0 ||
          key.indexOf("doan:topics:") === 0 ||
          key.indexOf("doan:ca_list:") === 0;

        // Chỉ xóa nháp MCQ khi chủ động yêu cầu, không xóa khi logout bình thường
        if (clearMcqDrafts) {
          shouldClear =
            shouldClear ||
            key.indexOf("mcq_progress_") === 0 ||
            key.indexOf("mcq_active_draft_") === 0 ||
            key.indexOf("mcq_pending_actions_") === 0;
        }

        if (shouldClear) {
          localStorage.removeItem(key);
        }
      });
    } catch (e) {
      console.warn("Không thể xóa App cache:", e);
    }
  }

  /**
   * Handle logout
   */
  function handleLogout(clearServerSession = true) {
    console.log("Logging out...");

    const userBeforeLogout = window.currentUser || currentUser || getStoredCurrentUser();

    stopUserHeartbeat();

    // Chỉ xóa session server khi user bấm đăng xuất thật
    // Không xóa khi bị FORCE_LOGOUT từ thiết bị khác
    if (
      clearServerSession &&
      userBeforeLogout &&
      userBeforeLogout.userId &&
      userBeforeLogout.sessionId &&
      typeof google !== "undefined" &&
      google.script &&
      google.script.run
    ) {
      google.script.run
        .withSuccessHandler(function (res) {
          console.log("Server session cleared:", res);
        })
        .withFailureHandler(function (err) {
          console.warn("Clear server session failed:", err);
        })
        .clearUserSession(userBeforeLogout.userId, userBeforeLogout.sessionId);
    }

    // Clear user data from all storage
    currentUser = null;
    window.currentUser = null; // â­ XÃ³a khá»i window
    localStorage.removeItem("currentUser");
    localStorage.removeItem("userSession");
    localStorage.removeItem("isLoggedIn");
    localStorage.removeItem("userId");

    // Clear App caches (Dashboard, Topics, etc.)
    clearAppLocalCaches();

    // â­ FIX F5: XÃ³a trang Ä‘Ã£ lÆ°u Ä‘á»ƒ trÃ¡nh quay láº¡i trang cÅ©
    localStorage.removeItem("lastActivePage");

    // Clear localStorage náº¿u cÃ³
    localStorage.removeItem("currentUser");
    localStorage.removeItem("user");
    localStorage.removeItem("authToken");
    localStorage.removeItem("recentActivities"); // Clear activity cache
    localStorage.removeItem("streakData");       // Clear streak cache

    // Clear theme
    if (window.ThemeManager) {
      window.ThemeManager.resetTheme();
    } else {
      localStorage.removeItem("userTheme");
    }

    // Clear auth panel state
    sessionStorage.removeItem("authPanelOpen");
    sessionStorage.removeItem("authFormType");
    sessionStorage.removeItem("currentUser");
    sessionStorage.removeItem("isLoggedIn");
    sessionStorage.removeItem("userId");

    // Hide Study Widget and Timeline Popup
    const studyWidget = document.getElementById("study-widget");
    if (studyWidget) studyWidget.style.display = "none";
    if (typeof closeTimelinePopup === "function") closeTimelinePopup();
    if (typeof toggleStudyWidget === "function") {
        const panel = document.getElementById("study-widget-panel");
        if (panel && panel.classList.contains("active")) {
           toggleStudyWidget();
        }
    }

    // Clear Google auth state if needed
    if (
      googleClientInitialized &&
      typeof google !== "undefined" &&
      google.accounts
    ) {
      try {
        google.accounts.id.disableAutoSelect();
        console.log("Google auto-select disabled");
      } catch (e) {
        console.log("Error disabling Google auto-select:", e);
      }
    }

    // Show message
    if (typeof showToast === "function") {
      showToast("Đã đăng xuất", "info");
    } else {
      showAppAlert("Đã đăng xuất");
    }

    // Navigate to login
    setTimeout(() => {
      // Reset landing page CTA buttons to show login/register
      resetLandingCTA();

      if (typeof showPage === "function") {
        showPage("page-landing");
      } else {
        document
          .querySelectorAll(".page-content")
          .forEach((p) => (p.style.display = "none"));
        const landingPage = document.getElementById("page-landing");

  /**
   * Loading overlay state — anti-duplication guard
   * Prevents multiple triggers from stacking overlays.
   * Background refreshes are silently ignored.
   */
  let _loadingCount = 0;
  let _loadingReason = null;
  let _loadingHideTimer = null;
  let _loadingVisibleSince = 0;
  let _loadingLastShowAt = 0;

  // Disable full-screen loading popup to avoid blocking user interactions
  // during frequent background/network requests.
  const ENABLE_GLOBAL_LOADING_OVERLAY = false;

  const LOADING_REOPEN_COOLDOWN_MS = 900;
  const LOADING_MIN_VISIBLE_MS = 220;

  function isDashboardPageActive() {
    const lastActivePage = localStorage.getItem("lastActivePage");
    if (lastActivePage === "dashboard") return true;

    const dashboardPage = document.getElementById("page-dashboard");
    if (!dashboardPage) return false;
    return dashboardPage.style.display === "block";
  }

  function isAuthPageName(pageName) {
    return (
      pageName === "landing" ||
      pageName === "login" ||
      pageName === "register" ||
      pageName === "verify-email" ||
      pageName === "forgot-password"
    );
  }

  function shouldSuppressOverlayForLoggedInApp(reason, forceBlocking) {
    if (forceBlocking) return false;
    if (!isSessionLoggedIn()) return false;

    const currentPage = (
      localStorage.getItem("lastActivePage") || ""
    ).toString();
    if (isAuthPageName(currentPage)) return false;

    const allowedBlockingReasons = new Set([
      "initial-load",
      "route-change",
      "page-transition",
      "blocking",
    ]);

    return !allowedBlockingReasons.has(reason || "");
  }

  function shouldSuppressGlobalOverlay(reason, forceBlocking) {
    if (forceBlocking) return false;

    if (shouldSuppressOverlayForLoggedInApp(reason, forceBlocking)) {
      return true;
    }

    if (reason === "background") {
      return true;
    }

    // While user is on dashboard, do not show full-screen overlay for
    // implicit/background actions. Allow only explicit blocking reasons.
    if (isDashboardPageActive()) {
      const allowedDashboardReasons = new Set([
        "initial-load",
        "route-change",
        "page-transition",
        "blocking",
      ]);
      return !allowedDashboardReasons.has(reason || "");
    }

    return false;
  }

  /**
   * Show/hide loading overlay
   * @param {boolean} show - true to show, false to hide
   * @param {string|object} [reasonOrOptions] - optional reason/options
   */
  function showLoading(show, reasonOrOptions) {
    const overlay = document.getElementById("loading-overlay");
    if (!overlay) return;

    if (!ENABLE_GLOBAL_LOADING_OVERLAY) {
      if (show) {
        _loadingCount++;
      } else {
        _loadingCount = Math.max(0, _loadingCount - 1);
      }
      overlay.style.display = "none";
      return;
    }

    const options =
      reasonOrOptions && typeof reasonOrOptions === "object"
        ? reasonOrOptions
        : { reason: reasonOrOptions };
    const reason = options.reason || "";
    const forceBlocking = !!options.forceBlocking;

    if (show) {
      if (shouldSuppressGlobalOverlay(reason, forceBlocking)) {
        return;
      }

      const now = Date.now();

      if (
        !forceBlocking &&
        now - _loadingLastShowAt < LOADING_REOPEN_COOLDOWN_MS
      ) {
        return;
      }

      if (_loadingHideTimer) {
        clearTimeout(_loadingHideTimer);
        _loadingHideTimer = null;
      }

      _loadingCount++;
      _loadingReason = reason || "unknown";
      _loadingVisibleSince = now;
      _loadingLastShowAt = now;

      if (overlay.style.display !== "flex") {
        overlay.style.display = "flex";
      }
    } else {
      _loadingCount = Math.max(0, _loadingCount - 1);
      if (_loadingCount === 0) {
        const elapsed = Date.now() - _loadingVisibleSince;
        const remainingVisibleMs = Math.max(
          0,
          LOADING_MIN_VISIBLE_MS - elapsed,
        );

        if (_loadingHideTimer) {
          clearTimeout(_loadingHideTimer);
          _loadingHideTimer = null;
        }

        if (remainingVisibleMs > 0) {
          _loadingHideTimer = setTimeout(() => {
            if (_loadingCount === 0) {
              overlay.style.display = "none";
              _loadingReason = null;
            }
            _loadingHideTimer = null;
          }, remainingVisibleMs);
        } else {
          overlay.style.display = "none";
          _loadingReason = null;
        }
      }
    }
  }

  /**
   * Force-hide loading overlay — resets counter completely
   */
  function hideLoading() {
    if (_loadingHideTimer) {
      clearTimeout(_loadingHideTimer);
      _loadingHideTimer = null;
    }
    _loadingCount = 0;
    _loadingReason = null;
    const overlay = document.getElementById("loading-overlay");
    if (overlay) overlay.style.display = "none";
  }

    hideLoading();

    enableButton("btn-login");
    enableButton("btn-register");

    // Check for specific error types
    let errorMessage = "Có lỗi xảy ra";

    if (error && error.message) {
      const msg = error.message.toLowerCase();

      if (msg.includes("429") || msg.includes("too many requests")) {
        errorMessage = "Quá nhiều yêu cầu. Vui lòng đợi 1 phút và thử lại.";
      } else if (msg.includes("timeout")) {
        errorMessage =
          "Hết thời gian chờ. Vui lòng kiểm tra kết nối và thử lại.";
      } else if (msg.includes("network")) {
        errorMessage =
          "Lỗi kết nối mạng. Vui lòng kiểm tra internet và thử lại.";
      } else {
        errorMessage = "Có lỗi xảy ra: " + error.message;
      }
    }

    showToast(errorMessage, "error");
  }

  /**

  function formatDate(dateString) {
    if (!dateString) return "";

    try {
      const date = new Date(dateString);
      return date.toLocaleDateString("vi-VN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      });
    } catch (error) {
      return dateString;
    }
  }

  // ==================== App Dialog System ====================
  let appDialogQueue = [];
  let appDialogActive = false;

  function getAppDialogElements() {
    return {
      overlay: document.getElementById("app-dialog-overlay"),
      title: document.getElementById("app-dialog-title"),
      message: document.getElementById("app-dialog-message"),
      inputWrap: document.getElementById("app-dialog-input-wrap"),
      input: document.getElementById("app-dialog-input"),
      okBtn: document.getElementById("app-dialog-ok"),
      cancelBtn: document.getElementById("app-dialog-cancel"),
    };
  }

  function showAppAlert(message, options) {
    const opts = options || {};
    return openAppDialog({
      type: "alert",
      title: opts.title || "Thông báo",
      message: String(message || ""),
      confirmText: opts.confirmText || "OK",
      cancelText: opts.cancelText || "Đóng",
      allowBackdropClose: opts.allowBackdropClose !== false,
    });
  }

  function showAppConfirm(message, options) {
    const opts = options || {};
    return openAppDialog({
      type: "confirm",
      title: opts.title || "Xác nhận",
      message: String(message || ""),
      confirmText: opts.confirmText || "Đồng ý",
      cancelText: opts.cancelText || "Hủy",
      allowBackdropClose: opts.allowBackdropClose !== false,
    });
  }

  function showAppPrompt(message, defaultValue, options) {
    const opts = options || {};
    return openAppDialog({
      type: "prompt",
      title: opts.title || "Nhập thông tin",
      message: String(message || ""),
      confirmText: opts.confirmText || "Xác nhận",
      cancelText: opts.cancelText || "Hủy",
      defaultValue: defaultValue || "",
      placeholder: opts.placeholder || "",
      allowBackdropClose: opts.allowBackdropClose !== false,
    });
  }

  function openAppDialog(config) {
    return new Promise(function (resolve) {
      appDialogQueue.push({ config: config, resolve: resolve });
      processAppDialogQueue();
    });
  }

  function processAppDialogQueue() {
    if (appDialogActive || appDialogQueue.length === 0) return;
    appDialogActive = true;

    const payload = appDialogQueue.shift();
    const config = payload.config;
    const resolve = payload.resolve;
    const els = getAppDialogElements();

    if (!els.overlay || !els.title || !els.message || !els.okBtn || !els.cancelBtn) {
      appDialogActive = false;
      console.warn("App dialog elements are missing in DOM");
      if (config.type === "confirm") resolve(false);
      else if (config.type === "prompt") resolve(null);
      else resolve(true);
      processAppDialogQueue();
      return;
    }

    const isPrompt = config.type === "prompt";
    const isConfirm = config.type === "confirm";
    const allowBackdropClose = config.allowBackdropClose !== false;

    els.title.textContent = config.title || "Thông báo";
    els.message.textContent = config.message || "";
    els.okBtn.textContent = config.confirmText || "OK";
    els.cancelBtn.textContent = config.cancelText || "Hủy";
    els.cancelBtn.style.display = isConfirm || isPrompt ? "inline-flex" : "none";

    if (isPrompt && els.inputWrap && els.input) {
      els.inputWrap.style.display = "block";
      els.input.value = String(config.defaultValue || "");
      els.input.placeholder = config.placeholder || "";
    } else if (els.inputWrap && els.input) {
      els.inputWrap.style.display = "none";
      els.input.value = "";
      els.input.placeholder = "";
    }

    let closed = false;
    let keyHandler = null;

    function cleanup() {
      els.overlay.classList.remove("active");
      els.overlay.setAttribute("aria-hidden", "true");
      els.okBtn.onclick = null;
      els.cancelBtn.onclick = null;
      els.overlay.onclick = null;
      if (keyHandler) document.removeEventListener("keydown", keyHandler);
    }

    function finalize(value) {
      if (closed) return;
      closed = true;
      cleanup();
      resolve(value);
      appDialogActive = false;
      processAppDialogQueue();
    }

    els.okBtn.onclick = function () {
      if (isPrompt && els.input) {
        finalize(els.input.value);
        return;
      }
      finalize(true);
    };

    els.cancelBtn.onclick = function () {
      if (isPrompt) {
        finalize(null);
        return;
      }
      finalize(false);
    };

    els.overlay.onclick = function (event) {
      if (!allowBackdropClose || event.target !== els.overlay) return;
      if (isPrompt) {
        finalize(null);
      } else if (isConfirm) {
        finalize(false);
      } else {
        finalize(true);
      }
    };

    keyHandler = function (event) {
      if (event.key === "Escape") {
        event.preventDefault();
        if (!allowBackdropClose) return;
        if (isPrompt) {
          finalize(null);
        } else if (isConfirm) {
          finalize(false);
        } else {
          finalize(true);
        }
      } else if (event.key === "Enter" && isPrompt && document.activeElement === els.input) {
        event.preventDefault();
        finalize(els.input.value);
      }
    };

    document.addEventListener("keydown", keyHandler);
    els.overlay.classList.add("active");
    els.overlay.setAttribute("aria-hidden", "false");

    if (isPrompt && els.input) {
      setTimeout(function () {
        els.input.focus();
        els.input.select();
      }, 20);
    } else {
      setTimeout(function () {
        els.okBtn.focus();
      }, 20);
    }
  }

  /**

  function showToast(message, type = "info") {
    const toast = document.getElementById("toast");

    );

      case "error":
        toast.classList.add("bg-red-500");
        break;
      case "warning":
        toast.classList.add("bg-yellow-500");
        break;
      default:
        toast.classList.add("bg-blue-500");
    }

    // Show toast with animation
    toast.classList.remove("translate-x-full");

    setTimeout(() => {
      hideToast();

  /**
   * Learning Time Tracker
   * Tracks time spent in learning activities and syncs to server
   */
  window.LearningTracker = (function () {
    let isTracking = false;
    let currentActivity = null; // 'lesson' | 'mindmap' | 'flashcard' | 'quiz'
    let accumulatedSeconds = 0;
    let saveInterval = null;
    let tickInterval = null;

    const SAVE_INTERVAL_MS = 60000; // Save every 1 minute

    function getGoalMinutes() {
      if (window.currentUser && window.currentUser.settings && window.currentUser.settings.dailyTimeGoal) {
        return parseInt(window.currentUser.settings.dailyTimeGoal, 10);
      }
      return 15; // Default fallback
    }

    /**
     * Start tracking for a specific activity
     */
    function start(activityType) {
      if (isTracking && currentActivity === activityType) {
        return;
      }

      if (isTracking) {
        stop();
      }

      currentActivity = activityType;
      accumulatedSeconds = 0;
      isTracking = true;

      console.log(`⏱️ Started tracking: ${activityType}`);

      tickInterval = setInterval(function () {
        if (!document.hidden && document.hasFocus()) {
          accumulatedSeconds++;
          updateLocalStorage();
        }
      }, 1000);

      saveInterval = setInterval(function () {
        saveToServer();
      }, SAVE_INTERVAL_MS);

      document.addEventListener("visibilitychange", handleVisibilityChange);
      window.addEventListener("beforeunload", handleBeforeUnload);
    }

    function stop() {
      if (!isTracking) return;

      console.log(
        `⏱️ Stopped tracking: ${currentActivity}, accumulated: ${accumulatedSeconds}s`,
      );

      if (accumulatedSeconds >= 60) {
        saveToServer();
      }

      if (tickInterval) clearInterval(tickInterval);
      if (saveInterval) clearInterval(saveInterval);
      document.removeEventListener("visibilitychange", handleVisibilityChange);
      window.removeEventListener("beforeunload", handleBeforeUnload);

      isTracking = false;
      currentActivity = null;
      accumulatedSeconds = 0;
    }

    function handleVisibilityChange() {
      if (document.hidden) {
        console.log("⏸️ Tab hidden - pausing");
      } else {
        console.log("▶️ Tab visible - resuming");
      }
    }

    function handleBeforeUnload() {
      if (isTracking && accumulatedSeconds > 0) {
        saveToServer(true);
      }
    }

    function updateLocalStorage() {
      var today = new Date().toISOString().split("T")[0];
      var storageKey = "dailyLearningTime";
      var data = {};

      try {
        var stored = localStorage.getItem(storageKey);
        if (stored) data = JSON.parse(stored);
      } catch (e) {}

      if (data.date !== today) {
        data = {
          date: today,
          totalMinutes: 0,
          streakAchieved: false,
          pendingSeconds: 0,
        };
      }

      data.pendingSeconds = (data.pendingSeconds || 0) + 1;
      data[currentActivity + "Seconds"] =
        (data[currentActivity + "Seconds"] || 0) + 1;

      var totalSeconds =
        (data.lessonSeconds || 0) +
        (data.mindmapSeconds || 0) +
        (data.flashcardSeconds || 0) +
        (data.quizSeconds || 0);
      data.totalMinutes = Math.floor(totalSeconds / 60);

      localStorage.setItem(storageKey, JSON.stringify(data));
      updateDashboardTimeUI(data);
    }

    function saveToServer(force = false) {
      var minutesToSave = Math.floor(accumulatedSeconds / 60);
      if (minutesToSave < 1) {
        if (force && accumulatedSeconds > 10) {
          minutesToSave = 1; // force save at least 1 min to not lose data
        } else {
          console.log(
            "⏳ Not enough time yet: " + accumulatedSeconds + " seconds",
          );
          return;
        }
      }

      console.log(
        "💾 Saving " +
          minutesToSave +
          " minutes of " +
          currentActivity +
          " to server...",
      );

      google.script.run
        .withSuccessHandler(function (result) {
          if (result && result.success) {
            console.log("✅ Saved. Daily total: " + result.dailyTotal + " min");

            var storageKey = "dailyLearningTime";
            var data = {};
            try {
              var stored = localStorage.getItem(storageKey);
              if (stored) data = JSON.parse(stored);
            } catch (e) {}

            data.serverTotal = result.dailyTotal;
            data.streakAchieved = result.streakAchieved;
            localStorage.setItem(storageKey, JSON.stringify(data));
            updateDashboardTimeUI(data);

            if (result.streakAchieved && !data.notifiedStreak) {
              data.notifiedStreak = true;
              localStorage.setItem(storageKey, JSON.stringify(data));
              if (typeof window.showNotification === "function") {
                window.showNotification(
                  "🎉 Tuyệt vời! Bạn đã học đủ " + getGoalMinutes() + " phút hôm nay!",
                  "success",
                );
              }
            }
          }
        })
        .withFailureHandler(function (error) {
          console.error("❌ Failed to save learning time:", error);
        })
        .saveLearningTime({
          minutes: minutesToSave,
          activityType: currentActivity,
        });

      accumulatedSeconds = accumulatedSeconds % 60;
    }

    function updateDashboardTimeUI(data) {
      var todayTimeEl = document.getElementById("today-time");
      var todayMinutesEl = document.getElementById("today-minutes");
      var timeStatusEl = document.getElementById("time-status");

      var totalMinutes = data.serverTotal || data.totalMinutes || 0;
      var goalMinutes = getGoalMinutes();

      if (todayTimeEl) todayTimeEl.textContent = totalMinutes;
      if (todayMinutesEl) todayMinutesEl.textContent = totalMinutes;

      if (timeStatusEl) {
        if (totalMinutes >= goalMinutes) {
          timeStatusEl.textContent = "Đã đạt";
          timeStatusEl.classList.add("achieved");
        } else {
          timeStatusEl.textContent = goalMinutes - totalMinutes + " phút nữa";
          timeStatusEl.classList.remove("achieved");
        }
      }
    }

    function getStats() {
      try {
        var stored = localStorage.getItem("dailyLearningTime");
        if (stored) return JSON.parse(stored);
      } catch (e) {}
      return null;
    }

    function loadFromServer(callback) {
      google.script.run
        .withSuccessHandler(function (result) {
          if (result && result.success) {
            var today = new Date().toISOString().split("T")[0];
            var data = {
              date: today,
              totalMinutes: result.dailyTotal || 0,
              serverTotal: result.dailyTotal || 0,
              streakAchieved: result.streakAchieved || false,
            };
            localStorage.setItem("dailyLearningTime", JSON.stringify(data));
            updateDashboardTimeUI(data);
            if (callback) callback(data);
          }
        })
        .withFailureHandler(function (error) {
          console.error("Failed to load learning stats:", error);
          if (callback) callback(null);
        })
        .getTodayLearningStats();
    }

    return {
      start: start,
      stop: stop,
      getStats: getStats,
      loadFromServer: loadFromServer,
      GOAL_MINUTES: GOAL_MINUTES,
    };
  })();

  function positionStudyWidgetPanel() {
    const widget = document.getElementById("study-widget");
    const btn = document.getElementById("study-widget-btn");
    const panel = document.getElementById("study-widget-panel");
  
    if (!widget || !btn || !panel || panel.style.display !== "block") return;
  
    const gap = 12;
    const safe = 12;
  
    const btnRect = btn.getBoundingClientRect();
  
    // Tạm bật visibility để đo chính xác nhưng không nháy giao diện
    const oldVisibility = panel.style.visibility;
    panel.style.visibility = "hidden";
  
    const panelRect = panel.getBoundingClientRect();
    const panelWidth = panelRect.width || 320;
    const panelHeight = panelRect.height || 300;
  
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;
  
    const spaceTop = btnRect.top;
    const spaceBottom = viewportHeight - btnRect.bottom;
  
    let placement = "top";
    let top = btnRect.top - panelHeight - gap;
  
    // Nếu phía trên không đủ chỗ thì bung xuống dưới
    if (spaceTop < panelHeight + gap && spaceBottom > spaceTop) {
      placement = "bottom";
      top = btnRect.bottom + gap;
    }
  
    // Căn panel theo tâm của icon
    let left = btnRect.left + btnRect.width / 2 - panelWidth / 2;
  
    // Không cho panel tràn khỏi màn hình
    left = Math.max(safe, Math.min(left, viewportWidth - panelWidth - safe));
    top = Math.max(safe, Math.min(top, viewportHeight - panelHeight - safe));
  
    panel.style.left = left + "px";
    panel.style.top = top + "px";
    panel.style.right = "auto";
    panel.style.bottom = "auto";
    panel.dataset.placement = placement;
  
    panel.style.visibility = oldVisibility || "visible";
  }

  // ==================== Study Widget Drag Logic ====================
var _studyWidgetDragInited = false;

function initStudyWidgetDrag() {
  if (_studyWidgetDragInited) return;

  // Xóa key cũ nếu trước đó bạn đã dùng kéo tự do
  localStorage.removeItem("studyWidgetPosition:v1");

  var widget = document.getElementById("study-widget");
  var btn = document.getElementById("study-widget-btn");

  if (!widget || !btn) return;

  _studyWidgetDragInited = true;

  var STORAGE_KEY = "studyWidgetVerticalPosition:v1";
  var startY = 0;
  var startBottom = 0;
  var isDragging = false;
  var dragged = false;

  btn.style.touchAction = "none";
  widget.style.touchAction = "none";

  function getRightColumnValue() {
    var backToTop = document.getElementById("app-back-to-top");

    if (backToTop) {
      var computed = window.getComputedStyle(backToTop);
      return computed.right || "1.25rem";
    }

    return window.innerWidth <= 768 ? "1rem" : "1.25rem";
  }

  function clampBottom(bottomValue) {
    var safeBottom = 14;
    var safeTop = 14;

    var widgetHeight = widget.offsetHeight || 46;
    var maxBottom = window.innerHeight - widgetHeight - safeTop;

    return Math.max(safeBottom, Math.min(bottomValue, maxBottom));
  }

  function applyVerticalPosition(bottomValue) {
    var finalBottom = clampBottom(bottomValue);

    widget.style.setProperty("position", "fixed", "important");
    widget.style.setProperty("right", getRightColumnValue(), "important");
    widget.style.setProperty("bottom", finalBottom + "px", "important");

    // Khóa ngang tuyệt đối
    widget.style.setProperty("left", "auto", "important");
    widget.style.setProperty("top", "auto", "important");

    return finalBottom;
  }

  function saveVerticalPosition() {
    var computed = window.getComputedStyle(widget);
    var bottom = parseFloat(computed.bottom) || 22;

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ bottom: bottom }));
    } catch (e) {
      console.warn("Không thể lưu vị trí study widget:", e);
    }
  }

  function restoreVerticalPosition() {
    try {
      var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");

      if (saved && typeof saved.bottom !== "undefined") {
        applyVerticalPosition(Number(saved.bottom) || 22);
      } else {
        applyVerticalPosition(22);
      }
    } catch (e) {
      applyVerticalPosition(22);
    }
  }

  function onPointerMove(e) {
    if (!isDragging) return;

    var deltaY = e.clientY - startY;

    if (!dragged && Math.abs(deltaY) > 4) {
      dragged = true;
      window.isDraggingStudyWidget = true;
      widget.classList.add("is-dragging");
    }

    if (!dragged) return;

    e.preventDefault();
    e.stopPropagation();

    // Chỉ thay đổi bottom, không thay đổi left/right
    var newBottom = startBottom - deltaY;
    applyVerticalPosition(newBottom);

    if (typeof positionStudyWidgetPanel === "function") {
      positionStudyWidgetPanel();
    }
  }

  function onPointerUp() {
    if (!isDragging) return;

    isDragging = false;

    document.removeEventListener("pointermove", onPointerMove);
    document.removeEventListener("pointerup", onPointerUp);

    widget.classList.remove("is-dragging");
    document.body.style.userSelect = "";

    if (dragged) {
      saveVerticalPosition();
    }

    setTimeout(function () {
      window.isDraggingStudyWidget = false;
    }, 120);
  }

  function onPointerDown(e) {
    if (e.button !== undefined && e.button !== 0) return;

    if (typeof closeStudyWidgetPanel === "function") {
      closeStudyWidgetPanel();
    }

    isDragging = true;
    dragged = false;

    startY = e.clientY;

    var computed = window.getComputedStyle(widget);
    startBottom = parseFloat(computed.bottom) || 22;

    widget.style.transition = "none";
    document.body.style.userSelect = "none";

    // Đảm bảo vừa bấm kéo là nó quay về đúng cột cạnh phải
    applyVerticalPosition(startBottom);

    if (btn.setPointerCapture) {
      try {
        btn.setPointerCapture(e.pointerId);
      } catch (err) {}
    }

    document.addEventListener("pointermove", onPointerMove, { passive: false });
    document.addEventListener("pointerup", onPointerUp);
  }

  btn.addEventListener("pointerdown", onPointerDown, { passive: false });

  restoreVerticalPosition();

  window.addEventListener("resize", function () {
    var computed = window.getComputedStyle(widget);
    var currentBottom = parseFloat(computed.bottom) || 22;
    applyVerticalPosition(currentBottom);
  });
}

</script>
