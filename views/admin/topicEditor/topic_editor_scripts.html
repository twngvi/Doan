<script>
/**
 * Topic Editor Scripts
 * Xử lý logic cho Rich Text Editor tạo Topic
 */

// ========================================
// GLOBAL VARIABLES
// ========================================

let savedSelection = null;
let tableInsertSelection = null;
let isEditMode = false;
let editingTopicId = null;
let allTopicsForPrereq = []; // Array of all topics for prerequisite selection
const TABLE_MAX_COLS = 10;
const TABLE_MAX_ROWS = 20;

function clampTableSize(value, maxValue, fallback) {
  var parsed = parseInt(value, 10);
  if (!Number.isInteger(parsed)) return fallback;
  if (parsed < 1) return 1;
  if (parsed > maxValue) return maxValue;
  return parsed;
}

function updateTableSizePicker(cols, rows, syncInputs) {
  var grid = document.getElementById('tableSizeGrid');
  var label = document.getElementById('tableSizeLabel');
  var colInput = document.getElementById('tableCols');
  var rowInput = document.getElementById('tableRows');
  if (!grid || !label || !colInput || !rowInput) return;

  var safeCols = clampTableSize(cols, TABLE_MAX_COLS, 1);
  var safeRows = clampTableSize(rows, TABLE_MAX_ROWS, 1);

  var cells = grid.querySelectorAll('.table-size-cell');
  cells.forEach(function(cell) {
    var cellCol = parseInt(cell.getAttribute('data-col'), 10);
    var cellRow = parseInt(cell.getAttribute('data-row'), 10);
    var isActive = cellCol <= safeCols && cellRow <= safeRows;
    cell.classList.toggle('active', isActive);
  });

  label.textContent = safeCols + ' x ' + safeRows;

  if (syncInputs !== false) {
    colInput.value = String(safeCols);
    rowInput.value = String(safeRows);
  }
}

function ensureTableSizePicker() {
  var grid = document.getElementById('tableSizeGrid');
  if (!grid) return;

  if (grid.dataset.initialized === 'true') return;

  var fragment = document.createDocumentFragment();
  for (var r = 1; r <= TABLE_MAX_ROWS; r++) {
    for (var c = 1; c <= TABLE_MAX_COLS; c++) {
      var cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'table-size-cell';
      cell.setAttribute('data-col', String(c));
      cell.setAttribute('data-row', String(r));
      cell.title = c + ' x ' + r;

      cell.addEventListener('mouseenter', function() {
        var hoverCol = parseInt(this.getAttribute('data-col'), 10);
        var hoverRow = parseInt(this.getAttribute('data-row'), 10);
        updateTableSizePicker(hoverCol, hoverRow, true);
      });

      cell.addEventListener('click', function() {
        var pickCol = parseInt(this.getAttribute('data-col'), 10);
        var pickRow = parseInt(this.getAttribute('data-row'), 10);
        updateTableSizePicker(pickCol, pickRow, true);
      });

      fragment.appendChild(cell);
    }
  }

  grid.appendChild(fragment);

  var colInput = document.getElementById('tableCols');
  var rowInput = document.getElementById('tableRows');
  if (colInput && rowInput) {
    var syncFromInputs = function() {
      var inputCols = clampTableSize(colInput.value, TABLE_MAX_COLS, 1);
      var inputRows = clampTableSize(rowInput.value, TABLE_MAX_ROWS, 1);
      updateTableSizePicker(inputCols, inputRows, true);
    };

    colInput.addEventListener('input', syncFromInputs);
    rowInput.addEventListener('input', syncFromInputs);
  }

  grid.dataset.initialized = 'true';
}

// ========================================
// INITIALIZATION
// ========================================

let topicEditorInitialized = false;
window.isTopicEditorDirty = false;

function initTopicEditorPage() {

  try {
    const oldClasses = Array.from(document.documentElement.classList).filter(c => c.startsWith('is-') && c.endsWith('-page'));
    if (oldClasses.length > 0) {
      document.documentElement.classList.remove(...oldClasses);
      document.body.classList.remove(...oldClasses);
    }
    document.documentElement.classList.add('is-topic-editor-page');
    document.body.classList.add('is-topic-editor-page');
    window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
  } catch(e) { console.error(e); }

  const editor = document.getElementById('contentEditor');
  if (!editor) {
    console.warn('[TopicEditor] Không tìm thấy contentEditor, bỏ qua init.');
    return;
  }

  if (!topicEditorInitialized) {
    initializeTopicEditor();
    setupDragAndDrop();
    setupKeyboardShortcuts();
    topicEditorInitialized = true;
  }

  loadAllTopicsForPrereq();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initTopicEditorPage);
} else {
  setTimeout(initTopicEditorPage, 0);
}

function initializeTopicEditor() {
  if (!document.getElementById("topicId").value) {
    document.getElementById("topicId").value = "TPC_" + new Date().getTime();
  }
  const editor = document.getElementById('contentEditor');
  if (editor && editor.dataset.editorInitialized === 'true') {
    return;
  }
  if (editor) {
    editor.dataset.editorInitialized = 'true';
  }
  
  // Handle paste - clean up pasted content
  editor.addEventListener('paste', function(e) {
    e.preventDefault();
    const text = e.clipboardData.getData('text/plain');
    document.execCommand('insertText', false, text);
  });

  ['keyup', 'mouseup'].forEach(function(evt) {
    editor.addEventListener(evt, function() {
      saveSelection();
    });
  });
  
  editor.addEventListener('input', function() {
    saveSelection();
    window.isTopicEditorDirty = true;
  });

  const container = document.getElementById('topic-editor-container');
  if (container) {
    container.addEventListener('input', function(e) {
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) {
        window.isTopicEditorDirty = true;
      }
    });
  }

  document.addEventListener('selectionchange', function() {
    const selection = window.getSelection();
    if (!selection || selection.rangeCount === 0) return;
    const range = selection.getRangeAt(0);
    if (editor.contains(range.commonAncestorContainer)) {
      savedSelection = range.cloneRange();
    }
  });

  const toolbar = document.querySelector('.editor-toolbar');
  if (toolbar) {
    toolbar.addEventListener('mousedown', function(e) {
      const btn = e.target.closest('button');
      if (!btn) return;
      saveSelection();
      // Prevent toolbar button focus from stealing editor caret.
      e.preventDefault();
    });
  }

  // Check edit mode
  initEditMode();

  // Bind order preview events
  const courseInput = document.getElementById('topicCourseId');
  const catInput = document.getElementById('topicCategory');
  const orderInput = document.getElementById('topicOrder');
  const titleInput = document.getElementById('topicTitle');
  
  function updateOrderAndPreview() {
    // If we are in create mode, suggest the next order number
    if (!isEditMode && courseInput && courseInput.value && !orderInput.value) {
      if (allTopicsForPrereq && allTopicsForPrereq.length > 0) {
        // Filter ONLY by courseId, since order is per-course
        const filteredTopics = allTopicsForPrereq.filter(t => t.courseId === courseInput.value);
        if (filteredTopics.length > 0) {
          const maxOrder = Math.max(...filteredTopics.map(t => parseInt(t.order) || 0));
          if (!isNaN(maxOrder) && maxOrder < 999) {
            orderInput.value = maxOrder + 1;
          }
        } else {
          orderInput.value = 1;
        }
      }
    }
    renderTopicOrderPreview();
  }

  if (courseInput) courseInput.addEventListener('change', updateOrderAndPreview);
  if (catInput) catInput.addEventListener('input', updateOrderAndPreview);
  if (orderInput) orderInput.addEventListener('input', renderTopicOrderPreview);
  if (titleInput) titleInput.addEventListener('input', renderTopicOrderPreview);

  // Focus editor after init (delay to allow edit mode to load)
  if (!isEditMode) {
    editor.focus();
  }
  
  // Populate courses dropdown
  populateTopicCourses();
}

function populateTopicCourses() {
  const courseSelect = document.getElementById('topicCourseId');
  if (!courseSelect) return;
  
  // Try to use allCourses from content_management_scripts if available
  if (typeof allCourses !== 'undefined' && allCourses.length > 0) {
    renderCourseOptions(allCourses, courseSelect);
  } else {
    // Fallback to fetch from server
    google.script.run
      .withSuccessHandler(function(response) {
        if (response && response.success && response.courses) {
          renderCourseOptions(response.courses, courseSelect);
        }
      })
      .getAllCoursesForAdmin();
  }
}

function renderCourseOptions(courses, selectEl) {
  // selectEl is now the hidden input topicCourseId
  const displayEl = document.getElementById('topicCourseDisplay');
  const datalist = document.getElementById('topicCourseDataList');
  if (!displayEl || !datalist) return;
  
  let html = '';
  window.topicCoursesMap = {};
  window.topicCoursesTitleMap = {};
  
  courses.forEach(c => {
    html += `<option value="${escapeHtml(c.title)}"></option>`;
    window.topicCoursesMap[c.courseId] = c.title;
    window.topicCoursesTitleMap[c.title] = c.courseId;
  });
  
  datalist.innerHTML = html;
  
  const currentVal = selectEl.dataset.selectedValue || selectEl.value;
  if (currentVal && window.topicCoursesMap[currentVal]) {
      displayEl.value = window.topicCoursesMap[currentVal];
      selectEl.value = currentVal;
  }
}

// Add event listener to update hidden ID when user types/selects course
document.addEventListener('input', function(e) {
  if (e.target && e.target.id === 'topicCourseDisplay') {
     const title = e.target.value.trim();
     const id = window.topicCoursesTitleMap[title] || '';
     document.getElementById('topicCourseId').value = id;
  }
});

// ========================================
// TEXT FORMATTING
// ========================================

function formatText(command) {
  restoreSelection();
  document.execCommand(command, false, null);
  if (command === 'insertUnorderedList' || command === 'insertOrderedList') {
    const editor = document.getElementById('contentEditor');
    normalizeListFormattingForEditor(editor);
  }
  saveSelection();
  document.getElementById('contentEditor').focus({ preventScroll: true });
}

function formatHeading(tag) {
  if (!tag) return;
  restoreSelection();
  document.execCommand('formatBlock', false, tag);
  document.getElementById('headingSelect').value = '';
  saveSelection();
  document.getElementById('contentEditor').focus({ preventScroll: true });
}

function clearTextFormatting() {
  restoreSelection();
  document.execCommand('removeFormat', false, null);
  // Reset block type to paragraph after clearing inline styles
  document.execCommand('formatBlock', false, 'p');
  var headingSelect = document.getElementById('headingSelect');
  if (headingSelect) headingSelect.value = '';
  saveSelection();
  document.getElementById('contentEditor').focus({ preventScroll: true });
}

// ========================================
// INLINE CODE
// ========================================

function insertInlineCode() {
  const selection = window.getSelection();
  if (selection.rangeCount > 0) {
    const range = selection.getRangeAt(0);
    const selectedText = range.toString() || 'code';
    
    const codeElement = document.createElement('code');
    codeElement.textContent = selectedText;
    
    range.deleteContents();
    range.insertNode(codeElement);
    
    // Move cursor after code element
    range.setStartAfter(codeElement);
    range.setEndAfter(codeElement);
    selection.removeAllRanges();
    selection.addRange(range);
  }
  document.getElementById('contentEditor').focus({ preventScroll: true });
}

// ========================================
// CODE BLOCK MODAL
// ========================================

function openCodeModal() {
  saveSelection();
  document.getElementById('codeModal').classList.add('active');
  document.getElementById('codeContent').value = '';
  document.getElementById('codeContent').focus();
}

function closeCodeModal(shouldRestoreSelection = true) {
  const modal = document.getElementById('codeModal');
  if (modal) {
    modal.classList.remove('active');
  }
  if (shouldRestoreSelection) {
    restoreSelection();
  }
}

function insertCodeBlock() {
  const language = document.getElementById('codeLanguage').value;
  const code = document.getElementById('codeContent').value;
  
  if (!code.trim()) {
    showToast('Vui lòng nhập code', 'warning');
    return;
  }
  
  const codeBlockHtml = `
    <div class="code-block" data-language="${language}">
      <div class="code-header" contenteditable="false">
        <span class="language-tag">${language}</span>
      </div>
      <pre><code>${escapeHtml(code)}</code></pre>
    </div>
    <p><br></p>
  `;
  
  closeCodeModal(false);
  insertHtmlAtSelection(codeBlockHtml);
}

// ========================================
// CALLOUTS
// ========================================

function insertCallout(type) {
  restoreSelection();
  const icons = {
    note: '💡',
    warning: '⚠️',
    info: 'ℹ️',
    danger: '🚫'
  };
  
  const titles = {
    note: 'Ghi chú',
    warning: 'Cảnh báo',
    info: 'Thông tin',
    danger: 'Lưu ý quan trọng'
  };
  
  const calloutHtml = `
    <div class="callout callout-${type}">
      <span class="callout-icon" contenteditable="false">${icons[type]}</span>
      <div class="callout-content">
        <strong>${titles[type]}:</strong> Nhập nội dung ở đây...
      </div>
    </div>
    <p><br></p>
  `;

  insertHtmlAtSelection(calloutHtml);
  saveSelection();
}

// ========================================
// BLOCK MARKERS (for Google Doc syntax)
// ========================================

function toggleBlockMarkersMenu() {
  const menu = document.getElementById('blockMarkersMenu');
  menu.classList.toggle('active');

  // Close menu when clicking outside
  if (menu.classList.contains('active')) {
    document.addEventListener('click', closeBlockMarkersMenuOnClickOutside);
  }
}

function closeBlockMarkersMenuOnClickOutside(e) {
  const menu = document.getElementById('blockMarkersMenu');
  const toggle = e.target.closest('.toolbar-dropdown');

  if (!toggle) {
    menu.classList.remove('active');
    document.removeEventListener('click', closeBlockMarkersMenuOnClickOutside);
  }
}

function insertBlockMarker(type) {
  restoreSelection();
  const menu = document.getElementById('blockMarkersMenu');
  menu.classList.remove('active');

  const blockConfig = {
    'NOTE': { icon: '📌', label: 'Ghi chú', placeholder: 'Ghi chú của bạn ở đây...' },
    'TIP': { icon: '💡', label: 'Mẹo', placeholder: 'Mẹo hữu ích ở đây...' },
    'WARNING': { icon: '⚠️', label: 'Cảnh báo', placeholder: 'Cảnh báo quan trọng ở đây...' },
    'HIGHLIGHT': { icon: '✨', label: 'Lưu ý', placeholder: 'Nội dung cần nhấn mạnh...' },
    'EXAMPLE': { icon: '📖', label: 'Ví dụ', placeholder: 'Ví dụ minh họa ở đây...' },
    'CHECKPOINT': { icon: '✅', label: 'Kiểm tra', placeholder: 'Câu hỏi kiểm tra hiểu bài...' },
    'TASK': { icon: '📋', label: 'Nhiệm vụ', placeholder: 'Mô tả nhiệm vụ cần thực hiện...' },
    'QA': { icon: '❓', label: 'Hỏi & Đáp', placeholder: 'Câu hỏi: ...\nTrả lời: ...' },
    'RESOURCES': { icon: '📚', label: 'Tài nguyên', placeholder: '• Link tài liệu 1\n• Link tài liệu 2' },
  };

  // Handle special block types
  if (type === 'TERMINAL') {
    insertTerminalBlock();
    return;
  }
  if (type === 'OUTPUT') {
    insertOutputBlock();
    return;
  }
  if (type === 'CMD') {
    insertCmdBlock();
    return;
  }
  if (type === 'GRID') {
    insertGridBlock();
    return;
  }

  const config = blockConfig[type];
  if (!config) return;

  const selection = window.getSelection();
  const selectedText = selection.toString().trim() || config.placeholder;

  const html = `
    <div class="visual-block visual-block-${type.toLowerCase()}" data-block-type="${type}" contenteditable="false">
      <span class="visual-block-icon">${config.icon}</span>
      <div class="visual-block-content" contenteditable="true"><span class="visual-block-label">${config.label}:</span> ${selectedText}</div>
      <button class="visual-block-delete" onclick="deleteVisualBlock(this)" title="Xóa block">✕</button>
    </div>
    <p><br></p>
  `;

  document.execCommand('insertHTML', false, html);
  saveSelection();
  document.getElementById('contentEditor').focus({ preventScroll: true });
}

function insertTerminalBlock() {
  const selection = window.getSelection();
  const selectedText = selection.toString().trim() || '>>> print("Hello World")\nHello World';

  const html = `
    <div class="visual-terminal-block" data-block-type="TERMINAL" contenteditable="false">
      <div class="visual-terminal-label">🖥️ Terminal Output</div>
      <div class="visual-terminal-content" contenteditable="true">${selectedText}</div>
      <button class="visual-block-delete" onclick="deleteVisualBlock(this)" title="Xóa block">✕</button>
    </div>
    <p><br></p>
  `;

  insertHtmlAtSelection(html);
}

function insertOutputBlock() {
  const selection = window.getSelection();
  const selectedText = selection.toString().trim() || 'Kết quả hiển thị ở đây...';

  const html = `
    <div class="visual-output-block" data-block-type="OUTPUT" contenteditable="false">
      <div class="visual-output-label">📄 Output Block</div>
      <div class="visual-output-content" contenteditable="true">${selectedText}</div>
      <button class="visual-block-delete" onclick="deleteVisualBlock(this)" title="Xóa block">✕</button>
    </div>
    <p><br></p>
  `;

  insertHtmlAtSelection(html);
}

function insertCmdBlock() {
  const selection = window.getSelection();
  const selectedText = selection.toString().trim() || '$ python main.py';

  const html = `
    <div class="visual-cmd-block" data-block-type="CMD" contenteditable="false">
      <div class="visual-cmd-label">⌨️ CMD Block</div>
      <div class="visual-cmd-content" contenteditable="true">${selectedText}</div>
      <button class="visual-block-delete" onclick="deleteVisualBlock(this)" title="Xóa block">✕</button>
    </div>
    <p><br></p>
  `;

  insertHtmlAtSelection(html);
}

function insertGridBlock() {
  const selection = window.getSelection();
  const selectedText = selection.toString().trim() || '• Item 1\n• Item 2\n• Item 3';

  const html = `
    <div class="visual-grid-block" data-block-type="GRID" contenteditable="false">
      <div class="visual-grid-label">📊 Grid Cards</div>
      <div class="visual-grid-content" contenteditable="true">${selectedText}</div>
      <button class="visual-block-delete" onclick="deleteVisualBlock(this)" title="Xóa block">✕</button>
    </div>
    <p><br></p>
  `;

  insertHtmlAtSelection(html);
}

function deleteVisualBlock(btn) {
  const block = btn.closest('[data-block-type]');
  if (block) {
    block.remove();
  }
}

function insertColorMarker(color) {
  const menu = document.getElementById('blockMarkersMenu');
  menu.classList.remove('active');

  const selection = window.getSelection();
  const selectedText = selection.toString().trim() || 'Nội dung có màu ở đây...';

  const html = `<span class="visual-color-block visual-color-${color.toLowerCase()}" data-color-type="${color}">${selectedText}</span>&nbsp;`;

  insertHtmlAtSelection(html);
}

// Code Marker Modal
function openCodeMarkerModal() {
  const menu = document.getElementById('blockMarkersMenu');
  menu.classList.remove('active');

  saveSelection();
  document.getElementById('codeMarkerModal').classList.add('active');
  document.getElementById('codeMarkerContent').value = '';
  document.getElementById('codeMarkerContent').focus();
}

function closeCodeMarkerModal(shouldRestoreSelection = true) {
  const modal = document.getElementById('codeMarkerModal');
  if (modal) {
    modal.classList.remove('active');
  }
  if (shouldRestoreSelection) {
    restoreSelection();
  }
}

function insertCodeMarker() {
  const language = document.getElementById('codeMarkerLanguage').value;
  const code = document.getElementById('codeMarkerContent').value;

  if (!code.trim()) {
    showToast('Vui lòng nhập code', 'warning');
    return;
  }

  closeCodeMarkerModal(false);

  // Escape HTML for display
  const escapedCode = code
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  const html = `
    <div class="visual-code-block" data-block-type="CODE" data-language="${language}" contenteditable="false">
      <div class="visual-code-header">
        <span class="visual-code-lang">${language}</span>
      </div>
      <pre class="visual-code-content" contenteditable="true">${escapedCode}</pre>
      <button class="visual-block-delete" onclick="deleteVisualBlock(this)" title="Xóa block">✕</button>
    </div>
    <p><br></p>
  `;

  insertHtmlAtSelection(html);
}



// ========================================
// LINK MODAL
// ========================================

function openLinkModal() {
  saveSelection();
  
  // Get selected text if any
  const selection = window.getSelection();
  const selectedText = selection.toString();
  
  document.getElementById('linkText').value = selectedText || '';
  document.getElementById('linkUrl').value = '';
  document.getElementById('linkModal').classList.add('active');
  
  if (selectedText) {
    document.getElementById('linkUrl').focus();
  } else {
    document.getElementById('linkText').focus();
  }
}

function closeLinkModal() {
  document.getElementById('linkModal').classList.remove('active');
  restoreSelection();
}

function openTableModal() {
  saveSelection();
  restoreSelection();
  const editor = document.getElementById('contentEditor');
  const selection = window.getSelection();
  if (editor && selection && selection.rangeCount > 0) {
    const range = selection.getRangeAt(0);
    if (editor.contains(range.commonAncestorContainer)) {
      tableInsertSelection = range.cloneRange();
      savedSelection = range.cloneRange();
    } else {
      tableInsertSelection = null;
    }
  } else {
    tableInsertSelection = null;
  }
  ensureTableSizePicker();
  document.getElementById('tableCols').value = '3';
  document.getElementById('tableRows').value = '4';
  document.getElementById('tableHasHeader').checked = true;
  document.getElementById('tableModal').classList.add('active');
  updateTableSizePicker(3, 4, true);
  document.getElementById('tableCols').focus();
}

function closeTableModal(restoreEditorSelection = true) {
  document.getElementById('tableModal').classList.remove('active');
  if (restoreEditorSelection) {
    if (tableInsertSelection) {
      savedSelection = tableInsertSelection.cloneRange();
    }
    restoreSelection();
    tableInsertSelection = null;
  }
}

function insertTable() {
  const cols = parseInt(document.getElementById('tableCols').value, 10);
  const rows = parseInt(document.getElementById('tableRows').value, 10);
  const hasHeader = !!document.getElementById('tableHasHeader').checked;

  if (!Number.isInteger(cols) || cols < 1 || cols > TABLE_MAX_COLS) {
    showToast('Số cột phải từ 1 đến ' + TABLE_MAX_COLS, 'warning');
    return;
  }
  if (!Number.isInteger(rows) || rows < 1 || rows > TABLE_MAX_ROWS) {
    showToast('Số dòng phải từ 1 đến ' + TABLE_MAX_ROWS, 'warning');
    return;
  }

  const editor = document.getElementById('contentEditor');
  if (!editor) return;

  const tableWrapper = document.createElement('div');
  tableWrapper.className = 'editor-table-wrapper';
  const table = document.createElement('table');
  table.className = 'editor-content-table';

  if (hasHeader) {
    const thead = document.createElement('thead');
    const tr = document.createElement('tr');
    for (let c = 0; c < cols; c++) {
      const th = document.createElement('th');
      th.textContent = 'Tiêu đề ' + (c + 1);
      tr.appendChild(th);
    }
    thead.appendChild(tr);
    table.appendChild(thead);
  }

  const bodyCount = hasHeader ? Math.max(rows - 1, 1) : rows;
  const tbody = document.createElement('tbody');
  for (let r = 0; r < bodyCount; r++) {
    const tr = document.createElement('tr');
    for (let c = 0; c < cols; c++) {
      const td = document.createElement('td');
      td.innerHTML = '<br>';
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  tableWrapper.appendChild(table);

  const trailingParagraph = document.createElement('p');
  trailingParagraph.innerHTML = '<br>';
  const fragment = document.createDocumentFragment();
  fragment.appendChild(tableWrapper);
  fragment.appendChild(trailingParagraph);

  closeTableModal(false);
  const selection = window.getSelection();
  if (!selection) return;

  if (tableInsertSelection) {
    const markerContainer = tableInsertSelection.commonAncestorContainer;
    if (editor.contains(markerContainer)) {
      const preservedRange = tableInsertSelection.cloneRange();
      selection.removeAllRanges();
      selection.addRange(preservedRange);
      savedSelection = preservedRange.cloneRange();
    }
  }

  restoreSelection();
  if (selection.rangeCount === 0) return;

  const range = selection.getRangeAt(0);
  range.deleteContents();
  range.insertNode(fragment);

  const firstCell = table.querySelector('tbody td') || table.querySelector('th');
  const caretRange = document.createRange();
  if (firstCell) {
    caretRange.selectNodeContents(firstCell);
    caretRange.collapse(true);
  } else {
    caretRange.setStartAfter(tableWrapper);
    caretRange.collapse(true);
  }

  try {
    editor.focus({ preventScroll: true });
  } catch (e) {
    editor.focus();
  }
  selection.removeAllRanges();
  selection.addRange(caretRange);
  savedSelection = caretRange.cloneRange();
  tableInsertSelection = null;
}

function openImageModal() {
  saveSelection();
  document.getElementById('imageModal').classList.add('active');
  document.getElementById('imageUrlInput').value = '';
}

function closeImageModal() {
  document.getElementById('imageModal').classList.remove('active');
  restoreSelection();
}

function setupDragAndDrop() {
  const uploadZone = document.getElementById('imageUploadZone');
  
  if (!uploadZone) return;
  
  uploadZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    this.classList.add('dragover');
  });
  
  uploadZone.addEventListener('dragleave', function(e) {
    e.preventDefault();
    this.classList.remove('dragover');
  });
  
  uploadZone.addEventListener('drop', function(e) {
    e.preventDefault();
    this.classList.remove('dragover');
    
    const files = e.dataTransfer.files;
    if (files.length > 0 && files[0].type.startsWith('image/')) {
      handleImageUpload(files[0]);
    }
  });
}

function handleImageUpload(file) {
  if (!file) return;
  
  // Validate file
  if (!file.type.startsWith('image/')) {
    showToast('Vui lòng chọn file hình ảnh', 'error');
    return;
  }
  
  if (file.size > 5 * 1024 * 1024) {
    showToast('File quá lớn. Tối đa 5MB', 'error');
    return;
  }
  
  showTopicEditorLoading('Đang upload hình ảnh...');
  
  // Convert to base64
  const reader = new FileReader();
  reader.onload = function(e) {
    const base64Data = e.target.result.split(',')[1];
    const mimeType = file.type;
    const fileName = file.name;
    
    // Upload to Google Drive
    google.script.run
      .withSuccessHandler(function(result) {
        hideTopicEditorLoading();
        if (result.success) {
          closeImageModal();
          restoreSelection();
          insertImageToEditor(result.imageUrl);
          showToast('Upload thành công!', 'success');
        } else {
          showToast('Lỗi upload: ' + result.message, 'error');
        }
      })
      .withFailureHandler(function(error) {
        hideTopicEditorLoading();
        showToast('Lỗi: ' + error.message, 'error');
      })
      .uploadImageToDrive(base64Data, fileName, mimeType);
  };
  reader.readAsDataURL(file);
}

function insertImageFromUrl() {
  const url = document.getElementById('imageUrlInput').value.trim();
  
  if (!url) {
    showToast('Vui lòng nhập URL hình ảnh', 'warning');

  closeImageModal();
  restoreSelection();
  insertImageToEditor(url);

/**
 * Enhance Topic Editor Preview content to match exact User side formatting
 */
function enhanceTopicEditorPreviewContent(container) {
  if (!container) return;

  // 1. Format bullet & numbering lists
  formatTopicEditorPreviewBullets(container);

  // 2. Normalize empty paragraphs (spacers) identical to User side
  const headingsAndParagraphs = container.querySelectorAll("h1, h2, h3, h4, h5, h6, p");
  headingsAndParagraphs.forEach(function(el) {
    el.innerHTML = el.innerHTML
      .replace(/\s+/g, " ")
      .trim();
  });

  const paragraphs = container.querySelectorAll("p");
  paragraphs.forEach(function(p) {
    const text = p.textContent.trim();
    const hasOnlyBr = p.children.length === 1 && p.children[0].tagName === "BR" && text === "";
    if (text === "" || hasOnlyBr) {
      p.classList.add("spacer");
      p.innerHTML = "&nbsp;";
    }
  });
}

function formatTopicEditorPreviewBullets(container) {
  const BULLET_CHARS = ['•', '●', '▪', '■', '-', '–', '—', '*'];
  const DASH_CHARS = ['-', '–', '—'];
  const NUMBER_REGEX = /^(\d+)[\.\)]\s+(.+)$/;
  const children = Array.from(container.children);
  let listBuffer = [];
  let bufferType = null;

  function flushListBuffer() {
    if (listBuffer.length === 0) return;
    const listTag = bufferType === 'number' ? 'ol' : 'ul';
    const listEl = document.createElement(listTag);
    listEl.className = 'doc-formatted-list ' + (bufferType === 'number' ? 'doc-number-list' : 'doc-bullet-list');

    listBuffer.forEach(function(item) {
      const li = document.createElement('li');
      li.innerHTML = item.content;
      if (item.indent > 1) {
        li.classList.add('doc-indent-' + Math.min(item.indent, 3));
      }
      listEl.appendChild(li);
    });

    listBuffer[0].element.parentNode.insertBefore(listEl, listBuffer[0].element);
    listBuffer.forEach(function(item) { item.element.remove(); });
    listBuffer = [];
    bufferType = null;
  }

  children.forEach(function(el) {
    if (el.tagName !== 'P') {
      flushListBuffer();
      return;
    }
    const text = el.textContent.trim();
    if (!text) {
      flushListBuffer();
      return;
    }

    const numMatch = text.match(NUMBER_REGEX);
    if (numMatch) {
      if (bufferType && bufferType !== 'number') flushListBuffer();
      bufferType = 'number';
      let content = el.innerHTML.replace(/^(\d+)[\.\)]\s+/, '').trim();
      listBuffer.push({ element: el, content: content, indent: 1 });
      return;
    }

    const firstChar = text.charAt(0);
    if (BULLET_CHARS.includes(firstChar)) {
      if (bufferType && bufferType !== 'bullet') flushListBuffer();
      bufferType = 'bullet';
      let content = el.innerHTML.replace(/^[•●▪■\-–—*\s]+/, '').trim();
      listBuffer.push({ element: el, content: content, indent: 1 });
      return;
    }

    flushListBuffer();
  });
  flushListBuffer();

  // ⭐ Normalize ANY existing or new lists in preview so bullets always display clearly
  const allLists = container.querySelectorAll('ul, ol');
  allLists.forEach(function(list) {
    if (list.tagName === 'UL') {
      list.classList.add('doc-formatted-list', 'doc-bullet-list');
      list.style.setProperty('list-style-type', 'disc', 'important');
    } else {
      list.classList.add('doc-formatted-list', 'doc-number-list');
      list.style.setProperty('list-style-type', 'decimal', 'important');
    }
    list.style.setProperty('padding-left', '1.5rem', 'important');
    list.style.setProperty('margin-left', '1.5rem', 'important');
    list.style.setProperty('margin-bottom', '1rem', 'important');
  });

  const allItems = container.querySelectorAll('li');
  allItems.forEach(function(li) {
    li.style.setProperty('list-style-position', 'outside', 'important');
  });
}

/**
 * Cleanup visual blocks for preview (remove delete buttons, contenteditable, inline colors/margins)
 */
function cleanupVisualBlocksForPreview(html) {
  const temp = document.createElement('div');
  temp.innerHTML = html;

  // Remove all delete buttons
  temp.querySelectorAll('.visual-block-delete').forEach(function(btn) {
    btn.remove();
  });

  // Remove contenteditable attributes
  temp.querySelectorAll('[contenteditable]').forEach(function(el) {
    el.removeAttribute('contenteditable');
  });

  // Strip inline styles that conflict with dark theme preview or paragraph spacing
  temp.querySelectorAll('[style]').forEach(function(el) {
    const isListElement = el.tagName === "UL" || el.tagName === "OL" || el.tagName === "LI";
    const style = el.getAttribute("style") || "";

    const allowedProps = ["text-align", "width", "height", "max-width"];
    if (isListElement) {
      allowedProps.push("list-style-type", "list-style", "padding-left", "margin-left");
    }

    const newStyle = allowedProps
      .map(function(prop) {
        const match = style.match(new RegExp(`${prop}\\s*:\\s*[^;]+`, "i"));
        return match ? match[0] : null;
      })
      .filter(Boolean)
      .join("; ");

    if (newStyle) {
      el.setAttribute("style", newStyle);
    } else {
      el.removeAttribute("style");
    }
  });

  return temp.innerHTML;
}

/**
 * Convert visual blocks in preview HTML to text markers (for re-rendering as client view)
 */
function convertVisualBlocksToMarkersForPreview(html) {
  const temp = document.createElement('div');
  temp.innerHTML = html;

  // Process iteratively - innermost first
  let maxIter = 100;
  let iter = 0;
  while (iter < maxIter) {
    const allBlocks = temp.querySelectorAll('[data-block-type], [data-color-type]');
    let found = false;

    for (const block of allBlocks) {
      // Check for nested blocks
      const nested = block.querySelectorAll('[data-block-type], [data-color-type]');
      let hasNested = false;
      for (const n of nested) {
        if (n !== block && block.contains(n)) { hasNested = true; break; }
      }
      if (hasNested) continue;

      const blockType = block.getAttribute('data-block-type');
      const colorType = block.getAttribute('data-color-type');

      if (colorType) {
        const content = block.innerHTML;
        const textNode = document.createTextNode('[[COLOR:' + colorType + ']]');
        const endNode = document.createTextNode('[[/COLOR]]');
        const wrapper = document.createElement('span');
        wrapper.innerHTML = content;
        block.replaceWith(textNode);
        textNode.parentNode.insertBefore(wrapper, textNode.nextSibling);
        wrapper.parentNode.insertBefore(endNode, wrapper.nextSibling);
        found = true;
        break;
      }

      if (!blockType) continue;

      if (['NOTE', 'TIP', 'WARNING', 'HIGHLIGHT', 'EXAMPLE', 'CHECKPOINT', 'TASK', 'QA', 'RESOURCES'].includes(blockType)) {
        const contentEl = block.querySelector('.visual-block-content');
        let content = contentEl ? contentEl.innerHTML : '';
        const labelSpan = contentEl ? contentEl.querySelector('.visual-block-label') : null;
        if (labelSpan) content = content.replace(labelSpan.outerHTML, '').trim();
        const wrapper = document.createElement('div');
        wrapper.innerHTML = '[[' + blockType + ']]' + content + '[[/' + blockType + ']]';
        block.replaceWith(wrapper);
        found = true;
        break;
      }

      if (blockType === 'CODE') {
        const language = block.getAttribute('data-language') || 'JAVASCRIPT';
        const codeEl = block.querySelector('.visual-code-content');
        let code = codeEl ? codeEl.textContent : '';
        const wrapper = document.createElement('div');
        wrapper.innerHTML = '[[CODE:' + language + ']]' + escapeHtml(code) + '[[/CODE]]';
        block.replaceWith(wrapper);
        found = true;
        break;
      }

      if (['TERMINAL', 'OUTPUT', 'CMD'].includes(blockType)) {
        const contentEl = block.querySelector('.visual-terminal-content, .visual-output-content, .visual-cmd-content');
        let content = contentEl ? contentEl.innerHTML : '';
        const wrapper = document.createElement('div');
        wrapper.innerHTML = '[[' + blockType + ']]' + content + '[[/' + blockType + ']]';
        block.replaceWith(wrapper);
        found = true;
        break;
      }

      if (blockType === 'GRID') {
        const contentEl = block.querySelector('.visual-grid-content');
        let content = contentEl ? contentEl.innerHTML : '';
        const wrapper = document.createElement('div');
        wrapper.innerHTML = '[[GRID]]' + content + '[[/GRID]]';
        block.replaceWith(wrapper);
        found = true;
        break;
      }

      if (blockType === 'FIGURE') {
        const caption = block.getAttribute('data-caption') || '';
        const contentEl = block.querySelector('.visual-figure-content');
        let content = contentEl ? contentEl.innerHTML : '';
        const wrapper = document.createElement('div');
        wrapper.innerHTML = '[[FIGURE:' + caption + ']]' + content + '[[/FIGURE]]';
        block.replaceWith(wrapper);
        found = true;
        break;
      }

      iter++;
    }

    if (!found) break;
    iter++;
  }

  return temp.innerHTML;
}

/**
 * Render block markers into client-matching HTML
 * Mirrors the parseContentMarkers logic from lesson_scripts.html
 */
function renderBlockMarkersAsClient(html) {
  let result = html;

  // Find innermost block (no nested blocks inside)
  function findInnermostBlock(text) {
    let bestMatch = null;
    let bestIndex = -1;
    const openingRegex = /\[\[(NOTE|TIP|WARNING|HIGHLIGHT|EXAMPLE|CHECKPOINT|TASK|QA|RESOURCES|TERMINAL(?::\w*)?|GRID|CMD|OUTPUT|CODE:\w+|FIGURE:[^\]]*|COLOR:\w+)\]\]/gi;
    let match;
    while ((match = openingRegex.exec(text)) !== null) {
      const openTag = match[0];
      const openIndex = match.index;
      const tagInfo = match[1];
      const tagType = tagInfo.split(':')[0].toUpperCase();
      const closeRegex = new RegExp('\\[\\[\\/' + tagType + '\\]\\]', 'gi');
      closeRegex.lastIndex = openIndex + openTag.length;
      const closeMatch = closeRegex.exec(text);
      if (closeMatch) {
        const closeIndex = closeMatch.index;
        const content = text.substring(openIndex + openTag.length, closeIndex);
        const hasNested = /\[\[(NOTE|TIP|WARNING|HIGHLIGHT|EXAMPLE|CHECKPOINT|TASK|QA|RESOURCES|TERMINAL(?::\w*)?|GRID|CMD|OUTPUT|CODE:\w+|FIGURE:[^\]]*|COLOR:\w+)\]\]/i.test(content);
        if (!hasNested) {
          if (bestMatch === null || openIndex < bestIndex) {
            bestMatch = {
              fullMatch: text.substring(openIndex, closeIndex + closeMatch[0].length),
              openTag, closeTag: closeMatch[0], tagInfo, tagType, content,
              startIndex: openIndex, endIndex: closeIndex + closeMatch[0].length
            };
            bestIndex = openIndex;
          }
        }
      }
    }
    return bestMatch;
  }

  // Render a single block into client-matching HTML
  function renderSingleBlock(blockInfo) {
    const { tagType, tagInfo, content } = blockInfo;

    // COLOR sections
    if (tagType === 'COLOR') {
      const color = tagInfo.split(':')[1] || 'BLUE';
      const colorMap = {
        ORANGE: 'lesson-section-orange', RED: 'lesson-section-red',
        BLUE: 'lesson-section-blue', GREEN: 'lesson-section-green',
        PURPLE: 'lesson-section-purple', CYAN: 'lesson-section-cyan'
      };
      const className = colorMap[color.toUpperCase()] || 'lesson-section-blue';
      return '<div class="' + className + '">' + content + '</div>';
    }

    // CODE blocks - VS Code style
    if (tagType === 'CODE') {
      const lang = tagInfo.split(':')[1] || 'TEXT';
      let cleanCode = content
        .trim()
        .replace(/<\/p>/gi, '\n').replace(/<br\s*\/?>/gi, '\n').replace(/<\/div>/gi, '\n')
        .replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ')
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
        .replace(/^\n+|\n+$/g, '');
      return '<div class="code-block-wrapper">' +
        '<div class="code-block-header">' +
          '<span class="code-block-lang">' + lang.toUpperCase() + '</span>' +
          '<div class="code-block-actions">' +
            '<button class="btn-copy-code" onclick="copyPreviewCode(this)">📋 Copy</button>' +
          '</div>' +
        '</div>' +
        '<pre><code class="language-' + lang.toLowerCase() + '">' + escapeHtml(cleanCode) + '</code></pre>' +
      '</div>';
    }

    // EXAMPLE blocks
    if (tagType === 'EXAMPLE') {
      return '<div class="example-block">' + content + '</div>';
    }

    // CALLOUT blocks
    var calloutTypes = {
      'NOTE': 'callout-note', 'TIP': 'callout-tip', 'WARNING': 'callout-warning',
      'CHECKPOINT': 'callout-checkpoint', 'TASK': 'callout-task',
      'QA': 'callout-qa', 'HIGHLIGHT': 'callout-highlight'
    };
    if (calloutTypes[tagType]) {
      return '<div class="' + calloutTypes[tagType] + '">' + content + '</div>';
    }

    // RESOURCES
    if (tagType === 'RESOURCES') {
      return '<div class="resource-links">' + content + '</div>';
    }

    // FIGURE
    if (tagType === 'FIGURE') {
      const caption = tagInfo.split(':').slice(1).join(':') || '';
      return '<figure>' + content + '<figcaption>' + caption + '</figcaption></figure>';
    }

    // GRID
    if (tagType === 'GRID') {
      return '<div class="grid-cards-section">' + content + '</div>';
    }

    // TERMINAL blocks - dark Tokyo Night style
    if (tagType === 'TERMINAL') {
      let cleanContent = content
        .trim()
        .replace(/<\/p>/gi, '\n').replace(/<br\s*\/?>/gi, '\n').replace(/<\/div>/gi, '\n')
        .replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ')
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
        .replace(/^\n+|\n+$/g, '');
      return '<div class="terminal-block">' +
        '<div class="terminal-header">' +
          '<div class="terminal-dots"><span class="terminal-dot red"></span><span class="terminal-dot yellow"></span><span class="terminal-dot green"></span></div>' +
          '<span class="terminal-title">Terminal</span>' +
        '</div>' +
        '<pre class="terminal-body"><code>' + escapeHtml(cleanContent) + '</code></pre>' +
      '</div>';
    }

    // CMD blocks
    if (tagType === 'CMD') {
      let cleanContent = content
        .trim()
        .replace(/<\/p>/gi, '\n').replace(/<br\s*\/?>/gi, '\n').replace(/<\/div>/gi, '\n')
        .replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ')
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
        .replace(/^\n+|\n+$/g, '');
      return '<div class="cmd-block"><pre class="cmd-body"><code>' + escapeHtml(cleanContent) + '</code></pre></div>';
    }

    // OUTPUT blocks
    if (tagType === 'OUTPUT') {
      let cleanContent = content
        .trim()
        .replace(/<\/p>/gi, '\n').replace(/<br\s*\/?>/gi, '\n').replace(/<\/div>/gi, '\n')
        .replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ')
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
        .replace(/^\n+|\n+$/g, '');
      return '<div class="output-block"><pre class="output-body"><code>' + escapeHtml(cleanContent) + '</code></pre></div>';
    }

    return content;
  }

  // Iterate innermost-first
  let maxIterations = 200;
  let iterations = 0;
  while (iterations < maxIterations) {
    const innermostBlock = findInnermostBlock(result);
    if (!innermostBlock) break;
    const renderedHtml = renderSingleBlock(innermostBlock);
    result = result.substring(0, innermostBlock.startIndex) + renderedHtml + result.substring(innermostBlock.endIndex);
    iterations++;
  }

  // Clean empty paragraphs
  result = result.replace(/<p[^>]*>\s*<\/p>/gi, '');

  return result;
}

/**
 * Copy code from preview code blocks
 */
function copyPreviewCode(btn) {
  const wrapper = btn.closest('.code-block-wrapper, .terminal-block, .cmd-block, .output-block');
  if (!wrapper) return;
  const codeEl = wrapper.querySelector('code');
  if (!codeEl) return;
  const text = codeEl.textContent;
  navigator.clipboard.writeText(text).then(function() {
    const original = btn.innerHTML;
    btn.innerHTML = '✅ Copied!';
    setTimeout(function() { btn.innerHTML = original; }, 2000);
  });
}

function closePreviewModal() {
  const overlay = document.getElementById('previewModal');
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

/**
 * Convert visual blocks thành text markers để gửi lên Google Doc
 * Xử lý nested blocks từ trong ra ngoài (innermost first)
 */
function convertVisualBlocksToMarkers(html) {
  const temp = document.createElement('div');
  temp.innerHTML = html;

  // Xử lý từ trong ra ngoài: tìm innermost visual block và convert
  function findInnermostVisualBlock(container) {
    // Tìm tất cả visual blocks
    const allBlocks = container.querySelectorAll('[data-block-type], [data-color-type]');

    for (const block of allBlocks) {
      // Kiểm tra xem block này có chứa visual block khác bên trong không
      const nestedBlocks = block.querySelectorAll('[data-block-type], [data-color-type]');
      // nestedBlocks bao gồm chính nó nếu nó match, nên kiểm tra length > 1 hoặc kiểm tra khác
      let hasNestedBlock = false;
      for (const nested of nestedBlocks) {
        if (nested !== block && block.contains(nested)) {
          hasNestedBlock = true;
          break;
        }
      }

      if (!hasNestedBlock) {
        return block;
      }
    }
    return null;
  }

  // Hàm convert một block thành marker
  function convertBlockToMarker(block) {
    const blockType = block.getAttribute('data-block-type');
    const colorType = block.getAttribute('data-color-type');

    if (colorType) {
      // Color block
      const content = block.innerHTML;
      const marker = document.createTextNode(`[[COLOR:${colorType}]]${content}[[/COLOR]]`);
      block.replaceWith(marker);
      return;
    }

    if (!blockType) return;

    // Callout blocks (NOTE, TIP, WARNING, etc.)
    if (['NOTE', 'TIP', 'WARNING', 'HIGHLIGHT', 'EXAMPLE', 'CHECKPOINT', 'TASK', 'QA', 'RESOURCES'].includes(blockType)) {
      const contentEl = block.querySelector('.visual-block-content');
      let content = contentEl ? contentEl.innerHTML : '';

      // Remove label span but keep the rest
      const labelSpan = contentEl ? contentEl.querySelector('.visual-block-label') : null;
      if (labelSpan) {
        content = content.replace(labelSpan.outerHTML, '').trim();
      }

      const wrapper = document.createElement('div');
      wrapper.innerHTML = `<p>[[${blockType}]]</p><div>${content}</div><p>[[/${blockType}]]</p>`;
      block.replaceWith(wrapper);
      return;
    }

    // Code block
    if (blockType === 'CODE') {
      const language = block.getAttribute('data-language') || 'JAVASCRIPT';
      const codeEl = block.querySelector('.visual-code-content');
      let code = codeEl ? codeEl.textContent : '';

      const wrapper = document.createElement('div');
      wrapper.innerHTML = `<p>[[CODE:${language}]]</p><pre>${escapeHtml(code)}</pre><p>[[/CODE]]</p>`;
      block.replaceWith(wrapper);
      return;
    }

    // Terminal, Output, CMD blocks
    if (['TERMINAL', 'OUTPUT', 'CMD'].includes(blockType)) {
      const contentEl = block.querySelector('.visual-terminal-content, .visual-output-content, .visual-cmd-content');
      let content = contentEl ? contentEl.innerHTML : '';

      const wrapper = document.createElement('div');
      wrapper.innerHTML = `<p>[[${blockType}]]</p><div>${content}</div><p>[[/${blockType}]]</p>`;
      block.replaceWith(wrapper);
      return;
    }

    // Grid block
    if (blockType === 'GRID') {
      const contentEl = block.querySelector('.visual-grid-content');
      let content = contentEl ? contentEl.innerHTML : '';

      const wrapper = document.createElement('div');
      wrapper.innerHTML = `<p>[[GRID]]</p><div>${content}</div><p>[[/GRID]]</p>`;
      block.replaceWith(wrapper);
      return;
    }

    // Figure block
    if (blockType === 'FIGURE') {
      const caption = block.getAttribute('data-caption') || '';
      const contentEl = block.querySelector('.visual-figure-content');
      let content = contentEl ? contentEl.innerHTML : '';

      const wrapper = document.createElement('div');
      wrapper.innerHTML = `<p>[[FIGURE:${caption}]]</p><div>${content}</div><p>[[/FIGURE]]</p>`;
      block.replaceWith(wrapper);
      return;
    }
  }

  // Lặp lại convert từ trong ra ngoài
  let maxIterations = 200;
  let iterations = 0;

  while (iterations < maxIterations) {
    const innermostBlock = findInnermostVisualBlock(temp);
    if (!innermostBlock) break;

    convertBlockToMarker(innermostBlock);
    iterations++;
  }

  // Remove delete buttons that might still exist
  temp.querySelectorAll('.visual-block-delete').forEach(function(btn) {
    btn.remove();
  });

  return temp.innerHTML;
}

async function publishTopic() {
  // Validate form
  let topicId = document.getElementById('topicId').value.trim();
  if (!topicId) {
    topicId = 'TPC_' + new Date().getTime();
    document.getElementById('topicId').value = topicId;
  }
  const courseId = document.getElementById('topicCourseId').value.trim();
  const title = document.getElementById('topicTitle').value.trim();
  const category = document.getElementById('topicCategory').value;
  const description = document.getElementById('topicDescription').value.trim();
  const order = document.getElementById('topicOrder').value || 999;
  let content = document.getElementById('contentEditor').innerHTML.trim();

  // Convert visual blocks to text markers for Google Doc
  content = convertVisualBlocksToMarkers(content);

  // Validation
  if (!topicId) {
    showToast('Vui lòng nhập Topic ID', 'error');
    document.getElementById('topicId').focus();
    return;
  }

  if (!title) {
    showToast('Vui lòng nhập tiêu đề', 'error');
    document.getElementById('topicTitle').focus();
    return;
  }

  if (!category) {
    showToast('Vui lòng chọn danh mục', 'error');
    document.getElementById('topicCategory').focus();
    return;
  }

  if (!content || content === '<br>' || content === '<p><br></p>') {
    showToast('Vui lòng nhập nội dung bài học', 'error');
    document.getElementById('contentEditor').focus({ preventScroll: true });
    return;
  }

  // Confirm publish
  const shouldPublish =
    typeof window.showAppConfirm === 'function'
      ? await window.showAppConfirm(
          'Bạn có chắc muốn publish topic này?\n\nTopic: ' + title,
          {
            title: 'Xác nhận publish',
            confirmText: 'Publish',
            cancelText: 'Hủy'
          }
        )
      : false;

  if (!shouldPublish) {
    return;
  }

  if (typeof showUnifiedTopicEditorOverlay === 'function') {
    showUnifiedTopicEditorOverlay('\u0110ang t\u1ea1o v\u00e0 xu\u1ea5t b\u1ea3n b\u00e0i h\u1ecdc...');
  } else if (typeof showUnifiedTopicEditorLoader === 'function') {
    showUnifiedTopicEditorLoader('\u0110ang t\u1ea1o v\u00e0 xu\u1ea5t b\u1ea3n b\u00e0i h\u1ecdc...');
  } else {
    showTopicEditorLoading('\u0110ang t\u1ea1o v\u00e0 xu\u1ea5t b\u1ea3n b\u00e0i h\u1ecdc...');
  }

  const useUnlockCondition = document.getElementById('useUnlockCondition').checked;
  const prereqTopicId = document.getElementById('prerequisiteTopics').value;
  const conditionTypeElement = document.querySelector('input[name="unlockConditionType"]:checked');
  const conditionType = conditionTypeElement ? conditionTypeElement.value : 'complete_topic';
  
  let prerequisiteTopics = [];
  let unlockCondition = "";
  let isLocked = false;
  
  if (useUnlockCondition && prereqTopicId) {
    prerequisiteTopics = [prereqTopicId];
    isLocked = true;
    unlockCondition = JSON.stringify({
      type: conditionType,
      mode: "all",
      requiredProgress: 100,
      requiredQuizAccuracy: conditionType === 'complete_topic_and_quiz' ? 70 : 0,
      prerequisiteTopicIds: [prereqTopicId]
    });
  }

  const topicData = {
    topicId: topicId,
    title: title,
    description: description,
    courseId: courseId,
      category: category,
    order: parseInt(order, 10) || 999,
    isVisible: false,
    prerequisiteTopics: prerequisiteTopics.join(','),
    unlockCondition: unlockCondition,
    isLocked: isLocked,

    // Chỉ quản lý XP hoàn thành Topic tại Topic Editor
    xpReward: getTopicXpRewardValue(),

    content: content
  };

  console.log('📤 Publishing topic:', topicData);

  // Check if google.script.run is available
  if (typeof google === 'undefined' || !google.script || !google.script.run) {
    if (typeof hideUnifiedTopicEditorLoader === 'function') hideUnifiedTopicEditorLoader();
    hideTopicEditorLoading();
    showToast('Lỗi: Không thể kết nối với server. Vui lòng tải lại trang.', 'error');
    console.error('google.script.run not available');
    return;
  }

  // Set a timeout to prevent infinite loading
  const publishTimeout = setTimeout(function() {
    if (typeof hideUnifiedTopicEditorLoader === 'function') hideUnifiedTopicEditorLoader();
    hideTopicEditorLoading();
    showToast('⏱️ Quá thời gian chờ (60s). Vui lòng kiểm tra Apps Script Logs và thử lại.', 'error');
    console.error('Publish timeout - server took too long to respond');
  }, 60000); // 60 seconds timeout

  google.script.run
    .withSuccessHandler(function(result) {
      clearTimeout(publishTimeout);
      if (typeof hideUnifiedTopicEditorLoader === 'function') hideUnifiedTopicEditorLoader();
      hideTopicEditorLoading();
      console.log('✅ Server response:', result);

      try {
        if (result && result.success) {
          showToast('🎉 Publish thành công!', 'success');

          // Show success message with doc link - use simple alert if dialog fails
          setTimeout(function() {
            try {
              var message = '🎉 Bài học "' + title + '" đã được tạo và lưu thành công!\n\n' +
                'Bạn có thể xem trước nội dung hoặc chỉnh sửa thêm nếu cần.\n\n' +
                '🔗 Link Google Doc lưu trữ: ' + result.docUrl;

              if (typeof window.showAppAlert === 'function') {
                window.showAppAlert(message, { title: 'Lưu bài học thành công', confirmText: 'Đã hiểu' })
                  .then(function() {
                    askCreateNew();
                  })
                  .catch(function(e) {
                    console.warn('showAppAlert error:', e);
                    askCreateNew();
                  });
              } else {
                alert(message);
                askCreateNew();
              }
            } catch (e) {
              console.error('Success dialog error:', e);
              askCreateNew();
            }

            function askCreateNew() {
              try {
                if (typeof window.showAppConfirm === 'function') {
                  window.showAppConfirm('Bạn có muốn tiếp tục tạo bài học mới không?', {
                    title: 'Tạo bài học mới',
                    confirmText: 'Tạo mới',
                    cancelText: 'Trở về danh sách'
                  }).then(function(shouldCreateNew) {
                    if (shouldCreateNew) {
                      resetForm();
                    } else {
                      if (typeof goBackToAdmin === 'function') {
                        goBackToAdmin();
                      }
                    }
                  }).catch(function(e) {
                    console.warn('showAppConfirm error:', e);
                  });
                }
              } catch (e) {
                console.warn('askCreateNew error:', e);
              }
            }
          }, 500);
        } else {
          showToast('Lỗi: ' + (result ? result.message : 'Không có phản hồi từ server'), 'error');
        }
      } catch (e) {
        console.error('Success handler error:', e);
        showToast('Có lỗi xảy ra khi xử lý kết quả', 'error');
      }
    })
    .withFailureHandler(function(error) {
      clearTimeout(publishTimeout);
      if (typeof hideUnifiedTopicEditorLoader === 'function') hideUnifiedTopicEditorLoader();
      hideTopicEditorLoading();
      console.error('❌ Server error:', error);
      var errorMsg = error && error.message ? error.message : String(error);
      showToast('Lỗi: ' + errorMsg, 'error');

      try {
        if (typeof window.showAppAlert === 'function') {
          window.showAppAlert('Chi tiết lỗi:\n\n' + errorMsg, { title: 'Lỗi publish topic' })
            .catch(function(e) { console.warn('Alert error:', e); });
        }
      } catch (e) {
        console.warn('Failure handler alert error:', e);
      }
    })
    .createAndPublishTopic(topicData);
}

    editingTopicId = null;

  editingTopicId = editTopicId;

  // Update UI for edit mode

      hideTopicEditorLoading();
      showToast('L\u1ed7i: ' + (error ? error.message : error), 'error');

    hardResetLoadedContentLeftEdge(editor);
    // Parse text markers into visual blocks
    parseMarkersToVisualBlocks(editor);
    // Heal accidental over-capture where following headings are swallowed into a block
    normalizeVisualBlockBoundaries(editor);
    // Ensure loaded Doc content is readable in editor (always black text)
    normalizeLoadedDocTextColors(editor);
    // Final guard: remove any remaining effective left border/indent from normal text nodes
    forceNormalizeComputedLeftEdge(editor);
    // Restore list indentation/markers that may be stripped by imported inline styles
    normalizeListFormattingForEditor(editor);
    // Normalize tables loaded from Doc to match web-created table styling
    normalizeLoadedTablesForEditor(editor);
    // Strict guard: ensure color text after heading always starts on a new line
    enforceHeadingColorLineBreak(editor);

    normalizeHetAlignmentForEditor(editor);

  editor.focus();

  showAdminMindmapSection();
  loadExistingMindmap(topic.topicId);
  
  setTimeout(() => {
    window.isTopicEditorDirty = false;
  }, 100);
}

/**
 * Normalize inline text colors from loaded Doc content to black.
 * This prevents white/invisible text caused by imported inline styles.
 */
function normalizeLoadedDocTextColors(editor) {
  if (!editor) return;

  // Phase 1: hard reset normal content to black, even when color is inherited
  // from previously inserted dark blocks.
  var normalNodes = editor.querySelectorAll('*');
  for (var n = 0; n < normalNodes.length; n++) {
    var normalNode = normalNodes[n];
    if (normalNode.closest(
      '.visual-terminal-block, .visual-code-block, .visual-code-content, .visual-terminal-content, pre, code, .code-block, .code-block-wrapper, .code-block-header, .code-block-lang'
    )) {
      continue;
    }
    normalNode.style.setProperty('color', '#000000', 'important');
    normalNode.style.setProperty('-webkit-text-fill-color', '#000000', 'important');
  }

  // Phase 2: normalize explicit inline styles from imported Doc HTML.
  // In edit mode, Google Doc export can bring left border/indent styles that create
  // a vertical colored column on the left. Strip those to match create mode layout.
  var nodes = editor.querySelectorAll('[style], font[color]');
  for (var i = 0; i < nodes.length; i++) {
    var node = nodes[i];
    var nodeTag = node.tagName ? node.tagName.toLowerCase() : '';
    var isListNode = nodeTag === 'ul' || nodeTag === 'ol' || nodeTag === 'li';

    // Keep intentional code/terminal/output/cmd styling
    if (node.closest('pre, code, .code-block, .visual-code-block, .visual-terminal-block, .visual-output-block, .visual-cmd-block')) {
      continue;
    }

    if (node.style) {
      var hasColor = !!node.style.getPropertyValue('color');
      var hasTextFillColor = !!node.style.getPropertyValue('-webkit-text-fill-color');

      if (hasColor) {
        node.style.setProperty('color', '#000000', 'important');
      }
      if (hasTextFillColor) {
        node.style.setProperty('-webkit-text-fill-color', '#000000', 'important');
      }

      // Remove imported layout/typography artifacts that often leak from Google Doc HTML.
      var stripProps = [
        'border-left',
        'padding-left',
        'margin-left',
        'text-indent',
        'background',
        'background-color',
        'font-family',
        'font-size',
        'line-height',
        'white-space',
        'display'
      ];
      if (isListNode) {
        stripProps = [
          'border-left',
          'background',
          'background-color',
          'font-family',
          'font-size',
          'line-height',
          'white-space',
          'display'
        ];
      }
      for (var sp = 0; sp < stripProps.length; sp++) {
        if (node.style.getPropertyValue(stripProps[sp])) {
          node.style.removeProperty(stripProps[sp]);
        }
      }

      // Cleanup empty style attribute after normalization
      if (!node.style.cssText || !node.style.cssText.trim()) {
        node.removeAttribute('style');
      }
    }

    if (node.tagName === 'FONT' && node.hasAttribute('color')) {
      node.setAttribute('color', '#000000');
    }
  }

  // Keep the editor root readable too.
  editor.style.setProperty('color', '#000000', 'important');
  editor.style.setProperty('-webkit-text-fill-color', '#000000', 'important');

  // Restore intended dark-block text colors (must run after black normalization).
  var terminalNodes = editor.querySelectorAll('.visual-terminal-block, .visual-terminal-block *, .visual-terminal-content');
  for (var t = 0; t < terminalNodes.length; t++) {
    var nodeT = terminalNodes[t];
    // Label has its own grey color, the rest is white/light-grey
    if (nodeT.classList.contains('visual-terminal-label')) {
      nodeT.style.setProperty('color', '#8b949e', 'important');
      nodeT.style.setProperty('-webkit-text-fill-color', '#8b949e', 'important');
    } else {
      nodeT.style.setProperty('color', '#c9d1d9', 'important');
      nodeT.style.setProperty('-webkit-text-fill-color', '#c9d1d9', 'important');
    }
  }

  var outputNodes = editor.querySelectorAll('.visual-output-block, .visual-output-block *, .visual-output-content');
  for (var o = 0; o < outputNodes.length; o++) {
    var nodeO = outputNodes[o];
    if (nodeO.classList.contains('visual-output-label')) {
      nodeO.style.setProperty('color', '#888888', 'important');
      nodeO.style.setProperty('-webkit-text-fill-color', '#888888', 'important');
    } else {
      nodeO.style.setProperty('color', '#ffffff', 'important');
      nodeO.style.setProperty('-webkit-text-fill-color', '#ffffff', 'important');
    }
  }

  var cmdNodes = editor.querySelectorAll('.visual-cmd-block, .visual-cmd-block *, .visual-cmd-content');
  for (var m = 0; m < cmdNodes.length; m++) {
    var nodeM = cmdNodes[m];
    if (nodeM.classList.contains('visual-cmd-label')) {
      nodeM.style.setProperty('color', '#565f89', 'important');
      nodeM.style.setProperty('-webkit-text-fill-color', '#565f89', 'important');
    } else {
      nodeM.style.setProperty('color', '#ffffff', 'important');
      nodeM.style.setProperty('-webkit-text-fill-color', '#ffffff', 'important');
    }
  }

  var codeContentNodes = editor.querySelectorAll('.visual-code-content, .visual-code-content *');
  for (var c = 0; c < codeContentNodes.length; c++) {
    codeContentNodes[c].style.setProperty('color', '#d4d4d4', 'important');
    codeContentNodes[c].style.setProperty('-webkit-text-fill-color', '#d4d4d4', 'important');
  }

  var legacyCodeNodes = editor.querySelectorAll('.code-block-wrapper .code-block-lang, .code-block-wrapper pre, .code-block-wrapper pre code, .code-block-wrapper pre *');
  for (var l = 0; l < legacyCodeNodes.length; l++) {
    legacyCodeNodes[l].style.setProperty('color', '#ffffff', 'important');
    legacyCodeNodes[l].style.setProperty('-webkit-text-fill-color', '#ffffff', 'important');
  }

  // Safety net: ensure normal headings/paragraphs never keep legacy left border.
  var normalTextBlocks = editor.querySelectorAll('h1, h2, h3, h4, h5, h6, p');
  for (var b = 0; b < normalTextBlocks.length; b++) {
    var blockNode = normalTextBlocks[b];
    if (blockNode.closest('.visual-block, .callout, .visual-color-block, .visual-terminal-block, .visual-output-block, .visual-cmd-block')) continue;
    blockNode.style.removeProperty('border-left');
    blockNode.style.removeProperty('padding-left');
    blockNode.style.removeProperty('margin-left');
    blockNode.style.removeProperty('text-indent');
  }
}

/**
 * Remove legacy callout visual classes from loaded content in edit mode.
 * Old content may include .callout-info/.callout-* wrappers that keep a blue left border.
 */
function neutralizeLegacyCalloutStyles(editor) {
  if (!editor) return;

  var legacyCallouts = editor.querySelectorAll('.callout, .callout-note, .callout-warning, .callout-info, .callout-danger');
  for (var i = 0; i < legacyCallouts.length; i++) {
    var node = legacyCallouts[i];
    node.classList.remove('callout', 'callout-note', 'callout-warning', 'callout-info', 'callout-danger');
    node.style.removeProperty('border-left');
    node.style.removeProperty('padding-left');
    node.style.removeProperty('margin-left');
    node.style.removeProperty('background');
    node.style.removeProperty('background-color');
  }
}

/**
 * Hard reset left-edge artifacts from imported HTML so edit mode matches create mode.
 * Keeps intentional block styles because those are re-applied by visual block classes.
 */
function hardResetLoadedContentLeftEdge(editor) {
  if (!editor) return;

  var targets = editor.querySelectorAll('*');
  for (var i = 0; i < targets.length; i++) {
    var node = targets[i];
    var tag = node.tagName ? node.tagName.toLowerCase() : '';
    var isListNode = tag === 'ul' || tag === 'ol' || tag === 'li';
    if (node.closest('.visual-code-block, .visual-terminal-block, .visual-output-block, .visual-cmd-block, .visual-grid-block, .visual-figure-block, .visual-block')) {
      continue;
    }

    // Keep native list indentation/markers for imported content
    if (isListNode) {
      if (node.style) {
        node.style.removeProperty('border-left');
        node.style.removeProperty('text-indent');
      }
      continue;
    }

    if (node.tagName && node.tagName.toLowerCase() === 'blockquote') {
      // Unwrap blockquote to plain flow content (blockquote often exports with left border).
      var frag = document.createDocumentFragment();
      while (node.firstChild) frag.appendChild(node.firstChild);
      node.parentNode.replaceChild(frag, node);
      continue;
    }

    if (node.style) {
      // Skip visual blocks from reset - only reset plain text/doc containers
      if (node.closest('.visual-code-block, .visual-terminal-block, .visual-output-block, .visual-cmd-block, .visual-grid-block, .visual-figure-block, .visual-block')) {
        continue;
      }

      node.style.removeProperty('border-left');
      node.style.removeProperty('padding-left');
      node.style.removeProperty('margin-left');
      node.style.removeProperty('text-indent');
      node.style.removeProperty('border');
      node.style.removeProperty('outline');
      node.style.removeProperty('width');
      node.style.removeProperty('max-width');
      
      // Only set 100% width on non-inline elements that aren't badges/icons
      const tagName = node.tagName.toLowerCase();
      if (['p', 'div', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6'].includes(tagName)) {
         node.style.setProperty('width', '100%', 'important');
         node.style.setProperty('max-width', '100%', 'important');
      }
      
      if (!node.style.cssText || !node.style.cssText.trim()) {
        node.removeAttribute('style');
      }
    }
  }
}

/**
 * Final guard using computed style (catches class-based borders, not just inline style).
 */
function forceNormalizeComputedLeftEdge(editor) {
  if (!editor || typeof window.getComputedStyle !== 'function') return;

  var nodes = editor.querySelectorAll('*');
  for (var i = 0; i < nodes.length; i++) {
    var node = nodes[i];
    var tagName = node.tagName ? node.tagName.toLowerCase() : '';
    if (node.closest('.visual-block, .visual-code-block, .visual-terminal-block, .visual-output-block, .visual-cmd-block, .visual-grid-block, .visual-figure-block, .visual-color-block')) {
      continue;
    }

    // Do not flatten native list indentation/markers
    if (tagName === 'ul' || tagName === 'ol' || tagName === 'li') {
      continue;
    }

    // Keep configured heading indentation from CSS (especially h3-h6).
    if (tagName === 'h1' || tagName === 'h2' || tagName === 'h3' || tagName === 'h4' || tagName === 'h5' || tagName === 'h6') {
      continue;
    }

    var cs = window.getComputedStyle(node);
    var borderLeft = parseFloat(cs.borderLeftWidth || '0') || 0;
    var marginLeft = parseFloat(cs.marginLeft || '0') || 0;
    var paddingLeft = parseFloat(cs.paddingLeft || '0') || 0;
    var textIndent = parseFloat(cs.textIndent || '0') || 0;

    if (borderLeft > 0 || marginLeft > 0 || paddingLeft > 0 || textIndent !== 0) {
      node.style.setProperty('border-left', 'none', 'important');
      node.style.setProperty('margin-left', '0', 'important');
      node.style.setProperty('padding-left', '0', 'important');
      node.style.setProperty('text-indent', '0', 'important');
      node.style.setProperty('border', 'none', 'important');
      node.style.setProperty('outline', 'none', 'important');
    }
  }
}

/**
 * Ensure list markers and indentation are visible in edit mode after loading from Doc.
 */
function normalizeListFormattingForEditor(editor) {

  var lists = editor.querySelectorAll('ul, ol');

    if (list.tagName.toLowerCase() === 'ul') {
      list.style.setProperty('list-style-type', 'disc', 'important');
    } else {
      list.style.setProperty('list-style-type', 'decimal', 'important');
    }
  }

  var nestedUls = editor.querySelectorAll('ul ul');
  for (var n1 = 0; n1 < nestedUls.length; n1++) {

  for (var n2 = 0; n2 < nestedOl.length; n2++) {

  var items = editor.querySelectorAll('li');

    }
    li.style.removeProperty('list-style');
