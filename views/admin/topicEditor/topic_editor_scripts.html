    li.style.removeProperty('margin-left');
    li.style.removeProperty('padding-left');
    li.style.setProperty('display', 'list-item', 'important');
    li.style.setProperty('list-style-position', 'outside', 'important');
    li.style.setProperty('margin', '5px 0', 'important');
  }
}

/**
 * Normalize imported tables so they look like tables created from web editor:
 * - add editor classes/wrapper
 * - ensure first row is header (th) when Doc HTML uses td only
 */
function normalizeLoadedTablesForEditor(editor) {
  if (!editor) return;

  var tables = editor.querySelectorAll('table');
  for (var i = 0; i < tables.length; i++) {
    var table = tables[i];

    if (table.closest('.visual-block, .visual-code-block, .visual-terminal-block, .visual-output-block, .visual-cmd-block, .visual-grid-block, .visual-figure-block, .visual-color-block')) {
      continue;
    }

    table.classList.add('editor-content-table');

    var parent = table.parentElement;
    if (!parent || !parent.classList || !parent.classList.contains('editor-table-wrapper')) {
      var wrapper = document.createElement('div');
      wrapper.className = 'editor-table-wrapper';
      table.parentNode.insertBefore(wrapper, table);
      wrapper.appendChild(table);
    }

    var hasHeader = table.querySelector('th') !== null;
    if (!hasHeader) {
      var firstRow = table.querySelector('tr');
      if (firstRow) {
        var cells = firstRow.querySelectorAll('td');
        for (var c = 0; c < cells.length; c++) {
          var td = cells[c];
          var th = document.createElement('th');
          th.innerHTML = td.innerHTML;
          td.parentNode.replaceChild(th, td);
        }
      }
    }
  }
}

/**
 * Ensure any color marker immediately after heading is block-separated.
 */
function enforceHeadingColorLineBreak(editor) {
  if (!editor) return;

  var headings = editor.querySelectorAll('h1, h2, h3, h4, h5, h6');
  for (var i = 0; i < headings.length; i++) {
    var heading = headings[i];
    var next = heading.nextElementSibling;
    if (!next) continue;
    if (!next.classList || !next.classList.contains('visual-color-block')) continue;

    next.classList.add('visual-color-block-section');
    next.style.setProperty('display', 'block', 'important');
    next.style.setProperty('margin-top', '8px', 'important');
  }
}

/**
 * Force "Hết" text to left-align when loaded into editor.
 * Google Doc stores "Hết" as centered (via ensureDocEndsWithHetMarker),
 * but in the web editor we want it left-aligned for readability.
 * The centered alignment is re-applied automatically when saving back to Doc.
 */
function normalizeHetAlignmentForEditor(editor) {
  if (!editor) return;

  // Walk all block-level elements and check for "Hết" text (or corrupted versions like H삖½삖½삖½t)
  var blocks = editor.querySelectorAll('p, div, span, h1, h2, h3, h4, h5, h6');
  for (var i = 0; i < blocks.length; i++) {
    var el = blocks[i];
    var text = (el.textContent || '').replace(/\u00A0/g, ' ').trim();

    // Check if it's the "Hết" marker or its corrupted variants
    var isHet = text === 'Hết' || (text.startsWith('H') && text.endsWith('t') && text.length >= 3 && text.length <= 15 && text.includes('½'));
    
    if (isHet) {
      // Fix the text content in case it's corrupted mojibake
      el.textContent = 'Hết';

      // Remove center alignment from inline style
      if (el.style && el.style.textAlign === 'center') {
        el.style.textAlign = 'left';
      }
      // Also check parent for center alignment
      var parent = el.parentElement;
      if (parent && parent !== editor && parent.style && parent.style.textAlign === 'center') {
        parent.style.textAlign = 'left';
      }
    }
  }
}

/**
 * Prevent block wrappers from swallowing subsequent headings when imported marker boundaries are imperfect.
 * If a callout-like visual block contains H1-H6, move that heading and following nodes outside the block.
 */
function normalizeVisualBlockBoundaries(editor) {
  if (!editor) return;

  var blockContents = editor.querySelectorAll('.visual-block .visual-block-content');
  for (var i = 0; i < blockContents.length; i++) {
    var contentEl = blockContents[i];
    var parentBlock = contentEl.closest('.visual-block');
    if (!parentBlock) continue;

    var headingNode = contentEl.querySelector('h1, h2, h3, h4, h5, h6');
    if (!headingNode) continue;

    var overflowFragment = document.createDocumentFragment();
    var cursor = headingNode;
    while (cursor) {
      var next = cursor.nextSibling;
      overflowFragment.appendChild(cursor);
      cursor = next;
    }

    // Keep a clean line break between block and moved content
    var spacer = document.createElement('p');
    spacer.innerHTML = '<br>';
    parentBlock.parentNode.insertBefore(spacer, parentBlock.nextSibling);
    parentBlock.parentNode.insertBefore(overflowFragment, spacer.nextSibling);
  }

  // Legacy callout blocks (insertCallout) can also wrap following headings when pasted/imported.
  // Split them the same way to avoid left blue border bleeding into subsequent content.
  var legacyCallouts = editor.querySelectorAll('.callout .callout-content');
  for (var j = 0; j < legacyCallouts.length; j++) {
    var calloutContent = legacyCallouts[j];
    var parentCallout = calloutContent.closest('.callout');
    if (!parentCallout) continue;

    var calloutHeading = calloutContent.querySelector('h1, h2, h3, h4, h5, h6');
    if (!calloutHeading) continue;

    var calloutOverflow = document.createDocumentFragment();
    var cursor2 = calloutHeading;
    while (cursor2) {
      var next2 = cursor2.nextSibling;
      calloutOverflow.appendChild(cursor2);
      cursor2 = next2;
    }

    var spacer2 = document.createElement('p');
    spacer2.innerHTML = '<br>';
    parentCallout.parentNode.insertBefore(spacer2, parentCallout.nextSibling);
    parentCallout.parentNode.insertBefore(calloutOverflow, spacer2.nextSibling);
  }
}

/**
 * Parse [[BLOCK]] markers from Doc HTML into visual editable blocks
 * Reuses the same innermost-first approach from preview parsing
 */
function parseMarkersToVisualBlocks(container) {
  var html = container.innerHTML;

  // === Normalize brackets (same as preview) ===
  html = html.replace(/&#91;/g, '[');
  html = html.replace(/&#93;/g, ']');
  html = html.replace(/&lbrack;/g, '[');
  html = html.replace(/&rbrack;/g, ']');
  html = html.replace(/&#x5B;/gi, '[');
  html = html.replace(/&#x5D;/gi, ']');
  html = html.replace(/[\u27E6\u301A\uFF3B]/g, '[');
  html = html.replace(/[\u27E7\u301B\uFF3D]/g, ']');
  html = html.replace(/[\u200B\u200C\u200D\uFEFF]/g, '');

  // Remove ONLY inline/formatting tags between/around brackets.
  // Preserve block-level tags (h1-h6, div, p, ul, ol, li, pre, table, tr, td, th,
  // blockquote, img, br, hr, section, article, nav, header, footer, figure, figcaption)
  // so that headings after blocks are not accidentally destroyed.
  var inlineTagPattern = '<\\/?(?:span|b|i|u|em|strong|font|a|s|sub|sup|mark|abbr|small|big|del|ins|cite|q|dfn|var|samp|kbd|wbr|bdo|bdi|ruby|rt|rp|data|time|output)(?:\\s[^>]*)?>'; 
  var inlineTagsRe = new RegExp('(' + inlineTagPattern + ')*\\[(' + inlineTagPattern + ')*', 'gi');
  html = html.replace(inlineTagsRe, '[');
  var inlineTagsReClose = new RegExp('(' + inlineTagPattern + ')*\\](' + inlineTagPattern + ')*', 'gi');
  html = html.replace(inlineTagsReClose, ']');

  // Clean inside [[ and ]]
  html = html.replace(/\[\[([^\[\]]*?)\]\]/g, function(match, inner) {
    var cleanInner = inner.replace(/<[^>]*>/g, '').trim();
    return '[[' + cleanInner + ']]';
  });

  // Normalize closing/opening tags
  html = html.replace(/\[\[\s*\/\s*(\w+)\s*\]\]/gi, '[[/$1]]');
  html = html.replace(/\[\[\s*(\w+(?::\w+)?)\s*\]\]/gi, '[[$1]]');

  console.log('[EditMode] Parsing markers. Found:',
    (html.match(/\[\[(\w+(?::\w+)?)\]\]/g) || []).length, 'opening,',
    (html.match(/\[\[\/\w+\]\]/g) || []).length, 'closing');

  // === Find innermost block ===
  function findInnermostBlock(text) {
    var bestMatch = null;
    var bestIndex = -1;
    var openingRegex = /\[\[(NOTE|TIP|WARNING|HIGHLIGHT|EXAMPLE|CHECKPOINT|TASK|QA|RESOURCES|TERMINAL(?::\w*)?|GRID|CMD|OUTPUT|CODE(?::\w+)?|FIGURE:[^\]]*|COLOR:\w+)\]\]/gi;
    var match;
    while ((match = openingRegex.exec(text)) !== null) {
      var openTag = match[0];
      var openIndex = match.index;
      var tagInfo = match[1];
      var tagType = tagInfo.split(':')[0].toUpperCase();
      var closeRegex = new RegExp('\\[\\[\\/' + tagType + '\\]\\]', 'gi');
      closeRegex.lastIndex = openIndex + openTag.length;
      var closeMatch = closeRegex.exec(text);
      if (closeMatch) {
        var closeIndex = closeMatch.index;
        var innerContent = text.substring(openIndex + openTag.length, closeIndex);
        var hasNested = /\[\[(NOTE|TIP|WARNING|HIGHLIGHT|EXAMPLE|CHECKPOINT|TASK|QA|RESOURCES|TERMINAL(?::\w*)?|GRID|CMD|OUTPUT|CODE(?::\w+)?|FIGURE:[^\]]*|COLOR:\w+)\]\]/i.test(innerContent);
        if (!hasNested) {
          if (bestMatch === null || openIndex < bestIndex) {
            bestMatch = {
              fullMatch: text.substring(openIndex, closeIndex + closeMatch[0].length),
              openTag: openTag,
              closeTag: closeMatch[0],
              tagInfo: tagInfo,
              tagType: tagType,
              content: innerContent,
              startIndex: openIndex,
              endIndex: closeIndex + closeMatch[0].length
            };
            bestIndex = openIndex;
          }
        }
      }
    }
    return bestMatch;
  }

  // === Render a block as a visual editable block ===
  function renderEditableBlock(blockInfo) {
    var tagType = blockInfo.tagType;
    var tagInfo = blockInfo.tagInfo;
    var content = blockInfo.content;

    // Clean content: strip surrounding <p> tags but keep inner HTML
    var cleanContent = content
      .replace(/^(\s*<\/?p[^>]*>\s*)+/gi, '')
      .replace(/(\s*<\/?p[^>]*>\s*)+$/gi, '')
      .trim();

    // CODE blocks
    if (tagType === 'CODE') {
      var lang = tagInfo.split(':')[1] || 'JAVASCRIPT';
      var cleanCode = cleanContent
        .replace(/<\/p>/gi, '\n')
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<\/div>/gi, '\n')
        .replace(/<[^>]*>/g, '')
        .replace(/&nbsp;/g, ' ')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/&amp;/g, '&')
        .replace(/^\n+|\n+$/g, '');
      return '<div class="visual-code-block" data-block-type="CODE" data-language="' + lang + '" contenteditable="false">' +
        '<div class="visual-code-header"><span class="visual-code-lang">' + lang + '</span></div>' +
        '<pre class="visual-code-content" contenteditable="true">' + escapeHtml(cleanCode) + '</pre>' +
        '<button class="visual-block-delete" onclick="deleteVisualBlock(this)" title="X\u00f3a block">\u2715</button>' +
        '</div>';
    }

    // CMD / OUTPUT / TERMINAL blocks
    if (tagType === 'TERMINAL' || tagType === 'CMD' || tagType === 'OUTPUT') {
      var markerType = tagType;
      var visualClass = 'visual-' + tagType.toLowerCase() + '-block';
      var labelText = tagType === 'TERMINAL' ? '\ud83d\udda5\ufe0f Terminal Output' : 
                      tagType === 'CMD' ? '\u2328\ufe0f CMD Block' : '\ud83d\udcc4 Output Block';
      var labelClass = 'visual-' + tagType.toLowerCase() + '-label';
      var contentClass = 'visual-' + tagType.toLowerCase() + '-content';

      var monoContent = cleanContent
        .replace(/<\/p>/gi, '\n')
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<[^>]*>/g, '')
        .replace(/&nbsp;/g, ' ')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/&amp;/g, '&')
        .replace(/^\n+|\n+$/g, '');

      return '<div class="' + visualClass + '" data-block-type="' + markerType + '" contenteditable="false">' +
        '<div class="' + labelClass + '">' + labelText + '</div>' +
        '<div class="' + contentClass + '" contenteditable="true">' + escapeHtml(monoContent) + '</div>' +
        '<button class="visual-block-delete" onclick="deleteVisualBlock(this)" title="X\u00f3a block">\u2715</button>' +
        '</div>';
    }

    // GRID blocks
    if (tagType === 'GRID') {
      return '<div class="visual-grid-block" data-block-type="GRID" contenteditable="false">' +
        '<div class="visual-grid-label">\ud83d\udcca Grid Cards</div>' +
        '<div class="visual-grid-content" contenteditable="true">' + cleanContent + '</div>' +
        '<button class="visual-block-delete" onclick="deleteVisualBlock(this)" title="X\u00f3a block">\u2715</button>' +
        '</div>';
    }

    // FIGURE blocks
    if (tagType === 'FIGURE') {
      var caption = tagInfo.split(':').slice(1).join(':') || '';
      return '<div class="visual-figure-block" data-block-type="FIGURE" data-caption="' + escapeHtml(caption) + '" contenteditable="false">' +
        '<div class="visual-figure-content" contenteditable="true">' + cleanContent + '</div>' +
        '<div class="visual-figure-caption">\ud83d\udcf7 ' + caption + '</div>' +
        '<button class="visual-block-delete" onclick="deleteVisualBlock(this)" title="X\u00f3a block">\u2715</button>' +
        '</div>';
    }

    // COLOR blocks
    if (tagType === 'COLOR') {
      var color = tagInfo.split(':')[1] || 'BLUE';
      var sectionContent = cleanContent.replace(/\n/g, '<br>');
      return '<div class="visual-color-block visual-color-block-section visual-color-' + color.toLowerCase() + '" data-color-type="' + color + '">' + sectionContent + '</div>';
    }

    // Callout blocks (NOTE, TIP, WARNING, HIGHLIGHT, EXAMPLE, CHECKPOINT, TASK, QA, RESOURCES)
    var blockConfig = {
      'NOTE': { icon: '\ud83d\udccc', label: 'Ghi ch\u00fa' },
      'TIP': { icon: '\ud83d\udca1', label: 'M\u1eb9o' },
      'WARNING': { icon: '\u26a0\ufe0f', label: 'C\u1ea3nh b\u00e1o' },
      'HIGHLIGHT': { icon: '\u2728', label: 'L\u01b0u \u00fd' },
      'EXAMPLE': { icon: '\ud83d\udcd6', label: 'V\u00ed d\u1ee5' },
      'CHECKPOINT': { icon: '\u2705', label: 'Ki\u1ec3m tra' },
      'TASK': { icon: '\ud83d\udccb', label: 'Nhi\u1ec7m v\u1ee5' },
      'QA': { icon: '\u2753', label: 'H\u1ecfi \u0026 \u0110\u00e1p' },
      'RESOURCES': { icon: '\ud83d\udcda', label: 'T\u00e0i nguy\u00ean' }
    };

    var config = blockConfig[tagType];
    if (config) {
      return '<div class="visual-block visual-block-' + tagType.toLowerCase() + '" data-block-type="' + tagType + '" contenteditable="false">' +
        '<span class="visual-block-icon">' + config.icon + '</span>' +
        '<div class="visual-block-content" contenteditable="true"><span class="visual-block-label">' + config.label + ':</span> ' + cleanContent + '</div>' +
        '<button class="visual-block-delete" onclick="deleteVisualBlock(this)" title="X\u00f3a block">\u2715</button>' +
        '</div>';
    }

    // Fallback: return content as-is
    return cleanContent;
  }

  // === Process blocks from innermost to outermost ===
  var maxIterations = 200;
  var iterations = 0;
  while (iterations < maxIterations) {
    var innermostBlock = findInnermostBlock(html);
    if (!innermostBlock) break;
    console.log('[EditMode] Converting block:', innermostBlock.tagType);
    var rendered = renderEditableBlock(innermostBlock);
    html = html.substring(0, innermostBlock.startIndex) + rendered + html.substring(innermostBlock.endIndex);
    iterations++;
  }
  console.log('[EditMode] Total blocks converted:', iterations);

  container.innerHTML = html;
}

/**

  // Validation
  if (!title) {
    showToast('Vui l\u00f2ng nh\u1eadp ti\u00eau \u0111\u1ec1', 'error');
    document.getElementById('topicTitle').focus();
    return;
  }
  if (!category) {
    showToast('Vui l\u00f2ng ch\u1ecdn danh m\u1ee5c', 'error');
    document.getElementById('topicCategory').focus();
    return;
  }
  if (!content || content === '<br>' || content === '<p><br></p>') {
    showToast('Vui l\u00f2ng nh\u1eadp n\u1ed9i dung b\u00e0i h\u1ecdc', 'error');
    document.getElementById('contentEditor').focus({ preventScroll: true });
    return;
  }

  // Confirm update
  var shouldUpdate =
    typeof window.showAppConfirm === 'function'
      ? await window.showAppConfirm(
          'B\u1ea1n c\u00f3 ch\u1eafc mu\u1ed1n c\u1eadp nh\u1eadt b\u00e0i h\u1ecdc n\u00e0y?\n\nTopic: ' + title,
          {
            title: 'X\u00e1c nh\u1eadn c\u1eadp nh\u1eadt',
            confirmText: 'C\u1eadp nh\u1eadt',
            cancelText: 'H\u1ee7y'
          }
        )
      : confirm('B\u1ea1n c\u00f3 ch\u1eafc mu\u1ed1n c\u1eadp nh\u1eadt b\u00e0i h\u1ecdc n\u00e0y?');

  if (!shouldUpdate) return;

  if (typeof showUnifiedTopicEditorOverlay === 'function') {
    showUnifiedTopicEditorOverlay('\u0110ang c\u1eadp nh\u1eadt b\u00e0i h\u1ecdc...');
  } else if (typeof showUnifiedTopicEditorLoader === 'function') {
    showUnifiedTopicEditorLoader('\u0110ang c\u1eadp nh\u1eadt b\u00e0i h\u1ecdc...');
  } else {
    showTopicEditorLoading('\u0110ang c\u1eadp nh\u1eadt b\u00e0i h\u1ecdc...');
  }

  const useUnlockCondition = document.getElementById('useUnlockCondition').checked;
  const prereqTopicId = document.getElementById('prerequisiteTopics').value;
  const conditionTypeElement = document.querySelector('input[name="unlockConditionType"]:checked');
  const conditionType = conditionTypeElement ? conditionTypeElement.value : 'complete_topic';
  
  let prerequisiteTopics = [];
  let unlockCondition = "";
  let isLocked = false;
  
  if (useUnlockCondition && prereqTopicId) {
    prerequisiteTopics = [prereqTopicId];
    isLocked = true;
    unlockCondition = JSON.stringify({
      type: conditionType,
      mode: "all",
      requiredProgress: 100,
      requiredQuizAccuracy: conditionType === 'complete_topic_and_quiz' ? 70 : 0,
      prerequisiteTopicIds: [prereqTopicId]
    });
  }

  var topicData = {
    title: title,
    description: description,
    category: category,
    order: parseInt(order, 10) || 999,
    prerequisiteTopics: prerequisiteTopics.join(','),
    unlockCondition: unlockCondition,
    isLocked: isLocked,

    // Chỉ cập nhật XP hoàn thành Topic
    xpReward: getTopicXpRewardValue(),

    content: content
  };

  console.log('\ud83d\udce4 Updating topic:', topicId, topicData);

  // Check google.script.run
  if (typeof google === 'undefined' || !google.script || !google.script.run) {
    if (typeof hideUnifiedTopicEditorLoader === 'function') hideUnifiedTopicEditorLoader();
    hideTopicEditorLoading();
    showToast('L\u1ed7i: Kh\u00f4ng th\u1ec3 k\u1ebft n\u1ed1i v\u1edbi server.', 'error');
    return;
  }

  var updateTimeout = setTimeout(function() {
    if (typeof hideUnifiedTopicEditorLoader === 'function') hideUnifiedTopicEditorLoader();
    hideTopicEditorLoading();
    showToast('\u23f1 Qu\u00e1 th\u1eddi gian ch\u1edd (60s). Vui l\u00f2ng ki\u1ec3m tra l\u1ea1i.', 'error');
  }, 60000);

  google.script.run
    .withSuccessHandler(function(result) {
      clearTimeout(updateTimeout);
      if (typeof hideUnifiedTopicEditorLoader === 'function') hideUnifiedTopicEditorLoader();
      hideTopicEditorLoading();
      console.log('\u2705 Update response:', result);

      if (result && result.success) {
        showToast('\ud83c\udf89 C\u1eadp nh\u1eadt th\u00e0nh c\u00f4ng!', 'success');

        setTimeout(function() {
          try {
            var docInfoText = '';
            if (result.docOperation === 'created' && result.contentDocId) {
              docInfoText =
                '\n\n📄 Đã tạo Google Doc mới cho topic này.' +
                '\nDoc ID: ' + result.contentDocId +
                (result.contentDocUrl ? ('\nLink: ' + result.contentDocUrl) : '');
            }

            if (typeof window.showAppAlert === 'function') {
              window.showAppAlert(
                '✅ Bài học đã được cập nhật thành công!\n\nTopic: ' + title + docInfoText,
                { title: 'Cập nhật thành công', confirmText: 'Đã hiểu' }
              ).then(function() {
                resetForm();
                goBackToAdmin();
              }).catch(function() {
                resetForm();
                goBackToAdmin();
              });
            } else {
              alert('✅ Bài học đã được cập nhật thành công!' + docInfoText);
              resetForm();
              goBackToAdmin();
            }
          } catch (e) {
            console.error('Success dialog error:', e);
            goBackToAdmin();
          }
        }, 500);
      } else {
        showToast('L\u1ed7i: ' + (result ? result.message : 'Kh\u00f4ng c\u00f3 ph\u1ea3n h\u1ed3i t\u1eeb server'), 'error');
      }
    })
    .withFailureHandler(function(error) {
      clearTimeout(updateTimeout);
      if (typeof hideUnifiedTopicEditorLoader === 'function') hideUnifiedTopicEditorLoader();
      hideTopicEditorLoading();
      console.error('\u274c Update error:', error);
      var errorMsg = error && error.message ? error.message : String(error);
      showToast('L\u1ed7i: ' + errorMsg, 'error');
    })
    .updateTopicWithContent(topicId, topicData);
}

function renderTopicOrderPreview() {
  const courseInput = document.getElementById('topicCourseId');
  const courseId = courseInput ? courseInput.value.trim() : '';
  const orderInput = document.getElementById('topicOrder').value;
  const titleInput = document.getElementById('topicTitle').value.trim() || 'Bài đang tạo';
  const container = document.getElementById('topicOrderPreviewContainer');
  const titleEl = document.getElementById('topicOrderPreviewTitle');
  const countEl = document.getElementById('topicOrderPreviewCount');
  const listEl = document.getElementById('topicOrderPreviewList');
  
  if (!container || !titleEl || !countEl || !listEl) return;
  
  // Preserve collapsed state
  const isCollapsed = container.classList.contains('is-collapsed');
  
  if (!courseId) {
    container.className = 'topic-order-preview is-empty' + (isCollapsed ? ' is-collapsed' : '');
    titleEl.textContent = 'Chọn khóa học để xem thứ tự bài học';
    countEl.textContent = '';
    listEl.innerHTML = '';
    return;
  }
  
  if (!allTopicsForPrereq || allTopicsForPrereq.length === 0) {
    container.className = 'topic-order-preview is-loading' + (isCollapsed ? ' is-collapsed' : '');
    titleEl.textContent = 'Đang tải danh sách bài học...';
    countEl.textContent = '';
    listEl.innerHTML = '';
    return;
  }
  
  container.className = 'topic-order-preview' + (isCollapsed ? ' is-collapsed' : '');
  
  // Filter by courseId ONLY
  let courseTopics = allTopicsForPrereq.filter(t => t.courseId === courseId);
  
  // Loại bỏ bài đang chỉnh sửa khỏi danh sách (để ghép nó vào vị trí mới)
  if (isEditMode && editingTopicId) {
    courseTopics = courseTopics.filter(t => t.topicId !== editingTopicId);
  }
  
  let previewList = courseTopics.map(t => {
     return {
       ...t,
       parsedOrder: parseInt(t.order) || 999
     };
  });
  
  const newOrder = parseInt(orderInput);
  const hasNewOrder = !isNaN(newOrder) && newOrder > 0;
  const currentTopicOrder = hasNewOrder ? newOrder : 999;
  
  let originalOldOrder = null;
  if (isEditMode && editingTopicId) {
    const origTopic = allTopicsForPrereq.find(t => t.topicId === editingTopicId);
    if (origTopic) {
       originalOldOrder = parseInt(origTopic.order) || null;
    }
  }
  
  // Simulate shifting logic
  if (hasNewOrder) {
    previewList.forEach(t => {
      if (originalOldOrder && originalOldOrder < 999) {
        if (originalOldOrder !== currentTopicOrder) {
          if (currentTopicOrder < originalOldOrder) {
            if (t.parsedOrder >= currentTopicOrder && t.parsedOrder < originalOldOrder) {
              t.parsedOrder++;
            }
          } else {
            if (t.parsedOrder > originalOldOrder && t.parsedOrder <= currentTopicOrder) {
              t.parsedOrder--;
            }
          }
        }
      } else {
        if (t.parsedOrder >= currentTopicOrder) {
          t.parsedOrder++;
        }
      }
    });
  }
  
  previewList.push({
    title: titleInput,
    isCurrent: true,
    parsedOrder: currentTopicOrder,
    topicId: isEditMode ? editingTopicId : 'new'
  });
  
  previewList.sort((a, b) => a.parsedOrder - b.parsedOrder);
  
  const selectedCourseTitle = courseInput.options && courseInput.selectedIndex > 0 ? courseInput.options[courseInput.selectedIndex].text : courseId;
  titleEl.textContent = `THỨ TỰ BÀI HỌC — ${selectedCourseTitle.toUpperCase()}`;
  countEl.textContent = `${previewList.length} bài`;
  
  let html = '';
  previewList.forEach(t => {
    const isCurrent = t.isCurrent;
    const orderDisplay = t.parsedOrder >= 999 ? '—' : (t.parsedOrder < 10 ? '0' + t.parsedOrder : t.parsedOrder);
    const label = isCurrent ? (isEditMode ? 'Đang chỉnh sửa' : 'Bài đang tạo') : '';
    const hasConflict = !isCurrent && t.parsedOrder === currentTopicOrder && t.parsedOrder < 999;
    
    html += `
      <div class="topic-order-preview-item ${isCurrent ? 'is-current' : ''}">
        <div class="topic-order-number">${orderDisplay}</div>
        <div class="topic-order-title">
          ${escapeHtml(t.title)}
          ${t.topicId && t.topicId !== 'new' && !isCurrent ? `<small style="color:#999; margin-left: 5px;">(${t.topicId})</small>` : ''}
        </div>
        ${hasConflict ? `<div class="topic-order-label" style="background:#ffedd5; color:#ea580c;">Trùng thứ tự</div>` : ''}
        ${label ? `<div class="topic-order-label">${label}</div>` : ''}
      </div>
    `;
  });
  
  listEl.innerHTML = html;
}

function setupKeyboardShortcuts() {
  document.addEventListener('keydown', function(e) {
    // Only when editor is focused
    const editor = document.getElementById('contentEditor');
    if (!editor.contains(document.activeElement) && document.activeElement !== editor) {
      return;
    }
    
    // Ctrl/Cmd + B = Bold
    if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
      e.preventDefault();
      formatText('bold');
    }
    
    // Ctrl/Cmd + I = Italic
    if ((e.ctrlKey || e.metaKey) && e.key === 'i') {
      e.preventDefault();
      formatText('italic');
    }
    
    // Ctrl/Cmd + U = Underline
    if ((e.ctrlKey || e.metaKey) && e.key === 'u') {
      e.preventDefault();
      formatText('underline');
    }
    
    // Ctrl/Cmd + K = Insert Link
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      openLinkModal();
    }
  });
}

function saveSelection() {
  const editor = document.getElementById('contentEditor');
  if (!editor) return;

  const selection = window.getSelection();
  if (!selection || selection.rangeCount === 0) return;

  const range = selection.getRangeAt(0);
  const container = range.commonAncestorContainer;

  // Only keep ranges inside the editor to avoid restoring to document start.
  if (editor.contains(container)) {
    savedSelection = range.cloneRange();
  }
}

function restoreSelection() {
  const editor = document.getElementById('contentEditor');
  if (!editor) return;

  const selection = window.getSelection();
  if (!selection) return;

  let rangeToApply = null;
  if (savedSelection) {
    const container = savedSelection.commonAncestorContainer;
    if (editor.contains(container)) {
      rangeToApply = savedSelection.cloneRange();
    }
  }

  // Fallback: place caret at end of editor instead of jumping to top.
  if (!rangeToApply) {
    rangeToApply = document.createRange();
    rangeToApply.selectNodeContents(editor);
    rangeToApply.collapse(false);
    savedSelection = rangeToApply.cloneRange();
  }

  try {
    editor.focus({ preventScroll: true });
  } catch (e) {
    editor.focus();
  }

  selection.removeAllRanges();
  selection.addRange(rangeToApply);
}

function insertHtmlAtSelection(html) {
  const editor = document.getElementById('contentEditor');
  if (!editor) return false;

  const selection = window.getSelection();
  if (!selection) return false;

  let insertRange = null;

  /*
   * Ưu tiên vị trí đã lưu trước khi mở popup.
   */
  if (savedSelection) {
    try {
      const container = savedSelection.commonAncestorContainer;

      if (editor.contains(container)) {
        insertRange = savedSelection.cloneRange();
      }
    } catch (error) {
      console.warn('[TopicEditor] savedSelection không hợp lệ:', error);
    }
  }

  /*
   * Nếu savedSelection không còn hợp lệ,
   * thử dùng vùng chọn hiện tại.
   */
  if (!insertRange && selection.rangeCount > 0) {
    const currentRange = selection.getRangeAt(0);

    if (editor.contains(currentRange.commonAncestorContainer)) {
      insertRange = currentRange.cloneRange();
    }
  }

  /*
   * Chỉ dùng cuối editor làm phương án cuối cùng.
   */
  if (!insertRange) {
    insertRange = document.createRange();
    insertRange.selectNodeContents(editor);
    insertRange.collapse(false);
  }

  try {
    insertRange.deleteContents();

    /*
     * Dùng template để không tạo các text node
     * do khoảng trắng đầu và cuối chuỗi HTML.
     */
    const template = document.createElement('template');
    template.innerHTML = String(html).trim();

    const fragment = template.content;
    const lastInsertedNode = fragment.lastChild;

    if (!lastInsertedNode) {
      return false;
    }

    insertRange.insertNode(fragment);

    /*
     * Đưa con trỏ xuống sau block vừa chèn.
     */
    const caretRange = document.createRange();
    caretRange.setStartAfter(lastInsertedNode);
    caretRange.collapse(true);

    try {
      editor.focus({ preventScroll: true });
      selection.removeAllRanges();
      selection.addRange(caretRange);
      savedSelection = caretRange.cloneRange();
    } catch (e) {
      editor.focus();
    }

    /*
     * Gom lại các text node liền nhau.
     */
    editor.normalize();

    /*
     * Đánh dấu nội dung đã thay đổi.
     */
    editor.dispatchEvent(new Event('input', { bubbles: true }));

    return true;
  } catch (error) {
    console.error('[TopicEditor] Lỗi khi chèn HTML tại con trỏ:', error);
    showToast('Không thể chèn nội dung tại vị trí con trỏ', 'error');
    return false;
  }
}

async function goBackToAdmin() {
  // Check if there's unsaved content ONLY if form is dirty
  if (window.isTopicEditorDirty) {
    const shouldLeave =
      typeof window.showAppConfirm === 'function'
        ? await window.showAppConfirm('Bạn có thay đổi chưa lưu. Bạn có chắc muốn thoát?', {
            title: 'Xác nhận thoát',
            confirmText: 'Thoát',
            cancelText: 'Ở lại'
          })
        : confirm('Bạn có thay đổi chưa lưu. Bạn có chắc muốn thoát?');
    if (!shouldLeave) {
      return;
    }
  }

  // Clear form when leaving
  resetForm();

  // Navigate back to Content Management page
  if (typeof showAdminPage === 'function') {
    showAdminPage('page-content-management');
    // Update active nav item
    const navItem = document.querySelector('.admin-sidebar .nav-item[data-page="page-content-management"]');
    if (navItem && typeof setActiveNavItem === 'function') {
      setActiveNavItem(navItem);
    }
  } else {
    // Fallback: try to use hash navigation
    window.location.hash = 'page-content-management';
  }
}

let pendingEditUnlockCondition = null;
let dbCategoriesForPrereq = [];
let topicsForPrereqLoaded = false;
let dbCategoriesLoaded = false;

function parseSavedUnlockCondition(topic) {
  var unlockConditionObj = null;

  if (topic.unlockCondition) {
    try {
      unlockConditionObj = JSON.parse(topic.unlockCondition);
    } catch (e) {
      console.error('[TopicEditor] Failed to parse unlockCondition:', e);
    }
  }

  // Dữ liệu cũ: chỉ có prerequisiteTopics, chưa có unlockCondition JSON
  if (!unlockConditionObj && topic.prerequisiteTopics) {
    var prereqIds = String(topic.prerequisiteTopics)
      .split(',')
      .map(function(id) {
        return id.trim();
      })
      .filter(Boolean);

    if (prereqIds.length > 0) {
      unlockConditionObj = {
        type: 'complete_topic',
        mode: 'all',
        requiredProgress: 100,
        requiredQuizAccuracy: 0,
        prerequisiteTopicIds: prereqIds
      };
    }
  }

  return unlockConditionObj;
}

function applyUnlockConditionToEditForm(unlockConditionObj) {
  var useUnlockCondition = document.getElementById('useUnlockCondition');
  var prereqCategorySelect = document.getElementById('prereqCategory');
  var prereqTopicsSelect = document.getElementById('prerequisiteTopics');

  if (!useUnlockCondition || !prereqCategorySelect || !prereqTopicsSelect) return;

  if (
    !unlockConditionObj ||
    !Array.isArray(unlockConditionObj.prerequisiteTopicIds) ||
    unlockConditionObj.prerequisiteTopicIds.length === 0
  ) {
    useUnlockCondition.checked = false;
    toggleUnlockConditionUI();
    return;
  }

  var prereqId = unlockConditionObj.prerequisiteTopicIds[0];

  var prereqTopic = (allTopicsForPrereq || []).find(function(t) {
    return String(t.topicId) === String(prereqId);
  });

  // Nếu topic list chưa load xong thì lưu lại để apply sau
  if (!prereqTopic) {
    console.warn('[TopicEditor] Chưa tìm thấy bài điều kiện, chờ topics load:', prereqId);
    pendingEditUnlockCondition = unlockConditionObj;
    return;
  }

  useUnlockCondition.checked = true;
  toggleUnlockConditionUI();

  prereqCategorySelect.value = prereqTopic.category || '';
  handlePrereqCategoryChange();

  setTimeout(function() {
    prereqTopicsSelect.value = prereqId;

    var type = unlockConditionObj.type || 'complete_topic';
    var radio = document.querySelector(
      'input[name="unlockConditionType"][value="' + type + '"]'
    );
    if (radio) radio.checked = true;

    updateUnlockPreview();
  }, 0);
}

function normalizeArrayResponse(result, key) {
  if (Array.isArray(result)) return result;
  if (result && Array.isArray(result.data)) return result.data;
  if (result && Array.isArray(result[key])) return result[key];
  return [];
}

function loadAllTopicsForPrereq() {
  if (typeof google === 'undefined' || !google.script || !google.script.run) {
    console.warn('[TopicEditor] google.script.run chưa sẵn sàng');
    return;
  }

  topicsForPrereqLoaded = false;
  dbCategoriesLoaded = false;
  dbCategoriesForPrereq = [];

  google.script.run
    .withSuccessHandler(function(result) {
      allTopicsForPrereq = normalizeArrayResponse(result, 'topics');

      console.log('[TopicEditor] Topics loaded:', allTopicsForPrereq);

      topicsForPrereqLoaded = true;
      checkAndPopulatePrereqCategories();
      handlePrereqCategoryChange();
      renderTopicOrderPreview();
    })
    .withFailureHandler(function(error) {
      console.error('[TopicEditor] Failed to load topics:', error);
      allTopicsForPrereq = [];
      topicsForPrereqLoaded = true;
      checkAndPopulatePrereqCategories();
    })
    .getAllTopicsForAdmin();

  google.script.run
    .withSuccessHandler(function(result) {
      dbCategoriesForPrereq = normalizeArrayResponse(result, 'categories');

      console.log('[TopicEditor] Categories loaded:', dbCategoriesForPrereq);

      dbCategoriesLoaded = true;
      checkAndPopulatePrereqCategories();
    })
    .withFailureHandler(function(error) {
      console.error('[TopicEditor] Failed to load categories:', error);
      dbCategoriesForPrereq = [];
      dbCategoriesLoaded = true;
      checkAndPopulatePrereqCategories();
    })
    .getTopicCategories();
}

function checkAndPopulatePrereqCategories() {
  if (!topicsForPrereqLoaded || !dbCategoriesLoaded) return;

  const topicCategories = (allTopicsForPrereq || [])
    .map(function(t) {
      return String(t.category || '').trim();
    })
    .filter(Boolean);

  const dbCategories = (dbCategoriesForPrereq || [])
    .map(function(cat) {
      return String(cat || '').trim();
    })
    .filter(Boolean);

  const combined = Array.from(new Set(dbCategories.concat(topicCategories))).sort();

  console.log('[TopicEditor] Combined categories:', combined);

  populatePrereqCategories(combined);

  if (pendingEditUnlockCondition) {
    applyUnlockConditionToEditForm(pendingEditUnlockCondition);
    pendingEditUnlockCondition = null;
  }
}

function populatePrereqCategories(uniqueCategories) {
  const select = document.getElementById('prereqCategory');
  
  // 1. Cập nhật datalist cho input Category chính của Topic
  const datalist = document.getElementById('categoryList');
  if (datalist && uniqueCategories && uniqueCategories.length > 0) {
    datalist.innerHTML = '';
    uniqueCategories.forEach(cat => {
      const option = document.createElement('option');
      option.value = cat;
      datalist.appendChild(option);
    });
  }

  // 2. Cập nhật select cho Danh mục điều kiện
  if (!select) return;
  
  const currentValue = select.value;
  
  // Clean recreate the default option to avoid DOM reference duplication issues
  select.innerHTML = '<option value="">-- Không có --</option>';
  
  if (uniqueCategories && uniqueCategories.length > 0) {
    uniqueCategories.forEach(cat => {
      const option = document.createElement('option');
      option.value = cat;
      option.textContent = cat;
      select.appendChild(option);
    });
  }
  
  if (currentValue && uniqueCategories && uniqueCategories.includes(currentValue)) {
    select.value = currentValue;
  }
}

function handlePrereqCategoryChange() {
  const category = document.getElementById('prereqCategory').value;
  const topicSelect = document.getElementById('prerequisiteTopics');
  
  if (!topicSelect) return;
  
  // Reset topic select
  topicSelect.innerHTML = '<option value="">-- Không có --</option>';
  
  if (!category) {
    topicSelect.disabled = true;
    topicSelect.innerHTML = '<option value="">-- Chọn danh mục trước --</option>';
    return;
  }
  
  topicSelect.disabled = false;
  
  const topicsInCategory = allTopicsForPrereq.filter(t => t.category === category && t.topicId !== document.getElementById('topicId').value);
  
  topicsInCategory.forEach(topic => {
    const option = document.createElement('option');
    option.value = topic.topicId;
    option.textContent = topic.title;
    topicSelect.appendChild(option);
  });
  updateUnlockPreview();
}

function toggleUnlockConditionUI() {
  const isChecked = document.getElementById('useUnlockCondition').checked;
  const section = document.getElementById('unlockConditionSection');
  const prereqCategory = document.getElementById('prereqCategory');
  const prereqTopics = document.getElementById('prerequisiteTopics');

  section.style.display = isChecked ? 'block' : 'none';

  if (isChecked) {
    if (!prereqCategory || prereqCategory.options.length <= 1) {
      loadAllTopicsForPrereq();
    }
  } else {
    prereqCategory.value = '';
    prereqTopics.value = '';
    prereqTopics.disabled = true;
  }

  updateUnlockPreview();
}

function updateUnlockPreview() {
  const isChecked = document.getElementById('useUnlockCondition').checked;
  const prereqTopicId = document.getElementById('prerequisiteTopics').value;
  const conditionTypeElement = document.querySelector('input[name="unlockConditionType"]:checked');
  const conditionType = conditionTypeElement ? conditionTypeElement.value : 'complete_topic';
  const previewEl = document.getElementById('unlockPreview');
  
  if (!isChecked) {
    return;
  }
  
  if (!prereqTopicId) {
    previewEl.innerHTML = 'Vui lòng chọn bài học điều kiện.';
    return;
  }
  
  const prereqTopic = allTopicsForPrereq.find(t => t.topicId === prereqTopicId);
  const title = prereqTopic ? prereqTopic.title : prereqTopicId;
  const category = prereqTopic ? prereqTopic.category : '';
  
  let conditionText = 'hoàn thành bài học';
  if (conditionType === 'complete_topic_and_quiz') {
    conditionText = 'hoàn thành bài học và đạt điểm Quiz >= 70%';
  }
  
  previewEl.innerHTML = `Bài học này sẽ mở khóa khi học viên <strong>${conditionText}</strong>: <br><span style="color:#333; margin-top:5px; display:inline-block">"<b>${title}</b>"</span> trong danh mục <span style="color:#333">"<b>${category}</b>"</span>.`;
}

let adminMarkmapObj = null;

const ADMIN_MINDMAP_COLORS = [
  '#2563eb',
  '#16a34a',
  '#d97706',
  '#dc2626',
  '#7c3aed',
  '#0891b2'
];

function getAdminMindmapNodeColor(node) {
  const depth = Number(node && node.depth) || 0;

  return ADMIN_MINDMAP_COLORS[
    depth % ADMIN_MINDMAP_COLORS.length
  ];
}

function showAdminMindmapSection() {
  const section = document.getElementById('adminMindmapSection');
  if (section) section.style.display = 'block';
}

function renderAdminMindmap(markdown) {
  if (!markdown || !markdown.trim()) {
    showToast(
      'Dữ liệu Mindmap đang trống',
      'warning'
    );
    return;
  }

  if (!window.markmap) {
    showToast(
      'Thư viện Markmap chưa tải xong',
      'error'
    );
    return;
  }

  const previewArea = document.getElementById(
    'mindmapPreviewArea'
  );

  const editArea = document.getElementById(
    'mindmapEditArea'
  );

  const saveButton = document.getElementById(
    'btnSaveMindmap'
  );

  const markdownStorage = document.getElementById(
    'mindmapRawMarkdown'
  );

  const svg = document.getElementById(
    'adminMindmapSvg'
  );

  if (!previewArea || !svg) {
    showToast(
      'Không tìm thấy vùng hiển thị Mindmap',
      'error'
    );
    return;
  }

  previewArea.style.display = 'block';

  if (editArea) {
    editArea.style.display = 'block';
  }

  if (saveButton) {
    saveButton.style.display = 'inline-flex';
  }

  if (markdownStorage) {
    markdownStorage.value = markdown;
  }

  const {
    Transformer,
    Markmap,
    loadCSS,
    loadJS
  } = window.markmap;

  try {
    const transformer = new Transformer();

    const transformed = transformer.transform(
      markdown
    );

    const root = transformed.root;
    const features = transformed.features;

    const assets = transformer.getUsedAssets(
      features
    );

    if (assets.styles) {
      loadCSS(assets.styles);
    }

    if (assets.scripts) {
      loadJS(assets.scripts, {
        getMarkmap: function() {
          return window.markmap;
        }
      });
    }

    /*
     * Hủy phiên bản cũ trước khi tạo lại.
     * Tránh nhiều sự kiện zoom/pan chồng lên nhau.
     */
    if (
      adminMarkmapObj &&
      typeof adminMarkmapObj.destroy === 'function'
    ) {
      adminMarkmapObj.destroy();
    }

    svg.replaceChildren();

    adminMarkmapObj = Markmap.create(
      svg,
      {
        /*
         * Không autoFit ngay lập tức vì container vừa
         * chuyển từ display:none sang display:block.
         */
        autoFit: false,

        duration: 350,

        /* Thu phóng và kéo Mindmap */
        zoom: true,
        pan: true,

        /*
         * Hiển thị sẵn đến cấp 3.
         * Các cấp sâu hơn có thể mở bằng nút tròn.
         */
        initialExpandLevel: 3,

        /*
         * false: chỉ đóng/mở nhánh đang chọn,
         * giữ trạng thái của các nhánh con.
         */
        toggleRecursively: false,

        fitRatio: 0.9,
        maxInitialScale: 1.15,

        /* Giới hạn chiều rộng từng nội dung */
        maxWidth: 240,

        nodeMinHeight: 38,
        paddingX: 18,

        /* Tạo khoảng trống cho khung và dây nối */
        spacingHorizontal: 90,
        spacingVertical: 18,

        lineWidth: function(node) {
          return Number(node.depth) <= 1
            ? 3
            : 2;
        },

        color: getAdminMindmapNodeColor
      },
      root
    );

    /*
     * Chờ SVG và foreignObject tính xong kích thước
     * rồi mới căn toàn bộ sơ đồ vào giữa.
     */
    requestAnimationFrame(function() {
      setTimeout(function() {
        decorateAdminMindmap();
        fitMindmap();
      }, 120);
    });
  } catch (error) {
    console.error(
      '[TopicEditor] Render Mindmap error:',
      error
    );

    showToast(
      'Không thể hiển thị Mindmap: ' +
        (error && error.message
          ? error.message
          : 'Lỗi không xác định'),
      'error'
    );
  }
}

function decorateAdminMindmap() {
  const svg = document.getElementById(
    'adminMindmapSvg'
  );

  if (!svg) return;

  const nodeGroups = svg.querySelectorAll(
    'g.markmap-node'
  );

  nodeGroups.forEach(function(group) {
    const nodeData = group.__data__;

    const nodeBox = group.querySelector(
      '.markmap-foreign > div'
    );

    if (!nodeBox || !nodeData) return;

    const depth = Number(nodeData.depth) || 0;

    nodeBox.setAttribute(
      'data-depth',
      String(Math.min(depth, 5))
    );

    const hasChildren =
      Array.isArray(nodeData.children) &&
      nodeData.children.length > 0;

    if (hasChildren) {
      nodeBox.classList.add('has-children');
      nodeBox.title =
        'Bấm nút tròn để thu gọn hoặc mở rộng nhánh';
    }
  });

  /*
   * Làm dây nối rõ hơn nhưng vẫn giữ màu
   * mà Markmap đã gán cho từng nhánh.
   */
  const links = svg.querySelectorAll(
    '.markmap-link'
  );

  links.forEach(function(link) {
    link.style.setProperty(
      'stroke-width',
      '2.25px'
    );

    link.style.setProperty(
      'stroke-opacity',
      '0.82'
    );

    link.style.setProperty(
      'stroke-linecap',
      'round'
    );

    link.style.setProperty(
      'stroke-linejoin',
      'round'
    );
  });
}

function generateMindmap() {
  const topicId = document.getElementById('topicId').value;
  const editor = document.getElementById('contentEditor');
  const content = editor ? editor.innerText.trim() : '';

  if (!content || content.length < 50) {
    showToast(
      'Nội dung bài học quá ngắn để tạo sơ đồ tư duy. Vui lòng soạn thảo bài học trước.',
      'warning'
    );
    return;
  }

  showMindmapLoading(
    'Đang phân tích nội dung và tạo Sơ đồ tư duy bằng AI...'
  );

  google.script.run
    .withSuccessHandler(function(response) {
      hideMindmapLoading();

      if (
        response &&
        response.success &&
        response.mindmapMarkdown
      ) {
        renderAdminMindmap(response.mindmapMarkdown);

        showToast(
          'Tạo sơ đồ tư duy thành công!',
          'success'
        );

        const status = document.getElementById(
          'mindmapStatusText'
        );

        if (status) {
          status.textContent = 'Chưa lưu';
          status.style.color = '#eab308';
        }
      } else {
        showToast(
          response && response.message
            ? response.message
            : 'Không nhận được dữ liệu sơ đồ tư duy hợp lệ',
          'error'
        );
      }
    })
    .withFailureHandler(function(error) {
      hideMindmapLoading();

      showToast(
        'Lỗi kết nối server: ' +
          (error && error.message
            ? error.message
            : 'Không xác định'),
        'error'
      );
    })
    .generateAdminMindmap(topicId, content, null);
}

(function() {
  let scrollAttached = false;
  
  function checkSticky() {
    const toolbar = document.querySelector('.editor-toolbar');
    const editor = document.querySelector('.content-editor');
    const container = document.querySelector('.editor-section');
    if (!toolbar || !editor || !container) return;
    
    if (toolbar.offsetParent === null && !toolbar.classList.contains('js-fixed-toolbar')) return;
    
    const containerRect = container.getBoundingClientRect();
    const title = container.querySelector('.editor-section-title');
    const titleHeight = title ? title.offsetHeight : 0;
    
    // Toolbar should stick when title scrolls out of view
    if (containerRect.top + titleHeight <= 0 && containerRect.bottom > toolbar.offsetHeight + 100) {
      if (!toolbar.classList.contains('js-fixed-toolbar')) {
        toolbar.classList.add('js-fixed-toolbar');
        toolbar.style.position = 'fixed';
        toolbar.style.top = '0px';
        toolbar.style.zIndex = '9999';
        toolbar.style.borderBottom = '2px solid #e0e0e0';
        
        // Prevent content jump by adding margin to editor
        editor.style.marginTop = toolbar.offsetHeight + 'px';
      }
      // Always sync width and left
      toolbar.style.left = containerRect.left + 'px';
      toolbar.style.width = containerRect.width + 'px';
    } else {
      if (toolbar.classList.contains('js-fixed-toolbar')) {
        toolbar.classList.remove('js-fixed-toolbar');
        toolbar.style.position = '';
        toolbar.style.top = '';
        toolbar.style.left = '';
        toolbar.style.width = '';
        toolbar.style.zIndex = '99';
        toolbar.style.borderBottom = '';
        
        // Reset margin
        editor.style.marginTop = '';
      }
    }
  }

  function attachScroll() {
    if (scrollAttached) return;
    window.addEventListener('scroll', checkSticky, { passive: true });
    window.addEventListener('resize', checkSticky, { passive: true });
    const pageContent = document.querySelector('.page-content');
    if (pageContent) pageContent.addEventListener('scroll', checkSticky, { passive: true });
    const adminMain = document.querySelector('.admin-main-content');
    if (adminMain) adminMain.addEventListener('scroll', checkSticky, { passive: true });
    scrollAttached = true;
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attachScroll);
  } else {
    attachScroll();
  }
  
  // Fallback observer for dynamic loading
  const observer = new MutationObserver(() => {
    if (document.querySelector('.editor-toolbar')) {
      attachScroll();
      checkSticky();
    }
  });
  observer.observe(document.body, { childList: true, subtree: true });
})();

</script>
