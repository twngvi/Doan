<script>
function initEmailManagement() {
    loadEmailTemplate();

    // Không còn form HTML nhập tay

    const testBtn = document.getElementById('btnTestEmailTemplate');
    if (testBtn) {
        testBtn.addEventListener('click', function() {
            sendTestEmail();
        });
    }

    const btnFetch = document.getElementById('btnFetchGmailDrafts');
    if (btnFetch) {
        btnFetch.addEventListener('click', fetchGmailDrafts);
    }

    const btnCreateStarter = document.getElementById('btnCreateStarterDraft');
    if (btnCreateStarter) {
        btnCreateStarter.addEventListener('click', createStarterDraft);
    }

    const copyBtns = document.querySelectorAll('.btn-copy-var');
    copyBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            const varToCopy = this.getAttribute('data-var');
            if (varToCopy) {
                navigator.clipboard.writeText(varToCopy).then(() => {
                    showToast('Đã copy: ' + varToCopy, 'success');
                }).catch(err => {
                    showToast('Lỗi copy', 'error');
                });
            }
        });
    });

    const selectDraft = document.getElementById('gmailDraftSelect');
    if (selectDraft) {
        selectDraft.addEventListener('change', function() {
            if (this.value) {
                previewDraft(this.value);
            } else {
                document.getElementById('gmailDraftPreviewContainer').style.display = 'none';
                document.getElementById('gmailDraftActions').style.display = 'none';
            }
        });
    }

    const btnUseDraft = document.getElementById('btnUseGmailDraft');
    if (btnUseDraft) {
        btnUseDraft.addEventListener('click', function() {
            const draftId = document.getElementById('gmailDraftSelect').value;
            if (draftId) saveDraftTemplate(draftId);
        });
    }
}

function loadEmailTemplate() {
    google.script.run
        .withSuccessHandler(function(res) {
            if (res && res.success) {
                const badge = document.getElementById('gmailDraftStatusBadge');
                if (badge) {
                    if (res.source === 'gmail_draft') {
                        badge.textContent = res.fromCache ? 'Đang dùng Cache (Lỗi đồng bộ)' : 'Đang dùng Gmail Draft';
                        badge.style.background = res.fromCache ? '#fce8e6' : '#e6f4ea';
                        badge.style.color = res.fromCache ? '#d93025' : '#137333';
                    } else {
                        badge.textContent = 'Chưa chọn mẫu Gmail';
                        badge.style.background = '#e0e0e0';
                        badge.style.color = '#555';
                    }
                }
            }
        })
        .getStudyReminderEmailTemplate();
}

function sendTestEmail() {
    const btn = document.getElementById('btnTestEmailTemplate');
    const originalText = btn.textContent;
    btn.textContent = 'Đang gửi...';
    btn.disabled = true;

    google.script.run
        .withSuccessHandler(function(res) {
            btn.textContent = originalText;
            btn.disabled = false;
            if (res && res.success) {
                showToast(res.message || 'Đã gửi email test thành công!', 'success');
            } else {
                showToast(res.message || 'Lỗi khi gửi email test', 'error');
            }
        })
        .withFailureHandler(function(err) {
            btn.textContent = originalText;
            btn.disabled = false;
            showToast('Lỗi server: ' + err.message, 'error');
        })
        .testSendStudyReminderEmailToMe();
}

function fetchGmailDrafts() {
    const btn = document.getElementById('btnFetchGmailDrafts');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-sharp" style="font-size: 18px;">sync</span> Đang tải...';
    btn.disabled = true;

    google.script.run
        .withSuccessHandler(function(res) {
            btn.innerHTML = originalText;
            btn.disabled = false;
            if (res && res.success) {
                const select = document.getElementById('gmailDraftSelect');
                select.innerHTML = '<option value="">-- Chọn một bản nháp --</option>';
                if (res.drafts && res.drafts.length > 0) {
                    res.drafts.forEach(function(draft) {
                        const opt = document.createElement('option');
                        opt.value = draft.id;
                        opt.textContent = draft.subject;
                        select.appendChild(opt);
                    });
                    document.getElementById('gmailDraftListContainer').style.display = 'block';
                    showToast('Đã tải danh sách nháp từ Gmail', 'success');
                } else {
                    document.getElementById('gmailDraftListContainer').style.display = 'none';
                    showToast('Không tìm thấy bản nháp nào có tiền tố [TERRACODE_REMINDER]', 'warning');
                }
            } else {
                showToast(res.message || 'Lỗi tải danh sách nháp', 'error');
            }
        })
        .withFailureHandler(function(err) {
            btn.innerHTML = originalText;
            btn.disabled = false;
            showToast('Lỗi server: ' + err.message, 'error');
        })
        .listStudyReminderGmailDrafts();
}

function previewDraft(draftId) {
    const previewContainer = document.getElementById('gmailDraftPreviewContainer');
    const actionsContainer = document.getElementById('gmailDraftActions');
    
    document.getElementById('previewDraftSubject').textContent = 'Đang tải...';
    document.getElementById('previewDraftBody').textContent = 'Vui lòng đợi...';
    previewContainer.style.display = 'block';
    actionsContainer.style.display = 'none';

    google.script.run
        .withSuccessHandler(function(res) {
            if (res && res.success) {
                document.getElementById('previewDraftSubject').textContent = res.subject || '';
                document.getElementById('previewDraftBody').innerHTML = res.body || '';
                actionsContainer.style.display = 'flex';
            } else {
                document.getElementById('previewDraftSubject').textContent = 'Lỗi';
                document.getElementById('previewDraftBody').textContent = res.message || 'Không thể xem trước';
            }
        })
        .withFailureHandler(function(err) {
            document.getElementById('previewDraftSubject').textContent = 'Lỗi';
            document.getElementById('previewDraftBody').textContent = err.message;
        })
        .previewStudyReminderGmailDraft(draftId);
}

function saveDraftTemplate(draftId) {
    const btn = document.getElementById('btnUseGmailDraft');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-sharp" style="font-size: 18px;">save</span> Đang lưu...';
    btn.disabled = true;

    google.script.run
        .withSuccessHandler(function(res) {
            btn.innerHTML = originalText;
            btn.disabled = false;
            if (res && res.success) {
                showToast(res.message || 'Đã lưu mẫu từ Gmail Draft', 'success');
                loadEmailTemplate(); // Reload to update form and badge
            } else {
                showToast(res.message || 'Lỗi khi lưu mẫu', 'error');
            }
        })
        .withFailureHandler(function(err) {
            btn.innerHTML = originalText;
            btn.disabled = false;
            showToast('Lỗi server: ' + err.message, 'error');
        })
        .saveStudyReminderGmailDraftTemplate(draftId);
}

function createStarterDraft() {
    const btn = document.getElementById('btnCreateStarterDraft');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-sharp" style="font-size: 18px;">add_box</span> Đang tạo...';
    btn.disabled = true;

    google.script.run
        .withSuccessHandler(function(res) {
            btn.innerHTML = originalText;
            btn.disabled = false;
            if (res && res.success) {
                showToast(res.message, 'success');
                // Tự động load lại danh sách nháp
                fetchGmailDrafts();
            } else {
                showToast(res.message || 'Lỗi khi tạo thư nháp mẫu', 'error');
            }
        })
        .withFailureHandler(function(err) {
            btn.innerHTML = originalText;
            btn.disabled = false;
            showToast('Lỗi server: ' + err.message, 'error');
        })
        .createStarterGmailDraft();
}
</script>
