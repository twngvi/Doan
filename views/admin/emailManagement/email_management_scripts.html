// ------------------------------
// EVENT DELEGATION
// ------------------------------
function handleDetailClicks(e) {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    
    const action = btn.getAttribute('data-action');

    if (action === 'create-starter-draft') {
        createStarterDraft(btn);
    } else if (action === 'fetch-drafts') {
        fetchGmailDrafts(btn);
    } else if (action === 'use-draft') {
        useDraft(btn);
    } else if (action === 'copy-var') {
        const chip = e.target.closest('.email-var-chip');
        const varToCopy = chip.getAttribute('data-var');
        copyToClipboard(varToCopy);
    } else if (action === 'send-test') {
        sendTestEmail(btn);
    }
}

function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => {
        showToast('Đã chép: ' + text, 'success');
    }).catch(err => {
        showToast('Lỗi copy', 'error');
    });
}

// ------------------------------
// BACKEND INTEGRATION
// ------------------------------
function loadEmailTemplateStatus() {
    google.script.run
        .withSuccessHandler(function(res) {
            if (res && res.success) {
                const badge = document.getElementById('systemCurrentTemplateSource');
                if (badge) {
                    if (res.source === 'gmail_draft') {
                        badge.textContent = 'Nguồn: Mẫu lưu từ Gmail';
                        badge.classList.remove('badge-primary', 'badge-danger', 'badge-warning');
                        badge.classList.add('badge-success');
                    } else {
                        badge.textContent = 'Nguồn: Chưa có template';
                        badge.classList.remove('badge-primary', 'badge-success', 'badge-danger');
                        badge.classList.add('badge-warning');
                    }
                }
            }
        })
        .getStudyReminderEmailTemplate();
}

function createStarterDraft(btn) {
    const originalContent = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-sharp" style="font-size: 18px;">autorenew</span> Đang tạo...';
    btn.disabled = true;

    google.script.run
        .withSuccessHandler(function(res) {
            btn.innerHTML = originalContent;
            btn.disabled = false;
            if (res && res.success) {
                showToast(res.message, 'success');
            } else {
                showToast(res.message || 'Lỗi khi tạo thư nháp mẫu', 'error');
            }
        })
        .withFailureHandler(function(err) {
            btn.innerHTML = originalContent;
            btn.disabled = false;
            showToast('Lỗi server: ' + err.message, 'error');
        })
        .createStarterGmailDraft();
}

function fetchGmailDrafts(btn) {
    const originalContent = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-sharp" style="font-size: 18px;">sync</span> Đang tải...';
    btn.disabled = true;

    google.script.run
        .withSuccessHandler(function(res) {
            btn.innerHTML = originalContent;
            btn.disabled = false;
            if (res && res.success) {
                const select = document.getElementById('gmailDraftSelect');
                const area = document.getElementById('draftSelectorArea');
                const emptyMsg = document.getElementById('draftSelectorEmptyMsg');

                if (select && area && emptyMsg) {
                    select.innerHTML = '<option value="">-- Chọn bản nháp chứa [TERRACODE_REMINDER] --</option>';
                    if (res.drafts && res.drafts.length > 0) {
                        res.drafts.forEach(function(draft) {
                            const opt = document.createElement('option');
                            opt.value = draft.id;
                            opt.textContent = draft.subject;
                            select.appendChild(opt);
                        });
                        area.style.display = 'flex';
                        emptyMsg.style.display = 'none';
                        showToast('Tải danh sách nháp thành công', 'success');

                        // Gọi preview nháp tự động nếu thay đổi
                        select.addEventListener('change', function() {
                            if (this.value) previewDraft(this.value);
                        });
                    } else {
                        area.style.display = 'none';
                        emptyMsg.style.display = 'block';
                        emptyMsg.textContent = 'Trống. Không tìm thấy bản nháp hợp lệ nào trong Gmail!';
                        emptyMsg.style.color = 'var(--email-danger)';
                    }
                }
            } else {
                showToast(res.message || 'Lỗi tải danh sách', 'error');
            }
        })
        .withFailureHandler(function(err) {
            btn.innerHTML = originalContent;
            btn.disabled = false;
            showToast('Lỗi server: ' + err.message, 'error');
        })
        .listStudyReminderGmailDrafts();
}

function previewDraft(draftId) {
    showToast('Đang tải bản xem trước...', 'info');

    google.script.run
        .withSuccessHandler(function(res) {
            if (res && res.success) {
                previewDataCache.subject = res.subject || '';
                previewDataCache.body = res.body || '';
                showToast('Lấy bản xem trước thành công', 'success');
                
                // Cập nhật ngay nếu đang ở tab preview
                if (currentTabId === 'preview') {
                    const subEl = document.getElementById('previewRenderedSubject');
                    const bodEl = document.getElementById('previewRenderedBody');
                    if (subEl) subEl.textContent = previewDataCache.subject;
                    if (bodEl) bodEl.innerHTML = previewDataCache.body;
                }
            } else {
                showToast(res.message || 'Lỗi khi tải xem trước', 'error');
            }
        })
        .previewStudyReminderGmailDraft(draftId);
}

function useDraft(btn) {
    const draftId = document.getElementById('gmailDraftSelect').value;
    if (!draftId) {
        showToast('Chưa chọn bản nháp nào!', 'warning');
        return;
    }

    const originalContent = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-sharp" style="font-size: 18px;">save</span> Đang lưu...';
    btn.disabled = true;

    google.script.run
        .withSuccessHandler(function(res) {
            btn.innerHTML = originalContent;
            btn.disabled = false;
            if (res && res.success) {
                showToast(res.message || 'Lưu làm mẫu chính thức thành công!', 'success');
                loadEmailTemplateStatus(); // Tải lại thẻ trạng thái Nguồn
            } else {
                showToast(res.message || 'Lỗi lưu dữ liệu', 'error');
            }
        })
        .withFailureHandler(function(err) {
            btn.innerHTML = originalContent;
            btn.disabled = false;
            showToast('Lỗi server: ' + err.message, 'error');
        })
        .saveStudyReminderGmailDraftTemplate(draftId);
}

function sendTestEmail(btn) {
    const originalContent = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-sharp" style="font-size: 18px;">send</span> Đang gửi...';
    btn.disabled = true;

    google.script.run
        .withSuccessHandler(function(res) {
            btn.innerHTML = originalContent;
            btn.disabled = false;
            if (res && res.success) {
                showToast(res.message || 'Đã gửi Email Test thành công! Vui lòng check hộp thư.', 'success');
            } else {
                showToast(res.message || 'Gửi lỗi. Vui lòng xem log.', 'error');
            }
        })
        .withFailureHandler(function(err) {
            btn.innerHTML = originalContent;
            btn.disabled = false;
            showToast('Lỗi server: ' + err.message, 'error');
        })
        .testSendStudyReminderEmailToMe();
}
</script>
