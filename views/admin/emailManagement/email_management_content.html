<div class="email-management-container">
    <div class="admin-unified-header mb-4">
        <div class="admin-unified-header-main">
            <div class="admin-unified-header-icon gradient-blue">
                <span class="material-symbols-sharp">mail</span>
            </div>
            <div class="admin-unified-header-text">
                <h1 class="admin-unified-header-title">Quản lý Email Mẫu</h1>
                <p class="admin-unified-header-subtitle">Chỉnh sửa nội dung email nhắc nhở học tập gửi đến người dùng.</p>
            </div>
        </div>
    </div>

    <div class="email-settings-card">
        <h3>Email nhắc nhở học tập</h3>
        <p style="color: var(--theme-text-secondary); margin-bottom: 20px;">
            Hệ thống hỗ trợ các biến sau: <br/>
            <code>{{userName}}</code> - Tên người dùng <br/>
            <code>{{dailyGoal}}</code> - Mục tiêu thời gian học mỗi ngày (phút) <br/>
            <code>{{loginUrl}}</code> - Link đăng nhập vào ứng dụng
        </p>

        <form id="emailTemplateForm">
            <div class="email-form-group">
                <label for="emailSubject">Tiêu đề (Subject):</label>
                <input type="text" id="emailSubject" required placeholder="Nhập tiêu đề email..." />
            </div>
            
            <div class="email-form-group">
                <label for="emailBody">Nội dung (HTML):</label>
                <textarea id="emailBody" required placeholder="Nhập nội dung email HTML..."></textarea>
            </div>

            <button type="submit" class="btn-save-email" id="btnSaveEmailTemplate">
                Lưu Thay Đổi
            </button>
        </form>
    </div>
</div>
