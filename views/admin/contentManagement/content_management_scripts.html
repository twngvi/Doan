<script>
// ===== Content Management Scripts - Enhanced Version =====

// State variables
let allTopics = [];
let allCourses = [];
let filteredTopics = [];
let currentPage = 1;
const itemsPerPage = 10;
let topicToDelete = null;
let currentView = 'table'; // 'table' or 'cards'
let categoriesList = [];
let isDataLoaded = false; // Flag để track data đã load chưa
const TOPICS_DATA_CHANGED_KEY = 'topics_data_changed_at';
let latestTopicsLoadRequestId = 0; // Tránh race condition khi gọi load nhiều lần

let currentCourseFilter = null;

// ===== Initialize =====
function initContentManagement() {

  try {
    const oldClasses = Array.from(document.documentElement.classList).filter(c => c.startsWith('is-') && c.endsWith('-page'));
    if (oldClasses.length > 0) {
      document.documentElement.classList.remove(...oldClasses);
      document.body.classList.remove(...oldClasses);
    }
    document.documentElement.classList.add('is-content-management-page');
    document.body.classList.add('is-content-management-page');
    window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
  } catch(e) { console.error(e); }

  console.log('[ContentManagement] Initializing...');

  // FIX: khi mới vào trang, không để trình duyệt giữ vị trí cuộn cũ
  window.scrollTo({
    top: 0,
    left: 0,
    behavior: 'auto'
  });

  // Khôi phục view preference TRƯỚC KHI load data (chỉ set UI, không render)
  const savedView = localStorage.getItem('cm-view-preference');
  if (savedView && (savedView === 'table' || savedView === 'cards')) {
    currentView = savedView;
    // Chỉ update UI buttons và visibility, không render content
    document.getElementById('view-table-btn').classList.toggle('active', savedView === 'table');
    document.getElementById('view-cards-btn').classList.toggle('active', savedView === 'cards');
    document.getElementById('cm-table-view').style.display = savedView === 'table' ? 'block' : 'none';
    document.getElementById('cm-cards-view').style.display = savedView === 'cards' ? 'block' : 'none';
  }

  // Setup search input events
  const searchInput = document.getElementById('cm-search-input');
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      const clearBtn = document.getElementById('cm-search-clear');
      if (clearBtn) {
        clearBtn.style.display = this.value ? 'flex' : 'none';
      }
    });
  }

  // Load data - sẽ tự render khi load xong
  loadCategories();
  loadCoursesList();
  loadTopicsList();
}

// ===== Load Categories for Filter =====
function loadCategories() {
  google.script.run
    .withSuccessHandler(function(response) {
      const select = document.getElementById('cm-category-filter');
      
      let categories = [];
      if (response && response.success && Array.isArray(response.data)) {
        categories = response.data;
      } else if (Array.isArray(response)) {
        categories = response;
      }

      if (select && categories) {
        categoriesList = categories;
        select.innerHTML = '<option value="">Tất cả danh mục</option>';
        categories.forEach(function(cat) {
          const option = document.createElement('option');
          option.value = cat;
          option.textContent = cat;
          select.appendChild(option);
        });
        updateStats();
      }
    })
    .withFailureHandler(function(error) {
      console.error('[ContentManagement] Failed to load categories:', error);
    })
    .getTopicCategories();
}

// ===== Load Courses List =====
function loadCoursesList() {
  const loading = document.getElementById('cm-courses-loading-state');
  if (loading) {
    loading.style.display = 'block';
  }

  google.script.run
    .withSuccessHandler(function(response) {
      if (!response || response.success !== true) {
        allCourses = [];
        if (typeof showNotification === 'function') {
          showNotification(response ? response.message : 'Không thể tải danh sách khóa học', 'error');
        }
        renderCoursesView();
        return;
      }
      
      allCourses = Array.isArray(response.courses) ? response.courses : [];
      renderCoursesView();
    })
    .withFailureHandler(function(error) {
      console.error('[ContentManagement] Failed to load courses:', error);
      if (loading) {
        loading.style.display = 'none';
      }
      if (typeof showNotification === 'function') {
        showNotification('Lỗi khi tải danh sách khóa học', 'error');
      }
    })
    .getAllCoursesForAdmin();
}

// ===== Load Topics List =====
function loadTopicsList() {
  const requestId = ++latestTopicsLoadRequestId;
  showLoading(true);
  isDataLoaded = false;

  google.script.run
    .withSuccessHandler(function(topics) {
      // Bỏ qua response cũ để không ghi đè data mới hơn
      if (requestId !== latestTopicsLoadRequestId) return;

      const rawTopics = Array.isArray(topics) ? topics : [];
      const topicMap = new Map();

      rawTopics.forEach(function(topic) {
        if (!topic) return;

        const topicId = String(topic.topicId || '').trim();

        // Không tính các dòng không có topicId
        if (!topicId) return;

        // Nếu server trả trùng topicId, chỉ giữ bản ghi cuối cùng
        topicMap.set(topicId, topic);
      });

      allTopics = Array.from(topicMap.values());

      currentPage = 1;
      isDataLoaded = true;

      updateStats();

      const searchInput = document.getElementById('cm-search-input');
      const searchTerm = searchInput
        ? searchInput.value.toLowerCase().trim()
        : '';

      if (currentCourseFilter) {
        applyFilters(searchTerm);
      } else {
        renderCoursesView();
      }

      showLoading(false);

      console.log(
        '[ContentManagement] Raw topics:',
        rawTopics.length,
        '- Valid unique topics:',
        allTopics.length
      );
    })
    .withFailureHandler(function(error) {
      // Bỏ qua lỗi của request cũ
      if (requestId !== latestTopicsLoadRequestId) return;

      console.error('[ContentManagement] Failed to load topics:', error);
      showLoading(false);

      // Giữ nguyên dữ liệu cũ nếu đang có để tránh danh sách "biến mất" khi lỗi tạm thời
      if (allTopics.length > 0) {
        isDataLoaded = true;
        renderContent();
        if (typeof showNotification === 'function') {
          showNotification('Không thể tải lại danh sách từ server. Đang giữ dữ liệu hiện tại.', 'warning');
        }
        return;
      }

      // Chỉ rỗng khi chưa từng có data
      isDataLoaded = true; // Vẫn set true để cho phép hiện empty state
      allTopics = [];
      filteredTopics = [];
      showEmptyState(true);
    })
    .getAllTopicsForAdmin();
}

// ===== Chuẩn hóa trạng thái bài học =====

function cmToBoolean(value) {
  if (value === true || value === 1) return true;

  const normalized = String(value ?? '')
    .trim()
    .toLowerCase();

  return normalized === 'true' ||
    normalized === '1' ||
    normalized === 'yes';
}

function isTopicComplete(topic) {
  return (
    cmToBoolean(topic.hasTheory) &&
    cmToBoolean(topic.hasMindmap) &&
    cmToBoolean(topic.hasQuiz) &&
    cmToBoolean(topic.hasMatching)
  );
}

function getTopicUiStatus(topic) {
  topic = topic || {};

  const publishStatus = String(topic.publishStatus || '')
    .trim()
    .toLowerCase();

  const hasLegacyLockField =
    Object.prototype.hasOwnProperty.call(topic, 'isHidden') ||
    Object.prototype.hasOwnProperty.call(topic, 'isLocked');

  const isHidden =
    cmToBoolean(topic.isHidden) ||
    cmToBoolean(topic.isLocked) ||
    publishStatus === 'hidden' ||
    publishStatus === 'locked';

  if (isHidden) {
    return {
      key: 'locked',
      publishStatus: 'hidden',
      text: 'Đang ẩn',
      icon: 'visibility_off',
      visibleToStudent: false
    };
  }

  if (
    publishStatus === 'published' ||
    publishStatus === 'active' ||
    (!publishStatus && hasLegacyLockField)
  ) {
    return {
      key: 'active',
      publishStatus: 'published',
      text: 'Đang hiển thị',
      icon: 'visibility',
      visibleToStudent: true
    };
  }

  return {
    key: 'draft',
    publishStatus: 'draft',
    text: 'Bản nháp',
    icon: 'edit_note',
    visibleToStudent: false
  };
}

// ===== Update Statistics =====
function updateStats() {
  const totalEl = document.getElementById('stat-total-topics');
  const activeEl = document.getElementById('stat-active-topics');
  const draftEl = document.getElementById('stat-draft-topics');
  const lockedEl = document.getElementById('stat-locked-topics');
  const categoriesEl = document.getElementById('stat-categories');

  const statusCounts = {
    active: 0,
    draft: 0,
    locked: 0
  };

  const topicsToCount = currentCourseFilter 
    ? allTopics.filter(t => String(t.courseId || '').trim() === currentCourseFilter)
    : allTopics;

  topicsToCount.forEach(function(topic) {
    if (topic.title === 'DUMMY_COURSE_HOLDER') return;
    const status = getTopicUiStatus(topic);

    if (Object.prototype.hasOwnProperty.call(statusCounts, status.key)) {
      statusCounts[status.key]++;
    }
  });

  const categorySource = topicsToCount.map(function(topic) {
    return topic.category;
  });

  const normalizedCategories = categorySource
    .map(function(category) {
      return String(category || '').trim().toLowerCase();
    })
    .filter(Boolean);

  const categoryCount = new Set(normalizedCategories).size;

  const validTopicsCount = topicsToCount.filter(t => t.title !== 'DUMMY_COURSE_HOLDER').length;
  cmSetStatNumber(totalEl, validTopicsCount);
  cmSetStatNumber(activeEl, statusCounts.active);
  cmSetStatNumber(draftEl, statusCounts.draft);
  cmSetStatNumber(lockedEl, statusCounts.locked);
  cmSetStatNumber(categoriesEl, categoryCount);
}

function cmSetStatNumber(element, nextValue) {
  if (!element) return;

  const currentValue = Number(element.textContent) || 0;
  const safeNextValue = Number(nextValue) || 0;

  if (currentValue === safeNextValue) {
    element.textContent = safeNextValue;
    return;
  }

  // Tận dụng hàm animateValue đang có sẵn trong file
  animateValue(element, currentValue, safeNextValue, 450);
}

function renderTopicStatusBadgeHtml(topic) {
  const status = getTopicUiStatus(topic);

  const hasTheory = cmToBoolean(topic.hasTheory);
  const hasMindmap = cmToBoolean(topic.hasMindmap);
  const hasQuiz = cmToBoolean(topic.hasQuiz);
  const hasMatching = cmToBoolean(topic.hasMatching);

  const nextActionText =
    status.key === 'locked'
      ? 'Bỏ trạng thái ẩn'
      : 'Ẩn bài học';

  const contentChecks = [
    {
      key: 'LT',
      name: 'Lý thuyết',
      completed: hasTheory
    },
    {
      key: 'MM',
      name: 'Mindmap',
      completed: hasMindmap
    },
    {
      key: 'QZ',
      name: 'Quiz',
      completed: hasQuiz
    },
    {
      key: 'MC',
      name: 'Matching',
      completed: hasMatching
    }
  ];

  const checklistHtml = `
    <div
      class="cm-content-checklist"
      title="Tình trạng nội dung bài học"
      aria-label="Tình trạng nội dung bài học"
    >
      ${contentChecks.map(function(item) {
        const stateClass = item.completed
          ? 'is-complete'
          : 'is-missing';

        const stateText = item.completed
          ? 'Đã có'
          : 'Chưa có';

        return `
          <span
            class="cm-content-check-item ${stateClass}"
            title="${item.name}: ${stateText}"
            aria-label="${item.name}: ${stateText}"
          >
            <span class="cm-content-check-icon">
              ${item.completed ? '✓' : '×'}
            </span>

            <span class="cm-content-check-label">
              ${item.key}
            </span>
          </span>
        `;
      }).join('')}
    </div>
  `;

  return `
    <div class="cm-topic-status-stack">
      <span
        class="status-badge ${status.key} interactive"
        onclick="toggleTopicStatus('${topic.topicId}', event)"
        title="${nextActionText}"
      >
        ${status.text}

        <span class="material-symbols-sharp status-swap-icon">
          swap_horiz
        </span>
      </span>

      ${checklistHtml}
    </div>
  `;
}

function animateValue(element, start, end, duration) {
  if (!element) return;

  const startTime = performance.now();

  function update(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const easeOut = 1 - Math.pow(1 - progress, 3);
    const current = Math.floor(start + (end - start) * easeOut);
    element.textContent = current;

    if (progress < 1) {
      requestAnimationFrame(update);
    }
  }

  requestAnimationFrame(update);
}

// ===== View Toggle =====
function switchView(view, save = true) {
  currentView = view;

  // Update buttons
  const tableBtn = document.getElementById('view-table-btn');
  const cardsBtn = document.getElementById('view-cards-btn');
  const tableView = document.getElementById('cm-table-view');
  const cardsView = document.getElementById('cm-cards-view');

  if (tableBtn) tableBtn.classList.toggle('active', view === 'table');
  if (cardsBtn) cardsBtn.classList.toggle('active', view === 'cards');

  // Toggle views
  if (tableView) tableView.style.display = view === 'table' ? 'block' : 'none';
  if (cardsView) cardsView.style.display = view === 'cards' ? 'block' : 'none';

  // Save preference
  if (save) {
    localStorage.setItem('cm-view-preference', view);
  }

  // Chỉ render nếu đã có data (tránh render empty khi data chưa load)
  if (allTopics.length > 0 || filteredTopics.length > 0) {
    renderContent();
  }
}

// ===== Render Content =====
function renderContent() {
  if (currentView === 'table') {
    renderTopicsTable();
  } else {
    renderTopicsCards();
  }
}

// ===== Render Topics Table =====
function renderTopicsTable() {
  const tbody = document.getElementById('cm-topics-tbody');
  if (!tbody) return;

  // Chỉ hiển thị empty state nếu data đã load xong và thực sự rỗng
  if (filteredTopics.length === 0) {
    tbody.innerHTML = '';
    if (isDataLoaded) {
      showEmptyState(true);
    }
    const pagination = document.getElementById('cm-pagination');
    if (pagination) pagination.style.display = 'none';
    return;
  }

  showEmptyState(false);

  // Calculate pagination
  const totalPages = Math.ceil(filteredTopics.length / itemsPerPage);
  const startIndex = (currentPage - 1) * itemsPerPage;
  const endIndex = Math.min(startIndex + itemsPerPage, filteredTopics.length);
  const pageTopics = filteredTopics.slice(startIndex, endIndex);

  // Render rows with staggered animation
  tbody.innerHTML = pageTopics.map(function(topic, index) {
    const rowNum = startIndex + index + 1;
    const categoryClass = getCategoryClass(topic.category);
    const updatedAt = formatDate(topic.updatedAt);

    return `
      <tr data-topic-id="${topic.topicId}" onclick="openMobileActionModal('${topic.topicId}', event)">
        <td><strong>${rowNum}</strong></td>
        <td>
          <div class="topic-info">
            <div class="topic-icon">
              ${topic.iconUrl
                ? `<img src="${topic.iconUrl}" alt="${topic.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                   <span class="material-symbols-sharp" style="display: none;">article</span>`
                : '<span class="material-symbols-sharp">article</span>'
              }
            </div>
            <div class="topic-details">
              <h4>${escapeHtml(topic.title)}</h4>
              <p title="${escapeHtml(topic.description || '')}">
                ${escapeHtml(topic.description || 'Chưa có mô tả')}
              </p>
            </div>
          </div>
        </td>
        <td>
          <span class="category-badge ${categoryClass}" title="${escapeHtml(topic.category || 'Chưa phân loại')}">
            ${escapeHtml(topic.category || 'Chưa phân loại')}
          </span>
        </td>
        <td>
          ${renderTopicStatusBadgeHtml(topic)}
        </td>
        <td>${updatedAt}</td>
        <td>
          <div class="action-buttons">
            <button class="action-btn view" title="Xem trước" onclick="viewTopic('${topic.topicId}')">
              <span class="material-symbols-sharp">visibility</span>
            </button>
            <button class="action-btn edit" title="Chỉnh sửa" onclick="editTopic('${topic.topicId}')">
              <span class="material-symbols-sharp">edit</span>
            </button>
            <button class="action-btn delete" title="Xóa" onclick="deleteTopic('${topic.topicId}', '${escapeHtml(topic.title).replace(/'/g, "\\'")}')">
              <span class="material-symbols-sharp">delete</span>
            </button>
          </div>
        </td>
      </tr>
    `;
  }).join('');

  // Add animation keyframes if not exists
  if (!document.getElementById('cm-animations')) {
    const style = document.createElement('style');
    style.id = 'cm-animations';
    style.textContent = `
      @keyframes fadeInRow {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes fadeInCard {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
    `;
    document.head.appendChild(style);
  }

  // Render pagination
  renderPagination(totalPages, startIndex + 1, endIndex, filteredTopics.length);
}

// ===== Render Topics Cards =====
function renderTopicsCards() {
  const grid = document.getElementById('cm-cards-grid');
  if (!grid) return;

  // Chỉ hiển thị empty state nếu data đã load xong và thực sự rỗng
  if (filteredTopics.length === 0) {
    grid.innerHTML = '';
    if (isDataLoaded) {
      showEmptyState(true);
    }
    const pagination = document.getElementById('cm-pagination');
    if (pagination) pagination.style.display = 'none';
    return;
  }

  showEmptyState(false);

  // Calculate pagination
  const totalPages = Math.ceil(filteredTopics.length / itemsPerPage);
  const startIndex = (currentPage - 1) * itemsPerPage;
  const endIndex = Math.min(startIndex + itemsPerPage, filteredTopics.length);
  const pageTopics = filteredTopics.slice(startIndex, endIndex);

  // Render cards
  grid.innerHTML = pageTopics.map(function(topic, index) {
    const categoryClass = getCategoryClass(topic.category);
    const updatedAt = formatDate(topic.updatedAt);
    const status = getTopicUiStatus(topic);

    return `
      <div
        class="cm-topic-card is-${status.key}"
        data-topic-id="${topic.topicId}"
        style="--cm-card-delay: ${index * 55}ms"
      >
        <div class="cm-card-header">
          <div class="cm-card-icon">
            ${topic.iconUrl
              ? `<img src="${topic.iconUrl}" alt="${topic.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                 <span class="material-symbols-sharp" style="display: none;">article</span>`
              : '<span class="material-symbols-sharp">article</span>'
            }
          </div>
          <div class="cm-card-title-wrapper">
            <h4 class="cm-card-title" title="${escapeHtml(topic.title)}">${escapeHtml(topic.title)}</h4>
            <p class="cm-card-desc">${escapeHtml(topic.description || 'Chưa có mô tả')}</p>
          </div>
        </div>

        <div class="cm-card-meta">
          <span class="category-badge ${categoryClass}" title="${escapeHtml(topic.category || 'Chưa phân loại')}">
            ${escapeHtml(topic.category || 'Chưa phân loại')}
          </span>
          ${renderTopicStatusBadgeHtml(topic)}
        </div>

        <div class="cm-card-footer">
          <span class="cm-card-date">
            <span class="material-symbols-sharp">update</span>
            ${updatedAt}
          </span>
          <div class="action-buttons">
            <button class="action-btn view" title="Xem trước" onclick="viewTopic('${topic.topicId}')">
              <span class="material-symbols-sharp">visibility</span>
            </button>
            <button class="action-btn edit" title="Chỉnh sửa" onclick="editTopic('${topic.topicId}')">
              <span class="material-symbols-sharp">edit</span>
            </button>
            <button class="action-btn delete" title="Xóa" onclick="deleteTopic('${topic.topicId}', '${escapeHtml(topic.title).replace(/'/g, "\\'")}')">
              <span class="material-symbols-sharp">delete</span>
            </button>
          </div>
        </div>
      </div>
    `;
  }).join('');

  // Render pagination
  renderPagination(totalPages, startIndex + 1, endIndex, filteredTopics.length);
}

// ===== Pagination =====
function renderPagination(totalPages, start, end, total) {
  const pagination = document.getElementById('cm-pagination');
  const controls = document.getElementById('cm-pagination-controls');

  if (total <= itemsPerPage) {
    pagination.style.display = 'none';
    return;
  }

  pagination.style.display = 'flex';
  document.getElementById('cm-showing-start').textContent = start;
  document.getElementById('cm-showing-end').textContent = end;
  document.getElementById('cm-total-count').textContent = total;

  let html = '';

  // Previous button
  html += `
    <button class="cm-page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">
      <span class="material-symbols-sharp">chevron_left</span>
    </button>
  `;

  // Page numbers
  const maxVisiblePages = window.innerWidth <= 600 ? 3 : 5;
  let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
  let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

  if (endPage - startPage < maxVisiblePages - 1) {
    startPage = Math.max(1, endPage - maxVisiblePages + 1);
  }

  if (startPage > 1) {
    html += `<button class="cm-page-btn" onclick="goToPage(1)">1</button>`;
    if (startPage > 2) {
      html += `<span style="padding: 0 8px; color: var(--text-muted);">...</span>`;
    }
  }

  for (let i = startPage; i <= endPage; i++) {
    html += `
      <button class="cm-page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">
        ${i}
      </button>
    `;
  }

  if (endPage < totalPages) {
    if (endPage < totalPages - 1) {
      html += `<span style="padding: 0 8px; color: var(--text-muted);">...</span>`;
    }
    html += `<button class="cm-page-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`;
  }

  // Next button
  html += `
    <button class="cm-page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">
      <span class="material-symbols-sharp">chevron_right</span>
    </button>
  `;

  controls.innerHTML = html;
}

function goToPage(page) {
  currentPage = page;
  renderContent();
  // Smooth scroll to top of content
  const wrapper = document.querySelector('.cm-content-wrapper, .cm-cards-container');
  if (wrapper) {
    wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

// ===== Search & Filter =====
function handleSearchTopics() {
  const searchTerm = document.getElementById('cm-search-input').value.toLowerCase().trim();
  applyFilters(searchTerm);
}

function handleFilterChange() {
  const searchTerm = document.getElementById('cm-search-input').value.toLowerCase().trim();
  applyFilters(searchTerm);
}

function clearSearch() {
  const input = document.getElementById('cm-search-input');
  input.value = '';
  document.getElementById('cm-search-clear').style.display = 'none';
  applyFilters('');
}

function applyFilters(searchTerm) {
  const categoryEl = document.getElementById('cm-category-filter');
  const statusEl = document.getElementById('cm-status-filter');

  const categoryFilter = categoryEl ? categoryEl.value : '';
  const statusFilter = statusEl ? statusEl.value : '';

  filteredTopics = allTopics.filter(function(topic) {
    const title = String(topic.title || '').toLowerCase();
    const topicId = String(topic.topicId || '').toLowerCase();
    const description = String(topic.description || '').toLowerCase();

    const matchesSearch =
      !searchTerm ||
      title.includes(searchTerm) ||
      topicId.includes(searchTerm) ||
      description.includes(searchTerm);

    const matchesCategory =
      !categoryFilter ||
      String(topic.category || '').trim() === categoryFilter;

    const topicStatus = getTopicUiStatus(topic);

    const matchesStatus =
      !statusFilter ||
      topicStatus.key === statusFilter;
      
    const matchesCourse = 
      !currentCourseFilter || 
      String(topic.courseId || '').trim() === currentCourseFilter;
      
    const notDummy = topic.title !== 'DUMMY_COURSE_HOLDER';

    return matchesSearch && matchesCategory && matchesStatus && matchesCourse && notDummy;
  });

  filteredTopics.sort(function(a, b) {
    const orderA = Number(a.order) || 999;
    const orderB = Number(b.order) || 999;

    if (orderA !== orderB) {
      return orderA - orderB;
    }

    return String(a.title || '').localeCompare(
      String(b.title || ''),
      'vi'
    );
  });

  currentPage = 1;
  renderContent();
}

let statusToggleTopicId = null;

// Giá trị gửi về updateTopicLockStatus:
// true = ẩn, false = bỏ ẩn
let statusToggleNewStatus = null;

let statusToggleNextKey = null;
let statusToggleConfirmLabel = 'Xác nhận';

function renderStatusPreviewBadge(status) {

function toggleTopicStatus(topicId, event) {
  if (event) {
    event.stopPropagation();
  }

  const topic = allTopics.find(function(item) {
    return String(item.topicId) === String(topicId);
  });

  if (!topic) {
    if (typeof showNotification === 'function') {
      showNotification('Không tìm thấy thông tin bài học', 'error');
    }
    return;
  }

  const currentStatus = getTopicUiStatus(topic);

  /*
   * Nếu đang ẩn thì bỏ ẩn.
   * Nếu đang hiển thị hoặc đang nháp thì chuyển sang ẩn.
   */
  const newHidden = currentStatus.key !== 'locked';

  let nextStatus;

  if (newHidden) {
    nextStatus = {
      key: 'locked',
      publishStatus: 'hidden',
      text: 'Đang ẩn',
      icon: 'visibility_off'
    };
  } else if (isTopicComplete(topic)) {
    nextStatus = {
      key: 'active',
      publishStatus: 'published',
      text: 'Đang hiển thị',
      icon: 'visibility'
    };
  } else {
    nextStatus = {
      key: 'draft',
      publishStatus: 'draft',
      text: 'Bản nháp',
      icon: 'edit_note'
    };
  }

  statusToggleTopicId = topicId;
  statusToggleNewStatus = newHidden;
  statusToggleNextKey = nextStatus.key;

  if (newHidden) {
    statusToggleConfirmLabel = 'Ẩn bài học';
  } else if (nextStatus.key === 'active') {
    statusToggleConfirmLabel = 'Bật hiển thị';
  } else {
    statusToggleConfirmLabel = 'Bỏ trạng thái ẩn';
  }

  const modal = document.getElementById('cm-status-modal');
  const headingEl = document.getElementById('status-modal-heading');
  const descEl = document.getElementById('status-modal-desc');
  const titleEl = document.getElementById('status-topic-title');
  const currentBadgeEl = document.getElementById('status-current-badge');
  const newBadgeEl = document.getElementById('status-new-badge');
  const iconEl = document.getElementById('status-modal-icon');
  const iconWrapEl = document.getElementById('status-modal-icon-wrap');
  const noteEl = document.getElementById('status-modal-note');

  if (headingEl) {
    if (newHidden) {
      headingEl.textContent = 'Ẩn bài học khỏi học viên';
    } else if (nextStatus.key === 'active') {
      headingEl.textContent = 'Bật hiển thị bài học';
    } else {
      headingEl.textContent = 'Bỏ trạng thái ẩn';
    }
  }

  if (descEl) {
    descEl.textContent =
      'Kiểm tra thay đổi bên dưới trước khi xác nhận. Nội dung bài học sẽ không bị xóa.';
  }

  if (titleEl) {
    titleEl.textContent = topic.title || 'Bài học chưa xác định';
  }

  if (currentBadgeEl) {
    currentBadgeEl.innerHTML =
      renderStatusPreviewBadge(currentStatus);
  }

  if (newBadgeEl) {
    newBadgeEl.innerHTML =
      renderStatusPreviewBadge(nextStatus);
  }

  if (iconEl) {
    iconEl.textContent = nextStatus.icon;
  }

  if (iconWrapEl) {
    iconWrapEl.classList.toggle(
      'is-locking',
      nextStatus.key === 'locked'
    );

    iconWrapEl.classList.toggle(
      'is-unlocking',
      nextStatus.key !== 'locked'
    );
  }

  if (noteEl) {
    if (nextStatus.key === 'locked') {
      noteEl.textContent =
        'Sau khi xác nhận, học viên sẽ không còn nhìn thấy bài học này. Admin vẫn có thể xem, chỉnh sửa và bật lại bất cứ lúc nào.';
    } else if (nextStatus.key === 'active') {
      noteEl.textContent =
        'Bài học đã đủ Lý thuyết, Mindmap, Quiz và Matching nên sẽ hiển thị ngay cho học viên.';
    } else {
      noteEl.textContent =
        'Bài học sẽ được bỏ trạng thái ẩn nhưng vẫn ở Bản nháp vì chưa đủ 4 nội dung bắt buộc. Học viên chưa thể nhìn thấy bài học.';
    }

    noteEl.classList.toggle(
      'danger',
      nextStatus.key === 'locked'
    );

    noteEl.classList.toggle(
      'success',
      nextStatus.key !== 'locked'
    );
  }

  setStatusConfirmLoading(false);

  if (modal) {
    modal.style.display = 'flex';
  }
}

  if (!statusToggleTopicId) return;

  const topicId = statusToggleTopicId;
  const newStatus = statusToggleNewStatus;
  const nextKey = statusToggleNextKey;

  setStatusConfirmLoading(true);

  google.script.run
    .withSuccessHandler(function(response) {
      if (response && response.success) {
        const topic = allTopics.find(function(t) {
          return t.topicId === topicId;
        });

        if (topic) {
          // Đồng bộ cả tên cũ và tên mới
          topic.isHidden = newStatus;
          topic.isLocked = newStatus;

          if (nextKey === 'active') {
            topic.publishStatus = 'published';
          } else if (nextKey === 'locked') {
            topic.publishStatus = 'hidden';
          } else {
            topic.publishStatus = 'draft';
          }
        }

        handleFilterChange();
        updateStats();
        closeStatusModal();

        let successMessage = 'Cập nhật trạng thái thành công';

        if (nextKey === 'active') {
          successMessage = 'Bài học đã được hiển thị cho học viên';
        } else if (nextKey === 'locked') {
          successMessage = 'Bài học đã được ẩn khỏi học viên';
        } else if (nextKey === 'draft') {
          successMessage =
            'Đã bỏ trạng thái ẩn. Bài học vẫn ở Bản nháp vì chưa đủ nội dung';
        }

        if (typeof showNotification === 'function') {
          showNotification(
            response.message || successMessage,
            'success'
          );
        }
      } else {
        setStatusConfirmLoading(false);

        const message = response && response.message
          ? response.message
          : 'Không thể cập nhật trạng thái';

        if (typeof showNotification === 'function') {
          showNotification('Lỗi: ' + message, 'error');
        } else {
          alert('Lỗi: ' + message);
        }
      }
    })
    .withFailureHandler(function(error) {
      setStatusConfirmLoading(false);

      const message = error && error.message
        ? error.message
        : 'Không thể kết nối server';

      if (typeof showNotification === 'function') {
        showNotification('Lỗi kết nối: ' + message, 'error');
      } else {
        alert('Lỗi kết nối: ' + message);

/**
 * Strip inline styles from HTML (color, background, font-family, margins, line-height)
 * Prevents Google Doc inline styles from overriding uniform paragraph spacing
 */
function stripInlineStyles(html) {
  const temp = document.createElement('div');
  temp.innerHTML = html;
  const elements = temp.querySelectorAll('[style]');
  elements.forEach(el => {
    const isListElement = el.tagName === "UL" || el.tagName === "OL" || el.tagName === "LI";
    const style = el.getAttribute("style") || "";

    const allowedProps = ["text-align", "width", "height", "max-width"];
    if (isListElement) {
      allowedProps.push("list-style-type", "list-style", "padding-left", "margin-left");
    }

    const newStyle = allowedProps
      .map(prop => {
        const match = style.match(new RegExp(`${prop}\\s*:\\s*[^;]+`, "i"));
        return match ? match[0] : null;
      })
      .filter(Boolean)
      .join("; ");

    if (newStyle) {
      el.setAttribute("style", newStyle);
    } else {
      el.removeAttribute("style");
    }
  });
  return temp.innerHTML;
}

/**
 * Enhance Admin Preview content to match exact User side formatting
 */
function enhanceAdminPreviewContent(container) {
  if (!container) return;

  // 1. Format bullet & numbering lists from Google Doc paragraphs (<p> starting with •, -, 1., etc.)
  formatAdminPreviewBullets(container);

  // 1.5 Normalize empty paragraphs (spacers) identical to User side
  const headingsAndParagraphs = container.querySelectorAll("h1, h2, h3, h4, h5, h6, p");
  headingsAndParagraphs.forEach((el) => {
    el.innerHTML = el.innerHTML
      .replace(/\s+/g, " ")
      .trim();
  });

  const paragraphs = container.querySelectorAll("p");
  paragraphs.forEach((p) => {
    if (!p.textContent.trim() && !p.querySelector("img")) {
      p.classList.add("spacer");
    }
  });

  // 2. Enhance Code Blocks (VS Code style wrapper with copy button)
  const preElements = container.querySelectorAll('pre');
  preElements.forEach(pre => {
    if (pre.closest('.code-block-wrapper') || pre.closest('.terminal-block')) return;
    const codeEl = pre.querySelector('code') || pre;
    const codeText = codeEl.textContent || '';
    if (!codeText.trim()) return;

    let language = 'CODE';
    const classList = (codeEl.className || '') + ' ' + (pre.className || '');
    const match = classList.match(/language-(\w+)/i);
    if (match && match[1]) {
      language = match[1].toUpperCase();
    } else if (codeText.includes('function') || codeText.includes('const ') || codeText.includes('let ')) {
      language = 'JAVASCRIPT';
    } else if (codeText.includes('def ') || codeText.includes('import ') || codeText.includes('print(')) {
      language = 'PYTHON';
    } else if (codeText.includes('<div') || codeText.includes('<html')) {
      language = 'HTML';
    }

    const wrapper = document.createElement('div');
    wrapper.className = 'code-block-wrapper';
    wrapper.innerHTML = `
      <div class="code-block-header">
        <span class="code-block-lang">${language}</span>
        <button class="btn-copy-code" onclick="copyAdminPreviewCode(this)">
          Sao chép
        </button>
      </div>
      <pre><code>${escapeHtmlAdminPreview(codeText.trim())}</code></pre>
    `;
    pre.parentNode.replaceChild(wrapper, pre);
  });

  // 3. Enhance Blockquotes with emojis into Callouts
  const blockquotes = container.querySelectorAll('blockquote');
  blockquotes.forEach(bq => {
    const text = bq.textContent || '';
    let calloutClass = null;
    if (text.includes('💡')) calloutClass = 'callout-tip';
    else if (text.includes('⚠️')) calloutClass = 'callout-warning';
    else if (text.includes('📝')) calloutClass = 'callout-note';
    else if (text.includes('🎯')) calloutClass = 'callout-checkpoint';
    else if (text.includes('✏️')) calloutClass = 'callout-task';

    if (calloutClass) {
      const div = document.createElement('div');
      div.className = calloutClass;
      div.innerHTML = bq.innerHTML;
      bq.parentNode.replaceChild(div, bq);
    }
  });

  // 4. Enhance Tables
  const tables = container.querySelectorAll('table');
  tables.forEach(tbl => {
    tbl.style.width = '100%';
    tbl.style.borderCollapse = 'collapse';
    tbl.style.margin = '1.5rem 0';
  });
}

function formatAdminPreviewBullets(container) {
  const BULLET_CHARS = ['•', '●', '▪', '■', '-', '–', '—', '*'];
  const NUMBER_REGEX = /^(\d+)[\.\)]\s+(.+)$/;
  const children = Array.from(container.children);
  let listBuffer = [];
  let bufferType = null;

  function flushListBuffer() {
    if (listBuffer.length === 0) return;
    const listTag = bufferType === 'number' ? 'ol' : 'ul';
    const listEl = document.createElement(listTag);
    listEl.className = 'doc-formatted-list ' + (bufferType === 'number' ? 'doc-number-list' : 'doc-bullet-list');

    listBuffer.forEach(function(item) {
      const li = document.createElement('li');
      li.innerHTML = item.content;
      if (item.indent > 1) {
        li.classList.add('doc-indent-' + Math.min(item.indent, 3));
      }
      listEl.appendChild(li);
    });

    listBuffer[0].element.parentNode.insertBefore(listEl, listBuffer[0].element);
    listBuffer.forEach(function(item) { item.element.remove(); });
    listBuffer = [];
    bufferType = null;
  }

  children.forEach(function(el) {
    if (el.tagName !== 'P') {
      flushListBuffer();
      return;
    }
    const text = el.textContent.trim();
    if (!text) {
      flushListBuffer();
      return;
    }

    const numMatch = text.match(NUMBER_REGEX);
    if (numMatch) {
      if (bufferType && bufferType !== 'number') flushListBuffer();
      bufferType = 'number';
      let content = el.innerHTML.replace(/^(\d+)[\.\)]\s+/, '').trim();
      listBuffer.push({ element: el, content: content, indent: 1 });
      return;
    }

    const firstChar = text.charAt(0);
    if (BULLET_CHARS.includes(firstChar)) {
      if (bufferType && bufferType !== 'bullet') flushListBuffer();
      bufferType = 'bullet';
      let content = el.innerHTML.replace(/^[•●▪■\-–—*\s]+/, '').trim();
      listBuffer.push({ element: el, content: content, indent: 1 });
      return;
    }

    flushListBuffer();
  });
  flushListBuffer();

  // ⭐ Normalize ANY existing or new lists in preview so bullets always display clearly
  const allLists = container.querySelectorAll('ul, ol');
  allLists.forEach(function(list) {
    if (list.tagName === 'UL') {
      list.classList.add('doc-formatted-list', 'doc-bullet-list');
      list.style.setProperty('list-style-type', 'disc', 'important');
    } else {
      list.classList.add('doc-formatted-list', 'doc-number-list');
      list.style.setProperty('list-style-type', 'decimal', 'important');
    }
    list.style.setProperty('padding-left', '1.5rem', 'important');
    list.style.setProperty('margin-left', '1.5rem', 'important');
    list.style.setProperty('margin-bottom', '1rem', 'important');
  });

  const allItems = container.querySelectorAll('li');
  allItems.forEach(function(li) {
    li.style.setProperty('list-style-position', 'outside', 'important');
  });
}

function escapeHtmlAdminPreview(str) {

/**
 * Render block markers into client-matching HTML
 * High-fidelity rendering matching the topic editor preview
 */
function renderBlockMarkersAsClient(html) {
  let result = html;
  
  // Basic normalization
  result = result.replace(/&#91;/g, '[').replace(/&#93;/g, ']');
  result = result.replace(/&lbrack;/g, '[').replace(/&rbrack;/g, ']');
  result = result.replace(/\[\[\s+/g, '[[').replace(/\s+\]\]/g, ']]');

  function findInnermostBlock(text) {
    let bestMatch = null;
    let bestIndex = -1;
    const openingRegex = /\[\[(NOTE|TIP|WARNING|HIGHLIGHT|EXAMPLE|CHECKPOINT|TASK|QA|RESOURCES|TERMINAL(?::\w*)?|GRID|CMD|OUTPUT|CODE:\w+|FIGURE:[^\]]*|COLOR:\w+)\]\]/gi;
    let match;
    while ((match = openingRegex.exec(text)) !== null) {
      const openTag = match[0];
      const openIndex = match.index;
      const tagInfo = match[1];
      const tagType = tagInfo.split(':')[0].toUpperCase();
      const closeRegex = new RegExp('\\[\\[\\/' + tagType + '\\]\\]', 'gi');
      closeRegex.lastIndex = openIndex + openTag.length;
      const closeMatch = closeRegex.exec(text);
      if (closeMatch) {
        const closeIndex = closeMatch.index;
        const content = text.substring(openIndex + openTag.length, closeIndex);
        const hasNested = /\[\[(NOTE|TIP|WARNING|HIGHLIGHT|EXAMPLE|CHECKPOINT|TASK|QA|RESOURCES|TERMINAL(?::\w*)?|GRID|CMD|OUTPUT|CODE:\w+|FIGURE:[^\]]*|COLOR:\w+)\]\]/i.test(content);
        if (!hasNested) {
          if (bestMatch === null || openIndex < bestIndex) {
            bestMatch = {
              fullMatch: text.substring(openIndex, closeIndex + closeMatch[0].length),
              openTag, closeTag: closeMatch[0], tagInfo, tagType, content,
              startIndex: openIndex, endIndex: closeIndex + closeMatch[0].length
            };
            bestIndex = openIndex;
          }
        }
      }
    }
    return bestMatch;
  }

  function renderSingleBlock(blockInfo) {
    const { tagType, tagInfo, content } = blockInfo;

    if (tagType === 'COLOR') {
      const color = tagInfo.split(':')[1] || 'BLUE';
      const colorMap = {
        ORANGE: 'lesson-section-orange', RED: 'lesson-section-red',
        BLUE: 'lesson-section-blue', GREEN: 'lesson-section-green',
        PURPLE: 'lesson-section-purple', CYAN: 'lesson-section-cyan'
      };
      const className = colorMap[color.toUpperCase()] || 'lesson-section-blue';
      return '<div class="' + className + '">' + content + '</div>';
    }

    if (tagType === 'CODE') {
      const lang = tagInfo.split(':')[1] || 'TEXT';
      let cleanCode = content
        .trim()
        .replace(/<\/p>/gi, '\n').replace(/<br\s*\/?>/gi, '\n').replace(/<\/div>/gi, '\n')
        .replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ')
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
        .replace(/^\n+|\n+$/g, '');
      return '<div class="code-block-wrapper">' +
        '<div class="code-block-header">' +
          '<span class="code-block-lang">' + lang.toUpperCase() + '</span>' +
          '<div class="code-block-actions">' +
            '<button class="btn-copy-code" onclick="copyPreviewCode(this)">📋 Copy</button>' +
          '</div>' +
        '</div>' +
        '<pre><code class="language-' + lang.toLowerCase() + '">' + escapeHtml(cleanCode) + '</code></pre>' +
      '</div>';
    }

    if (tagType === 'EXAMPLE') {
      return '<div class="example-block">' + content + '</div>';
    }

    var calloutTypes = {
      'NOTE': 'callout-note', 'TIP': 'callout-tip', 'WARNING': 'callout-warning',
      'CHECKPOINT': 'callout-checkpoint', 'TASK': 'callout-task',
      'QA': 'callout-qa', 'HIGHLIGHT': 'callout-highlight'
    };
    if (calloutTypes[tagType]) {
      return '<div class="' + calloutTypes[tagType] + '">' + content + '</div>';
    }

    if (tagType === 'RESOURCES') {
      return '<div class="resource-links">' + content + '</div>';
    }

    if (tagType === 'FIGURE') {
      const caption = tagInfo.split(':').slice(1).join(':') || '';
      return '<figure>' + content + '<figcaption>' + caption + '</figcaption></figure>';
    }

    if (tagType === 'GRID') {
      return '<div class="grid-cards-section">' + content + '</div>';
    }

    if (tagType === 'TERMINAL') {
      let cleanContent = content
        .trim()
        .replace(/<\/p>/gi, '\n').replace(/<br\s*\/?>/gi, '\n').replace(/<\/div>/gi, '\n')
        .replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ')
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
        .replace(/^\n+|\n+$/g, '');
      return '<div class="terminal-block">' +
        '<div class="terminal-header">' +
          '<div class="terminal-dots"><span class="terminal-dot red"></span><span class="terminal-dot yellow"></span><span class="terminal-dot green"></span></div>' +
          '<span class="terminal-title">Terminal</span>' +
        '</div>' +
        '<pre class="terminal-body"><code>' + escapeHtml(cleanContent) + '</code></pre>' +
      '</div>';
    }

    if (tagType === 'CMD') {
      let cleanContent = content
        .trim()
        .replace(/<\/p>/gi, '\n').replace(/<br\s*\/?>/gi, '\n').replace(/<\/div>/gi, '\n')
        .replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ')
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
        .replace(/^\n+|\n+$/g, '');
      return '<div class="cmd-block"><pre class="cmd-body"><code>' + escapeHtml(cleanContent) + '</code></pre></div>';
    }

    if (tagType === 'OUTPUT') {
      let cleanContent = content
        .trim()
        .replace(/<\/p>/gi, '\n').replace(/<br\s*\/?>/gi, '\n').replace(/<\/div>/gi, '\n')
        .replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ')
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
        .replace(/^\n+|\n+$/g, '');
      return '<div class="output-block"><pre class="output-body"><code>' + escapeHtml(cleanContent) + '</code></pre></div>';
    }

    return content;
  }

  let maxIterations = 200;
  let iterations = 0;
  while (iterations < maxIterations) {
    const innermostBlock = findInnermostBlock(result);
    if (!innermostBlock) break;
    const renderedHtml = renderSingleBlock(innermostBlock);
    result = result.substring(0, innermostBlock.startIndex) + renderedHtml + result.substring(innermostBlock.endIndex);
    iterations++;
  }

  return result;
}

/**
 * Copy code from preview block
 */
function copyPreviewCode(btn) {
  const wrapper = btn.closest('.code-block-wrapper, .terminal-block');
  const codeEl = wrapper.querySelector('code');
  const text = codeEl.textContent;

  navigator.clipboard.writeText(text).then(() => {
    const originalContent = btn.innerHTML;
    btn.innerHTML = '✅ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = originalContent;
      btn.classList.remove('copied');
    }, 2000);
  });
}

// ===== Mobile Action Modal =====
function openMobileActionModal(topicId, event) {
  // Only trigger on mobile/tablet widths
  if (window.innerWidth > 768) return;
  
  // Don't trigger if they clicked an action button directly
  if (event && event.target.closest('.action-buttons')) return;

  const topic = allTopics.find(function(t) { return t.topicId === topicId; });
  if (!topic) return;

  const status = getTopicUiStatus(topic);
  const statusClass = status.key;
  const statusText = status.text;
  
  document.getElementById('mobile-action-category').textContent = topic.category || 'Chưa phân loại';
  document.getElementById('mobile-action-status').innerHTML = `<span class="status-badge ${statusClass}" style="margin:0; padding:4px 8px; font-size:11px;">${statusText}</span>`;
  document.getElementById('mobile-action-date').textContent = formatDate(topic.updatedAt);

  // Setup buttons
  const btnView = document.getElementById('mobile-action-btn-view');
  const btnEdit = document.getElementById('mobile-action-btn-edit');
  const btnDelete = document.getElementById('mobile-action-btn-delete');
  
  // Clean old event listeners by cloning
  const newBtnView = btnView.cloneNode(true);
  const newBtnEdit = btnEdit.cloneNode(true);
  const newBtnDelete = btnDelete.cloneNode(true);
  
  btnView.parentNode.replaceChild(newBtnView, btnView);
  btnEdit.parentNode.replaceChild(newBtnEdit, btnEdit);
  btnDelete.parentNode.replaceChild(newBtnDelete, btnDelete);

  newBtnView.addEventListener('click', () => { closeMobileActionModal(); viewTopic(topicId); });
  newBtnEdit.addEventListener('click', () => { closeMobileActionModal(); editTopic(topicId); });
  newBtnDelete.addEventListener('click', () => { 
    closeMobileActionModal(); 
    deleteTopic(topicId, topic.title); 
  });

  document.getElementById('cm-mobile-action-modal').style.display = 'flex';
}

function closeMobileActionModal() {
  document.getElementById('cm-mobile-action-modal').style.display = 'none';
}

function confirmDeleteTopic() {
  if (!topicToDelete) return;
  const deletingTopicId = topicToDelete;

  const deleteBtn = document.querySelector('.cm-btn-danger');
  const originalBtnHtml = deleteBtn.innerHTML;
  deleteBtn.disabled = true;
  deleteBtn.innerHTML = '<span class="material-symbols-sharp">hourglass_empty</span> Đang xóa...';

  // Gọi API xóa topic và document
  google.script.run
    .withSuccessHandler(function(result) {
      deleteBtn.disabled = false;
      deleteBtn.innerHTML = originalBtnHtml;
      closeDeleteModal();

      if (result && result.success) {
        // Đồng bộ cache giữa các page để buộc Topics page reload từ DB
        markTopicsDataChanged();
        if (window.globalTopicsCache) {
          window.globalTopicsCache.data = null;
          window.globalTopicsCache.progress = null;
          window.globalTopicsCache.lastLoadTime = 0;
        }

        // Reload lại data từ server để UI luôn khớp DB
        loadTopicsList();
        loadCoursesList();

        // Hiển thị thông báo thành công
        if (typeof showNotification === 'function') {
          showNotification(result.message || 'Đã xóa bài học thành công!', 'success');
        } else {
          alert(result.message || 'Đã xóa bài học thành công!');
        }

        // Log nếu doc cũng bị xóa
        if (result.docDeleted) {
          console.log('[ContentManagement] Document cũng đã được chuyển vào thùng rác');
        }
      } else {
        // Hiển thị lỗi
        if (typeof showNotification === 'function') {
          showNotification(result?.message || 'Không thể xóa bài học', 'error');
        } else {
          alert(result?.message || 'Không thể xóa bài học');
        }
      }

      topicToDelete = null;
    })
    .withFailureHandler(function(error) {
      deleteBtn.disabled = false;
      deleteBtn.innerHTML = originalBtnHtml;
      closeDeleteModal();

      console.error('[ContentManagement] Delete failed:', error);
      if (typeof showNotification === 'function') {
        showNotification('Lỗi khi xóa bài học: ' + (error?.message || error), 'error');
      } else {
        alert('Lỗi khi xóa bài học: ' + (error?.message || error));
      }

      topicToDelete = null;
    })
    .deleteTopicWithDoc(deletingTopicId);
}

function getCategoryClass(category) {
  if (!category) return '';
  const lowerCat = category.toLowerCase();
  if (lowerCat.includes('javascript') || lowerCat.includes('js')) return 'javascript';
  if (lowerCat.includes('python')) return 'python';
  if (lowerCat.includes('html') || lowerCat.includes('css')) return 'html-css';
  return '';
}

function formatDate(dateStr) {
  if (!dateStr) return '-';
  try {
    const date = new Date(dateStr);
    return date.toLocaleDateString('vi-VN', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric'
    });
  } catch (e) {
    return dateStr;
  }
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function markTopicsDataChanged() {
  try {

function renderCMPreviewTopicSwitcherList(currentTopic) {
  const listEl = document.getElementById("cmPreviewTopicSwitcherList");
  if (!listEl) return;
  
  const currentCategory = currentTopic.category || 'Chưa phân loại';
  const currentTopicId = currentTopic.topicId;
  const currentTopicTitle = currentTopic.title || 'Chưa có tiêu đề';
  
  const currentTopicSpan = document.getElementById("cmPreviewSwitcherCurrentTopic");
  if (currentTopicSpan) currentTopicSpan.textContent = currentTopicTitle;

  // Filter topics for current category
  let topics = (allTopics || []).filter(t => (t.category || 'Chưa phân loại') === currentCategory);

  // Sort by order
  topics = topics.sort((a, b) => (a.order || 0) - (b.order || 0));

  let html = "";
  topics.forEach((topic, index) => {
    const isActive = topic.topicId === currentTopicId;
    const contentDocId = topic.contentDocId || "";
    const hasContent = contentDocId.trim().length > 10; 
    const canSwitch = hasContent;

    let statusIcon = "";
    if (isActive) {
      statusIcon = "▶";
    } else if (!hasContent) {
      statusIcon = "🔒";
    }
    
    const itemClass = "topic-switcher-item" + (isActive ? " active" : "") + (!hasContent ? " no-content locked" : "");
    const safeTopicId = String(topic.topicId || "").replace(/"/g, '&quot;');
    const safeTopicTitle = String(topic.title || "Chủ đề").replace(/</g, '&lt;').replace(/>/g, '&gt;');
    
    html += `<div class="${itemClass}" data-topic-id="${safeTopicId}" ${canSwitch && !isActive ? `onclick="switchToCMPreviewTopic('${safeTopicId}')"` : ''} style="${canSwitch && !isActive ? 'cursor: pointer;' : ''}">`;
    html += `<span class="topic-item-order">${index + 1}</span>`;
    html += `<span class="topic-item-title">${safeTopicTitle}</span>`;
    html += `<span class="topic-item-status">${statusIcon}</span>`;
    html += `</div>`;
  });
  
  listEl.innerHTML = html;
}

window.renderCMPreviewTopicSwitcherList = renderCMPreviewTopicSwitcherList;

function openCourseModal(courseId) {
  const modal = document.getElementById('cm-course-modal-overlay');
  const form = document.getElementById('cm-course-form');
  const title = document.getElementById('cm-course-modal-title');
  
  form.reset();
  
  if (courseId) {
    title.textContent = "Chỉnh sửa khóa học";
    const course = allCourses.find(c => c.courseId === courseId);
    if (course) {
      document.getElementById('course-id-input').value = course.courseId;
      document.getElementById('course-title-input').value = course.title || '';
      document.getElementById('course-short-desc-input').value = course.shortDescription || '';
      document.getElementById('course-category-input').value = course.category || '';
      document.getElementById('course-level-input').value = course.level || 'beginner';
      document.getElementById('course-order-input').value = course.order || 1;
      document.getElementById('course-status-input').value = course.status || 'draft';
      document.getElementById('course-thumb-input').value = course.thumbnailUrl || '';
    }
  } else {
    title.textContent = "Tạo khóa học mới";
    document.getElementById('course-id-input').value = '';
    
    let maxOrder = 0;
    allCourses.forEach(c => { if (c.order > maxOrder) maxOrder = c.order; });
    document.getElementById('course-order-input').value = maxOrder + 1;
    document.getElementById('course-status-input').value = 'draft';
  }
  
  modal.style.display = 'flex';
}

}

function handleCourseSubmit(e) {
  e.preventDefault();
  
  const courseId = document.getElementById('course-id-input').value;
  const courseData = {
    title: document.getElementById('course-title-input').value,
    shortDescription: document.getElementById('course-short-desc-input').value,
    category: document.getElementById('course-category-input').value,
    level: document.getElementById('course-level-input').value,
    status: document.getElementById('course-status-input').value,
    order: parseInt(document.getElementById('course-order-input').value) || 1,
    thumbnailUrl: document.getElementById('course-thumb-input').value,
  };
  
  const btn = document.getElementById('course-save-btn');
  btn.disabled = true;
  btn.textContent = 'Đang lưu...';
  
  if (courseId) {
    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        btn.textContent = 'Lưu khóa học';
        if (res && res.success) {
          if (typeof showNotification === 'function') showNotification('Cập nhật khóa học thành công', 'success');
          closeCourseModal();
          loadCoursesList();
        } else {
          if (typeof showNotification === 'function') showNotification('Lỗi: ' + res.message, 'error');
        }
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.textContent = 'Lưu khóa học';
        if (typeof showNotification === 'function') showNotification('Lỗi kết nối', 'error');
      })
      .updateCourse(courseId, courseData);
  } else {
    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        btn.textContent = 'Lưu khóa học';
        if (res && res.success) {
          if (typeof showNotification === 'function') showNotification('Tạo khóa học thành công', 'success');
          closeCourseModal();
          loadCoursesList();
        } else {
          if (typeof showNotification === 'function') showNotification('Lỗi: ' + res.message, 'error');
        }
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.textContent = 'Lưu khóa học';
        if (typeof showNotification === 'function') showNotification('Lỗi kết nối', 'error');
      })
      .createCourse(courseData);
  }
}
