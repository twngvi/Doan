<!-- User Statistics Page Styles -->
<style>

    align-items: center;
    gap: 1rem;
  }

    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;

  .header-icon .material-symbols-sharp {
    font-size: 28px;

  .gradient-blue {
    background: var(--theme-gradient);

  .user-stats-toolbar {

  .summary-user-info {

    flex-direction: column;

  .topic-history-list {

  .topic-history-item {

    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.3rem;

    font-weight: 700;

  }

  .attempt-detail-list {

    flex-direction: column;
    gap: 0.4rem;
    max-height: 220px;
    overflow-y: auto;
  }

  .attempt-detail-row {
    border: 1px solid var(--theme-border-light);
    border-radius: 8px;
    padding: 0.45rem 0.5rem;
    background: rgba(255, 255, 255, 0.02);
  }

  .attempt-detail-question {

  }

  .attempt-detail-pre {

    border: 1px solid var(--theme-card-border);
    border-radius: 14px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }

  .topic-history-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.8rem;
    padding: 0.85rem 1rem;
    border-bottom: 1px solid var(--theme-border-light);
    background: var(--theme-surface);
  }

  .topic-history-modal-title {
    margin: 0;
    font-size: 1rem;
    color: var(--theme-text);
    font-weight: 800;
  }

  .topic-history-modal-close {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    border: 1px solid var(--theme-border-light);
    background: var(--theme-card);
    color: var(--theme-text-secondary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s ease;
  }

  .topic-history-modal-close:hover {
    color: var(--theme-text);
    border-color: var(--theme-primary);
  }

  .topic-history-modal-list {
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    overflow-y: auto;
    max-height: calc(78vh - 72px);

  @media (max-width: 1200px) {
    .summary-cards {
      flex-wrap: wrap;
    }
  }

  @media (max-width: 992px) {
    .user-stats-main-grid {
      grid-template-columns: 1fr;
      height: auto;
      min-height: unset;
    }

    .users-list {
      max-height: 420px;
    }

    .users-list-panel,
    .user-detail-panel {
      height: auto;
    }

    .users-list-panel {
      max-height: 520px;
    }

    .detail-placeholder {
      min-height: 380px;
      flex: none;
    }

    .detail-content {
      flex: none;
      height: auto;
    }

    .fixed-height-section {
      flex: none;
      height: 320px;
    }
  }

  @media (max-width: 680px) {
    .user-stats-container {
      padding: 1rem;
    }

    .user-stats-header {
      flex-direction: column;
      align-items: stretch;
    }

    .user-stats-toolbar {
      flex-direction: column;
      align-items: stretch;
    }

    .search-box {
      width: 100%;
    }

    .filters-group {
      justify-content: space-between;
    }

    .summary-cards {
      flex-direction: column;
      align-items: stretch;
    }

    .fixed-height-section {
      height: 240px;
    }

    .topic-history-modal-card {
      width: calc(100vw - 1rem);
      max-height: 84vh;
    }

    .topic-history-modal-list {
      max-height: calc(84vh - 72px);
    }
  }

  /* =================================================
   ADMIN GLOBAL SPACING STANDARD

  :root {
    --admin-page-padding: 24px;
    --admin-section-gap: 24px;
    --admin-card-padding: 20px;
  }

  /* Reset box sizing Ä‘á»ƒ padding khÃ´ng lÃ m trÃ n ngang */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  /* 
  CÃ¡c root page cá»§a admin pháº£i dÃ¹ng cÃ¹ng 1 padding.
  KhÃ´ng Ä‘á»ƒ tá»«ng trang tá»± max-width / margin auto khÃ¡c nhau ná»¯a.
*/
  :is(
    .question-manager-page,
    .mc-manager-page,
    .content-management-container,
    .code-arrangement-page,
    .course-stats-page,

/* =====================================================
   USER STATS VISUAL UPGRADE

body.is-user-stats-page {
  --user-stats-blue: #2563eb;

/* 1. Header trang */
body.is-user-stats-page .user-stats-header {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(
      circle at 88% 15%,
      rgba(34, 211, 238, 0.20),
      transparent 32%

    linear-gradient(135deg, #1e3a8a 0%, #172554 100%) !important;

  box-shadow: 0 14px 34px rgba(30, 58, 138, 0.24) !important;
}

body.is-user-stats-page .user-stats-header::after {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  top: -110px;
  right: 80px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.06);
  pointer-events: none;
}

body.is-user-stats-page .user-stats-header .page-title {
  color: #ffffff !important;
  letter-spacing: -0.02em;
}

body.is-user-stats-page .user-stats-header .header-icon {

  border: 1px solid rgba(255, 255, 255, 0.34);
