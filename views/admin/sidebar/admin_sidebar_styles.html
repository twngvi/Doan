<!-- Admin Sidebar Styles -->
<style>
  /* ========================================
     ADMIN SIDEBAR VARIABLES
     ======================================== */
  :root {
    --admin-sidebar-width: 260px;
    --admin-sidebar-collapsed-width: 76px;
    --admin-sidebar-transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ========================================
     ADMIN SIDEBAR PASTEL BLUE THEME
     ======================================== */
  .admin-sidebar {
    --admin-pastel-accent: #93c5fd;
    --admin-pastel-accent-hover: #60a5fa;
    --admin-pastel-accent-deep: #3b82f6;
    --admin-pastel-accent-light: #bfdbfe;
    --admin-pastel-glow: rgba(147, 197, 253, 0.35);
    --admin-pastel-glow-strong: rgba(96, 165, 250, 0.5);
    --admin-pastel-bg-start: #0f1b2e;
    --admin-pastel-bg-mid: #162d4a;
    --admin-pastel-bg-end: #1a3654;
    background: rgba(255, 255, 255, 0.4) !important;
    backdrop-filter: blur(16px) saturate(1.2) !important;
    -webkit-backdrop-filter: blur(16px) saturate(1.2) !important;
    border-right-color: rgba(255, 255, 255, 0.3) !important;
    box-shadow: 4px 0 24px rgba(0, 0, 0, 0.05) !important;
  }

  /* ========================================
     ADMIN SIDEBAR BASE
     ======================================== */
  .admin-sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: var(--admin-sidebar-width);
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    border-right: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 4px 0 24px rgba(0, 0, 0, 0.05);
    display: none;
    flex-direction: column;
    z-index: 1000;
    transition: width var(--admin-sidebar-transition), transform var(--admin-sidebar-transition);
    overflow: visible;
    font-size: 0.9375rem;
  }

  body.has-admin-sidebar .admin-sidebar {
    display: flex !important;
  }

  /* ========================================
     COLLAPSED STATE
     ======================================== */
  .admin-sidebar.collapsed {
    width: var(--admin-sidebar-collapsed-width);
  }

  .admin-sidebar.collapsed .logo-text,
  .admin-sidebar.collapsed .nav-label,
  .admin-sidebar.collapsed .sidebar-username,
  .admin-sidebar.collapsed .sidebar-role,
  .admin-sidebar.collapsed .sidebar-user-info,
  .admin-sidebar.collapsed .back-label,
  .admin-sidebar.collapsed .logout-label {
    opacity: 0;
    width: 0;
    overflow: hidden;
    white-space: nowrap;
  }



  /* ========================================
     HEADER & LOGO
     ======================================== */
  .admin-sidebar .sidebar-header {
    padding: 0.25rem 0.5rem;
    border-bottom: 1px solid rgba(147, 197, 253, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 75px;
    box-sizing: border-box;
    overflow: visible;
  }

  .admin-sidebar .logo {
    display: flex;
    align-items: center;
    gap: 0;
    font-size: 3rem;
    font-weight: 400;
    white-space: nowrap;
    overflow: visible;
    font-family: "Fredoka One", "Baloo 2", "Nunito", sans-serif;
    justify-content: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  #adminSidebarLogo {
    height: 60px !important;
    width: auto;
    object-fit: contain;
    display: block;
    transform-origin: center center;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: auto;
    transition:
      transform 300ms cubic-bezier(0.22, 1, 0.36, 1),
      filter 300ms cubic-bezier(0.22, 1, 0.36, 1);
    cursor: pointer;
    will-change: transform, filter;
    backface-visibility: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #adminSidebarLogo:hover,
  #adminSidebarLogo:active,
  #adminSidebarLogo:focus-visible {
    transform: scale(1.06);
    filter: none;
  }

  /* Collapsed Logo */
  .admin-sidebar.collapsed .sidebar-header {
    justify-content: center;
    padding: 0.25rem 0.5rem;
    height: 100px;
  }

  .admin-sidebar.collapsed .logo {
    justify-content: center;
    width: 100%;
    font-size: 2.125rem;
  }

  .admin-sidebar.collapsed #adminSidebarLogo {
    height: 40px !important;
    transform-origin: center center;
  }

  .admin-sidebar.collapsed #adminSidebarLogo:hover,
  .admin-sidebar.collapsed #adminSidebarLogo:active,
  .admin-sidebar.collapsed #adminSidebarLogo:focus-visible {
    transform: scale(1.08);
    filter: drop-shadow(0 0 14px rgba(147, 197, 253, 0.7));
  }

  /* ========================================
     SEARCH BOX
     ======================================== */
  .admin-sidebar .sidebar-search-wrapper {
    position: relative;
    overflow: visible;
    padding: 0.375rem 0.625rem;
    border-bottom: 1px solid rgba(147, 197, 253, 0.15);
  }

  .admin-sidebar .sidebar-search-item {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 0.625rem;
    padding: 0 0.625rem;
    background: linear-gradient(135deg, rgba(147, 197, 253, 0.06) 0%, rgba(96, 165, 250, 0.06) 100%);
    border-radius: 10px;
    height: 48px;
    transition: all 0.2s ease;
    border: 1px solid rgba(147, 197, 253, 0.12);
  }

  .admin-sidebar .sidebar-search-item:hover {
    background: linear-gradient(135deg, rgba(147, 197, 253, 0.12) 0%, rgba(96, 165, 250, 0.12) 100%);
    border-color: rgba(147, 197, 253, 0.25);
  }

  .admin-sidebar .search-icon {
    font-size: 1.25rem;
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(147, 197, 253, 0.12);
    border-radius: 50%;
    color: #93c5fd;
    transition: all 0.2s ease;
  }

  .admin-sidebar .sidebar-search-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-size: 0.8125rem;
    color: var(--theme-sidebar-text, #e0e7ff);
  }

  .admin-sidebar .sidebar-search-input::placeholder {
    color: var(--theme-text-muted, rgba(255, 255, 255, 0.5));
  }

  /* Collapsed Search */
  .admin-sidebar.collapsed .sidebar-search-wrapper {
    padding: 0.375rem 0;
    display: flex;
    justify-content: center;
  }

  .admin-sidebar.collapsed .sidebar-search-item {
    justify-content: center;
    padding: 0;
    width: 50px;
    height: 50px;
  }

  .admin-sidebar.collapsed .sidebar-search-input {
    display: none;
  }

  .admin-sidebar .sidebar-search-results {
    display: none;
    position: absolute;
    left: calc(100% + 0.6rem);
    top: 0.25rem;
    width: 330px;
    max-width: min(330px, calc(100vw - var(--admin-sidebar-width) - 2rem));
    max-height: 360px;
    overflow-y: auto;
    border-radius: 12px;
    border: 1px solid rgba(147, 197, 253, 0.12);
    background: rgba(15, 27, 46, 0.85);
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    box-shadow: 0 8px 32px rgba(15, 27, 46, 0.5);
    padding: 0.35rem;
    z-index: 1300;
  }

  .admin-sidebar .sidebar-search-results.open {
    display: block;
  }

  .admin-sidebar .sidebar-search-group {
    padding: 0.25rem;
  }

  .admin-sidebar .sidebar-search-group + .sidebar-search-group {
    border-top: 1px solid rgba(147, 197, 253, 0.15);
  }

  .admin-sidebar .sidebar-search-group-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--theme-text-muted, rgba(255, 255, 255, 0.6));
    margin: 0.25rem 0.3rem 0.35rem;
  }

  .admin-sidebar .sidebar-search-result-item {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    color: #bfdbfe;
    border-radius: 10px;
    padding: 0.45rem 0.55rem;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.45rem;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
  }

  .admin-sidebar .sidebar-search-result-item:hover,
  .admin-sidebar .sidebar-search-result-item.active {
    background: linear-gradient(135deg, rgba(147, 197, 253, 0.12) 0%, rgba(96, 165, 250, 0.12) 100%);
    border-color: rgba(147, 197, 253, 0.25);
  }

  .admin-sidebar .sidebar-search-result-main {
    min-width: 0;
    flex: 1;
  }

  .admin-sidebar .sidebar-search-result-side {
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .admin-sidebar .sidebar-search-result-title {
    font-size: 0.82rem;
    font-weight: 600;
    line-height: 1.3;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .admin-sidebar .sidebar-search-result-subtitle {
    font-size: 0.72rem;
    line-height: 1.3;
    color: var(--theme-text-muted, rgba(255, 255, 255, 0.7));
    margin-top: 0.1rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .admin-sidebar .sidebar-search-result-tag {
    align-self: center;
    font-size: 0.66rem;
    font-weight: 700;
    line-height: 1;
    border-radius: 999px;
    padding: 0.25rem 0.45rem;
    border: 1px solid transparent;
    white-space: nowrap;
  }

  .admin-sidebar .sidebar-search-result-tag.tag-page {
    color: #67e8f9;
    border-color: rgba(103, 232, 249, 0.45);
    background: rgba(103, 232, 249, 0.14);
  }

  .admin-sidebar .sidebar-search-result-tag.tag-lesson {
    color: #86efac;
    border-color: rgba(134, 239, 172, 0.5);
    background: rgba(134, 239, 172, 0.14);
  }

  .admin-sidebar .sidebar-search-result-tag.tag-user {
    color: #f9a8d4;
    border-color: rgba(249, 168, 212, 0.5);
    background: rgba(249, 168, 212, 0.14);
  }

  .admin-sidebar .sidebar-search-empty {
    font-size: 0.78rem;
    color: var(--theme-text-muted, rgba(255, 255, 255, 0.7));
    padding: 0.7rem 0.55rem;
    text-align: center;
  }

  .admin-sidebar.collapsed .sidebar-search-results {
    display: none !important;
  }

  /* ========================================
     NAVIGATION
     ======================================== */
  .admin-sidebar .sidebar-nav {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.5rem 0;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    
    /* Hide scrollbar to prevent icon shift when centering */
    -ms-overflow-style: none;  /* IE and Edge */
    scrollbar-width: none;  /* Firefox */
  }

  .admin-sidebar .sidebar-nav::-webkit-scrollbar {
    display: none; /* Chrome, Safari and Opera */
  }

  .admin-sidebar .nav-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0 0.625rem;
    margin: 0 0.625rem;
    height: 42px;
    border-radius: 12px;
    color: #475569;
    text-decoration: none;
    transition:
      background 0.25s ease,
      border-color 0.25s ease,
      color 0.25s ease,
      transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
      box-shadow 0.25s ease;
    position: relative;
    background: transparent;
    border: 1px solid transparent;
  }

  /* --- Hover Effect --- */
  .admin-sidebar .nav-item:hover {
    background: rgba(37, 99, 235, 0.08);
    border-color: rgba(37, 99, 235, 0.15);
    transform: translateX(4px);
  }

  .admin-sidebar .nav-item:hover .nav-icon {
    color: #2563eb;
    transform: scale(1.1);
  }

  .admin-sidebar .nav-item:hover .nav-label {
    color: #1e3a8a;
  }

  /* --- Active Effect (Premium Pill + Glow) --- */
  .admin-sidebar .nav-item.active {
    background: linear-gradient(135deg, rgba(37, 99, 235, 0.15) 0%, rgba(59, 130, 246, 0.05) 100%);
    border-color: rgba(37, 99, 235, 0.2);
    box-shadow:
      0 0 16px rgba(147, 197, 253, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .admin-sidebar .nav-item.active::before {
    content: '';
    position: absolute;
    left: -0.625rem;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 60%;
    border-radius: 0 3px 3px 0;
    background: linear-gradient(180deg, #2563eb 0%, #3b82f6 100%);
    box-shadow: 0 0 8px rgba(37, 99, 235, 0.4);
  }

  .admin-sidebar .nav-item.active .nav-icon {
    color: #2563eb;
    filter: drop-shadow(0 0 4px rgba(37, 99, 235, 0.2));
    transform: scale(1.08);
  }

  .admin-sidebar .nav-item.active .nav-label {
    color: #1e40af;
    font-weight: 700;
    text-shadow: none;
  }

  .admin-sidebar .nav-icon {
    font-size: 1.25rem;
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border-radius: 10px;
    color: #64748b;
    transition:
      color 0.25s ease,
      transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
      filter 0.25s ease;
  }

  .admin-sidebar .nav-icon .course-stats-nav-icon {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .admin-sidebar .nav-icon .course-stats-nav-icon {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .admin-sidebar .nav-label {
    flex: 1;
    font-size: 0.875rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity var(--admin-sidebar-transition), width var(--admin-sidebar-transition);
  }



  /* Collapsed Nav */
  .admin-sidebar.collapsed .sidebar-nav {
    align-items: center;
  }

  .admin-sidebar.collapsed .nav-item {
    justify-content: center;
    align-items: center;
    padding: 0;
    margin: 0 auto;
    width: 50px;
    height: 40px;
    gap: 0;
  }

  .admin-sidebar.collapsed .nav-icon {
    margin: 0;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .admin-sidebar.collapsed .nav-label {
    display: none;
  }

  /* ========================================
     TOGGLE BUTTON
     ======================================== */
  .admin-sidebar .sidebar-toggle-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0.5rem auto;
    width: 40px;
    height: 40px;
    background: rgba(59, 130, 246, 0.2);
    border: 1px solid rgba(59, 130, 246, 0.3);
    border-radius: 10px;
    color: #1e3a8a;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .admin-sidebar .sidebar-toggle-btn:hover {
    background: rgba(59, 130, 246, 0.35);
    color: #1e3a8a;
    transform: scale(1.1);
  }

  .admin-sidebar .toggle-icon {
    font-size: 1.25rem;
    transition: transform 0.3s ease;
  }

  .admin-sidebar.collapsed .toggle-icon {
    transform: rotate(180deg);
  }

  /* ========================================
     FOOTER
     ======================================== */
  .admin-sidebar .sidebar-footer {
    padding: 0.5rem 0.625rem;
    border-top: 1px solid rgba(147, 197, 253, 0.15);
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    position: relative;
  }

  /* User Profile */
  .admin-sidebar .sidebar-user-profile {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.5rem;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(37, 99, 235, 0.15) 100%);
    border-radius: 12px;
    border: 1px solid rgba(59, 130, 246, 0.2);
    transition: all 0.2s ease;
  }

  .admin-sidebar .sidebar-user-profile:hover {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.35) 0%, rgba(37, 99, 235, 0.35) 100%);
    border-color: rgba(59, 130, 246, 0.5);
  }

  .admin-sidebar .sidebar-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(147, 197, 253, 0.25);
    flex-shrink: 0;
  }

  .admin-sidebar .sidebar-user-info {
    display: flex;
    flex-direction: column;
    gap: 0.125rem;
    overflow: hidden;
    transition: opacity var(--admin-sidebar-transition), width var(--admin-sidebar-transition);
  }

  .admin-sidebar .sidebar-username {
    font-size: 0.875rem;
    font-weight: 600;
    color: #1e3a8a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .admin-sidebar .sidebar-role {
    font-size: 0.7rem;
    color: #2563eb;
    font-weight: 500;
  }

  /* Collapsed User Profile */
  .admin-sidebar.collapsed .sidebar-user-profile {
    justify-content: center;
    padding: 0;
    margin: 0 auto;
    width: 50px;
    height: 50px;
  }

  .admin-sidebar.collapsed .sidebar-avatar {
    width: 36px;
    height: 36px;
  }

  .admin-sidebar.collapsed .sidebar-user-info {
    display: none;
  }

  /* Back Button */
  .admin-sidebar .sidebar-back-btn {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    padding: 0 0.625rem;
    height: 44px;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(37, 99, 235, 0.15) 100%);
    border: 1px solid rgba(59, 130, 246, 0.2);
    border-radius: 10px;
    color: #60a5fa;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .admin-sidebar .sidebar-back-btn:hover {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: white;
  }

  .admin-sidebar .back-icon {
    font-size: 1.25rem;
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(59, 130, 246, 0.2);
    border-radius: 50%;
    transition: all 0.2s ease;
  }

  .admin-sidebar .sidebar-back-btn:hover .back-icon {
    background: rgba(255, 255, 255, 0.2);
  }

  .admin-sidebar .back-label {
    font-size: 0.8125rem;
    font-weight: 600;
    white-space: nowrap;
  }

  /* Collapsed Back Button */
  .admin-sidebar.collapsed .sidebar-back-btn {
    justify-content: center;
    padding: 0;
    margin: 0 auto;
    width: 50px;
    height: 50px;
  }

  .admin-sidebar.collapsed .back-label {
    display: none;
  }

  /* ========================================
     AVATAR MENU (POPUP BÊN PHẢI)
     ======================================== */
  .admin-avatar-menu {
    position: absolute;
    bottom: 0;
    left: calc(100% + 10px);
    background: var(--theme-card, rgba(255, 255, 255, 0.95));
    border: 1px solid rgba(59, 130, 246, 0.2);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    border-radius: 12px;
    padding: 8px;
    min-width: 180px;
    z-index: 1000;
    backdrop-filter: blur(10px);
  }

  .admin-sidebar.collapsed .admin-avatar-menu {
    left: calc(100% + 15px);
    bottom: -10px;
  }

  .admin-avatar-menu .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 10px 16px;
    border: none;
    background: transparent;
    color: var(--theme-text, #1e293b);
    font-size: 0.95rem;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
  }

  .admin-avatar-menu .menu-item .material-symbols-sharp {
    font-size: 20px;
    color: var(--theme-text-muted, #64748b);
  }

  .admin-avatar-menu .menu-item:hover {
    background: rgba(59, 130, 246, 0.1);
    color: #3b82f6;
  }

  .admin-avatar-menu .menu-item:hover .material-symbols-sharp {
    color: #3b82f6;
  }

  .admin-avatar-menu .menu-item.logout-btn {
    color: #ef4444;
  }

  .admin-avatar-menu .menu-item.logout-btn .material-symbols-sharp {
    color: #ef4444;
  }

  .admin-avatar-menu .menu-item.logout-btn:hover {
    background: rgba(239, 68, 68, 0.1);
    color: #dc2626;
  }

  .admin-avatar-menu .menu-item.logout-btn:hover .material-symbols-sharp {
    color: #dc2626;
  }

  @keyframes logoutSlideDown {
    from {
      opacity: 0;
      transform: translateY(10px) translateX(-10px);
    }
    to {
      opacity: 1;
      transform: translateY(0) translateX(0);
    }
  }

  /* ========================================
     LOGOUT MODAL
     ======================================== */
  .logout-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    /* animation: fadeIn 0.2s ease; */
  }

  .logout-modal-overlay.show {
    display: flex;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .logout-modal {
    background: var(--theme-card);
    border: 1px solid var(--theme-card-border);
    border-radius: 16px;
    padding: 2rem;
    max-width: 360px;
    width: 90%;
    text-align: center;
    /* animation: slideUp 0.3s ease; */
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .logout-modal-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 1rem;
