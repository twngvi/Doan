
<!-- Online Statistics Page Scripts -->
<script>
  // ========================================
  // ONLINE STATS PAGE CONTROLLER
  // ========================================

  // State
  let onlineUsers = [];
  let recentActivities = [];
  let onlineSummary = {
    totalOnline: 0,
    activeNow: 0,
    idleUsers: 0,
    offlineUsers: 0,
    disabledUsers: 0,
  };
  let currentFilter = 'all';
  let searchQuery = '';
  let refreshInterval = null;
  let meteorInterval = null;
  let aiUsageStats = null;
  let onlineStatsInitialized = false;

  // Chart instances
  let levelDistributionChart = null;
  let topTrendingChart = null;
  let hardestTopicsChart = null;
  let dailyActivityChart = null;
  let featureEngagementChart = null;
  let peakStudyHoursChart = null;
  let studyDaysOfWeekChart = null;
  let studyDuration7DaysChart = null;

  function getOnlineStatsCurrentUser() {
    try {
      return window.currentUser || JSON.parse(localStorage.getItem('currentUser') || 'null');
    } catch (e) {
      return window.currentUser || null;
    }
  }

  function isOnlineStatsPageActive() {
    const adminPage = document.getElementById('page-admin');
    const statsPage = document.getElementById('page-online-stats');

    const adminVisible = !!(
      adminPage &&
      window.getComputedStyle(adminPage).display !== 'none'
    );

    const statsVisible = !!(
      statsPage &&
      statsPage.classList.contains('active') &&
      window.getComputedStyle(statsPage).display !== 'none'
    );

    const user = getOnlineStatsCurrentUser();
    const role = String(user?.role || '').trim().toUpperCase();

    return adminVisible && statsVisible && role === 'ADMIN';
  }

  // Initialize page
  function initOnlineStatsPage() {

  try {
    const oldClasses = Array.from(document.documentElement.classList).filter(c => c.startsWith('is-') && c.endsWith('-page'));
    if (oldClasses.length > 0) {
      document.documentElement.classList.remove(...oldClasses);
      document.body.classList.remove(...oldClasses);
    }
    document.documentElement.classList.add('is-online-stats-page');
    document.body.classList.add('is-online-stats-page');
    window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
  } catch(e) { console.error(e); }

    if (!isOnlineStatsPageActive()) {
      stopAutoRefresh();
      return;
    }

    if (!onlineStatsInitialized) {
      setupEventListeners();
      onlineStatsInitialized = true;
    }

    loadOnlineUsers();
    loadDashboardCharts();
    startAutoRefresh();
    initMeteorEffect();
  }

  // Setup event listeners
  function setupEventListeners() {
    // Search input
    const searchInput = document.getElementById('searchUser');
    if (searchInput) {
      searchInput.addEventListener('input', debounce((e) => {
        searchQuery = e.target.value.toLowerCase();
        filterAndRenderUsers();
      }, 300));
    }

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        filterAndRenderUsers();
      });
    });
  }

  // Load online users from server
  async function loadOnlineUsers() {
    if (!isOnlineStatsPageActive()) return;
    showLoading(true);
    
    try {
      const result = await callAppsScript('getAdminOnlineUsersData');
      if (!result || !result.success) {
        throw new Error((result && result.message) || 'Không thể tải dữ liệu online users');
      }

      onlineUsers = (result.data && result.data.users) ? result.data.users : [];
      recentActivities = (result.data && result.data.activities) ? result.data.activities : [];
      onlineSummary = {
        totalOnline: Number((result.data && result.data.totalOnline) || 0),
        activeNow: Number((result.data && result.data.activeNow) || 0),
        idleUsers: Number((result.data && result.data.idleUsers) || 0),
        offlineUsers: Number((result.data && result.data.offlineUsers) || 0),
        disabledUsers: Number((result.data && result.data.disabledUsers) || 0),
      };
      
      updateStats();
      filterAndRenderUsers();
      renderActivityTimeline();
    } catch (error) {
      console.error('Error loading online users:', error);
      showError('Không thể tải danh sách người dùng');
    } finally {
      showLoading(false);
    }
  }

  async function loadDashboardCharts() {
    if (!isOnlineStatsPageActive()) return;
    try {
      if (typeof Chart === 'undefined') {
        console.warn('Chart.js is not loaded yet');
        return;
      }

      const result = await callAppsScript('getAdminDashboardChartsData');
      if (!result || !result.success) {
        throw new Error((result && result.message) || 'Không thể tải dữ liệu dashboard charts');
      }

      const data = result.data;
      renderDashboardCharts(data);
    } catch (error) {
      console.error('Error loading dashboard charts:', error);
    }
  }

  function renderDashboardCharts(data) {
    if (!data) return;

    // --- CẬP NHẬT STATS CARDS ---
    const setText = (id, val) => {
      const el = document.getElementById(id);
      if (el) el.textContent = val;
    };

    // Nhóm 1
    if (data.overview) {
      setText('valTotalLearners', data.overview.totalLearners || 0);
      setText('valActiveToday', data.overview.activeToday || 0);
      setText('valActive7Days', data.overview.active7Days || 0);
      setText('valDisabled', data.overview.disabledLearners || 0);
    }

    // Nhóm 2: Tương tác tính năng
    if (data.featureEngagement && data.featureEngagement.distribution) {
      setText('valPctLesson', `${data.featureEngagement.distribution.lesson || 0}%`);
      setText('valPctQuiz', `${data.featureEngagement.distribution.quiz || 0}%`);
      setText('valPctMatching', `${data.featureEngagement.distribution.matching || 0}%`);
      setText('valPctCodeGame', `${data.featureEngagement.distribution.codeGame || 0}%`);
    }
    
    // Nhóm 3: Thói quen học tập
    if (data.studyHabits) {
      setText('valPeakHourRange', data.studyHabits.peakHours?.peakHourRangeLabel || '20:00 - 22:00');
      setText('valTopStudyDay', data.studyHabits.daysOfWeek?.topDayLabel || 'Thứ 5');
    }

    // Nhóm 3
    if (data.results) {
      setText('valAvgAccuracy', `${data.results.avgAccuracy || 0}%`);
      setText('valPassRate', `${data.results.passRate || 0}%`);
    }

    // Nhóm 4
    if (data.recentActivity) {
      setText('valNewLearners', data.recentActivity.newLearners || 0);
      setText('valReturningLearners', data.recentActivity.returningLearners || 0);
      setText('valChurnLearners', data.recentActivity.churnLearners || 0);
    }

    // --- VẼ BIỂU ĐỒ ---
    const primaryColor = window.getComputedStyle(document.body).getPropertyValue('--theme-primary') || '#3b82f6';
    const secondaryColor = window.getComputedStyle(document.body).getPropertyValue('--theme-secondary') || '#8b5cf6';
    const accentColor = window.getComputedStyle(document.body).getPropertyValue('--theme-accent') || '#10b981';
    const textColor = window.getComputedStyle(document.body).getPropertyValue('--theme-text') || '#f3f4f6';
    const gridColor = window.getComputedStyle(document.body).getPropertyValue('--theme-border-light') || 'rgba(255,255,255,0.1)';

    Chart.defaults.color = textColor;
    Chart.defaults.font.family = "'Inter', sans-serif";

    const chartPalette = [
      accentColor,
      'rgba(156, 163, 175, 0.55)',
      'rgba(239, 68, 68, 0.75)',
      primaryColor,
      secondaryColor
    ];

    // 0. Biểu đồ cột chồng Tương tác tính năng (7 ngày)
    const ctxFeature = document.getElementById('featureEngagementChart');
    if (ctxFeature && data.featureEngagement && data.featureEngagement.timeline7Days) {
      if (featureEngagementChart) featureEngagementChart.destroy();
      const timeline = data.featureEngagement.timeline7Days;

      featureEngagementChart = new Chart(ctxFeature, {
        type: 'line',
        data: {
          labels: timeline.labels,
          datasets: [
            {
              label: '📘 Lesson',
              data: timeline.datasets.lesson,
              borderColor: '#3b82f6',
              backgroundColor: 'rgba(59, 130, 246, 0.1)',
              borderWidth: 3,
              tension: 0.4,
              pointBackgroundColor: '#3b82f6',
              pointRadius: 4,
              pointHoverRadius: 6
            },
            {
              label: '📙 Quiz',
              data: timeline.datasets.quiz,
              borderColor: '#f59e0b',
              backgroundColor: 'rgba(245, 158, 11, 0.1)',
              borderWidth: 3,
              tension: 0.4,
              pointBackgroundColor: '#f59e0b',
              pointRadius: 4,
              pointHoverRadius: 6
            },
            {
              label: '📗 Matching',
              data: timeline.datasets.matching,
              borderColor: '#10b981',
              backgroundColor: 'rgba(16, 185, 129, 0.1)',
              borderWidth: 3,
              tension: 0.4,
              pointBackgroundColor: '#10b981',
              pointRadius: 4,
              pointHoverRadius: 6
            },
            {
              label: '🎮 Code Game',
              data: timeline.datasets.codeGame,
              borderColor: '#8b5cf6',
              backgroundColor: 'rgba(139, 92, 246, 0.1)',
              borderWidth: 3,
              tension: 0.4,
              pointBackgroundColor: '#8b5cf6',
              pointRadius: 4,
              pointHoverRadius: 6
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              position: 'top',
              labels: { usePointStyle: true, boxWidth: 8, padding: 16 }
            }
          },
          scales: {
            x: { grid: { display: false } },
            y: { beginAtZero: true, grid: { color: gridColor }, ticks: { precision: 0 } }
          }
        }
      });
    }

    // ==========================================
    // NHÓM 3: THÓI QUEN HỌC TẬP (Study Habits Charts)
    // ==========================================
    // 3.1. Khung giờ học phổ biến (24h)
    const ctxPeakHours = document.getElementById('peakStudyHoursChart');
    if (ctxPeakHours && data.studyHabits && data.studyHabits.peakHours) {
      if (peakStudyHoursChart) peakStudyHoursChart.destroy();

      const gradientPeak = ctxPeakHours.getContext('2d').createLinearGradient(0, 0, 0, 300);
      gradientPeak.addColorStop(0, '#10b981');
      gradientPeak.addColorStop(1, 'rgba(16, 185, 129, 0.15)');

      peakStudyHoursChart = new Chart(ctxPeakHours, {
        type: 'bar',
        data: {
          labels: data.studyHabits.peakHours.labels,
          datasets: [{
            label: 'Lượt tương tác học tập',
            data: data.studyHabits.peakHours.data,
            backgroundColor: gradientPeak,
            borderRadius: 5,
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, grid: { color: gridColor }, ticks: { precision: 0 } },
            x: { grid: { display: false }, ticks: { maxTicksLimit: 12 } }
          }
        }
      });
    }

    // 3.2. Mức độ học theo ngày trong tuần (Thứ 2 -> CN)
    const ctxDaysOfWeek = document.getElementById('studyDaysOfWeekChart');
    if (ctxDaysOfWeek && data.studyHabits && data.studyHabits.daysOfWeek) {
      if (studyDaysOfWeekChart) studyDaysOfWeekChart.destroy();

      const gradientDays = ctxDaysOfWeek.getContext('2d').createLinearGradient(0, 0, 0, 300);
      gradientDays.addColorStop(0, primaryColor);
      gradientDays.addColorStop(1, 'rgba(59, 130, 246, 0.2)');

      studyDaysOfWeekChart = new Chart(ctxDaysOfWeek, {
        type: 'bar',
        data: {
          labels: data.studyHabits.daysOfWeek.labels,
          datasets: [{
            label: 'Tổng lượt học',
            data: data.studyHabits.daysOfWeek.data,
            backgroundColor: gradientDays,
            borderRadius: 6,
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, grid: { color: gridColor }, ticks: { precision: 0 } },
            x: { grid: { display: false } }
          }
        }
      });
    }



    // 3. Top Topic điểm thấp nhất (Horizontal Bar)
    const ctxHardest = document.getElementById('hardestTopicsChart');
    if (ctxHardest && data.results && data.results.hardestTopics) {
      if (hardestTopicsChart) hardestTopicsChart.destroy();
      
      hardestTopicsChart = new Chart(ctxHardest, {
        type: 'bar',
        data: {
          labels: data.results.hardestTopics.labels,
          datasets: [{
            label: 'Tỉ lệ đúng (%)',
            data: data.results.hardestTopics.data,
            backgroundColor: 'rgba(239, 68, 68, 0.8)', // Red
            borderRadius: 4
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { beginAtZero: true, max: 100, grid: { color: gridColor } },
            y: { grid: { display: false } }
          }
        }
      });
    }

    // 4. Hoạt động người dùng theo ngày / theo tháng (Line)
    const ctxActivity = document.getElementById('dailyActivityChart');
    if (ctxActivity && data.recentActivity && data.recentActivity.dailyTimeline) {
      window.__chart4RecentActivity = data.recentActivity;

      const monthSelect = document.getElementById('monthFilterChart4');
      if (monthSelect) {
        let opts = `<option value="30days">30 ngày qua</option>`;
        if (data.recentActivity.monthlyTimelines) {
          Object.keys(data.recentActivity.monthlyTimelines).forEach(mk => {
            const mt = data.recentActivity.monthlyTimelines[mk];
            opts += `<option value="${mk}">${mt.label}</option>`;
          });
        }
        monthSelect.innerHTML = opts;
        monthSelect.value = "30days";
      }

      if (dailyActivityChart) dailyActivityChart.destroy();
      
      const gradient = ctxActivity.getContext('2d').createLinearGradient(0, 0, 0, 400);
      gradient.addColorStop(0, 'rgba(16, 185, 129, 0.5)'); // Accent green transparent
      gradient.addColorStop(1, 'rgba(16, 185, 129, 0.0)');

      dailyActivityChart = new Chart(ctxActivity, {
        type: 'line',
        data: {
          labels: data.recentActivity.dailyTimeline.labels,
          datasets: [{
            label: 'Số lượng người dùng hoạt động',
            data: data.recentActivity.dailyTimeline.data,
            borderColor: accentColor,
            backgroundColor: gradient,
            borderWidth: 3,
            fill: true,
            tension: 0.4,
            pointBackgroundColor: accentColor,
            pointBorderColor: '#fff',
            pointRadius: 4,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, grid: { color: gridColor }, ticks: { precision: 0 } },
            x: { grid: { display: false } }
          }
        }
      });
    }
  }

  window.filterChart4ByMonth = function(monthKey) {
    if (!window.__chart4RecentActivity || !dailyActivityChart) return;
    const rec = window.__chart4RecentActivity;
    let labels = [];
    let dataArr = [];
    let titleText = "Số lượng người dùng hoạt động từng ngày (30 ngày qua)";
    let subText = "Biểu đồ thống kê số học viên truy cập và học tập mỗi ngày trong 30 ngày gần nhất";

    if (monthKey === "30days" && rec.dailyTimeline) {
      labels = rec.dailyTimeline.labels;
      dataArr = rec.dailyTimeline.data;
    } else if (rec.monthlyTimelines && rec.monthlyTimelines[monthKey]) {
      const mt = rec.monthlyTimelines[monthKey];
      labels = mt.labels;
      dataArr = mt.data;
      titleText = `Số lượng người dùng hoạt động từng ngày (${mt.label})`;
      subText = `Biểu đồ thống kê số học viên truy cập và học tập mỗi ngày trong ${mt.label.toLowerCase()}`;
    } else {
      return;
    }

    const titleEl = document.getElementById('chart4Title');
    const subEl = document.getElementById('chart4Subtitle');
    if (titleEl) titleEl.textContent = titleText;
    if (subEl) subEl.textContent = subText;

    dailyActivityChart.data.labels = labels;
    dailyActivityChart.data.datasets[0].data = dataArr;
    dailyActivityChart.update();
  };



  // Update statistics
  function updateStats() {
    const totalOnline = onlineSummary.totalOnline;
    const activeUsers = onlineSummary.activeNow;
    const idleUsers = onlineSummary.idleUsers;
    const offlineUsers = onlineSummary.offlineUsers;
    
    animateNumber('totalOnline', totalOnline);
    animateNumber('activeNow', activeUsers);
    animateNumber('idleUsers', idleUsers);
    animateNumber('offlineUsers', offlineUsers);
  }

  // Animate number change
  function animateNumber(elementId, targetValue) {
    const element = document.getElementById(elementId);
    if (!element) return;
    
    const currentValue = parseInt(element.textContent) || 0;
    const increment = (targetValue - currentValue) / 20;
    let current = currentValue;
    
    const timer = setInterval(() => {
      current += increment;
      if ((increment > 0 && current >= targetValue) || (increment < 0 && current <= targetValue)) {
        element.textContent = targetValue;
        clearInterval(timer);
      } else {
        element.textContent = Math.round(current);
      }
    }, 30);
  }

  // Filter and render users
  function filterAndRenderUsers() {
    let filteredUsers = [...onlineUsers];
    
    // Apply status filter
    if (currentFilter === 'active') {
      filteredUsers = filteredUsers.filter(u => u.status === 'active');
    } else if (currentFilter === 'idle') {
      filteredUsers = filteredUsers.filter(u => u.status === 'idle');
    } else if (currentFilter === 'offline') {
      filteredUsers = filteredUsers.filter(u => u.status === 'offline');
    } else if (currentFilter === 'disabled') {
      filteredUsers = filteredUsers.filter(u => u.status === 'disabled');
    }
    
    // Apply search filter
    if (searchQuery) {
      filteredUsers = filteredUsers.filter(u => 
        (u.name || '').toLowerCase().includes(searchQuery) ||
        (u.email || '').toLowerCase().includes(searchQuery)
      );
    }
    
    renderUsers(filteredUsers);
    updateDisplayedCount(filteredUsers.length);
  }

  // Render users grid
  function renderUsers(users) {
    closeUserActionMenu();

    const grid = document.getElementById('usersGrid');
    const emptyState = document.getElementById('emptyState');
    const loadingState = document.getElementById('loadingState');
    
    if (!grid) return;
    
    // Always hide loading state when rendering users
    if (loadingState) loadingState.style.display = 'none';
    
    if (users.length === 0) {
      grid.innerHTML = '';
      grid.style.display = 'none';
      if (emptyState) emptyState.style.display = 'flex';
      return;
    }
    
    if (emptyState) emptyState.style.display = 'none';
    grid.style.display = '';
    
    const isDisabled = (s) => s === 'disabled';
    grid.innerHTML = users.map(user => {
      const blocked = isDisabled(user.status);
      return `
      <div class="user-card" data-user-id="${user.id}">
        <div class="user-card-row1" style="justify-content: space-between; overflow: visible;">
          <div style="display: flex; align-items: center; gap: 0.75rem; flex: 1; min-width: 0; overflow: hidden;">
            <div class="user-avatar">
              <img src="${user.avatar || ''}" alt="${user.name}">
              <span class="status-indicator ${user.status}"></span>
            </div>
            <div class="user-info-row1" style="flex-direction: column; align-items: flex-start; gap: 0.15rem; flex: 1; min-width: 0; overflow: hidden;">
              <div style="display: flex; align-items: center; gap: 0.35rem; width: 100%;">
                <h4 class="user-name" title="${user.name}" style="margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${user.name}</h4>
                ${user.status === 'idle' ? `<span class="user-badge-idle">${user.activity}</span>` : ''}
              </div>
              <span class="user-time" style="font-size: 0.7rem;">${formatTimeAgoSafe(user.lastActivity)}</span>
            </div>
          </div>
          <button class="btn-action-dots" data-userid="${user.id}" onclick="toggleUserActionMenu('${user.id}', event)" title="Thêm hành động">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="6" r="1.5"></circle>
              <circle cx="12" cy="12" r="1.5"></circle>
              <circle cx="12" cy="18" r="1.5"></circle>
            </svg>
          </button>
        </div>
      </div>
    `}).join('');

    if (window.innerWidth <= 600) {
      grid.scrollTop = 0;
    }
  }

  // Update displayed count
  function updateDisplayedCount(count) {
    const countElement = document.getElementById('displayedCount');
    if (countElement) {
      countElement.textContent = `${count} người dùng`;
    }
  }

  // ========================================
  // SINGLE ACTIVE DROPDOWN STATE
  // ========================================
  let activeUserActionUserId = null;
  let activeUserActionButton = null;

  function closeUserActionMenu() {
    const dropdown = document.getElementById('floatingUserActionDropdown');
    if (dropdown) {
      dropdown.remove();
    }
    activeUserActionUserId = null;
    activeUserActionButton = null;
  }

  function positionUserActionMenu() {
    const dropdown = document.getElementById('floatingUserActionDropdown');
    if (!dropdown || !activeUserActionButton) return;

    if (!document.body.contains(activeUserActionButton)) {
      closeUserActionMenu();
      return;
    }

    const rect = activeUserActionButton.getBoundingClientRect();
    dropdown.style.position = 'fixed';
    dropdown.style.zIndex = '99999';
    dropdown.style.top = (rect.bottom + 6) + 'px';
    dropdown.style.left = 'auto';
    dropdown.style.right = (window.innerWidth - rect.right) + 'px';
  }

  window.addEventListener('scroll', positionUserActionMenu, true);
  window.addEventListener('resize', positionUserActionMenu);

  // Toggle user action menu (single active dropdown)
  window.toggleUserActionMenu = function(userId, event) {
    event.preventDefault();
    event.stopPropagation();

    const clickedButton = event.currentTarget || event.target.closest('.btn-action-dots');
    if (!clickedButton) return;

    const normalizedUserId = String(userId);

    // If same user's dropdown is open, close it (toggle off)
    if (activeUserActionUserId === normalizedUserId && document.getElementById('floatingUserActionDropdown')) {
      closeUserActionMenu();
      return;
    }

    // Close any existing dropdown first
    closeUserActionMenu();

    const user = onlineUsers.find(item => String(item.id) === normalizedUserId);
    if (!user) return;

    activeUserActionUserId = normalizedUserId;
    activeUserActionButton = clickedButton;

    const blocked = user.status === 'disabled';

    const dropdown = document.createElement('div');
    dropdown.id = 'floatingUserActionDropdown';
    dropdown.className = 'user-action-dropdown';
    dropdown.dataset.userid = normalizedUserId;
    dropdown.innerHTML = `
      <button type="button" class="btn-block-user ${blocked ? 'unblock' : 'block'}" onclick="toggleUserBlock('${user.id}', ${!blocked}, event)">
        <span>${blocked ? 'Mở khóa' : 'Khóa'}</span>
      </button>
    `;

    document.body.appendChild(dropdown);
    positionUserActionMenu();
  };

  // Close menus when clicking outside
  document.addEventListener('click', function(event) {
    if (!event.target.closest('.btn-action-dots') && !event.target.closest('#floatingUserActionDropdown')) {
      closeUserActionMenu();
    }
  });

  // Toggle online users list display
  window.toggleOnlineUsersList = function(event) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }

    closeUserActionMenu();

    const section = document.querySelector('.online-users-section');
    const content = document.getElementById('onlineUsersCollapsibleContent');
    const toggleBtn = document.getElementById('toggleUsersListBtn');

    if (!section || !content || !toggleBtn) return;

    const collapsed = section.classList.toggle('is-collapsed');
    content.hidden = collapsed;
    toggleBtn.setAttribute('aria-expanded', String(!collapsed));
  };

  // Format time ago
  function formatTimeAgo(date) {
    const seconds = Math.floor((new Date() - new Date(date)) / 1000);
    
    if (seconds < 60) return 'Vừa xong';
    if (seconds < 3600) return `${Math.floor(seconds / 60)} phút trước`;
    if (seconds < 86400) return `${Math.floor(seconds / 3600)} giờ trước`;
    return `${Math.floor(seconds / 86400)} ngày trước`;
  }

  function formatTimeAgoSafe(date) {
    if (!date) return 'Không có dữ liệu';
    const parsed = new Date(date);
    if (Number.isNaN(parsed.getTime())) return 'Không có dữ liệu';
    return formatTimeAgo(parsed);
  }

  // Render activity timeline
  function renderActivityTimeline() {
    const timeline = document.getElementById('activityTimeline');
    if (!timeline) return;

    if (!recentActivities || recentActivities.length === 0) {
      timeline.innerHTML = `
        <div class="timeline-item">
          <div class="timeline-content">
            <p class="timeline-text">Chưa có hoạt động gần đây</p>
          </div>
        </div>
      `;
      return;
    }

    timeline.innerHTML = recentActivities.map(act => {
      let iconHtml = '';
      let text = '';
      
      switch (act.type) {
        case 'login':
          iconHtml = `
            <div class="timeline-icon login">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                <polyline points="10 17 15 12 10 7"/>
                <line x1="15" y1="12" x2="3" y2="12"/>
              </svg>
            </div>
          `;
          text = `<strong>${act.user}</strong> đã đăng nhập`;
          break;
        case 'logout':
          iconHtml = `
            <div class="timeline-icon logout">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
            </div>
          `;
          text = `<strong>${act.user}</strong> đã đăng xuất`;
          break;
        case 'activity':
          iconHtml = `
            <div class="timeline-icon activity">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
              </svg>
            </div>
          `;
          text = `<strong>${act.user}</strong> ${act.action}`;
          break;
        default:
          iconHtml = `
            <div class="timeline-icon activity">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
              </svg>
            </div>
          `;
          text = `<strong>${act.user}</strong> ${act.action || 'có hoạt động'}`;
          break;
      }
      
      return `
        <div class="timeline-item">
          ${iconHtml}
          <div class="timeline-content">
            <p class="timeline-text">${text}</p>
            <p class="timeline-time">${formatTimeAgo(act.time)}</p>
          </div>
        </div>
      `;
    }).join('');
  }

  function callAppsScript(functionName, ...args) {
    return new Promise((resolve, reject) => {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        reject(new Error('google.script.run chưa sẵn sàng'));
        return;
      }

      let runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((error) => {
          reject(error instanceof Error ? error : new Error(String(error)));
        });

      if (typeof runner[functionName] !== 'function') {
        reject(new Error(`Không tìm thấy hàm server: ${functionName}`));
        return;
      }

      runner[functionName](...args);
    });
  }

  // Show/hide loading state
  function showLoading(show) {
    const loadingState = document.getElementById('loadingState');
    const usersGrid = document.getElementById('usersGrid');
    const emptyState = document.getElementById('emptyState');
    
    if (show) {
      if (loadingState) loadingState.style.display = 'flex';
      if (usersGrid) usersGrid.style.display = 'none';
      if (emptyState) emptyState.style.display = 'none';
    } else {
      if (loadingState) loadingState.style.display = 'none';
      if (usersGrid && usersGrid.style.display === 'none' && usersGrid.innerHTML.trim() !== '') {
        usersGrid.style.display = '';
      }
    }
  }

  // Show error message
  function showError(message) {

    console.error(message);

  // Refresh online users
  function refreshOnlineUsers() {

    const refreshBtn = document.querySelector('.refresh-btn svg');
    if (refreshBtn) {
      refreshBtn.style.transition = 'transform 0.5s ease';
      refreshBtn.style.transform = 'rotate(360deg)';
      setTimeout(() => {
        refreshBtn.style.transform = 'rotate(0deg)';
      }, 500);
    }
    
    loadOnlineUsers();
    loadDashboardCharts();
  }



  let dashboardChartRefreshTick = 0;

  // Start auto refresh
  function startAutoRefresh() {
    stopAutoRefresh();
    // Refresh every 30 seconds only when admin page is active
    refreshInterval = setInterval(() => {
      if (!isOnlineStatsPageActive()) return;
      loadOnlineUsers();

      dashboardChartRefreshTick++;
      if (dashboardChartRefreshTick >= 4) {
        dashboardChartRefreshTick = 0;
        loadDashboardCharts();
      }
    }, 30000);
  }

  // Stop auto refresh
  function stopAutoRefresh() {
    if (refreshInterval) {
      clearInterval(refreshInterval);
      refreshInterval = null;
    }
  }

  // Toggle user block status
  async function toggleUserBlock(userId, isBlocked, event) {
    if (event) {
      event.stopPropagation();
    }
    
    const confirmMessage = isBlocked ? 'Bạn có chắc chắn muốn khóa tài khoản này?' : 'Bạn có chắc chắn muốn mở khóa tài khoản này?';
    
    const confirmed = typeof window.showAppConfirm === 'function' 
      ? await window.showAppConfirm(confirmMessage, { 
          confirmText: isBlocked ? 'Khóa' : 'Mở khóa', 
          cancelText: 'Hủy', 
          isDanger: isBlocked 
        }) 
      : confirm(confirmMessage);
      
    if (!confirmed) {
      return;
    }
    
    showLoading(true);
    try {
      const result = await callAppsScript('toggleUserBlockStatus', userId, isBlocked);
      if (result && result.success) {
        if (typeof window.showToast === 'function') {
          window.showToast(result.message, 'success');
        }
        // Refresh list
        loadOnlineUsers();
      } else {
        if (typeof window.showToast === 'function') {
          window.showToast(result.message || 'Có lỗi xảy ra', 'error');
        } else {
          alert(result.message || 'Có lỗi xảy ra');
        }
        showLoading(false);
      }
    } catch (error) {
      console.error('Error toggling block status:', error);
      if (typeof window.showToast === 'function') {
        window.showToast('Có lỗi xảy ra: ' + error.message, 'error');
      } else {
        alert('Có lỗi xảy ra: ' + error.message);
      }
      showLoading(false);
    }
  }

  // Meteor effect
  function initMeteorEffect() {
    const container = document.getElementById('onlineStatsMeteorContainer');
    if (!container) return;
    if (!isOnlineStatsPageActive()) return;
    
    // Check if galaxy effects should be hidden
    if (document.body.classList.contains('hide-galaxy-effects')) return;
    
    function createMeteor() {
      const meteor = document.createElement('div');
      meteor.className = 'online-stats-meteor';
      meteor.style.left = `${Math.random() * 100}%`;
      meteor.style.top = `${Math.random() * 30}%`;
      meteor.style.animationDuration = `${1 + Math.random() * 0.5}s`;
      
      container.appendChild(meteor);
      
      setTimeout(() => {
        meteor.remove();
      }, 2000);
    }
    
    if (meteorInterval) {
      clearInterval(meteorInterval);
    }

    // Create meteors periodically
    meteorInterval = setInterval(() => {
      if (!isOnlineStatsPageActive()) return;
      if (Math.random() > 0.7) {
        createMeteor();
      }
    }, 2000);
  }

  // Debounce utility
  function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
      const later = () => {
        clearTimeout(timeout);
        func(...args);
      };
      clearTimeout(timeout);
      timeout = setTimeout(later, wait);
    };
  }

  // Expose hook so admin sidebar navigation can init this page lazily.
  window.initonlinestats = initOnlineStatsPage;

  // Initialize only if admin page is currently active.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      if (isOnlineStatsPageActive()) initOnlineStatsPage();
    });
  } else if (isOnlineStatsPageActive()) {
    initOnlineStatsPage();
  }

  // Cleanup on page unload
  window.addEventListener('beforeunload', () => {
    stopAutoRefresh();
    if (meteorInterval) {
      clearInterval(meteorInterval);
      meteorInterval = null;
    }
  });


</script>
