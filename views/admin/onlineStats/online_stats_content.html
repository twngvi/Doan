<!-- Online Statistics Page Content -->
<div class="online-stats-page">
  <!-- Animated Background -->
  <div class="online-stats-bg-effects">
    <div class="online-stats-gradient-orb orb-1"></div>
    <div class="online-stats-gradient-orb orb-2"></div>
    <div class="online-stats-gradient-orb orb-3"></div>
    <!-- Meteor Shower Container -->
    <div
      class="online-stats-meteor-container"
      id="onlineStatsMeteorContainer"
    ></div>
  </div>

  <div class="online-stats-container">
    <!-- Header Section -->
    <div class="online-stats-header admin-unified-header">
      <div class="header-content admin-unified-header-main">
        <div class="header-icon gradient-blue admin-unified-header-icon">
          <svg
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
        </div>
        <div class="header-text admin-unified-header-text">
          <h1 class="page-title admin-unified-header-title">Tổng quan</h1>
        </div>
      </div>
      <div class="header-stats admin-unified-header-actions">
        <div class="stat-badge online">
          <span class="stat-dot"></span>
          <span class="stat-number" id="totalOnline">0</span>
          <span class="stat-label">Đang online</span>
        </div>
      </div>
    </div>

    <!-- Stats Cards Row -->
    <div class="stats-cards-row">
      <div class="stat-card">
        <div class="stat-card-icon gradient-green">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
        </div>
        <div class="stat-card-content">
          <span class="stat-card-value" id="activeNow">0</span>
          <span class="stat-card-label">Hoạt động</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-card-icon gradient-yellow">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
        </div>
        <div class="stat-card-content">
          <span class="stat-card-value" id="idleUsers">0</span>
          <span class="stat-card-label">Nhàn rỗi</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-card-icon gradient-red">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
        </div>
        <div class="stat-card-content">
          <span class="stat-card-value" id="offlineUsers">0</span>
          <span class="stat-card-label">Offline</span>
        </div>
      </div>
    </div>

    <!-- Online Users List -->
    <div class="online-users-section">
      <div class="section-header">
        <h2 class="section-title" style="cursor: pointer;" onclick="toggleOnlineUsersList()">Danh sách trạng thái tài khoản</h2>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="section-count" id="displayedCount">0 người dùng</span>
          <button class="btn-collapse-list" id="toggleUsersListBtn" onclick="toggleOnlineUsersList()" style="background: transparent; border: 1px solid var(--theme-border-light); color: var(--theme-text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 6px; transition: transform 0.3s ease;" title="Thu gọn / Mở rộng">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
          </button>
        </div>
      </div>

      <div id="onlineUsersCollapsibleContent">
        <!-- Search & Filter Section -->
        <div class="search-filter-section">
          <div class="search-box">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              type="text"
              id="searchUser"
              placeholder="Tìm kiếm người dùng..."
              class="search-input"
            />
          </div>
          <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">Tất cả</button>
            <button class="filter-btn" data-filter="active">Đang hoạt động</button>
            <button class="filter-btn" data-filter="idle">Nhàn rỗi</button>
            <button class="filter-btn" data-filter="offline">Offline</button>
            <button class="filter-btn" data-filter="disabled">Bị khóa</button>
          </div>
          <button class="refresh-btn" onclick="refreshOnlineUsers()">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="23 4 23 10 17 10" />
              <polyline points="1 20 1 14 7 14" />
              <path
                d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
              />
            </svg>
            <span>Làm mới</span>
          </button>
        </div>

        <div class="online-users-list" id="onlineUsersList">
          <!-- Loading State -->
          <div class="admin-loading-container">
            <div class="admin-loading-popup">
              <div class="admin-loading-logo">
                <span class="logo-o">O</span>
                <div class="logo-dots">
                  <div class="dot"></div>
                  <div class="dot"></div>
                  <div class="dot"></div>
                </div>
              </div>
              <div class="admin-loading-text">Đang tải danh sách...</div>
            </div>
          </div>

          <!-- Empty State (hidden by default) -->
          <div class="empty-state" id="emptyState" style="display: none">
            <svg
              width="64"
              height="64"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M8 15h8" />
              <circle cx="9" cy="9" r="1" />
              <circle cx="15" cy="9" r="1" />
            </svg>
            <p>Không có tài khoản phù hợp với bộ lọc</p>
          </div>

          <!-- User Cards Container -->
          <div class="users-grid" id="usersGrid">
            <!-- User cards will be dynamically inserted here -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
