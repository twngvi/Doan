  <div class="question-manager-page">
    <div class="admin-unified-header" style="margin-bottom: 24px;">
      <div class="admin-unified-header-main">
        <div class="admin-unified-header-icon" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
          <span class="material-symbols-sharp" style="font-size: 28px;">quiz</span>
        </div>
        <div class="admin-unified-header-text">
          <h1 class="admin-unified-header-title">Quản lý câu hỏi Quiz</h1>
          <p class="admin-unified-header-subtitle">Duyệt và tạo câu hỏi trắc nghiệm tự động bằng AI</p>
        </div>
      </div>
    </div>

    <!-- Topic Selection & Generation Controls -->
    <div class="qm-card qm-controls-card">
      <div class="qm-card-body">
        <div class="qm-form-row">
          <div class="qm-form-group" style="flex: 2;">
            <label>Chọn Topic</label>
            <select id="qmTopicSelect" class="qm-input" onchange="qmLoadTopicQuestions()">
              <option value="">-- Đang tải danh sách topic --</option>
            </select>
          </div>
          
          <div class="qm-form-group">
            <label>Số lượng tạo</label>
            <select id="qmAiCount" class="qm-input">
              <option value="5">5 câu</option>
              <option value="10" selected>10 câu</option>
              <option value="15">15 câu</option>
              <option value="20">20 câu</option>
            </select>
          </div>
          
          <div class="qm-form-group">
            <label>Mức độ</label>
            <select id="qmAiDifficulty" class="qm-input">
              <option value="easy">Dễ</option>
              <option value="medium">Trung bình</option>
              <option value="hard">Khó</option>
              <option value="mixed" selected>Hỗn hợp</option>
            </select>
          </div>
          
          <div class="qm-form-group" style="display: flex; align-items: flex-end;">
            <button class="qm-btn qm-btn-primary" id="qmGenerateBtn" onclick="qmGenerateAIQuestions()" style="width: 100%;">
              <span class="material-symbols-sharp" style="font-size: 18px; margin-right: 8px;">auto_awesome</span>
              Tạo bằng AI
            </button>
          </div>
        </div>
        
        <!-- Topic Stats -->
        <div class="qm-topic-stats" id="qmTopicStats" style="display: none;">
          <div class="qm-stat-item">
            <span class="qm-stat-label">Trạng thái Quiz:</span>
            <span class="qm-badge" id="qmTopicStatusBadge">--</span>
          </div>
          <div class="qm-stat-item">
            <span class="qm-stat-label">Đã duyệt:</span>
            <strong class="qm-text-success" id="qmApprovedCount">0</strong>
          </div>
          <div class="qm-stat-item">
            <span class="qm-stat-label">Bản nháp:</span>
            <strong class="qm-text-warning" id="qmDraftCount">0</strong>
          </div>
          
          <div style="flex: 1; text-align: right;">
            <button class="qm-btn qm-btn-outline" onclick="qmAddNewManualQuestion()">
              <span class="material-symbols-sharp" style="font-size: 18px;">add</span> Thêm thủ công
            </button>
            <button class="qm-btn qm-btn-success" id="qmPublishBtn" onclick="qmPublishTopicQuiz()" style="display: none; margin-left: 8px;">
              <span class="material-symbols-sharp" style="font-size: 18px;">publish</span> Công bố Topic
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading State -->
    <div id="qmLoadingState" class="qm-loading" style="display: none;">
      <div class="loading-spinner"></div>
      <p id="qmLoadingText">Đang xử lý...</p>
    </div>

    <!-- Questions List Area -->
    <div id="qmQuestionsArea" style="display: none;">
      <div class="qm-action-bar">
        <h3>Danh sách câu hỏi <span class="qm-count-badge" id="qmListCount">0</span></h3>
        <div class="qm-actions">
          <label class="qm-checkbox-label">
            <input type="checkbox" id="qmSelectAll" onchange="qmToggleSelectAll(this)"> Chọn tất cả
          </label>
          <button class="qm-btn qm-btn-primary" onclick="qmSaveApprovedQuestions()">
            <span class="material-symbols-sharp" style="font-size: 18px;">save</span> Lưu câu hỏi đã chọn
          </button>
        </div>
      </div>
      
      <div id="qmQuestionsList" class="qm-questions-list">
        <!-- Questions will be rendered here -->
      </div>
    </div>

    <!-- Empty State -->
    <div id="qmEmptyState" class="qm-empty-state" style="display: none;">
      <span class="material-symbols-sharp" style="font-size: 64px; color: #cbd5e1; margin-bottom: 16px;">quiz</span>
      <h3 style="color: #64748b;">Chưa có câu hỏi nào</h3>
      <p style="color: #94a3b8; max-width: 400px; margin: 8px auto 0;">Hãy chọn Topic và bấm "Tạo bằng AI" hoặc "Thêm thủ công" để bắt đầu xây dựng kho câu hỏi.</p>
    </div>
  </div>
