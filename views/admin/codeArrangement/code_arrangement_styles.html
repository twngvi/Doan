<style>
  /* Code Arrangement Styles inherited from Question Manager */
  .code-arrangement-page {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--theme-dashboard-bg);
  }

  .ca-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    background: var(--theme-card);
    padding: 20px 24px;
    border-radius: 12px;
    box-shadow: 0 4px 12px var(--theme-shadow);
  }

  .ca-header-title h1 {
    font-size: 24px;
    font-weight: 700;
    color: var(--theme-text);
    margin: 0 0 8px 0;
  }

  .ca-header-title p {
    color: var(--theme-text-secondary);
    margin: 0;
    font-size: 14px;
  }

  .ca-actions {
    display: flex;
    gap: 12px;
  }

  .ca-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
  }

  .ca-btn-primary {
    background: linear-gradient(135deg, #1a73e8, #1557b0);
    color: white;
  }

  .ca-btn-primary:hover {
    box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
    transform: translateY(-1px);
  }

  .ca-filters {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
    background: var(--theme-card);
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 8px var(--theme-shadow);
    flex-wrap: wrap;
  }

  .ca-filter-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    min-width: 200px;
  }

  .ca-filter-group label {
    font-size: 13px;
    font-weight: 600;
    color: var(--theme-text-secondary);
  }

  .ca-input {
    padding: 10px 12px;
    border: 1px solid var(--theme-card-border);
    border-radius: 8px;
    background: var(--theme-bg);
    color: var(--theme-text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .ca-input:focus {
    border-color: #1a73e8;
  }

  .ca-list-container {
    background: var(--theme-card);
    border-radius: 12px;
    box-shadow: 0 4px 12px var(--theme-shadow);
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .ca-table {
    width: 100%;
    border-collapse: collapse;
  }

  .ca-table th,
  .ca-table td {
    padding: 16px;
    text-align: left;
    border-bottom: 1px solid var(--theme-card-border);
  }

  .ca-table th {
    background: #1e40af;
    font-weight: 700;
    font-size: 13px;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    border-bottom: 2px solid #1e3a8a;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .ca-table td {
    color: var(--theme-text);
  }

  .ca-table td:last-child {
    text-align: right;
  }

  .ca-table th:last-child {
    text-align: right;
    padding-right: 60px;
  }

  .ca-table tr:hover {
    background: var(--theme-dashboard-bg);
  }

  .ca-table tr[draggable="true"] {
    cursor: grab;
    transition: background-color 0.15s ease, transform 0.15s ease;
  }
  .ca-table tr[draggable="true"]:active {
    cursor: grabbing;
  }
  .ca-table tr.ca-row-dragging {
    opacity: 0.4;
    background: rgba(37, 99, 235, 0.1) !important;
  }
  .ca-table tr.ca-row-drag-over {
    border-top: 2px dashed #2563eb !important;
    background: rgba(37, 99, 235, 0.08) !important;
  }
  .ca-drag-handle {
    cursor: grab;
    color: var(--theme-text-secondary);
    display: inline-flex;
    align-items: center;
    vertical-align: middle;
    margin-right: 4px;
    font-size: 16px;
  }
  .ca-drag-handle:hover {
    color: #2563eb;
  }

  .ca-status-badge {
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    text-transform: capitalize;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid transparent;
    user-select: none;
  }

  .ca-status-badge:hover {
    transform: translateY(-1px);
    filter: brightness(0.92);
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  .status-published {
    background: rgba(52, 168, 83, 0.1);
    color: #34a853;
  }
  .status-draft {
    background: rgba(251, 188, 5, 0.1);
    color: #fbbc05;
  }
  .status-hidden {
    background: rgba(234, 67, 53, 0.1);
    color: #ea4335;
  }

  .ca-action-btns {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .ca-icon-btn {
    width: 36px;
    height: 36px;
    border: 1px solid transparent;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    color: #ffffff !important;
  }

  .ca-icon-btn:hover {
    transform: translateY(-1px);
  }

  .ca-icon-btn.view {
    background: linear-gradient(135deg, #3b82f6, #2563eb) !important;
    border-color: #1d4ed8;
  }

  .ca-icon-btn.view:hover {
    background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
    box-shadow: 0 6px 14px rgba(37, 99, 235, 0.35);
  }

  .ca-icon-btn.edit {
    background: linear-gradient(135deg, #f59e0b, #d97706) !important;
    border-color: #b45309;
  }

  .ca-icon-btn.edit:hover {
    background: linear-gradient(135deg, #d97706, #b45309) !important;
    box-shadow: 0 6px 14px rgba(217, 119, 6, 0.35);
  }

  .ca-icon-btn.delete {
    background: linear-gradient(135deg, #ef4444, #dc2626) !important;
    border-color: #b91c1c;
  }

  .ca-icon-btn.delete:hover {
    background: linear-gradient(135deg, #dc2626, #b91c1c) !important;
    box-shadow: 0 6px 14px rgba(220, 38, 38, 0.35);
  }

  /* Modal Styles */
  .ca-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    backdrop-filter: blur(4px);
  }

  .ca-modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .ca-modal {
    background: var(--theme-card);
    width: 94%;
    max-width: 1120px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    display: flex;
    flex-direction: column;
    max-height: 90vh;
    transform: translateY(20px);
    transition: transform 0.3s;
  }

  .ca-modal-overlay.active .ca-modal {
    transform: translateY(0);
  }

  .ca-modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--theme-card-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .ca-modal-header h2 {
    margin: 0;
    font-size: 20px;
    color: var(--theme-text);
  }

  .ca-modal-close {
    background: none;
    border: none;
    color: var(--theme-text-secondary);
    cursor: pointer;
    padding: 4px;
  }

  .ca-modal-body {
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .ca-form-row {
    display: flex;
    gap: 16px;
  }

  .ca-form-row > div {
    flex: 1;
  }

  .ca-textarea {
    min-height: 120px;
    resize: vertical;
    font-family: monospace;
    white-space: pre;
  }

  .ca-modal-footer {
    padding: 20px 24px;
    border-top: 1px solid var(--theme-card-border);
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }

  .ca-btn-secondary {
    background: var(--theme-dashboard-bg);
    color: var(--theme-text);
    border: 1px solid var(--theme-card-border);
  }

  .ca-btn-secondary:hover {
    background: var(--theme-card-border);
  }

  /* ========== FULLSCREEN ADMIN PREVIEW (Simulates Client Code Sort exactly like Topic Editor) ========== */

  #caPreviewModalOverlay.admin-preview-overlay.active,
  body.has-admin-sidebar #caPreviewModalOverlay.admin-preview-overlay,

    overflow-x: hidden !important;

  }

  #caPreviewModalOverlay.admin-preview-overlay {
    display: none;
    opacity: 0;
  }

  #caPreviewModalOverlay.admin-preview-overlay.active {
    display: block !important;
    opacity: 1 !important;
  }

  body.has-admin-sidebar.admin-sidebar-collapsed #caPreviewModalOverlay.admin-preview-overlay,
  body.has-admin-sidebar.admin-sidebar-collapsed #caPreviewModalOverlay.admin-preview-overlay.active,
  body.sidebar-collapsed #caPreviewModalOverlay.admin-preview-overlay,

  }

  @media (max-width: 768px) {
    #caPreviewModalOverlay.admin-preview-overlay,
    #caPreviewModalOverlay.admin-preview-overlay.active,
    body.has-admin-sidebar #caPreviewModalOverlay.admin-preview-overlay,
    body.has-admin-sidebar #caPreviewModalOverlay.admin-preview-overlay.active,
    body.has-admin-sidebar.admin-sidebar-collapsed #caPreviewModalOverlay.admin-preview-overlay,
    body.has-admin-sidebar.admin-sidebar-collapsed #caPreviewModalOverlay.admin-preview-overlay.active {

      width: 100vw !important;
    }
  }

  /* ========== PREVIEW HEADER (Now handled globally) ========== */

  /* Preview Block & Interactive Cards */
  .ca-preview-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--theme-card, #1e293b);
    border: 1px solid var(--theme-card-border, rgba(255,255,255,0.12));
    border-radius: 10px;
    cursor: grab;
    transition: all 0.2s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    user-select: none;
  }

  .ca-preview-card:hover {
    border-color: #3b82f6;
    box-shadow: 0 4px 12px rgba(59,130,246,0.2);
    transform: translateY(-1px);
  }

  .ca-preview-card:active {
    cursor: grabbing;
  }

  .ca-preview-card.dragging {
    opacity: 0.5;
    background: rgba(59,130,246,0.1);
    border: 2px dashed #3b82f6;
  }

  .ca-preview-card.correct {
    border-color: #10b981 !important;
    background: rgba(16,185,129,0.1) !important;
  }

  .ca-preview-card.incorrect {
    border-color: #ef4444 !important;
    background: rgba(239,68,68,0.1) !important;
  }

  .ca-preview-card-handle {
    color: var(--theme-text-secondary, #64748b);
    display: flex;
    align-items: center;
  }

  .ca-preview-card-index {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: rgba(255,255,255,0.06);
    color: var(--theme-text-secondary, #94a3b8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.82rem;
    font-weight: 700;
    flex-shrink: 0;
  }

  .ca-preview-card-code {
    flex: 1;
    font-family: 'Fira Code', 'Courier New', monospace;
    font-size: 0.92rem;
    color: var(--theme-text, #f8fafc);
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.5;
  }

  /* Editable Sliced Blocks */
  .ca-blocks-toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-top: 12px;
    margin-bottom: 16px;
    padding: 12px;
    background: var(--theme-dashboard-bg);
    border-radius: 8px;
    border: 1px solid var(--theme-card-border);
  }

  .ca-sliced-blocks-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 16px;
  }

  .ca-block-card {
    display: flex;
    gap: 12px;
    background: var(--theme-bg);
    border: 1px solid var(--theme-card-border);
    border-radius: 8px;
    padding: 12px;
    box-shadow: 0 2px 4px var(--theme-shadow);
    transition: box-shadow 0.2s;
  }

  .ca-block-card:hover {
    box-shadow: 0 4px 8px var(--theme-shadow);
  }

  .ca-block-number {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 30px;
    font-weight: bold;
    color: var(--theme-text-secondary);
    gap: 8px;
  }

  .ca-block-number button {
    cursor: pointer;
    background: none;
    border: none;
    color: var(--theme-text-secondary);
    padding: 2px;
    border-radius: 4px;
    transition: all 0.2s;
  }

  .ca-block-number button:hover {
    background: var(--theme-card-border);
    color: var(--theme-primary);
  }

  .ca-block-content {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .ca-block-content textarea {
    width: 100%;
    min-height: 50px;
    resize: vertical;
    padding: 8px;
    font-family: monospace;
    border: 1px solid var(--theme-card-border);
    border-radius: 6px;
    background: var(--theme-card);
    color: var(--theme-text);
    outline: none;
  }

  .ca-block-content textarea:focus {
    border-color: var(--theme-primary);
  }

  .ca-block-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    justify-content: center;
  }

  .ca-block-actions button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border: 1px solid var(--theme-card-border);
    border-radius: 6px;
    background: var(--theme-card);
    color: var(--theme-text-secondary);
    cursor: pointer;
    transition: all 0.2s;
  }

  .ca-block-actions button:hover {
    background: var(--theme-dashboard-bg);
    color: var(--theme-primary);
    border-color: var(--theme-primary);
  }

  .ca-block-actions button.ca-btn-danger:hover {
    color: #ea4335;
    border-color: #ea4335;
    background: rgba(234, 67, 53, 0.1);
  }

  /* Success Toast Notification */
  .ca-toast-container {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 10000;
    display: flex;
    flex-direction: column;
    gap: 12px;
    pointer-events: none;
  }

  .ca-toast {
    width: min(420px, calc(100vw - 32px));
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 16px 16px;
    border-radius: 16px;
    background: var(--theme-card);
    color: var(--theme-text);
    border: 1px solid var(--theme-card-border);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16);
    pointer-events: auto;
    opacity: 0;
    transform: translateY(18px) scale(0.98);
    transition:
      opacity 0.25s ease,
      transform 0.25s ease;
    overflow: hidden;
    position: relative;
  }

  .ca-toast::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 5px;
    height: 100%;
    background: #22c55e;
  }

  .ca-toast.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .ca-toast.hide {
    opacity: 0;
    transform: translateY(12px) scale(0.98);
  }

  .ca-toast-icon {
    width: 38px;
    height: 38px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .ca-toast-icon .material-symbols-sharp {
    font-size: 22px;
  }

  .ca-toast-content {
    flex: 1;
    min-width: 0;
  }

  .ca-toast-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .ca-toast-message {
    font-size: 13px;
    line-height: 1.45;
    color: var(--theme-text-secondary);
  }

  .ca-toast-close {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--theme-text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    flex-shrink: 0;
  }

  .ca-toast-close:hover {
    background: var(--theme-dashboard-bg);
    color: var(--theme-text);
  }

  .ca-toast-close .material-symbols-sharp {
    font-size: 18px;
  }

  /* Xuáº¥t báº£n thÃ nh cÃ´ng */
  .ca-toast-publish::before {
    background: #1a73e8;
  }

  .ca-toast-publish .ca-toast-icon {
    background: rgba(26, 115, 232, 0.12);
    color: #1a73e8;
  }

  /* LÆ°u nhÃ¡p thÃ nh cÃ´ng */
  .ca-toast-draft::before {
    background: #f59e0b;
  }

  .ca-toast-draft .ca-toast-icon {
    background: rgba(245, 158, 11, 0.14);
    color: #f59e0b;
  }

  /* ThÃ nh cÃ´ng chung */
  .ca-toast-success::before {
    background: #22c55e;
  }

  .ca-toast-success .ca-toast-icon {
    background: rgba(34, 197, 94, 0.14);
    color: #16a34a;
  }

  /* Cáº£nh bÃ¡o */
  .ca-toast-warning::before {
    background: #f59e0b;
  }

  .ca-toast-warning .ca-toast-icon {
    background: rgba(245, 158, 11, 0.14);
    color: #f59e0b;
  }

  /* Lá»—i */
  .ca-toast-error::before {
    background: #ef4444;
  }

  .ca-toast-error .ca-toast-icon {
    background: rgba(239, 68, 68, 0.12);
    color: #ef4444;
  }

  @media (max-width: 640px) {
    .ca-toast-container {
      left: 16px;
      right: 16px;
      bottom: 16px;
    }

    .ca-toast {
      width: 100%;
    }
  }

  /* =================================================
   ADMIN GLOBAL SPACING STANDARD
   Láº¥y trang "Quáº£n lÃ½ cÃ¢u há»i Quiz" lÃ m chuáº©n
================================================= */

  :root {
    --admin-page-padding: 24px;
    --admin-section-gap: 24px;
    --admin-card-padding: 20px;
  }

  /* Reset box sizing Ä‘á»ƒ padding khÃ´ng lÃ m trÃ n ngang */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  /*

    .mc-manager-page,
    .content-management-container,

    .course-stats-page,
    #page-online-stats,
    #page-user-stats,
    .pet-management-page,
    .email-page,

    padding-left: var(--admin-page-padding) !important;

    min-height: 100vh;
    background: var(--theme-dashboard-bg) !important;
  }

  /* 
  Nhá»¯ng trang cÃ³ container con thÃ¬ bá» padding/max-width á»Ÿ container con,
  Ä‘á»ƒ padding chá»‰ náº±m á»Ÿ root page, trÃ¡nh bá»‹ double padding.

    max-width: none !important;
    margin: 0 !important;
    padding: 0 !important;

  }

  :is(.online-stats-page, .user-stats-page) {

  }

  /* Sá»­a lá»—i cÃ¡c trang height 100vh lÃ m máº¥t khoáº£ng trá»‘ng bottom */

    height: auto !important;
    min-height: 100vh !important;
    overflow: visible !important;
  }

  .course-stats-container {

  }

  /* Header cá»§a táº¥t cáº£ trang: top do page padding quáº£n lÃ½, dÆ°á»›i cÃ¡ch 24px */
  :is(
    .admin-unified-header,
    .content-management-header,
    .ca-header,
