<script>
  let caList = [];
  let currentSlicedBlocks = [];
  let isCaFormDirty = false;

  document.addEventListener("DOMContentLoaded", function() {
    const modal = document.getElementById('caModalOverlay');
    if (modal) {
      modal.addEventListener('input', () => {
        isCaFormDirty = true;
      });
    }
  });

  function initCodeArrangementManager() {

  try {
    const oldClasses = Array.from(document.documentElement.classList).filter(c => c.startsWith('is-') && c.endsWith('-page'));
    if (oldClasses.length > 0) {
      document.documentElement.classList.remove(...oldClasses);
      document.body.classList.remove(...oldClasses);
    }
    document.documentElement.classList.add('is-code-arrangement-page');
    document.body.classList.add('is-code-arrangement-page');
    window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
  } catch(e) { console.error(e); }

    loadCAList();
  }

  function caShowLoading(text) {
    const loadingText = document.getElementById("caLoadingText");
    if (loadingText && text) loadingText.textContent = text;
    const loadingState = document.getElementById("caLoadingState");
    if (loadingState) loadingState.style.display = "flex";
    const contentArea = document.getElementById("caContentArea");
    if (contentArea) contentArea.style.display = "none";
  }

  function caHideLoading() {
    const loadingState = document.getElementById("caLoadingState");
    if (loadingState) loadingState.style.display = "none";
    const contentArea = document.getElementById("caContentArea");
    if (contentArea) contentArea.style.display = "block";
  }

  function loadCAList(isSilent = false) {
    const tbody = document.getElementById('caTableBody');
    if (!isSilent) caShowLoading("Đang tải danh sách bài tập Code Sort...");
    
    google.script.run
      .withSuccessHandler(function(response) {
        if (!isSilent) caHideLoading();
        if (response.success) {
          caList = response.data || [];
          renderCAList(caList);
        } else {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #ea4335;">Lỗi: ${response.message}</td></tr>`;
        }
      })
      .withFailureHandler(function(error) {
        if (!isSilent) caHideLoading();
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #ea4335;">Lỗi kết nối: ${error.message}</td></tr>`;
      })
      .adminGetCodeArrangements();
  }

  function filterCAList() {
    const caNormalizeText = (text) => {
      if (!text) return "";
      return String(text)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    };

    const search = caNormalizeText(document.getElementById("adminCaSearchInput").value);

    const status = document.getElementById("caStatusFilter").value;
    const difficulty = document.getElementById("caDifficultyFilter").value;

    const filtered = caList.filter(function (item) {
      const title = caNormalizeText(item.title);
      const arrangementId = caNormalizeText(item.arrangementId);
      const itemStatus = String(item.status || "").toLowerCase();
      const itemDifficulty = String(item.difficulty || "").toLowerCase();

      const matchSearch =
        title.includes(search) ||
        arrangementId.includes(search);

      const matchStatus =
        status === "" ||
        itemStatus === status;

      const matchDifficulty =
        difficulty === "" ||
        itemDifficulty === difficulty;

      return matchSearch && matchStatus && matchDifficulty;
    });

    renderCAList(filtered);
  }

  function renderCAList(list) {
    const tbody = document.getElementById('caTableBody');
    if (!list || list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--theme-text-secondary);">Không có dữ liệu</td></tr>`;
      return;
    }
    
    let html = '';
    list.forEach((item, index) => {
      let statusClass = "status-draft";
      let statusText = "Bản nháp";
      
      if (!item.publishedData) {
        statusClass = "status-draft";
        statusText = "Bản nháp";
      } else if (item.status === 'hidden') {
        statusClass = "status-hidden";
        statusText = "Đang ẩn";
      } else if (item.draftData !== item.publishedData) {
        statusClass = "status-draft";
        statusText = "Có thay đổi chưa XB";
      } else {
        statusClass = "status-published";
        statusText = "Đã xuất bản";
      }
      
      const isHidden = item.status === 'hidden';
      const targetStatus = isHidden ? (item.publishedData ? 'published' : 'draft') : 'hidden';
      const badgeTitle = isHidden ? 'Đang ẩn khỏi học viên. Nhấn để mở hiển thị lại (Xuất bản)' : 'Nhấn để ẩn câu hỏi này khỏi trang học viên';
      const badgeIcon = isHidden ? 'visibility_off' : (statusClass === 'status-published' ? 'check_circle' : 'edit_note');

      html += `
        <tr draggable="true" 
            ondragstart="caOnDragStart(event, ${index})" 
            ondragover="caOnDragOver(event, ${index})" 
            ondragenter="caOnDragEnter(event, ${index})" 
            ondragleave="caOnDragLeave(event, ${index})" 
            ondrop="caOnDrop(event, ${index})" 
            ondragend="caOnDragEnd(event)"
            title="Nhấn giữ và kéo thả để sắp xếp lại thứ tự">
          <td style="text-align: center; font-weight: 600; color: var(--theme-text-secondary); white-space: nowrap;">
            <span class="material-symbols-sharp ca-drag-handle" title="Nắm và kéo để sắp xếp">drag_indicator</span>${index + 1}
          </td>
          <td style="font-weight: 600;">${item.title}</td>
          <td style="text-transform: capitalize;">${item.programmingLanguage}</td>
          <td style="text-transform: capitalize;">${item.difficulty}</td>
          <td>
            <span class="ca-status-badge ${statusClass}" onclick="toggleHideCA('${item.arrangementId}', '${targetStatus}')" title="${badgeTitle}">
              <span class="material-symbols-sharp" style="font-size: 14px;">${badgeIcon}</span>
              <span>${statusText}</span>
            </span>
          </td>
          <td>
            <div class="ca-action-btns">
              <button class="ca-icon-btn view" onclick="previewCA('${item.arrangementId}')" title="Xem trước">
                <span class="material-symbols-sharp" style="font-size: 18px;">visibility</span>
              </button>
              <button class="ca-icon-btn edit" onclick="editCA('${item.arrangementId}')" title="Sửa">
                <span class="material-symbols-sharp" style="font-size: 18px;">edit</span>
              </button>
              <button class="ca-icon-btn delete" onclick="deleteCA('${item.arrangementId}')" title="Xóa">
                <span class="material-symbols-sharp" style="font-size: 18px;">delete</span>
              </button>
            </div>
          </td>
        </tr>
      `;
    });
    
    tbody.innerHTML = html;
  }

  let caDragFromIndex = null;

  function caOnDragStart(e, index) {
    caDragFromIndex = index;
    e.currentTarget.classList.add('ca-row-dragging');
    e.dataTransfer.effectAllowed = 'move';
  }

  function caOnDragOver(e, index) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  }

  function caOnDragEnter(e, index) {
    e.preventDefault();
    if (caDragFromIndex !== null && caDragFromIndex !== index) {
      e.currentTarget.classList.add('ca-row-drag-over');
    }
  }

  function caOnDragLeave(e, index) {
    e.currentTarget.classList.remove('ca-row-drag-over');
  }

  function caOnDrop(e, toIndex) {
    e.preventDefault();
    e.currentTarget.classList.remove('ca-row-drag-over');
    if (caDragFromIndex === null || caDragFromIndex === toIndex) return;

    // 1. Cập nhật vị trí tức thì trên giao diện (Optimistic UI Update)
    const [movedItem] = caList.splice(caDragFromIndex, 1);
    caList.splice(toIndex, 0, movedItem);
    caDragFromIndex = null;

    filterCAList();

    // 2. Đồng bộ ngầm thứ tự xuống máy chủ
    const orderedIds = caList.map(item => item.arrangementId);
    google.script.run
      .withFailureHandler(function(error) {
        caShowToast("Lỗi đồng bộ", "error", "Không thể lưu thứ tự sắp xếp: " + error.message);
      })
      .adminReorderCodeArrangements(orderedIds);
  }

  function caOnDragEnd(e) {
    document.querySelectorAll('#caTableBody tr').forEach(tr => {
      tr.classList.remove('ca-row-dragging', 'ca-row-drag-over');
    });
    caDragFromIndex = null;
  }

  function openCAModal() {
    document.getElementById('caId').value = '';
    document.getElementById('caTitle').value = '';
    document.getElementById('caDescription').value = '';
    document.getElementById('caLanguage').value = 'javascript';
    document.getElementById('caDifficulty').value = 'medium';
    document.getElementById('caStatus').value = 'published';
    document.getElementById('caOriginalCode').value = '';
    
    currentSlicedBlocks = [];
    document.getElementById('caSliceCount').value = 4;
    renderSlicedBlocks();
    
    document.getElementById('caModalTitle').innerText = 'Thêm câu hỏi Code';
    document.getElementById('caModalOverlay').classList.add('active');
    isCaFormDirty = false;
  }

  async function closeCAModal(force = false) {
    if (force === true) {
      document.getElementById('caModalOverlay').classList.remove('active');
      return;
    }
    if (isCaFormDirty) {
      const confirmed = await caShowConfirm({
        title: "Đóng mà chưa lưu?",
        message: "Các thay đổi hiện tại sẽ bị mất nếu bạn đóng cửa sổ này.",
        confirmText: "Đóng",
        cancelText: "Ở lại",
        type: "warning"
      });
      if (!confirmed) {
        return;
      }
    }
    document.getElementById('caModalOverlay').classList.remove('active');
  }

  function editCA(id) {
    const item = caList.find(x => x.arrangementId === id);
    if (!item) return;
    
    document.getElementById('caId').value = item.arrangementId;
    document.getElementById('caTitle').value = item.title;
    document.getElementById('caDescription').value = item.description;
    document.getElementById('caLanguage').value = item.programmingLanguage;
    document.getElementById('caDifficulty').value = item.difficulty || 'medium';
    
    let currentStatus = item.status || 'published';
    if (currentStatus === 'draft') currentStatus = 'published';
    document.getElementById('caStatus').value = currentStatus;
    
    document.getElementById('caOriginalCode').value = item.originalCode || '';
    
    try {
      currentSlicedBlocks = JSON.parse(item.slicedCodeBlocks || "[]");
    } catch(e) {
      currentSlicedBlocks = [];
    }
    
    document.getElementById('caSliceCount').value = currentSlicedBlocks.length || 4;
    renderSlicedBlocks();
    
    document.getElementById('caModalTitle').innerText = 'Sửa câu hỏi Code: ' + id;
    document.getElementById('caModalOverlay').classList.add('active');
    isCaFormDirty = false;
  }

  async function saveCA(action = 'draft') {
    syncBlocksFromUI();
    
    const payload = {
      arrangementId: document.getElementById('caId').value,
      title: document.getElementById('caTitle').value,
      description: document.getElementById('caDescription').value,
      programmingLanguage: document.getElementById('caLanguage').value,
      difficulty: document.getElementById('caDifficulty').value,
      status: document.getElementById('caStatus').value,
      originalCode: document.getElementById('caOriginalCode').value,
      slicedCodeBlocks: JSON.stringify(currentSlicedBlocks),
      action: action
    };
    
    if (!payload.title || payload.title.trim() === '') {
      caShowToast("Thiếu tiêu đề", "warning", "Vui lòng điền tiêu đề cho câu hỏi.");
      return;
    }
    if (!payload.description || payload.description.trim() === '') {
      caShowToast("Thiếu đề bài", "warning", "Vui lòng nhập yêu cầu bài toán.");
      return;
    }
    if (!payload.originalCode || payload.originalCode.trim() === '') {
      caShowToast("Thiếu code gốc", "warning", "Vui lòng nhập code gốc trước khi cắt khối.");
      return;
    }
    
    if (currentSlicedBlocks.length < 2) {
      caShowToast("Chưa đủ khối code", "warning", "Vui lòng cắt code thành ít nhất 2 khối trước khi lưu.");
      return;
    }

    let hasEmptyCard = false;
    let concatenatedCards = '';
    currentSlicedBlocks.forEach(b => {
      if (!b.content || b.content.trim() === '') hasEmptyCard = true;
      concatenatedCards += (b.content || '');
    });
    
    if (hasEmptyCard) {
      caShowToast("Card đang bị trống", "warning", "Vui lòng điền nội dung cho tất cả card code.");
      return;
    }

    const normalizeSpace = str => (str || '').replace(/\s+/g, '').trim();
    if (normalizeSpace(payload.originalCode) !== normalizeSpace(concatenatedCards)) {
      const confirmed = await caShowConfirm({
        title: "Code chưa khớp",
        message: "Nội dung các card sau khi ghép lại không khớp với code gốc. Bạn vẫn muốn lưu?",
        confirmText: "Vẫn lưu",
        cancelText: "Kiểm tra lại",
        type: "warning"
      });
      if (!confirmed) {
        return;
      }
    }
    
    const btnDraft = document.getElementById('caBtnDraft');
    const btnPublish = document.getElementById('caBtnPublish');
    const activeBtn = action === 'publish' ? btnPublish : btnDraft;
    const oldText = activeBtn.innerHTML;
    
    activeBtn.innerHTML = '<div class="loading-spinner" style="width: 16px; height: 16px; margin-right: 8px;"></div> Đang lưu...';
    btnDraft.disabled = true;
    btnPublish.disabled = true;
    
    google.script.run
      .withSuccessHandler(function(response) {
        activeBtn.innerHTML = oldText;
        btnDraft.disabled = false;
        btnPublish.disabled = false;
        
        if (response.success) {
          isCaFormDirty = false;
          if (response.arrangementId) {
            document.getElementById('caId').value = response.arrangementId;
            document.getElementById('caModalTitle').innerText = 'Sửa câu hỏi Code: ' + response.arrangementId;
          }

          const successMessage = action === 'publish'
            ? {
                title: "Xuất bản thành công",
                message: "Bài code đã sẵn sàng hiển thị cho học viên.",
                type: "publish"
              }
            : {
                title: "Đã lưu bản nháp",
                message: "Bạn có thể tiếp tục chỉnh sửa hoặc xuất bản sau.",
                type: "draft"
              };

          loadCAList();
          closeCAModal(true);

          caShowToast(successMessage.title, successMessage.type, successMessage.message);
        } else {
          caShowToast("Không thể lưu", "error", response.message);
        }
      })
      .withFailureHandler(function(error) {
        activeBtn.innerHTML = oldText;
        btnDraft.disabled = false;
        btnPublish.disabled = false;
        caShowToast("Lỗi kết nối", "error", error.message);
      })
      .adminSaveCodeArrangement(payload);
  }

  function caShowToast(title, type = 'success', message = '') {
    let toastContainer = document.getElementById('caToastContainer');

    if (!toastContainer) {
      toastContainer = document.createElement('div');
      toastContainer.id = 'caToastContainer';
      toastContainer.className = 'ca-toast-container';
      document.body.appendChild(toastContainer);
    }

    const toast = document.createElement('div');
    toast.className = `ca-toast ca-toast-${type}`;

    const iconMap = {
      publish: 'rocket_launch',
      draft: 'draft',
      success: 'check_circle',
      warning: 'warning',
      error: 'error'
    };

    const icon = iconMap[type] || 'check_circle';

    toast.innerHTML = `
      <div class="ca-toast-icon">
        <span class="material-symbols-sharp">${icon}</span>
      </div>

      <div class="ca-toast-content">
        <div class="ca-toast-title">${escapeHTML(title)}</div>
        ${message ? `<div class="ca-toast-message">${escapeHTML(message)}</div>` : ''}
      </div>

      <button class="ca-toast-close" type="button" aria-label="Đóng thông báo">
        <span class="material-symbols-sharp">close</span>
      </button>
    `;

    toastContainer.appendChild(toast);

    const closeBtn = toast.querySelector('.ca-toast-close');
    closeBtn.addEventListener('click', () => {
      hideCAToast(toast);
    });

    requestAnimationFrame(() => {
      toast.classList.add('show');
    });

    setTimeout(() => {
      hideCAToast(toast);
    }, 3500);
  }

  function hideCAToast(toast) {
    if (!toast) return;

    toast.classList.remove('show');
    toast.classList.add('hide');

    setTimeout(() => {
      toast.remove();
    }, 250);
  }

  async function deleteCA(id) {
    const confirmed = await caShowConfirm({
      title: "Xóa câu hỏi?",
      message: "Bạn có chắc muốn xóa câu hỏi " + id + " không? Hành động này không thể hoàn tác.",
      confirmText: "Xóa",
      cancelText: "Hủy",
      type: "danger"
    });
    if (!confirmed) return;
    
    google.script.run
      .withSuccessHandler(function(response) {
        if (response.success) {
          loadCAList();
          caShowToast("Đã xóa câu hỏi", "success", "Câu hỏi đã được xóa khỏi danh sách.");
        } else {
          caShowToast("Không thể xóa", "error", response.message);
        }
      })
      .withFailureHandler(function(error) {
        caShowToast("Lỗi kết nối", "error", error.message);
      })
      .adminDeleteCodeArrangement(id);
  }

  function toggleHideCA(id, targetStatus) {
    const item = caList.find(x => x.arrangementId === id);
    if (!item) return;

    const oldStatus = item.status;

    // 1. Cập nhật giao diện tức thì (Optimistic UI Update) hoàn toàn im lặng không thông báo
    item.status = targetStatus;
    filterCAList();

    // 2. Chạy ngầm gửi dữ liệu xuống máy chủ
    google.script.run
      .withSuccessHandler(function(response) {
        if (!response.success) {
          // Khôi phục lại giao diện nếu máy chủ báo lỗi
          item.status = oldStatus;
          filterCAList();
          caShowToast("Lỗi đồng bộ", "error", response.message);
        }
      })
      .withFailureHandler(function(error) {
        // Khôi phục lại giao diện nếu lỗi kết nối
        item.status = oldStatus;
        filterCAList();
        caShowToast("Lỗi kết nối", "error", error.message);
      })
      .adminToggleCodeArrangementStatus(id, targetStatus);
  }

  let caPreviewCurrentData = null;
  let caPreviewOriginalBlocks = [];
  let caPreviewShowingSolution = false;
  let caPreviewDragSource = null;

  function previewCA(id) {
    const item = caList.find(x => x.arrangementId === id);
    if (!item) return;

    let draftData = {};
    if (document.getElementById('caModalOverlay').classList.contains('active') && document.getElementById('caId').value === id) {
      draftData = {
        title: document.getElementById('caTitle').value,
        description: document.getElementById('caDescription').value,
        programmingLanguage: document.getElementById('caLanguage').value,
        difficulty: document.getElementById('caDifficulty').value,
        slicedCodeBlocks: JSON.stringify(getCurrentBlocks())
      };
    } else {
      try {
        draftData = item.draftData ? JSON.parse(item.draftData) : null;
      } catch(e) {}
      if (!draftData) {
        draftData = {
           title: item.title,
           description: item.description,
           programmingLanguage: item.programmingLanguage,
           difficulty: item.difficulty,
           slicedCodeBlocks: item.slicedCodeBlocks
        };
      }
    }

    openAdminCAPreview(draftData);
  }

  function previewCACurrentDraft() {
    const draftData = {
      title: document.getElementById('caTitle').value,
      description: document.getElementById('caDescription').value,
      programmingLanguage: document.getElementById('caLanguage').value,
      difficulty: document.getElementById('caDifficulty').value,
      slicedCodeBlocks: JSON.stringify(getCurrentBlocks())
    };
    
    openAdminCAPreview(draftData);
  }

  function openAdminCAPreview(draftData) {
    caPreviewCurrentData = draftData;
    caPreviewShowingSolution = false;

    // Set header info
    const titleEl = document.getElementById('caPreviewTitle');
    const descEl = document.getElementById('caPreviewDesc');
    const langEl = document.getElementById('caPreviewLangTag');
    const diffEl = document.getElementById('caPreviewDiffTag');

    const titleText = String(draftData.title || '').trim();
    titleEl.innerText = titleText ? `Bài: ${titleText}` : 'Bài tập chưa đặt tiêu đề';
    descEl.innerText = String(draftData.description || '').trim() || 'Sắp xếp các khối code theo đúng thứ tự logic để hoàn thiện chương trình.';
    
    const lang = (draftData.programmingLanguage || 'python').toUpperCase();
    langEl.innerText = lang;

    const diffMap = {
      'easy': { text: 'Dễ (Easy)', color: '#10b981', bg: 'rgba(16, 185, 129, 0.15)' },
      'medium': { text: 'Trung bình (Medium)', color: '#f59e0b', bg: 'rgba(245, 158, 11, 0.15)' },
      'hard': { text: 'Khó (Hard)', color: '#ef4444', bg: 'rgba(239, 68, 68, 0.15)' }
    };
    const diffInfo = diffMap[draftData.difficulty] || diffMap['medium'];
    diffEl.innerText = diffInfo.text;
    diffEl.style.color = diffInfo.color;
    diffEl.style.background = diffInfo.bg;
    diffEl.style.border = `1px solid ${diffInfo.color}44`;

    // Parse blocks
    let blocks = [];
    try {
      blocks = JSON.parse(draftData.slicedCodeBlocks || '[]');
    } catch(e) {
      blocks = [];
    }

    const container = document.getElementById('caPreviewBlocks');
    const countEl = document.getElementById('caPreviewBlockCount');
    if (!blocks || blocks.length === 0) {
      container.innerHTML = '<div style="padding: 30px; text-align: center; color: #ef4444; background: rgba(239,68,68,0.05); border-radius: 8px;">Bài tập này hiện chưa có khối code nào được cắt. Hãy kiểm tra lại!</div>';
      countEl.innerText = '0 khối code';
      caPreviewOriginalBlocks = [];
    } else {
      caPreviewOriginalBlocks = blocks.map((b, idx) => ({
        id: idx,
        content: typeof b === 'string' ? b : (b.content || b.code || ''),
        originalIndex: idx
      }));
      caPreviewShuffle();
    }

    document.getElementById('caPreviewModalOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function caPreviewShuffle() {
    caPreviewShowingSolution = false;
    const feedback = document.getElementById('caPreviewFeedback');
    if (feedback) feedback.style.display = 'none';

    const btnSol = document.getElementById('caBtnShowSolution');
    if (btnSol) {
      btnSol.innerHTML = '<span class="material-symbols-sharp" style="font-size: 18px;">lightbulb</span> Xem đáp án chuẩn';
      btnSol.style.color = '#f59e0b';
    }

    if (!caPreviewOriginalBlocks || caPreviewOriginalBlocks.length === 0) return;

    // Shuffle blocks
    let shuffled = [...caPreviewOriginalBlocks];
    if (shuffled.length > 1) {
      let isSame = true;
      let attempts = 0;
      while (isSame && attempts < 10) {
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        isSame = shuffled.every((b, idx) => b.originalIndex === idx);
        attempts++;
      }
    }

    renderCAPreviewBlocks(shuffled, false);
  }

  function caPreviewShowSolution() {
    if (caPreviewShowingSolution) {
      caPreviewShuffle();
      return;
    }

    caPreviewShowingSolution = true;
    const feedback = document.getElementById('caPreviewFeedback');
    if (feedback) feedback.style.display = 'none';

    const btnSol = document.getElementById('caBtnShowSolution');
    if (btnSol) {
      btnSol.innerHTML = '<span class="material-symbols-sharp" style="font-size: 18px;">refresh</span> Quay lại chơi thử';
      btnSol.style.color = '#3b82f6';
    }

    renderCAPreviewBlocks(caPreviewOriginalBlocks, true);
  }

  function renderCAPreviewBlocks(blocksList, isSolution) {
    const container = document.getElementById('caPreviewBlocks');
    const countEl = document.getElementById('caPreviewBlockCount');
    if (!container) return;

    countEl.innerText = `${blocksList.length} khối code`;
    container.innerHTML = '';

    blocksList.forEach((block, idx) => {
      const card = document.createElement('div');
      card.className = 'ca-preview-card' + (isSolution ? ' correct' : '');
      card.setAttribute('draggable', !isSolution);
      card.setAttribute('data-original-index', block.originalIndex);

      card.innerHTML = `
        <div class="ca-preview-card-handle">
          <span class="material-symbols-sharp" style="font-size: 20px;">drag_indicator</span>
        </div>
        <div class="ca-preview-card-index">${idx + 1}</div>
        <div class="ca-preview-card-code">${escapeHtml(block.content)}</div>
      `;

      if (!isSolution) {
        card.addEventListener('dragstart', function(e) {
          caPreviewDragSource = this;
          this.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/html', this.innerHTML);
        });

        card.addEventListener('dragover', function(e) {
          if (e.preventDefault) e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          return false;
        });

        card.addEventListener('dragenter', function(e) {
          this.style.borderColor = '#3b82f6';
        });

        card.addEventListener('dragleave', function(e) {
          this.style.borderColor = '';
        });

        card.addEventListener('drop', function(e) {
          if (e.stopPropagation) e.stopPropagation();
          if (caPreviewDragSource && caPreviewDragSource !== this) {
            // Reorder cards in DOM
            const allCards = Array.from(container.querySelectorAll('.ca-preview-card'));
            const srcIdx = allCards.indexOf(caPreviewDragSource);
            const targetIdx = allCards.indexOf(this);

            if (srcIdx < targetIdx) {
              container.insertBefore(caPreviewDragSource, this.nextSibling);
            } else {
              container.insertBefore(caPreviewDragSource, this);
            }
            caPreviewUpdateIndices();
          }
          return false;
        });

        card.addEventListener('dragend', function() {
          this.classList.remove('dragging');
          container.querySelectorAll('.ca-preview-card').forEach(c => c.style.borderColor = '');
        });
      }

      container.appendChild(card);
    });
  }

  function caPreviewUpdateIndices() {
    const container = document.getElementById('caPreviewBlocks');
    if (!container) return;
    const cards = container.querySelectorAll('.ca-preview-card');
    cards.forEach((card, idx) => {
      const idxEl = card.querySelector('.ca-preview-card-index');
      if (idxEl) idxEl.innerText = idx + 1;
      card.classList.remove('correct', 'incorrect');
    });
    const feedback = document.getElementById('caPreviewFeedback');
    if (feedback) feedback.style.display = 'none';
  }

  function caPreviewCheckResult() {
    const container = document.getElementById('caPreviewBlocks');
    const feedback = document.getElementById('caPreviewFeedback');
    if (!container || !feedback) return;

    const cards = Array.from(container.querySelectorAll('.ca-preview-card'));
    if (cards.length === 0) return;

    let allCorrect = true;
    cards.forEach((card, idx) => {
      const originalIdx = parseInt(card.getAttribute('data-original-index'), 10);
      card.classList.remove('correct', 'incorrect');
      if (originalIdx === idx) {
        card.classList.add('correct');
      } else {
        card.classList.add('incorrect');
        allCorrect = false;
      }
    });

    feedback.style.display = 'flex';
    if (allCorrect) {
      feedback.style.background = 'rgba(16, 185, 129, 0.15)';
      feedback.style.color = '#10b981';
      feedback.style.border = '1px solid rgba(16, 185, 129, 0.4)';
      feedback.innerHTML = `
        <span class="material-symbols-sharp" style="font-size: 24px;">celebration</span>
        <div>
          <div style="font-size: 0.98rem;">Tuyệt vời! Thứ tự các khối code hoàn toàn chính xác!</div>
          <div style="font-size: 0.8rem; font-weight: normal; opacity: 0.9;">Bài tập hoạt động hoàn hảo và sẵn sàng xuất bản cho học viên.</div>
        </div>
      `;
    } else {
      feedback.style.background = 'rgba(239, 68, 68, 0.15)';
      feedback.style.color = '#ef4444';
      feedback.style.border = '1px solid rgba(239, 68, 68, 0.4)';
      feedback.innerHTML = `
        <span class="material-symbols-sharp" style="font-size: 24px;">error</span>
        <div>
          <div style="font-size: 0.98rem;">Thứ tự chưa chính xác!</div>
          <div style="font-size: 0.8rem; font-weight: normal; opacity: 0.9;">Các khối màu xanh đã đúng vị trí, khối màu đỏ đang sai vị trí. Hãy kéo thả lại nhé!</div>
        </div>
      `;
    }
  }

  function closeCAPreview() {
    document.getElementById('caPreviewModalOverlay').classList.remove('active');
    document.body.style.overflow = '';
  }

  // Block Management Functions
  
  function syncBlocksFromUI() {
    const textareas = document.querySelectorAll('.ca-block-content textarea');
    currentSlicedBlocks = [];
    textareas.forEach((ta, index) => {
      currentSlicedBlocks.push({
        id: "block_" + Date.now() + "_" + index,
        content: ta.value
      });
    });
  }

  function renderSlicedBlocks() {
    const container = document.getElementById('caSlicedBlocksContainer');
    let html = '';
    
    if (currentSlicedBlocks.length === 0) {
      container.innerHTML = '<div style="text-align: center; color: var(--theme-text-secondary); padding: 20px; font-style: italic;">Chưa có khối code nào. Hãy bấm "Tự động cắt" hoặc thêm mới.</div>';
      return;
    }
    
    currentSlicedBlocks.forEach((block, index) => {
      const isFirst = index === 0;
      const isLast = index === currentSlicedBlocks.length - 1;
      
      html += `
        <div class="ca-block-card">
          <div class="ca-block-number">
            <button onclick="moveBlock(${index}, -1)" ${isFirst ? 'disabled style="opacity:0.3"' : ''} title="Lên">
              <span class="material-symbols-sharp" style="font-size: 20px;">keyboard_arrow_up</span>
            </button>
            <span style="font-size: 16px;">${index + 1}</span>
            <button onclick="moveBlock(${index}, 1)" ${isLast ? 'disabled style="opacity:0.3"' : ''} title="Xuống">
              <span class="material-symbols-sharp" style="font-size: 20px;">keyboard_arrow_down</span>
            </button>
          </div>
          <div class="ca-block-content">
            <textarea placeholder="Nội dung thẻ...">${escapeHTML(block.content)}</textarea>
          </div>
          <div class="ca-block-actions">
            <button onclick="splitBlock(${index})" title="Tách đôi">
              <span class="material-symbols-sharp" style="font-size: 18px;">content_cut</span>
            </button>
            <button onclick="mergeBlock(${index})" ${isLast ? 'disabled style="opacity:0.3"' : ''} title="Gộp xuống thẻ dưới">
              <span class="material-symbols-sharp" style="font-size: 18px;">link</span>
            </button>
            <button class="ca-btn-danger" onclick="deleteBlock(${index})" title="Xóa thẻ">
              <span class="material-symbols-sharp" style="font-size: 18px;">delete</span>
            </button>
          </div>
        </div>
      `;
    });
    
    container.innerHTML = html;
  }

  function autoSliceBlocks() {
    const code = document.getElementById('caOriginalCode').value;
    if (!code) {
      caShowToast("Thiếu code gốc", "warning", "Vui lòng nhập Code gốc trước khi tự động cắt.");
      return;
    }
    
    const count = parseInt(document.getElementById('caSliceCount').value) || 4;
    const lines = code.split('\n');
    
    if (lines.length < count) {
      caShowToast("Không thể cắt code", "warning", `Đoạn code chỉ có ${lines.length} dòng, không thể tự động cắt thành ${count} phần. Vui lòng giảm số phần.`);
      return;
    }
    
    const blocks = [];
    const baseSize = Math.floor(lines.length / count);
    let remainder = lines.length % count;
    
    let currentLine = 0;
    for (let i = 0; i < count; i++) {
      let linesForThisBlock = baseSize + (remainder > 0 ? 1 : 0);
      if (remainder > 0) remainder--;
      
      const blockContent = lines.slice(currentLine, currentLine + linesForThisBlock).join('\n');
      blocks.push({
        id: "block_" + Date.now() + "_" + i,
        content: blockContent
      });
      
      currentLine += linesForThisBlock;
    }
    
    currentSlicedBlocks = blocks;
    renderSlicedBlocks();
  }

  async function resetBlocksFromOriginal() {
    const confirmed = await caShowConfirm({
      title: "Khôi phục từ code gốc?",
      message: "Các chỉnh sửa hiện tại trên thẻ code sẽ bị thay thế.",
      confirmText: "Khôi phục",
      cancelText: "Hủy",
      type: "warning"
    });
    if (!confirmed) return;
    autoSliceBlocks();
  }

  function addNewBlock() {
    syncBlocksFromUI();
    currentSlicedBlocks.push({ id: "block_" + Date.now(), content: "" });
    renderSlicedBlocks();
  }

  async function deleteBlock(index) {
    const confirmed = await caShowConfirm({
      title: "Xóa thẻ code?",
      message: "Thẻ này sẽ bị xóa khỏi danh sách khối code.",
      confirmText: "Xóa thẻ",
      cancelText: "Hủy",
      type: "danger"
    });
    if (!confirmed) return;
    syncBlocksFromUI();
    currentSlicedBlocks.splice(index, 1);
    renderSlicedBlocks();
  }

  function moveBlock(index, direction) {
    syncBlocksFromUI();
    if (index + direction < 0 || index + direction >= currentSlicedBlocks.length) return;
    
    const temp = currentSlicedBlocks[index];
    currentSlicedBlocks[index] = currentSlicedBlocks[index + direction];
    currentSlicedBlocks[index + direction] = temp;
    
    renderSlicedBlocks();
  }

  function mergeBlock(index) {
    syncBlocksFromUI();
    if (index >= currentSlicedBlocks.length - 1) return;
    
    const blockA = currentSlicedBlocks[index];
    const blockB = currentSlicedBlocks[index + 1];
    
    blockA.content = blockA.content + (blockA.content && blockB.content ? '\n' : '') + blockB.content;
    currentSlicedBlocks.splice(index + 1, 1); // remove next block
    
    renderSlicedBlocks();
  }

  function splitBlock(index) {
    syncBlocksFromUI();
    const block = currentSlicedBlocks[index];
    const lines = block.content.split('\n');
    
    if (lines.length <= 1) {
      caShowToast("Không thể tách thẻ", "warning", "Thẻ này chỉ có 1 dòng. Hãy thêm thẻ mới để chia nội dung.");
      return;
    }
    
    const half = Math.ceil(lines.length / 2);
    const topLines = lines.slice(0, half).join('\n');
    const bottomLines = lines.slice(half).join('\n');
    
    block.content = topLines;
    currentSlicedBlocks.splice(index + 1, 0, {
      id: "block_" + Date.now() + "_split",
      content: bottomLines
    });
    
    renderSlicedBlocks();
  }

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, 
      tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
    );
  }

  function caShowConfirm(options) {
    return new Promise((resolve) => {
      let overlay = document.getElementById('caConfirmOverlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'caConfirmOverlay';
        overlay.className = 'ca-confirm-overlay';
        overlay.innerHTML = `
          <div class="ca-confirm-dialog">
            <div class="ca-confirm-icon">
              <span class="material-symbols-sharp"></span>
            </div>
            <div class="ca-confirm-title"></div>
            <div class="ca-confirm-message"></div>
            <div class="ca-confirm-actions">
              <button class="ca-confirm-btn ca-confirm-btn-secondary" id="caConfirmBtnCancel">Hủy</button>
              <button class="ca-confirm-btn" id="caConfirmBtnOk">Xác nhận</button>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);
      }
      
      const iconEl = overlay.querySelector('.ca-confirm-icon span');
      const iconContainer = overlay.querySelector('.ca-confirm-icon');
      const titleEl = overlay.querySelector('.ca-confirm-title');
      const msgEl = overlay.querySelector('.ca-confirm-message');
      const btnCancel = overlay.querySelector('#caConfirmBtnCancel');
      const btnOk = overlay.querySelector('#caConfirmBtnOk');
      
      titleEl.innerText = options.title || "Xác nhận";
      msgEl.innerText = options.message || "Bạn có chắc chắn?";
      btnOk.innerText = options.confirmText || "Đồng ý";
      btnCancel.innerText = options.cancelText || "Hủy";
      
      const type = options.type || "warning";
      btnOk.className = "ca-confirm-btn";
      iconContainer.className = "ca-confirm-icon";
      
      if (type === "danger") {
        btnOk.classList.add("ca-confirm-btn-danger");
        iconContainer.classList.add("ca-confirm-danger");
        iconEl.innerText = "warning";
      } else if (type === "info") {
        btnOk.classList.add("ca-confirm-btn-primary");
        iconContainer.classList.add("ca-confirm-info");
        iconEl.innerText = "info";
      } else {
        btnOk.classList.add("ca-confirm-btn-primary");
        iconContainer.classList.add("ca-confirm-warning");
        iconEl.innerText = "help";
      }
      
      // Force layout calculation for transition
      overlay.style.display = 'flex';
      overlay.offsetHeight; 
      overlay.classList.add('active');
      
      const cleanup = () => {
        overlay.classList.remove('active');
        setTimeout(() => {
          overlay.style.display = 'none';
        }, 250);
        btnOk.onclick = null;
        btnCancel.onclick = null;
      };
      
      btnOk.onclick = () => { cleanup(); resolve(true); };
      btnCancel.onclick = () => { cleanup(); resolve(false); };
    });
  }
</script>
