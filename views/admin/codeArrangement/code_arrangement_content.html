<div class="code-arrangement-page">
  <div class="ca-header admin-unified-header">
    <div class="ca-header-title admin-unified-header-main">
      <div
        class="admin-unified-header-icon"
        style="
          background: linear-gradient(
            135deg,
            #1a73e8 0%,
            #1557b0 100%
          ) !important;
          box-shadow: 0 8px 20px rgba(26, 115, 232, 0.22) !important;
        "
      >
        <span class="material-symbols-sharp">integration_instructions</span>
      </div>
      <div class="admin-unified-header-text">
        <h1 class="admin-unified-header-title">Code Sort</h1>
      </div>
    </div>
    <div class="ca-actions admin-unified-header-actions">
      <button class="ca-btn ca-btn-primary" onclick="openCAModal()">
        <span class="material-symbols-sharp">add</span>
        Thêm câu hỏi
      </button>
    </div>
  </div>

  <!-- Loading State -->
  <div
    id="caLoadingState"
    class="admin-loading-container"
    style="display: flex"
  >
    <div class="admin-loading-popup">
      <div class="admin-loading-logo">
        <span class="logo-o">O</span>
        <div class="logo-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
      <div class="admin-loading-text" id="caLoadingText">Đang tải danh sách bài tập Code Sort...</div>
      <div class="admin-loading-hint">Vui lòng chờ trong giây lát</div>
    </div>
  </div>

  <!-- Content Area -->
  <div id="caContentArea" style="display: none">
    <div class="ca-filters">
      <div class="ca-filter-group">
        <label>Tìm kiếm</label>
        <input
          type="text"
          id="caSearchInput"
          class="ca-input"
          placeholder="Tìm theo tiêu đề..."
          onkeyup="filterCAList()"
        />
      </div>

      <div class="ca-filter-group">
        <label>Trạng thái</label>
        <select id="caStatusFilter" class="ca-input" onchange="filterCAList()">
          <option value="">Tất cả</option>
          <option value="published">Đã xuất bản</option>
          <option value="draft">Bản nháp</option>
          <option value="hidden">Đang ẩn</option>
        </select>
      </div>
    </div>

    <div class="ca-list-container">
      <div style="overflow-x: auto">
        <table class="ca-table">
          <thead>
            <tr>
              <th style="width: 50px; text-align: center;">STT</th>
              <th>Tiêu đề</th>

              <th>Ngôn ngữ</th>
              <th>Độ khó</th>
              <th>Trạng thái</th>
              <th style="text-align: right">Hành động</th>
            </tr>
          </thead>
          <tbody id="caTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="ca-modal-overlay" id="caModalOverlay">
  <div class="ca-modal">
    <div class="ca-modal-header">
      <h2 id="caModalTitle">Thêm câu hỏi Code</h2>
      <button class="ca-modal-close" onclick="closeCAModal()">
        <span class="material-symbols-sharp">close</span>
      </button>
    </div>
    <div class="ca-modal-body">
      <input type="hidden" id="caId" />
      <div class="ca-form-row">
        <div class="ca-filter-group">
          <label>Tiêu đề</label>
          <input
            type="text"
            id="caTitle"
            class="ca-input"
            placeholder="Ví dụ: Tính tổng 2 số"
          />
        </div>
      </div>
      <div class="ca-filter-group">
        <label>Đề bài</label>
        <textarea
          id="caDescription"
          class="ca-input ca-textarea"
          placeholder="Yêu cầu bài toán..."
          style="min-height: 80px"
        ></textarea>
      </div>
      <div class="ca-form-row">
        <div class="ca-filter-group">
          <label>Ngôn ngữ lập trình</label>
          <select id="caLanguage" class="ca-input">
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
            <option value="cpp">C++</option>
            <option value="java">Java</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
          </select>
        </div>
        <div class="ca-filter-group">
          <label>Độ khó</label>
          <select id="caDifficulty" class="ca-input">
            <option value="easy">Dễ</option>
            <option value="medium" selected>Trung bình</option>
            <option value="hard">Khó</option>
          </select>
        </div>
        <div class="ca-filter-group">
          <label>Trạng thái hiển thị (Sau khi xuất bản)</label>
          <select id="caStatus" class="ca-input">
            <option value="published">Hoạt động</option>
            <option value="hidden">Tạm ẩn</option>
          </select>
        </div>
      </div>
      <div class="ca-filter-group">
        <label>Code gốc</label>
        <textarea
          id="caOriginalCode"
          class="ca-input ca-textarea"
          placeholder="function sum(a, b) {\n  return a + b;\n}"
        ></textarea>
      </div>

      <div class="ca-filter-group" style="margin-top: 8px">
        <label style="color: var(--theme-primary); font-size: 16px"
          >Tùy chỉnh các khối Code</label
        >
        <div class="ca-blocks-toolbar">
          <label style="font-size: 13px; margin-right: 8px"
            >Số phần tự động cắt:</label
          >
          <input
            type="number"
            id="caSliceCount"
            class="ca-input"
            value="4"
            min="2"
            max="20"
            style="width: 80px; padding: 6px 12px"
          />
          <button
            class="ca-btn ca-btn-primary"
            style="padding: 6px 12px"
            onclick="autoSliceBlocks()"
          >
            <span class="material-symbols-sharp" style="font-size: 16px"
              >content_cut</span
            >
            Tự động cắt
          </button>
          <button
            class="ca-btn ca-btn-secondary"
            style="padding: 6px 12px; margin-left: auto"
            onclick="resetBlocksFromOriginal()"
          >
            <span class="material-symbols-sharp" style="font-size: 16px"
              >restart_alt</span
            >
            Khôi phục gốc
          </button>
        </div>

        <div id="caSlicedBlocksContainer" class="ca-sliced-blocks-list">
          <!-- Render blocks here -->
        </div>

        <button
          class="ca-btn ca-btn-secondary"
          style="width: 100%; border-style: dashed; margin-top: 8px"
          onclick="addNewBlock()"
        >
          <span class="material-symbols-sharp">add</span> Thêm khối mới
        </button>
      </div>
    </div>
    <div class="ca-modal-footer">
      <button
        class="ca-btn ca-btn-secondary"
        onclick="previewCACurrentDraft()"
        id="caBtnPreviewForm"
      >
        <span class="material-symbols-sharp" style="font-size: 18px"
          >visibility</span
        >
        Xem trước
      </button>
      <button class="ca-btn ca-btn-secondary" onclick="closeCAModal()">
        Hủy
      </button>
      <button
        class="ca-btn ca-btn-secondary"
        onclick="saveCA('draft')"
        id="caBtnDraft"
      >
        <span class="material-symbols-sharp" style="font-size: 18px">save</span>
        Lưu nháp
      </button>
      <button
        class="ca-btn ca-btn-primary"
        onclick="saveCA('publish')"
        id="caBtnPublish"
      >
        <span class="material-symbols-sharp" style="font-size: 18px"
          >publish</span
        >
        Xuất bản
      </button>
    </div>
  </div>
</div>

<!-- Fullscreen Preview Overlay (simulates client lesson view exact like Topic Editor) -->
<div class="admin-preview-overlay" id="caPreviewModalOverlay">
  <!-- Preview Header -->
  <div class="admin-preview-header">
    <div class="admin-preview-header-content">
      <div>
        <h1 class="admin-preview-title" id="caPreviewTitle">Xem Trước Code Sort</h1>
        <div style="display: flex; gap: 8px; align-items: center; margin-top: 6px;">
          <span id="caPreviewLangTag" style="padding: 4px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; background: rgba(59,130,246,0.15); color: #3b82f6; border: 1px solid rgba(59,130,246,0.3);"></span>
          <span id="caPreviewDiffTag" style="padding: 4px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600;"></span>
        </div>
      </div>
      <button class="btn-back-global" onclick="closeCAPreview()">
        ← Quay lại
      </button>
    </div>
  </div>

  <!-- Content Layout (Mimicking user side but centered) -->
  <div style="max-width: 1000px; margin: 0 auto; padding: 20px 20px 60px;">
    <div class="lesson-card" style="padding: 2rem; background: var(--theme-card, #1e293b); border: 1px solid var(--theme-card-border, rgba(255,255,255,0.1)); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);">
      <!-- Description & Hint -->
      <p id="caPreviewDesc" style="font-size: 1rem; color: var(--theme-text-secondary, #cbd5e1); margin: 0 0 1.5rem 0; line-height: 1.6;"></p>

      <!-- Feedback Banner -->
      <div id="caPreviewFeedback" style="display: none; padding: 1rem 1.25rem; border-radius: 10px; margin-bottom: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 10px;"></div>

      <!-- Instruction label -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--theme-card-border, rgba(255,255,255,0.08));">
        <span style="font-size: 0.95rem; font-weight: 600; color: var(--theme-text, #f8fafc); display: flex; align-items: center; gap: 8px;">
          <span class="material-symbols-sharp" style="font-size: 20px; color: #3b82f6;">drag_indicator</span>
          Kéo thả các khối code dưới đây theo đúng thứ tự logic:
        </span>
        <span id="caPreviewBlockCount" style="font-size: 0.85rem; font-weight: 600; color: var(--theme-text-secondary, #64748b); padding: 4px 12px; background: rgba(255,255,255,0.05); border-radius: 12px;"></span>
      </div>

      <!-- Interactive Blocks Container -->
      <div id="caPreviewBlocks" style="display: flex; flex-direction: column; gap: 12px; min-height: 140px; margin-bottom: 2rem;">
        <!-- Render cards dynamically -->
      </div>

      <!-- Action Buttons -->
      <div style="padding-top: 1.5rem; border-top: 1px solid var(--theme-card-border, rgba(255,255,255,0.1)); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
        <div style="display: flex; gap: 12px;">
          <button type="button" class="ca-btn ca-btn-secondary" onclick="caPreviewShuffle()" style="display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; font-size: 0.92rem;">
            <span class="material-symbols-sharp" style="font-size: 20px;">shuffle</span>
            Xáo trộn lại
          </button>
          <button type="button" class="ca-btn ca-btn-secondary" onclick="caPreviewShowSolution()" id="caBtnShowSolution" style="display: inline-flex; align-items: center; gap: 6px; color: #f59e0b; border-color: rgba(245,158,11,0.3); padding: 10px 16px; font-size: 0.92rem;">
            <span class="material-symbols-sharp" style="font-size: 20px;">lightbulb</span>
            Xem đáp án chuẩn
          </button>
        </div>
        <div style="display: flex; gap: 12px;">
          <button type="button" class="ca-btn ca-btn-primary" onclick="caPreviewCheckResult()" style="display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #10b981, #059669); border: none; padding: 10px 22px; font-size: 0.95rem; font-weight: 600; box-shadow: 0 4px 12px rgba(16,185,129,0.3);">
            <span class="material-symbols-sharp" style="font-size: 22px;">check_circle</span>
            Kiểm tra thứ tự
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
