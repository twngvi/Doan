<!-- Topics Page Scripts -->
<script>
  (function () {
    console.log("🚀 Topics page scripts loading...");

    // ========================================
    // MODULE VARIABLES (in closure)
    // ========================================
    let allTopics = [];
    let filteredTopics = [];
    let allCourses = [];
    let currentViewMode = "courses"; // "courses" or "topics"
    let currentCourseId = null;
    let coursesLoaded = false;
    let currentFilter = "all";
    let currentView = "grid";
    
    // ⭐ Course Filter State
    let courseFilterState = {
      keyword: "",
      keyword_raw: "",
      level: "all",

      // Mặc định đưa khóa học đã truy cập gần đây lên đầu
      sort: "recent",

      // false: hiển thị tất cả
      // true: chỉ hiển thị khóa học yêu thích
      favoritesOnly: false
    };

    // Lưu trạng thái yêu thích và thời gian học gần đây
    let coursePreferences = {
      favorites: {},
      recent: {}
    };

    // Theo dõi tài khoản nào đã được tải tùy chọn
    let loadedCoursePreferencesKey = "";
    let selectedTopic = null;
    let userProgress = {};

    // ⭐ Navigation lock: chặn bấm liên tục khi đang chuyển trang
    let isTopicNavigating = false;
    let topicNavigationToken = 0;

    // ⭐ CACHE để tránh reload không cần thiết
    let topicsCache = null;
    let progressCache = null;
    let lastLoadTime = 0;
    const CACHE_DURATION = 60000; // Cache 1 phút
    const TOPICS_DATA_CHANGED_KEY = "topics_data_changed_at";
    let lastTopicsDataChangeStamp = 0;

    // ⭐ Expose function to invalidate LOCAL cache from other pages
    window.invalidateTopicsLocalCache = function () {
      progressCache = null;
      topicsCache = null;
      lastLoadTime = 0;
      console.log("🔄 Topics LOCAL progress cache invalidated");
    };

    function getTopicsDataChangedStamp() {
      try {
        const raw = localStorage.getItem(TOPICS_DATA_CHANGED_KEY);
        if (!raw) return 0;
        const stamp = Number(raw);
        return Number.isFinite(stamp) ? stamp : 0;
      } catch (e) {
        console.warn("⚠️ Could not read topics changed marker:", e);
        return 0;
      }
    }

    // ===== TOPICS LOCAL STORAGE CACHE =====
    const TOPICS_LOCAL_CACHE_VERSION = "v1";
    const TOPICS_LOCAL_CACHE_MAX_AGE = 10 * 60 * 1000; // 10 phút

    function getTopicsLocalCacheKey() {
      var userKey =
        (window.currentUser && (window.currentUser.userId || window.currentUser.email)) ||
        "guest";
      return "doan:topics:" + userKey + ":" + TOPICS_LOCAL_CACHE_VERSION;
    }

    function saveTopicsLocalCache(data) {
      try {
        if (!data || !data.success) return;

        var payload = {
          savedAt: Date.now(),
          data: data
        };

        localStorage.setItem(
          getTopicsLocalCacheKey(),
          JSON.stringify(payload)
        );
      } catch (e) {
        console.warn("Không thể lưu Topics vào localStorage:", e);
      }
    }

    function readTopicsLocalCache() {
      try {
        var raw = localStorage.getItem(getTopicsLocalCacheKey());
        if (!raw) return null;

        var payload = JSON.parse(raw);
        if (!payload || !payload.data || !payload.savedAt) return null;

        var age = Date.now() - payload.savedAt;

        if (age > TOPICS_LOCAL_CACHE_MAX_AGE) {
          return null;
        }

        return payload;
      } catch (e) {
        console.warn("Không thể đọc Topics localStorage:", e);
        return null;
      }
    }

    /**
     * ⭐ Merge localStorage lesson progress into progress map
     * Reads lesson_progress_<topicId> keys written by Lesson page
     * Options:
     * - serverAuthoritative: if true, topics missing on server will be removed from localStorage
     */
    function mergeLocalStorageProgress(progress, options) {
      var merged = Object.assign({}, progress || {});
      var opts = options || {};
      var serverAuthoritative = !!opts.serverAuthoritative;

      try {
        for (var i = localStorage.length - 1; i >= 0; i--) {
          var key = localStorage.key(i);
          if (!key || key.indexOf("lesson_progress_") !== 0) continue;

          var topicId = key.replace("lesson_progress_", "");
          var localData = JSON.parse(localStorage.getItem(key) || "null");
          if (!localData) continue;

          // If server is source of truth and topic no longer exists there (e.g. reset), clear stale local cache.
          if (serverAuthoritative && !merged[topicId]) {
            localStorage.removeItem(key);
            continue;
          }

          if (!merged[topicId]) {
            merged[topicId] = {
              topicId: topicId,
              status: 'not_started',
              progress: 0,
            };
          }

          // Merge: true values from either source win
          merged[topicId].lessonCompleted =
            merged[topicId].lessonCompleted || localData.lessonRead || false;
          merged[topicId].mindmapViewed =
            merged[topicId].mindmapViewed || localData.mindmapViewed || false;
          merged[topicId].flashcardsCompleted =
            merged[topicId].flashcardsCompleted ||
            localData.flashcardsDone ||
            false;
          merged[topicId].miniQuizCompleted =
            merged[topicId].miniQuizCompleted || localData.lessonQuiz || false;
          merged[topicId].quizDone =
            merged[topicId].quizDone || localData.quizDone || false;
          merged[topicId].matchingDone =
            merged[topicId].matchingDone || localData.matchingDone || false;

          var count = 0;
          if (merged[topicId].lessonCompleted) count++;
          if (merged[topicId].mindmapViewed) count++;
          if (merged[topicId].flashcardsCompleted) count++;
          
          var topic = allTopics.find(function(t) { return t.topicId === topicId; });
          var quizRequired = topic && topic.quizStatus === "active";
          var matchingRequired = topic && topic.matchingStatus === "active";
          var quizDone = merged[topicId].quizDone;
          var matchingDone = merged[topicId].matchingDone;
          
          merged[topicId].completed = (count === 3) && (!quizRequired || quizDone) && (!matchingRequired || matchingDone);
          
          // Re-calculate progressPercent
          var totalAct = 3;
          if (quizRequired) { totalAct++; if (quizDone) count++; }
          if (matchingRequired) { totalAct++; if (matchingDone) count++; }
          merged[topicId].progress = Math.round((count / totalAct) * 100);
        }
      } catch (e) {
        console.warn("⚠️ Could not merge localStorage progress:", e);
      }
      return merged;
    }

    // ========================================
    // INITIALIZATION
    // ========================================
    window.initTopicsPage = function () {
      console.log("✅ Initializing Topics Page...");
      setupEventListeners();
      loadTopics();
      // Start meteor shower for header
      startTopicsHeaderMeteors();
      setupTopicsHeaderMouseEffect();
    };

    function setupEventListeners() {
      // Search input debounce
      const searchInput = document.getElementById("searchTopics");
      if (!searchInput) {
        console.warn("Search input not found, skipping event listener setup");
        return;
      }

      let searchTimeout;
      searchInput.addEventListener("input", function (e) {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          searchTopics(e.target.value);
        }, 200); // Giảm debounce từ 300ms xuống 200ms
      });
    }

    // ========================================
    // LOAD TOPICS FROM DATABASE - OPTIMIZED
    // ========================================
    function loadTopics(forceRefresh = false) {
      console.log("Loading topics from database...");

      const now = Date.now();
      const topicsChangedStamp = getTopicsDataChangedStamp();
      const hasTopicsDataChanged = topicsChangedStamp > lastTopicsDataChangeStamp;
      if (hasTopicsDataChanged) {
        console.log("🔄 Topics data changed marker detected, forcing fresh reload...");
        forceRefresh = true;
        lastTopicsDataChangeStamp = topicsChangedStamp;
        topicsCache = null;
        progressCache = null;
        lastLoadTime = 0;
        if (window.globalTopicsCache) {
          window.globalTopicsCache.data = null;
          window.globalTopicsCache.progress = null;
          window.globalTopicsCache.lastLoadTime = 0;
        }
      }

      // ⭐ Hiện loading state trước khi check cache
      if (!forceRefresh) {
        showLoadingState();
      }

      // ⭐ ƯU TIÊN 1: Kiểm tra GLOBAL cache cho topics data (có thể đã load từ MCQ page)
      const globalCache = window.globalTopicsCache;
      if (
        !forceRefresh &&
        globalCache &&
        globalCache.data &&
        now - globalCache.lastLoadTime <
          (globalCache.cacheDuration || CACHE_DURATION)
      ) {
        console.log(
          "✅ Using GLOBAL cached topics data, refreshing progress...",
        );
        allTopics = globalCache.data;
        topicsCache = globalCache.data;
        lastLoadTime = globalCache.lastLoadTime;

        // Use cached progress for instant render, then refresh from server
        userProgress = mergeLocalStorageProgress(globalCache.progress || {});
        progressCache = userProgress;
        
        if (currentViewMode === 'courses') {
          renderCourses();
          goBackToCourses();
        } else {
          const searchInput = document.getElementById('searchTopics');
          searchTopics(searchInput ? searchInput.value : '');
        }
        updateProgressStats();
        hideLoadingState();

        // ⭐ Always fetch fresh progress in background
        refreshProgressFromServer();
        return;
      }

      // ⭐ ƯU TIÊN 2: Kiểm tra LOCAL cache cho topics data
      if (!forceRefresh && topicsCache && now - lastLoadTime < CACHE_DURATION) {
        console.log(
          "✅ Using LOCAL cached topics data, refreshing progress...",
        );
        allTopics = topicsCache;

        // Use cached progress for instant render, then refresh from server
        userProgress = mergeLocalStorageProgress(progressCache || {});
        if (currentViewMode === 'courses') {
          renderCourses();
          goBackToCourses();
        } else {
          const searchInput = document.getElementById('searchTopics');
          searchTopics(searchInput ? searchInput.value : '');
        }
        updateProgressStats();
        hideLoadingState();

        // ⭐ Always fetch fresh progress in background
        refreshProgressFromServer();
        return;
      }

      // ⭐ ƯU TIÊN 3: Kiểm tra LOCAL STORAGE cache
      var hasRenderedFromLocalStore = false;
      if (!forceRefresh) {
        var localStoreCache = readTopicsLocalCache();
        if (localStoreCache && localStoreCache.data) {
          console.log("✅ Using LOCAL STORAGE cached topics data, rendering instantly...");
          var result = localStoreCache.data;
          
          allTopics = result.topics || [];
          
          let serverProgress = result.progress || {};
          userProgress = mergeLocalStorageProgress(serverProgress, { serverAuthoritative: true });
          
          topicsCache = allTopics;
          progressCache = userProgress;
          lastLoadTime = localStoreCache.savedAt;

          if (currentViewMode === 'courses') {
            renderCourses();
            goBackToCourses();
          } else {
            const searchInput = document.getElementById('searchTopics');
            searchTopics(searchInput ? searchInput.value : '');
          }
          updateProgressStats();
          hideLoadingState();
          
          hasRenderedFromLocalStore = true;
        }
      }

      // ⭐ ƯU TIÊN 4: Load từ server
      if (!hasRenderedFromLocalStore) {
        // Show loading state if we haven't rendered anything yet
        showLoadingState();
      } else {
        console.log("🔄 Background refreshing full topics from server...");
      }

      // ⭐ Gọi API mới để lấy topics và progress
      google.script.run
        .withSuccessHandler(function(result) {
          processAndRenderUserTopics(result);
        })
        .withFailureHandler(function(error) {
          if (!hasRenderedFromLocalStore) {
            showErrorState(error.message || error.toString());
          } else {
            console.warn("⚠️ Background refresh failed:", error);
          }
        })
        .getTopicsForUserPage(window.getAuthContext ? window.getAuthContext() : null);
    }

    // ⭐ XỬ LÝ VÀ RENDER - Gộp logic, render 1 lần duy nhất
    function processAndRenderUserTopics(result) {
      console.log("Processing topics and progress...");

      if (!result || !result.success) {
        showErrorState((result && result.message) || 'Không thể tải danh sách bài học.');
        return;
      }

      allTopics = result.topics || [];
      
      // ⭐ Extract courses from the same API response
      if (result.courses && result.courses.length > 0) {
        allCourses = result.courses;
        coursesLoaded = true;
        console.log('✅ Got ' + allCourses.length + ' courses from server');
      } else if (!coursesLoaded) {
        // No courses in response - mark as loaded with empty
        coursesLoaded = true;
        allCourses = [];
      }
      
      // Xử lý progress
      let serverProgress = result.progress || {};
      userProgress = mergeLocalStorageProgress(serverProgress, {
        serverAuthoritative: true,
      });

      topicsCache = allTopics;
      progressCache = userProgress;
      lastLoadTime = Date.now();

      // ⭐ Lưu vào GLOBAL cache (để chia sẻ với MCQ, Matching và các page khác)
      if (!window.globalTopicsCache) {
        window.globalTopicsCache = {
          data: null,
          progress: null,
          lastLoadTime: 0,
          cacheDuration: 60000,
        };
      }
      window.globalTopicsCache.data = allTopics;
      window.globalTopicsCache.progress = userProgress;
      window.globalTopicsCache.lastLoadTime = Date.now();
      console.log(`✅ Saved ${allTopics.length} topics to GLOBAL cache`);

      // ⭐ Save to LocalStorage for offline-first architecture
      saveTopicsLocalCache(result);

      // ⭐ RENDER
      if (currentViewMode === 'courses') {
        renderCourses();
        const coursesGridEl = document.getElementById('coursesGrid');
        if (coursesGridEl) coursesGridEl.style.display = 'grid';
        const coursesFilterBarEl = document.getElementById('coursesFilterBar');
        if (coursesFilterBarEl) coursesFilterBarEl.style.display = 'flex';
        document.getElementById('topicsGrid').style.display = 'none';
        document.getElementById('topicsJourney').style.display = 'none';
        document.getElementById('topicsEmpty').style.display = 'none';
        document.getElementById('btnBackToCourses').style.display = 'none';
        document.getElementById('topicsHeaderControls').style.display = 'none';
      } else {
        const searchInput = document.getElementById('searchTopics');
        searchTopics(searchInput ? searchInput.value : '');
      }
      updateProgressStats();
      hideLoadingState();
    }

    function onTopicsLoadError(error) {
      console.error("❌ Error loading topics:", error);
      showErrorState(
        error.message ||
          error.toString() ||
          "Không thể kết nối với server. Vui lòng thử lại sau.",
      );
    }

    /**
     * ⭐ Refresh progress from server in background (uses cached topics)
     * Re-renders topics after getting fresh data
     */
    function refreshProgressFromServer() {
      console.log("🔄 Refreshing progress from server...");
      google.script.run
        .withSuccessHandler(function (result) {
          if (result && result.success && result.progress) {
            // ⭐ Merge localStorage data, but keep server as source of truth after resets
            var merged = mergeLocalStorageProgress(result.progress, {
              serverAuthoritative: true,
            });
            var hasChanges =
              JSON.stringify(userProgress) !== JSON.stringify(merged);
            userProgress = merged;
            progressCache = merged;
            // Update global cache
            if (window.globalTopicsCache) {
              window.globalTopicsCache.progress = merged;
            }
            if (hasChanges) {
              console.log("✅ Progress updated from server, re-rendering...");
              renderTopics();
              updateProgressStats();
            } else {
              console.log("✅ Progress unchanged from server");
            }
          }
        })
        .withFailureHandler(function (error) {
          console.warn("⚠️ Failed to refresh progress:", error);
        })
        .getUserTopicProgress();
    }

    // ========================================
    // CATEGORY HELPERS
    // ========================================
    function getCategoryName(topic) {
      return String(topic.category || '').trim() || 'Chưa phân loại';
    }

    function groupTopicsByCategory(topics) {
      const groups = [];

      topics.forEach(function(topic) {
        const category = getCategoryName(topic);
        let group = groups.find(function(item) {
          return item.category === category;
        });

        if (!group) {
          group = {
            category: category,
            topics: []
          };
          groups.push(group);
        }

        group.topics.push(topic);
      });

      return groups;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // ========================================
    // RENDER TOPICS - OPTIMIZED
    // ========================================
    function renderTopics() {
      if (currentViewMode === 'courses') return;

      if (currentView === "grid") {
        renderGridView();
      } else {
        renderJourneyView();
      }
    }

    function renderGridView() {
      const grid = document.getElementById("topicsGrid");
      const emptyState = document.getElementById("topicsEmpty");

      if (filteredTopics.length === 0) {
        showEmptyState();
        return;
      }

      if (emptyState) {
        emptyState.style.display = "none";
      }

      const groups = groupTopicsByCategory(filteredTopics);
      const fragment = document.createDocumentFragment();

      groups.forEach(function(group) {
        const section = document.createElement('section');
        section.className = 'topic-category-section';

        const completedCount = group.topics.filter(function(topic) {
          return userProgress[topic.topicId] && userProgress[topic.topicId].completed;
        }).length;

        section.innerHTML = `
          <div class="topic-category-grid"></div>
        `;

        const categoryGrid = section.querySelector('.topic-category-grid');

        group.topics.forEach(function(topic) {
          categoryGrid.appendChild(createTopicCard(topic));
        });

        fragment.appendChild(section);
      });

      grid.innerHTML = "";
      grid.appendChild(fragment);

      grid.style.display = "block";
      document.getElementById("topicsJourney").style.display = "none";

      setupGridCardTilt();
    }

    function renderJourneyView() {
      const journeyContainer = document.getElementById("topicsJourney");
      const listContainer = document.getElementById("journeyListContainer");
      const emptyState = document.getElementById("topicsEmpty");

      if (filteredTopics.length === 0) {
        showEmptyState();
        return;
      }

      if (emptyState) {
        emptyState.style.display = "none";
      }

      const groups = groupTopicsByCategory(filteredTopics);
      const fragment = document.createDocumentFragment();

      groups.forEach(function(group) {
        const section = document.createElement('section');
        section.className = 'topic-category-list-section';

        section.innerHTML = `
          <div class="topic-category-list-header">
            <h3>${escapeHtml(group.category)}</h3>
            <span>${group.topics.length} bài</span>
          </div>
          <div class="topic-category-list-items"></div>
        `;

        const itemContainer = section.querySelector('.topic-category-list-items');

        group.topics.forEach(function(topic, index) {
          itemContainer.appendChild(createTopicListItem(topic, index + 1));
        });

        fragment.appendChild(section);
      });

      listContainer.innerHTML = "";
      listContainer.appendChild(fragment);

      // ⭐ Stagger list item animations
      listContainer.querySelectorAll(".topic-list-item").forEach((item, i) => {
        item.style.animationDelay = i * 0.04 + "s";
      });

      document.getElementById("topicsGrid").style.display = "none";
      journeyContainer.style.display = "block";
    }

    // Create compact list item for journey view
    function createTopicListItem(topic, index) {
      const item = document.createElement("div");
      const status = getTopicStatus(topic, window.currentPageParams);
      const hasContent = topicHasContent(topic);
      item.className =
        "topic-list-item status-" + status + (hasContent ? "" : " no-content");
      item.onclick = () => startTopicDirect(topic);

      const progress = userProgress[topic.topicId] || {
        status: 'not_started',
        progress: 0,
      };
      const isLocked = status === "locked";
      const journeyClass = getJourneyClass(topic.journey);
      const progressPercent = progress.progress || 0;
      const topicIcon = getTopicIcon(topic);

      let statusIndicator = "";
      if (isLocked || !hasContent) {
        statusIndicator = `
          <div class="list-item-status locked" aria-label="Đang khóa">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>`;
      } else if ((progress.status === 'completed')) {
        statusIndicator = `
          <div class="list-item-status completed" aria-label="Đã hoàn thành">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </div>`;
      } else {
        statusIndicator = `
          <div class="list-item-status ready" aria-label="Có thể vào học">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/>
            </svg>
          </div>`;
      }

      // Progress circle SVG
      let progressCircle = "";
      if ((progress.status === 'completed')) {
        progressCircle = `
          <div class="list-item-progress-circle completed">
            <svg width="36" height="36" viewBox="0 0 36 36">
              <circle cx="18" cy="18" r="16" fill="none" stroke="#fdf2f8" stroke-width="3"/>
              <circle cx="18" cy="18" r="16" fill="none" stroke="#db2777" stroke-width="3"
                stroke-dasharray="100.5" stroke-dashoffset="0" stroke-linecap="round"
                transform="rotate(-90 18 18)"/>
              <path d="M12 18l4 4 8-8" fill="none" stroke="#db2777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>`;
      } else if (progressPercent > 0) {
        const dashOffset = 100.5 - (progressPercent / 100) * 100.5;
        progressCircle = `
          <div class="list-item-progress-circle in-progress">
            <svg width="36" height="36" viewBox="0 0 36 36">
              <circle cx="18" cy="18" r="16" fill="none" stroke="#eef1ff" stroke-width="3"/>
              <circle cx="18" cy="18" r="16" fill="none" stroke="#5b6ff8" stroke-width="3"
                stroke-dasharray="100.5" stroke-dashoffset="${dashOffset}" stroke-linecap="round"
                transform="rotate(-90 18 18)"/>
              <text x="18" y="22" text-anchor="middle" font-size="10" font-weight="600" fill="#5b6ff8">${progressPercent}%</text>
            </svg>
          </div>`;
      } else {
        progressCircle = `
          <div class="list-item-progress-circle not-started">
            <svg width="36" height="36" viewBox="0 0 36 36">
              <circle cx="18" cy="18" r="16" fill="none" stroke="#e2e8f0" stroke-width="3"/>
            </svg>
          </div>`;
      }

      item.innerHTML = `
        <div class="list-item-index ${journeyClass}">${index}</div>
        <div class="list-item-icon">${topicIcon}</div>
        <div class="list-item-content">
          <div class="list-item-title">${topic.title}</div>
          <div class="list-item-meta">
            <span class="list-item-category">${topic.category || "Chung"}</span>
          </div>
        </div>
        ${progressCircle}
        ${statusIndicator}
        <div class="list-item-arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      `;

      if (isLocked) item.classList.add("locked");
      if ((progress.status === 'completed')) item.classList.add("completed");

      return item;
    }

    // ⭐ TỐI ƯU CARD CREATION - Professional Design with SVG Icons
    function createTopicCard(topic) {
      const card = document.createElement("div");
      const status = getTopicStatus(topic, window.currentPageParams);
      const hasContent = topicHasContent(topic);
      card.dataset.topicId = topic.topicId;
      card.className =
        "topic-card status-" + status + (hasContent ? "" : " no-content");
      // Clicking the card opens the action menu (unless click is inside the menu)
      card.onclick = (e) => {
        if (e.target.closest(".topic-action-menu")) return;
        // If this topic is locked, do not open the action menu
        if (status === "locked") {
          // Optionally show a hint or open detail; currently we simply ignore the click
          return;
        }
        // Open the menu for this card
        toggleTopicCardMenu(card, e);
      };

      // Get user progress for this topic
      const progress = userProgress[topic.topicId] || {
        status: 'not_started',
        progress: 0,
      };
      const isLocked = status === "locked";

    // ========================================
    // COURSE PREFERENCES
    // Yêu thích + học gần đây
    // ========================================

    function normalizeCourseId(courseId) {
      if (courseId === null || courseId === undefined) {
        return "";
      }
      return String(courseId).trim();
    }

    function getCoursePreferencesStorageKey() {
      const currentUser = window.currentUser || {};
      const userKey = String(
        currentUser.userId ||
        currentUser.email ||
        "guest"
      )
        .trim()
        .toLowerCase();
      return "doan:course-preferences:" + userKey + ":v1";
    }

    /**
     * Tải trạng thái yêu thích và gần đây từ localStorage.
     * Dữ liệu được tách riêng theo từng tài khoản.
     */
    function ensureCoursePreferencesLoaded() {
      const storageKey = getCoursePreferencesStorageKey();

      // Đã tải đúng tài khoản thì không cần đọc lại
      if (loadedCoursePreferencesKey === storageKey) {
        return;
      }

      coursePreferences = {
        favorites: {},
        recent: {}
      };

      try {
        const rawData = localStorage.getItem(storageKey);
        if (rawData) {
          const parsedData = JSON.parse(rawData);
          if (parsedData && typeof parsedData === "object") {
            coursePreferences.favorites =
              parsedData.favorites &&
              typeof parsedData.favorites === "object"
                ? parsedData.favorites
                : {};
            coursePreferences.recent =
              parsedData.recent &&
              typeof parsedData.recent === "object"
                ? parsedData.recent
                : {};
          }
        }
      } catch (error) {
        console.warn("Không thể đọc tùy chọn khóa học:", error);
        coursePreferences = {
          favorites: {},
          recent: {}
        };
      }

      loadedCoursePreferencesKey = storageKey;
    }

    /**
     * Lưu trạng thái xuống localStorage.
     */
    function saveCoursePreferences() {
      ensureCoursePreferencesLoaded();
      try {
        localStorage.setItem(
          getCoursePreferencesStorageKey(),
          JSON.stringify(coursePreferences)
        );
      } catch (error) {
        console.warn("Không thể lưu tùy chọn khóa học:", error);
      }
    }

    /**
     * Kiểm tra một khóa học đã được yêu thích hay chưa.
     */
    function isCourseFavorite(courseId) {
      ensureCoursePreferencesLoaded();
      const normalizedId = normalizeCourseId(courseId);
      return coursePreferences.favorites[normalizedId] === true;
    }

    /**
     * Lấy thời gian học gần đây của khóa học.
     */
    function getCourseRecentTime(courseId) {
      ensureCoursePreferencesLoaded();
      const normalizedId = normalizeCourseId(courseId);
      const recentTime = coursePreferences.recent[normalizedId];
      const numericTime = Number(recentTime);
      return Number.isFinite(numericTime) ? numericTime : 0;
    }

    /**
     * Ghi nhận khóa học vừa được mở hoặc vừa được học.
     */
    function markCourseRecentlyStudied(courseId) {
      ensureCoursePreferencesLoaded();
      const normalizedId = normalizeCourseId(courseId);
      if (!normalizedId) return;
      coursePreferences.recent[normalizedId] = Date.now();
      saveCoursePreferences();
    }

    /**
     * Nhấn nút tim trên card.
     */
    window.toggleCourseFavorite = function (courseId, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      ensureCoursePreferencesLoaded();
      const normalizedId = normalizeCourseId(courseId);
      if (!normalizedId) return;

      if (coursePreferences.favorites[normalizedId] === true) {
        delete coursePreferences.favorites[normalizedId];
      } else {
        coursePreferences.favorites[normalizedId] = true;
      }
      saveCoursePreferences();
      // Vẽ lại card để cập nhật màu trái tim
      renderCourses();
    };

    /**
     * Bật/tắt bộ lọc yêu thích.
     */
    window.toggleFavoriteCourseFilter = function () {
      courseFilterState.favoritesOnly = !courseFilterState.favoritesOnly;
      const favoriteFilterButton = document.getElementById("courseFavoriteFilter");
      if (favoriteFilterButton) {
        favoriteFilterButton.classList.toggle("active", courseFilterState.favoritesOnly);
        favoriteFilterButton.setAttribute("aria-pressed", String(courseFilterState.favoritesOnly));
      }
      renderCourses();
    };

    // ========================================
    // COURSES LOGIC
    // ========================================
    function renderCourses() {
      const container = document.getElementById('coursesGrid');
      if (!container) return;
      
      ensureCoursePreferencesLoaded();
      
      container.innerHTML = '';
      
      if (!coursesLoaded) {
        return;
      }
      
      if (!allCourses || allCourses.length === 0) {
        container.innerHTML = '<div style="padding: 24px; color: var(--text-muted);">Không có khóa học nào.</div>';
        return;
      }
      
      // Lọc và sắp xếp khóa học dựa trên courseFilterState
      let filteredCourses = [...allCourses];
      
      // Tính số bài học một lần để tránh filter lặp lại
      const topicCountByCourse = allTopics.reduce(
        function (countMap, topic) {
          const courseId = normalizeCourseId(topic.courseId);
          if (!courseId) {
            return countMap;
          }
          countMap[courseId] = (countMap[courseId] || 0) + 1;
          return countMap;
        },
        {}
      );
      
      if (courseFilterState.keyword) {
        filteredCourses = filteredCourses.filter(course => {
          const title = convertVietnamese(course.title || '');
          const desc = convertVietnamese(course.description || course.shortDescription || '');
          const code = convertVietnamese(course.courseCode || course.category || '');
          const level = convertVietnamese(course.level || '');
          return title.includes(courseFilterState.keyword) || 
                 desc.includes(courseFilterState.keyword) || 
                 code.includes(courseFilterState.keyword) ||
                 level.includes(courseFilterState.keyword);
        });
      }
      
      if (courseFilterState.level !== 'all') {
        filteredCourses = filteredCourses.filter(course => {
          const courseLevel = String(course.level || '').toLowerCase();
          return courseLevel === courseFilterState.level.toLowerCase();
        });
      }

      // Chỉ hiển thị khóa học đã thả tim
      if (courseFilterState.favoritesOnly) {
        filteredCourses = filteredCourses.filter(function (course) {
          return isCourseFavorite(course.courseId);
        });
      }
      
      filteredCourses.sort(function (a, b) {
        const sortMode = courseFilterState.sort;

        const titleA = String(a.title || "");
        const titleB = String(b.title || "");

        // Hàm so sánh tên hỗ trợ tiếng Việt
        const compareByName = function () {
          return titleA.localeCompare(
            titleB,
            "vi",
            {
              sensitivity: "base"
            }
          );
        };

        // Khóa học vừa học hoặc vừa mở sẽ nằm trước
        if (sortMode === "recent") {
          const recentA = getCourseRecentTime(a.courseId);
          const recentB = getCourseRecentTime(b.courseId);

          if (recentA !== recentB) {
            return recentB - recentA;
          }

          // Các khóa học chưa học có recent = 0,
          // tiếp tục sắp xếp A–Z
          return compareByName();
        }

        if (sortMode === "name_asc") {
          return compareByName();
        }

        if (sortMode === "name_desc") {
          return titleB.localeCompare(
            titleA,
            "vi",
            {
              sensitivity: "base"
            }
          );
        }

        const courseIdA = normalizeCourseId(a.courseId);
        const courseIdB = normalizeCourseId(b.courseId);

        const lessonCountA = topicCountByCourse[courseIdA] || 0;
        const lessonCountB = topicCountByCourse[courseIdB] || 0;

        if (sortMode === "lessons_asc") {
          return lessonCountA - lessonCountB;
        }

        if (sortMode === "lessons_desc") {
          return lessonCountB - lessonCountA;
        }

        return 0;
      });
      
      if (filteredCourses.length === 0) {
        const emptyMessage =
          courseFilterState.favoritesOnly
            ? "Bạn chưa có khóa học yêu thích."
            : "Không tìm thấy khóa học phù hợp.";

        container.innerHTML = `
          <div class="courses-empty-state">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            <p>${emptyMessage}</p>
          </div>
        `;
        return;
      }
      
      filteredCourses.forEach(function (course) {
        const courseId = normalizeCourseId(course.courseId);
        const favorite = isCourseFavorite(courseId);
        const recentTime = getCourseRecentTime(courseId);
        
        const card = document.createElement("div");
        card.className = "course-card" + (favorite ? " is-favorite" : "");
        card.dataset.courseId = courseId;
        
        card.onclick = function () {
          openCourse(courseId);
        };
        
        const imgUrl = course.thumbnailUrl || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1400&auto=format&fit=crop';
        const topicsCount = topicCountByCourse[courseId] || 0;
        
        card.innerHTML = `
          <div class="course-card-image-wrapper">
            <img src="${imgUrl}" alt="${escapeHtml(course.title)}" class="course-card-image" onerror="this.src='https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1400&auto=format&fit=crop'">
            <button
              type="button"
              class="course-favorite-btn ${favorite ? "is-active" : ""}"
              aria-pressed="${favorite}"
              aria-label="${favorite ? "Bỏ khỏi yêu thích" : "Thêm vào yêu thích"}"
              title="${favorite ? "Bỏ khỏi yêu thích" : "Thêm vào yêu thích"}"
            >
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
            </button>
            ${
              recentTime > 0
                ? `<span class="course-recent-badge">Học gần đây</span>`
                : ""
            }
          </div>
          <div class="course-card-content">
            ${(course.courseCode || course.category) ? `<div class="course-card-category">${escapeHtml(course.courseCode || course.category)}</div>` : ''}
            <h3 class="course-card-title">${escapeHtml(course.title)}</h3>
            <div class="course-card-desc">${escapeHtml(course.shortDescription || course.description || '')}</div>
            <div class="course-card-footer">
              <div class="course-card-stat">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                  <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                ${topicsCount} bài học
              </div>
              ${course.level ? `
              <div class="course-card-stat">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
                ${escapeHtml(course.level)}
              </div>` : ''}
            </div>
          </div>
        `;
        
        const favoriteButton = card.querySelector(".course-favorite-btn");
        if (favoriteButton) {
          favoriteButton.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            window.toggleCourseFavorite(courseId, event);
          });
        }
        
        container.appendChild(card);
      });
    }

    // Helper: chuẩn hóa tiếng Việt
    function convertVietnamese(str) {
      if (!str) return '';
      str = String(str).toLowerCase().trim();
      str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
      str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
      str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
      str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
      str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
      str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
      str = str.replace(/đ/g, "d");
      // Some system encode vietnamese combining accent as individual utf-8 characters
      str = str.replace(/\u0300|\u0301|\u0303|\u0309|\u0323/g, ""); // Huyền sắc hỏi ngã nặng 
      str = str.replace(/\u02C6|\u0306|\u031B/g, ""); // Â, Ê, Ă, Ơ, Ư
      return str.replace(/\s+/g, ' '); // Loại bỏ khoảng trắng thừa
    }

    // FILTER & SEARCH
    // ========================================
    function filterTopics(category) {
      currentFilter = category || 'all';

      document.querySelectorAll('.filter-tab').forEach(function(tab) {
        tab.classList.toggle('active', tab.dataset.filter === currentFilter);
      });

      const searchValue = document.getElementById('searchTopics').value;
      searchTopics(searchValue);
    }

    let currentStatusFilter = 'all';

    function setTopicStatusFilter(status) {
      currentStatusFilter = status;
      const group = document.querySelector('.topics-header .segmented-filter');
      if (group) group.setAttribute('data-active', status);
      
      document.querySelectorAll('.topics-header .segmented-filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === status);
      });
      const searchValue = document.getElementById('searchTopics').value;
      searchTopics(searchValue);
    }

    function searchTopics(query) {
      if (currentViewMode === 'courses') {
        const rawValue = String(query || '');
        courseFilterState.keyword_raw = rawValue;
        courseFilterState.keyword = convertVietnamese(rawValue);
        renderCourses();
        return;
      }
      
      const searchValue = String(query || '').trim().toLowerCase();

      let baseTopics =
        currentFilter === 'all'
          ? allTopics
          : allTopics.filter(function(topic) {
              return getCategoryName(topic) === currentFilter;
            });

      // Filter by current course if inside a course
      if (currentViewMode === 'topics' && currentCourseId) {
        baseTopics = baseTopics.filter(topic => topic.courseId === currentCourseId);
      }

      if (currentStatusFilter !== 'all') {
        baseTopics = baseTopics.filter(function(topic) {
          const status = typeof getTopicStatus === 'function' ? getTopicStatus(topic, window.currentPageParams) : 'available';
          const progressData = userProgress[topic.topicId] || {};
          const isCompleted = status === 'completed' || progressData.completed === true;
          const progressPercent = Number(progressData.progress || 0);
          
          if (currentStatusFilter === 'completed' || currentStatusFilter === 'played') {
            return isCompleted;
          }
          if (currentStatusFilter === 'in_progress') {
            return progressPercent > 0 && !isCompleted;
          }
          if (currentStatusFilter === 'unplayed' || currentStatusFilter === 'available') {
            return progressPercent === 0 && !isCompleted;
          }
          return true;
        });
      }

      if (!searchValue) {
        filteredTopics = [...baseTopics];
      } else {
        filteredTopics = baseTopics.filter(function(topic) {
          const title = String(topic.title || '').toLowerCase();
          const category = String(topic.category || '').toLowerCase();
          const description = String(topic.description || '').toLowerCase();

          return (

    function getTopicStatus(topic, currentParams) {
      if (!topicHasContent(topic)) {
        return 'locked';
      }

      // Server lock phải được ưu tiên hơn progress.
      if (topic.unlocked === false || !checkTopicUnlocked(topic)) {
        return 'locked';
      }

      const progress = userProgress[topic.topicId] || {};
      if ((progress.status === 'completed')) {
        return 'completed';
      }

      if (
        currentParams &&
        currentParams.topicId &&
        currentParams.topicId === topic.topicId
      ) {
        return 'current';
      }

      return 'available';
    }

    window.startTopicDirect = function(topicId, mode) {

        releaseTopicNavigationSoon();

     * @param {string} topicId
     * @param {number} [token] - navigation token để bỏ qua callback cũ

      var topic = topicId
        ? allTopics.find(function(t) { return t.topicId === topicId; })

      if (!topic) {
        releaseTopicNavigation();
        showNotification('Không tìm thấy bài học', 'error');

        return;

      releaseTopicNavigationSoon();

    // ========================================
    // HELPER FUNCTIONS
    // ========================================
    function getTopicQuizPercent(topicId) {
      try {
        const raw = localStorage.getItem("oq_quiz_stats_cache_v1");
        if (!raw) return 0;
        const parsed = JSON.parse(raw);
        if (!parsed || !parsed.stats || !parsed.stats[topicId]) return 0;
        const stats = parsed.stats[topicId];
        
        const byPercent = Number(stats.bestPercent);
        if (Number.isFinite(byPercent) && byPercent >= 0) return Math.min(100, Math.round(byPercent));
        
        const byScore = Number(stats.bestScore);
        const byTotal = Number(stats.bestTotal);
        if (Number.isFinite(byScore) && Number.isFinite(byTotal) && byTotal > 0) {
          return Math.max(0, Math.min(100, Math.round((byScore / byTotal) * 100)));
        }
      } catch(e) {}
      return 0;
    }

    function getTopicMatchingPercent(topicId) {
      try {
        const raw = localStorage.getItem("oq_matching_stats_cache_v1");
        if (!raw) return 0;
        const parsed = JSON.parse(raw);
        if (!parsed || !parsed.stats || !parsed.stats[topicId]) return 0;
        const stats = parsed.stats[topicId];
        
        const byAccuracy = Number(stats.bestAccuracy);
        if (Number.isFinite(byAccuracy) && byAccuracy >= 0) return Math.min(100, Math.round(byAccuracy));
        
        const byPercent = Number(stats.bestPercent);
        if (Number.isFinite(byPercent) && byPercent >= 0) return Math.min(100, Math.round(byPercent));
        
        const byScore = Number(stats.bestScore);
        const byTotalPairs = Number(stats.bestTotalPairs);
        if (Number.isFinite(byScore) && Number.isFinite(byTotalPairs) && byTotalPairs > 0) {
          return Math.max(0, Math.min(100, Math.round((byScore / byTotalPairs) * 100)));
        }
      } catch(e) {}
      return 0;
    }

    function checkTopicUnlocked(topic) {
      if (!topic) return false;

      // Server đã tính sẵn
      if (typeof topic.unlocked === 'boolean') {
        return topic.unlocked;
      }

      // Fallback nếu API cũ chưa trả unlocked
      if (!topic.isLocked && !topic.unlockCondition && !topic.prerequisiteTopics) {
        return true;
      }

      return checkTopicUnlockedClientSide(topic);
    }

    function parseTopicUnlockCondition(topic) {
      if (topic.unlockCondition) {
        try {
          return JSON.parse(topic.unlockCondition);
        } catch (e) {
          console.warn('[Topics] Invalid unlockCondition:', e);
        }
      }

      if (topic.prerequisiteTopics) {
        var ids = String(topic.prerequisiteTopics)
          .split(',')
          .map(function(id) {
            return id.trim();
          })
          .filter(Boolean);

        if (ids.length > 0) {
          return {
            type: 'complete_topic',
            mode: 'all',
            prerequisiteTopicIds: ids
          };
        }
      }

      return null;
    }

    function checkTopicUnlockedClientSide(topic) {
      var condition = parseTopicUnlockCondition(topic);

      if (!topic.isLocked && !condition) {
        return true;
      }

      if (!condition || !Array.isArray(condition.prerequisiteTopicIds)) {
        return !topic.isLocked;
      }

      var ids = condition.prerequisiteTopicIds;
      if (ids.length === 0) return !topic.isLocked;

      var mode = condition.mode || 'all';

      var checks = ids.map(function(id) {
        var progress = userProgress[id] || {};
        return progress.status === 'completed';
      });

      return mode === 'any'
        ? checks.some(Boolean)
        : checks.every(Boolean);
    }

    function setupCardTiltEffect() {
      const container = document.querySelector(".topics-grid, .journey-view");
      if (!container) return;

      // ⭐ Chống gắn lặp listener khi render nhiều lần
      if (container.dataset.tiltBound === '1') return;
      container.dataset.tiltBound = '1';

      container.addEventListener("mousemove", function (e) {
        const card = e.target.closest(".topic-card");
        if (!card || card.classList.contains("menu-open") || isTopicActionMenuOpen()) {
          if (card && !card.classList.contains("menu-open")) {
            card.style.transform = "";
          }
          return;
        }

        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateY = ((x - centerX) / centerX) * 8;
        const rotateX = ((centerY - y) / centerY) * 6;

        card.style.transform = `perspective(600px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
        card.style.transition = "transform 0.1s ease, box-shadow 0.3s ease";
      });

      container.addEventListener(
        "mouseleave",
        function (e) {
          const card = e.target.closest(".topic-card");
          if (card && !card.classList.contains("menu-open") && !isTopicActionMenuOpen()) {
            card.style.transform = "";
            card.style.transition = "transform 0.4s ease, box-shadow 0.3s ease";
          }
        },
        true,
      );

      container.addEventListener("mouseout", function (e) {
        const card = e.target.closest(".topic-card");
        if (
          card &&
          !card.contains(e.relatedTarget) &&
          !card.classList.contains("menu-open") &&
          !isTopicActionMenuOpen()
        ) {
          card.style.transform = "";
          card.style.transition = "transform 0.4s ease, box-shadow 0.3s ease";
        }
      });
    }

    // - Also listen to localStorage `storage` events for lesson/quiz/matching keys
    // When triggered, invalidate caches and refresh topics/progress.
    // ========================================
    function handleTopicCompleted(topicId) {
      try {
        console.log('🔔 Topic completed handler called for:', topicId);
        if (typeof window.invalidateTopicsLocalCache === 'function') {
          window.invalidateTopicsLocalCache();
        } else {
          // fallback: clear local caches
          topicsCache = null;
          progressCache = null;
          lastLoadTime = 0;
        }

        // Force refresh from server so badges/progress update immediately
        loadTopics(true);
      } catch (e) {
        console.warn('⚠️ Error in handleTopicCompleted:', e);
      }
    }

    // Listen for dispatched custom events from other pages/scripts
    document.addEventListener('topicCompleted', function (ev) {
      var topicId = ev && ev.detail && ev.detail.topicId;
      handleTopicCompleted(topicId);

          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          const rotateY = ((x - centerX) / centerX) * 12;
          const rotateX = ((centerY - y) / centerY) * 8;
          card.style.transform = `perspective(600px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;
        });
        card.addEventListener("mouseleave", function () {
          if (card.classList.contains("selected") || isTopicActionMenuOpen()) return;
          card.style.transform =
            "perspective(600px) rotateX(0) rotateY(0) scale(1)";
          card.style.transition = "transform 0.4s ease";
          setTimeout(() => {
            card.style.transition = "";
          }, 400);
        });
        card.addEventListener("mouseenter", function () {
          if (card.classList.contains("selected") || isTopicActionMenuOpen()) return;
          card.style.transition = "transform 0.15s ease-out";
          setTimeout(() => {
            card.style.transition = "transform 0.08s ease-out";
          }, 150);
        });
      });
    }

    // Create aliases for compatibility with different calling patterns
    window.initTopics = window.initTopicsPageOnShow;
    window.loadTopicsPage = window.initTopicsPageOnShow;

    console.log("✅ Topics page scripts loaded successfully");
    console.log("- window.initTopicsPage:", typeof window.initTopicsPage);
    console.log(
      "- window.initTopicsPageOnShow:",
      typeof window.initTopicsPageOnShow,
    );
  })();
</script>
