<style>
/* ==========================================================================
   Chat & Friends Page Styles
   ========================================================================== */

#page-chat {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  --chat-bg: #f1e7d8;
  --chat-surface: #f7f0e6;
  --chat-surface-2: #efe3d4;
  --chat-border: #dccdb9;
  --chat-text: #3e433f;
  --chat-text-soft: #66706a;
  --chat-text-dim: #869087;
  --chat-accent: #8aa6c6;
  --chat-accent-2: #6f91b6;
  --chat-warm: #c8a87f;
  --chat-danger: #c87c74;
  --chat-success: #82a891;
  background: linear-gradient(180deg, #f2e9dd 0%, #e7d9c7 100%);
}

.chat-container {
  padding: var(--spacing-lg);
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-xl);
}

.chat-header .uph-search-control {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  max-width: 500px;
}

#page-chat .chat-header,
#page-chat .chat-main-area,
#page-chat .chat-room-area,
#page-chat .chat-state-container,
#page-chat .conversation-item,
#page-chat .player-card,
#page-chat .chat-room-header,
#page-chat .chat-room-footer {
  color: var(--chat-text);
  border-color: var(--chat-border);
}

#page-chat .chat-tabs,
#page-chat .chat-tab,
#page-chat .chat-room-messages,
#page-chat .conversation-list-container,
#page-chat .chat-results-grid,
#page-chat .friends-filter-container {
  color: var(--chat-text);
}

#page-chat .chat-state-container p,
#page-chat .chat-state-container h3,
#page-chat .conversation-name,
#page-chat .player-name,
#page-chat .chat-room-info h3,
#page-chat .chat-room-info .status-text,
#page-chat .conversation-last-msg,
#page-chat .conversation-time,
#page-chat .player-id,
#page-chat .chat-time,
#page-chat .chat-date-divider span,
#page-chat .chat-tab,
#page-chat .search-input,
#page-chat .chat-input {
  color: var(--chat-text-soft);
}

#page-chat .chat-tab.active,
#page-chat .chat-tab:hover,
#page-chat .conversation-name,
#page-chat .player-name,
#page-chat .chat-room-info h3 {
  color: var(--chat-text);
}

#page-chat .uph-search-input,
#page-chat .search-input,
#page-chat .chat-input {
  background: #f7f0e6;
  border: 1px solid var(--chat-border);
}

#page-chat .btn-primary {
  background: linear-gradient(135deg, var(--chat-accent), var(--chat-accent-2));
  color: #11141b;
  border: none;
}

#page-chat .btn-primary:hover {
  filter: brightness(1.05);
}

#page-chat .chat-state-container,
#page-chat .chat-room-area,
#page-chat .conversation-item,
#page-chat .player-card,
#page-chat .chat-room-header,
#page-chat .chat-room-footer,
#page-chat .chat-input,
#page-chat .uph-search-input,
#page-chat .btn-relationship,
#page-chat .btn-chat,
#page-chat .menu-dot-btn,
#page-chat .card-menu-panel {
  box-shadow: none;
}

.search-player-btn {
  padding: 8px 16px;
  border-radius: var(--radius-md);
  white-space: nowrap;
}

/* State Containers */
.chat-state-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 64px 20px;
  text-align: center;
  border-radius: var(--radius-lg);
  border: 1px solid var(--chat-border);
  color: var(--chat-text-soft);
}

.chat-state-container h3 {
  margin: 16px 0 8px;
  color: var(--chat-text);
  font-size: 1.25rem;
}

.chat-loading-spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--chat-border);
  border-top-color: var(--chat-accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 16px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Results Grid */
.chat-results-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

@media (max-width: 900px) {
  .chat-results-grid {
    grid-template-columns: 1fr;
  }
}

.player-card {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  min-height: 156px;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(247,240,230,0.95), rgba(239,227,212,0.92));
  border: 1px solid var(--chat-border);
  border-radius: 18px;
  transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  gap: 10px;
  position: relative;
  overflow: hidden;
}

.player-card:hover {
  transform: translateY(-2px);
  border-color: var(--chat-accent-2);
  background: linear-gradient(180deg, rgba(229, 214, 196, 0.98), rgba(216, 197, 175, 0.92));
}

.player-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--chat-surface-2);
  border: 1px solid var(--chat-border);
}

.player-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.player-name {
  font-weight: 600;
  color: var(--chat-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.player-id {
  font-size: 0.85rem;
  color: var(--chat-text-dim);
  font-family: monospace;
  line-height: 1.4;
}

.player-action {
  flex-shrink: 0;
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: auto;
  justify-content: flex-end;
}

/* Action Buttons Specific for Chat */
.btn-relationship {
  font-size: 0.85rem;
  padding: 6px 12px;
  border-radius: 99px;
  font-weight: 500;
}

.btn-relationship.is-none {
  background: var(--chat-accent);
  color: #10131a;
  border: none;
}
.btn-relationship.is-none:hover {
  background: var(--chat-accent-2);
}

.btn-relationship.is-friends {
  background: var(--chat-surface-2);
  color: var(--chat-text-soft);
  border: 1px solid var(--chat-border);
  pointer-events: none;
}

.btn-relationship.is-sent {
  background: var(--chat-surface-2);
  color: var(--chat-text-soft);
  border: 1px solid var(--chat-border);
  pointer-events: none;
}

.btn-relationship.is-received {
  background: var(--chat-success);
  color: #10131a;
  border: none;
}
.btn-relationship.is-received:hover {
  filter: brightness(1.05);
}

.btn-relationship.is-self {
  display: none;
}

/* Tabs */
.chat-tabs {
  display: flex;
  gap: 16px;
  border-bottom: 1px solid var(--chat-border);
  margin-bottom: 16px;
  width: 100%;
}

.chat-tab {
  background: none;
  border: none;
  padding: 12px 16px;
  color: var(--chat-text-soft);
  font-weight: 500;
  font-size: 1rem;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.chat-tab:hover {
  color: var(--chat-text);
}

.chat-tab.active {
  color: var(--chat-accent-2);
  border-bottom-color: var(--chat-accent-2);
}

.badge {
  background: var(--chat-danger);
  color: #10131a;
  font-size: 0.75rem;
  padding: 2px 6px;
  border-radius: 99px;
  font-weight: bold;
}

/* Reject Button */
.btn-relationship.is-reject {
  background: var(--chat-surface-2);
  color: var(--chat-danger);
  border: 1px solid var(--chat-border);
}
.btn-relationship.is-reject:hover {
  background: rgba(215, 134, 130, 0.16);
  color: var(--chat-text);
  border-color: var(--chat-danger);
}

.request-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* Friends List Specifics */
.friends-filter-container {
  margin-bottom: 24px;
}

.btn-chat {
  background: var(--chat-warm);
  color: #1a120c;
}
.btn-chat:hover {
  filter: brightness(1.03);
}

.player-meta-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.player-body {
  display: flex;
  gap: 12px;
  align-items: center;
}

.player-main {
  display: flex;
  gap: 12px;
  align-items: center;
  min-width: 0;
}

.player-compact-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.card-menu-wrap {
  position: relative;
  flex-shrink: 0;
}

.menu-dot-btn {
  width: 32px;
  height: 32px;
  border-radius: 999px;
  border: 1px solid var(--chat-border);
  background: var(--chat-surface-2);
  color: var(--chat-text-soft);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}

.menu-dot-btn:hover {
  background: rgba(138, 166, 198, 0.18);
  border-color: var(--chat-accent-2);
  color: var(--chat-text);
}

.card-menu-panel {
  position: absolute;
  top: 38px;
  right: 0;
  min-width: 180px;
  background: #f4eadf;
  border: 1px solid var(--chat-border);
  border-radius: 14px;
  padding: 8px;
  box-shadow: 0 16px 40px rgba(88, 70, 48, 0.14);
  z-index: 20;
  display: none;
}

.card-menu-panel.is-open {
  display: block;
}

.card-menu-item {
  width: 100%;
  border: none;
  background: transparent;
  color: var(--chat-text);
  padding: 10px 12px;
  border-radius: 10px;
  text-align: left;
  cursor: pointer;
}

.card-menu-item:hover {
  background: rgba(138, 166, 198, 0.18);
}

.card-menu-item.is-danger {
  color: var(--chat-danger);
}

.card-menu-separator {
  height: 1px;
  background: var(--chat-border);
  margin: 6px 0;
}

/* ============================================== */
/* CHAT ROOM STYLES                               */
/* ============================================== */
.chat-room-area {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 200px); /* Adjust based on global header if any, maybe 600px min */
  min-height: 500px;
  border: 1px solid var(--chat-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.chat-room-header {
  display: flex;
  align-items: center;
  padding: 16px;
  background: var(--chat-surface-2);
  border-bottom: 1px solid var(--chat-border);
  gap: 12px;
}

.back-btn {
  background: none;
  border: none;
  color: var(--chat-text-soft);
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
}

.back-btn:hover {
  background: rgba(138, 166, 198, 0.18);
  color: var(--chat-text);
}

.chat-room-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--chat-border);
}

.chat-room-info {
  flex: 1;
  min-width: 0;
}

.chat-room-info h3 {
  margin: 0 0 2px 0;
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--chat-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chat-room-info .status-text {
  margin: 0;
  font-size: 0.85rem;
  color: var(--chat-text-dim);
}

.chat-room-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  background: linear-gradient(180deg, rgba(242, 233, 221, 0.82), rgba(231, 217, 199, 0.72));
  display: flex;
  flex-direction: column;
  gap: 12px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.chat-room-messages::-webkit-scrollbar {
  width: 0;
  height: 0;
}

.chat-room-loading {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100%;
}

.chat-room-footer {
  display: flex;
  padding: 16px;
  background: var(--chat-surface-2);
  border-top: 1px solid var(--chat-border);
  gap: 12px;
  align-items: center;
}

.chat-input {
  flex: 1;
  padding: 12px 16px;
  border-radius: 99px;
  border: 1px solid var(--chat-border);
  background: #f7f0e6;
  color: var(--chat-text);
  font-size: 1rem;
}
.chat-input:focus {
  outline: none;
  border-color: var(--chat-accent);
}
.chat-input:disabled {
  background: #efe3d4;
  cursor: not-allowed;
}

.btn-send {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.btn-send:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Messages */
.chat-message-row {
  display: flex;
  width: 100%;
  margin-bottom: 8px;
}

.chat-message-row.is-me {
  justify-content: flex-end;
}

.chat-message-row.is-friend {
  justify-content: flex-start;
}

.chat-message-wrap {
  display: flex;
  flex-direction: column;
  width: min(68%, 760px);
  max-width: 68%;
}

.chat-message-row.is-me .chat-message-wrap {
  margin-left: auto;
  align-items: flex-end;
}

.chat-message-row.is-friend .chat-message-wrap {
  margin-right: auto;
  align-items: flex-start;
}

.chat-bubble {
  width: 100%;
  max-width: none;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 0.95rem;
  line-height: 1.4;
  word-break: break-word;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  hyphens: auto;
  position: relative;
}

.chat-message-row.is-me .chat-bubble {
  background: linear-gradient(135deg, #b9cbe0, #9eb8d3);
  color: #2f3634;
  border-bottom-right-radius: 4px;
}

.chat-message-row.is-friend .chat-bubble {
  background: #e7d8c8;
  color: var(--chat-text);
  border: 1px solid var(--chat-border);
  border-bottom-left-radius: 4px;
}

.chat-bubble.is-optimistic {
  opacity: 0.6;
}

.chat-time {
  font-size: 0.7rem;
  color: var(--chat-text-dim);
  margin-top: 4px;
  text-align: right;
}
.chat-message-row.is-friend .chat-time {
  text-align: left;
}

.chat-date-divider {
  text-align: center;
  margin: 16px 0;
  position: relative;
}
.chat-date-divider::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  border-top: 1px solid var(--chat-border);
  z-index: 1;
}
.chat-date-divider span {
  padding: 0 12px;
  color: var(--chat-text-dim);
  font-size: 0.8rem;
  position: relative;
  z-index: 2;
}

/* ============================================== */
/* CONVERSATIONS LIST                             */
/* ============================================== */
.conversation-list-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.conversation-item {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  background: linear-gradient(180deg, rgba(247,240,230,0.96), rgba(239,227,212,0.88));
  border: 1px solid var(--chat-border);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: all 0.2s ease;
}

.conversation-item:hover {
  background: rgba(226, 211, 190, 0.98);
  border-color: var(--chat-accent-2);
}

.conversation-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  margin-right: 16px;
}

.conversation-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.conversation-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}

.conversation-name {
  font-weight: 600;
  color: var(--chat-text);
  font-size: 1.05rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.conversation-time {
  font-size: 0.8rem;
  color: var(--chat-text-dim);
  white-space: nowrap;
  margin-left: 8px;
}

.conversation-body {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.conversation-last-msg {
  font-size: 0.9rem;
  color: var(--chat-text-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}

.conversation-badge {
  background: var(--chat-danger);
  color: #10131a;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 99px;
  margin-left: 12px;
}

.tab-unread-badge {
  background: var(--chat-danger);
  color: #10131a;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 99px;
  margin-left: 6px;
  min-width: 16px;
  text-align: center;
  line-height: 16px;
}

</style>
