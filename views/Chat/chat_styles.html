<style>
/* ==========================================================================
   Chat & Friends Page Styles
   ========================================================================== */

#page-chat {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

.chat-container {
  padding: var(--spacing-lg);
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-xl);
}

.chat-header .uph-search-control {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  max-width: 500px;
}

.search-player-btn {
  padding: 8px 16px;
  border-radius: var(--radius-md);
  white-space: nowrap;
}

/* State Containers */
.chat-state-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 64px 20px;
  text-align: center;
  background: var(--surface-default);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
}

.chat-state-container h3 {
  margin: 16px 0 8px;
  color: var(--text-primary);
  font-size: 1.25rem;
}

.chat-loading-spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--border-subtle);
  border-top-color: var(--primary-main);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 16px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Results Grid */
.chat-results-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--spacing-md);
}

.player-card {
  display: flex;
  align-items: center;
  padding: 16px;
  background: var(--surface-default);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  transition: transform 0.2s, box-shadow 0.2s;
  gap: 12px;
}

.player-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
  border-color: var(--border-strong);
}

.player-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--surface-sunken);
  border: 2px solid var(--border-subtle);
}

.player-info {
  flex: 1;
  min-width: 0;
}

.player-name {
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}

.player-id {
  font-size: 0.85rem;
  color: var(--text-tertiary);
  font-family: monospace;
}

.player-action {
  flex-shrink: 0;
}

/* Action Buttons Specific for Chat */
.btn-relationship {
  font-size: 0.85rem;
  padding: 6px 12px;
  border-radius: 99px;
  font-weight: 500;
}

.btn-relationship.is-none {
  background: var(--primary-main);
  color: white;
  border: none;
}
.btn-relationship.is-none:hover {
  background: var(--primary-hover);
}

.btn-relationship.is-friends {
  background: var(--surface-sunken);
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
  pointer-events: none;
}

.btn-relationship.is-sent {
  background: var(--surface-sunken);
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
  pointer-events: none;
}

.btn-relationship.is-received {
  background: var(--success-main);
  color: white;
  border: none;
}
.btn-relationship.is-received:hover {
  background: var(--success-hover);
}

.btn-relationship.is-self {
  display: none;
}

/* Tabs */
.chat-tabs {
  display: flex;
  gap: 16px;
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: 16px;
  width: 100%;
}

.chat-tab {
  background: none;
  border: none;
  padding: 12px 16px;
  color: var(--text-secondary);
  font-weight: 500;
  font-size: 1rem;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.chat-tab:hover {
  color: var(--text-primary);
}

.chat-tab.active {
  color: var(--primary-main);
  border-bottom-color: var(--primary-main);
}

.badge {
  background: var(--error-main);
  color: white;
  font-size: 0.75rem;
  padding: 2px 6px;
  border-radius: 99px;
  font-weight: bold;
}

/* Reject Button */
.btn-relationship.is-reject {
  background: var(--surface-sunken);
  color: var(--error-main);
  border: 1px solid var(--border-subtle);
}
.btn-relationship.is-reject:hover {
  background: var(--error-hover);
  color: white;
  border-color: var(--error-hover);
}

.request-actions {
  display: flex;
  gap: 8px;
}

/* Friends List Specifics */
.friends-filter-container {
  margin-bottom: 24px;
}

.status-indicator {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--text-tertiary); /* Offline */
  margin-right: 6px;
}

.status-indicator.is-online {
  background: var(--success-main);
  box-shadow: 0 0 0 2px rgba(var(--success-main-rgb, 16, 185, 129), 0.2);
}

.btn-chat {
  background: var(--primary-main);
  color: white;
}
.btn-chat:hover {
  background: var(--primary-hover);
}

/* ============================================== */
/* CHAT ROOM STYLES                               */
/* ============================================== */
.chat-room-area {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 200px); /* Adjust based on global header if any, maybe 600px min */
  min-height: 500px;
  background: var(--surface-default);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.chat-room-header {
  display: flex;
  align-items: center;
  padding: 16px;
  background: var(--surface-sunken);
  border-bottom: 1px solid var(--border-subtle);
  gap: 12px;
}

.back-btn {
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
}

.back-btn:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
}

.chat-room-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--border-subtle);
}

.chat-room-info {
  flex: 1;
  min-width: 0;
}

.chat-room-info h3 {
  margin: 0 0 2px 0;
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chat-room-info .status-text {
  margin: 0;
  font-size: 0.85rem;
  color: var(--text-tertiary);
}

.chat-room-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  background: var(--surface-default);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.chat-room-loading {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100%;
}

.chat-room-footer {
  display: flex;
  padding: 16px;
  background: var(--surface-sunken);
  border-top: 1px solid var(--border-subtle);
  gap: 12px;
  align-items: center;
}

.chat-input {
  flex: 1;
  padding: 12px 16px;
  border-radius: 99px;
  border: 1px solid var(--border-subtle);
  background: var(--surface-default);
  color: var(--text-primary);
  font-size: 1rem;
}
.chat-input:focus {
  outline: none;
  border-color: var(--primary-main);
}
.chat-input:disabled {
  background: var(--surface-disabled, #f3f4f6);
  cursor: not-allowed;
}

.btn-send {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.btn-send:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Messages */
.chat-message-row {
  display: flex;
  width: 100%;
  margin-bottom: 8px;
}

.chat-message-row.is-me {
  justify-content: flex-end;
}

.chat-message-row.is-friend {
  justify-content: flex-start;
}

.chat-bubble {
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 0.95rem;
  line-height: 1.4;
  word-break: break-word;
  position: relative;
}

.chat-message-row.is-me .chat-bubble {
  background: var(--primary-main);
  color: white;
  border-bottom-right-radius: 4px;
}

.chat-message-row.is-friend .chat-bubble {
  background: var(--surface-sunken);
  color: var(--text-primary);
  border: 1px solid var(--border-subtle);
  border-bottom-left-radius: 4px;
}

.chat-bubble.is-optimistic {
  opacity: 0.6;
}

.chat-time {
  font-size: 0.7rem;
  color: var(--text-tertiary);
  margin-top: 4px;
  text-align: right;
}
.chat-message-row.is-friend .chat-time {
  text-align: left;
}

.chat-date-divider {
  text-align: center;
  margin: 16px 0;
  position: relative;
}
.chat-date-divider::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  border-top: 1px solid var(--border-subtle);
  z-index: 1;
}
.chat-date-divider span {
  background: var(--surface-default);
  padding: 0 12px;
  color: var(--text-tertiary);
  font-size: 0.8rem;
  position: relative;
  z-index: 2;
}

/* ============================================== */
/* CONVERSATIONS LIST                             */
/* ============================================== */
.conversation-list-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.conversation-item {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  background: var(--surface-default);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: all 0.2s ease;
}

.conversation-item:hover {
  background: var(--surface-hover);
  border-color: var(--border-strong);
}

.conversation-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  margin-right: 16px;
}

.conversation-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.conversation-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}

.conversation-name {
  font-weight: 600;
  color: var(--text-primary);
  font-size: 1.05rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.conversation-time {
  font-size: 0.8rem;
  color: var(--text-tertiary);
  white-space: nowrap;
  margin-left: 8px;
}

.conversation-body {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.conversation-last-msg {
  font-size: 0.9rem;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}

.conversation-badge {
  background: var(--error-main);
  color: white;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 99px;
  margin-left: 12px;
}

.tab-unread-badge {
  background: var(--error-main, #ef4444);
  color: white;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 99px;
  margin-left: 6px;
  min-width: 16px;
  text-align: center;
  line-height: 16px;
}

</style>
